<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ECHOES OF REASON - 伏線回収アドベンチャー</title>
    <style>
        :root {
            --bg-color: #0b0d17;
            --card-bg: rgba(22, 27, 46, 0.82);
            --primary: #5d6dff;
            --primary-glow: rgba(93, 109, 255, 0.5);
            --accent: #ff477e;
            --accent-glow: rgba(255, 71, 126, 0.5);
            --text-main: #f0f3fe;
            --text-sub: #a0aabf;
            --gold: #ffb703;
            --danger: #ef476f;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-family);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ゲームコンテナ */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100%;
            max-height: 900px;
            background: radial-gradient(circle at center, #161b33 0%, #080910 100%);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* 背景エフェクトCanvas */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* ノイズ overlay と 色収差エフェクト用クラス */
        .glitch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
            z-index: 2;
            pointer-events: none;
            opacity: 0.6;
        }

        /* シネマティック色収差・被写界深度ブラー */
        .screen.cinematic-blur {
            filter: blur(8px) contrast(1.2);
            transition: filter 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .chromatic-aberration {
            animation: chromaticAnim 0.4s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        @keyframes chromaticAnim {
            0% { text-shadow: -3px 0 rgba(255,71,126,0.8), 3px 0 rgba(93,109,255,0.8); }
            50% { text-shadow: 4px 0 rgba(255,71,126,0.9), -4px 0 rgba(93,109,255,0.9); }
            100% { text-shadow: none; }
        }

        /* 画面タップ波紋（リップルエフェクト） */
        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(93,109,255,0.2) 60%, transparent 100%);
            transform: scale(0);
            pointer-events: none;
            animation: rippleAnim 0.6s cubic-bezier(0, 0.5, 0.5, 1) forwards;
            z-index: 5;
        }

        @keyframes rippleAnim {
            to {
                transform: scale(3.5);
                opacity: 0;
            }
        }

        /* スクリーン共通レイアウト */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
            transform: scale(0.98);
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        /* ヘッダー / スコアUI (ホログラフィック・シマー搭載) */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(22, 27, 46, 0.88) 0%, rgba(10, 14, 26, 0.94) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.14);
            margin-bottom: 16px;
            z-index: 15;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .hud-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 150%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            animation: shimmerEffect 6s infinite linear;
            pointer-events: none;
        }

        @keyframes shimmerEffect {
            0% { left: -150%; }
            30% { left: 150%; }
            100% { left: 150%; }
        }

        .hud-item {
            display: flex;
            flex-direction: column;
        }

        .hud-label {
            font-size: 0.7rem;
            color: var(--text-sub);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hud-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary);
            text-shadow: 0 0 8px var(--primary-glow);
        }

        /* スタート画面 */
        #start-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, rgba(30,38,74,0.9) 0%, rgba(8,9,16,0.98) 100%);
            animation: screenIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes screenIn {
            0% { opacity: 0; transform: scale(1.05); filter: blur(4px); }
            100% { opacity: 1; transform: scale(1); filter: blur(0); }
        }

        .title-logo {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #fff 0%, var(--primary) 50%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-transform: uppercase;
            filter: drop-shadow(0 0 15px var(--primary-glow));
        }

        .title-sub {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary) 0%, #4353d9 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--primary-glow);
            transition: all 0.2s ease;
            width: 80%;
            max-width: 280px;
            margin: 8px 0;
            position: relative;
            overflow: hidden;
        }

        .btn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 10px var(--primary-glow);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: none;
            color: var(--text-sub);
        }

        /* メインアドベンチャー画面 */
        #main-screen {
            justify-content: flex-end;
            padding-bottom: 20px;
        }

        /* 視覚演出ウィンドウ（キャラクター／シーン） */
        .visual-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 16px;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .avatar-box {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 35px var(--primary-glow), inset 0 0 15px rgba(255,255,255,0.3);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: avatarPulse 4s infinite ease-in-out;
        }

        @keyframes avatarPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px var(--primary-glow), inset 0 0 15px rgba(255,255,255,0.3); }
            50% { transform: scale(1.04); box-shadow: 0 0 50px var(--primary-glow), inset 0 0 25px rgba(255,255,255,0.6); }
        }

        .avatar-icon {
            font-size: 3.5rem;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.8));
        }

        /* ダイアログボックス（プレミアム・ガラスモルフィズムとホログラフィックボーダー） */
        .dialog-box {
            background: linear-gradient(135deg, rgba(32, 40, 72, 0.9) 0%, rgba(14, 18, 32, 0.95) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 20px;
            padding: 22px;
            min-height: 160px;
            max-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.35);
            margin-bottom: 12px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            animation: dialogPulse 6s infinite ease-in-out;
        }

        .dialog-box::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            border: 1px solid transparent;
            background: linear-gradient(135deg, rgba(93,109,255,0.4), rgba(255,71,126,0.2), rgba(255,183,3,0.3)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.6;
        }

        @keyframes dialogPulse {
            0%, 100% { border-color: rgba(255, 255, 255, 0.18); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.25); }
            50% { border-color: rgba(93, 109, 255, 0.45); box-shadow: 0 12px 45px rgba(93, 109, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.4); }
        }

        .dialog-hint {
            position: absolute;
            bottom: 8px;
            right: 14px;
            font-size: 0.7rem;
            color: var(--text-sub);
            opacity: 0.6;
            animation: blinkHint 1.5s infinite ease-in-out;
        }

        @keyframes blinkHint {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        .speaker-name {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .dialog-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-main);
            flex: 1;
            white-space: pre-wrap;
            position: relative;
        }

        /* 1文字ごとの発光・収束アニメーション用スパン */
        .char-fade {
            display: inline-block;
            opacity: 0;
            filter: blur(4px);
            transform: translateY(4px);
            animation: charIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        @keyframes charIn {
            to {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0);
            }
        }

        /* 選択肢ボタン群 (プレミアム・ガラス質感) */
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .choices-container.disabled {
            opacity: 0;
            pointer-events: none;
            transform: translateY(12px);
        }

        .choice-btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: var(--text-main);
            padding: 15px 20px;
            min-height: 50px;
            border-radius: 14px;
            font-size: 0.9rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .choice-btn:hover, .choice-btn:active {
            background: rgba(93, 109, 255, 0.2);
            border-color: var(--primary);
            transform: translateX(4px);
        }

        .choice-btn.truth {
            border-color: var(--gold);
            background: rgba(255, 183, 3, 0.1);
        }

        /* ミニゲーム（記憶復元パズル） */
        #puzzle-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 9, 16, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #puzzle-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 270px;
            height: 270px;
            margin: 20px 0;
            touch-action: none;
        }

        .puzzle-success-msg {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(255, 183, 3, 0.8);
            margin: 10px 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .puzzle-success-msg.show {
            opacity: 1;
        }

        .puzzle-tile {
            background: var(--card-bg);
            border: 1px solid rgba(93, 109, 255, 0.4);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-main);
            cursor: default;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.15s cubic-bezier(0.2, 0.9, 0.3, 1), background 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
        }

        /* 移動可能なタイルの視覚フィードバック */
        .puzzle-tile.movable {
            border-color: var(--primary);
            background: rgba(93, 109, 255, 0.28);
            box-shadow: 0 0 18px var(--primary-glow);
            cursor: pointer;
            will-change: transform;
        }

        .puzzle-tile.sliding {
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
        }

        /* 正解時のゴールド発光エフェクト */
        .puzzle-tile.success-glow {
            animation: tileSuccessGlow 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes tileSuccessGlow {
            0% { transform: scale(1); background: var(--card-bg); border-color: var(--gold); box-shadow: 0 0 10px var(--gold); }
            50% { transform: scale(1.08); background: rgba(255, 183, 3, 0.35); border-color: #fff; box-shadow: 0 0 25px var(--gold), inset 0 0 10px #fff; }
            100% { transform: scale(1); background: rgba(255, 183, 3, 0.2); border-color: var(--gold); box-shadow: 0 0 15px var(--gold); }
        }

        .puzzle-tile.movable::after {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }

        .puzzle-tile.movable:active {
            transform: scale(0.94);
            background: rgba(93, 109, 255, 0.4);
        }

        /* 移動不可タイルタップ時のシェイクアニメーション */
        .puzzle-tile.invalid-move {
            animation: tileShake 0.3s ease;
        }

        @keyframes tileShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        .puzzle-tile.empty {
            background: rgba(0,0,0,0.2);
            border: 1px dashed rgba(255,255,255,0.1);
            box-shadow: none;
            cursor: default;
        }

        /* ゲームオーバー・エンディング画面 */
        #result-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, rgba(20,15,35,0.95) 0%, rgba(5,5,10,0.98) 100%);
        }

        .result-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .result-title.bad { color: var(--danger); text-shadow: 0 0 10px rgba(239,71,111,0.5); }
        .result-title.normal { color: var(--text-sub); }
        .result-title.true { color: var(--gold); text-shadow: 0 0 20px rgba(255,183,3,0.8); }

        .result-desc {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 24px;
            max-width: 320px;
        }

        .recall-list {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            max-width: 340px;
            margin-bottom: 24px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }

        .recall-item {
            font-size: 0.75rem;
            color: var(--accent);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 特殊エフェクト：フラッシュバック */
        .flashback {
            animation: flashAnim 0.8s ease-in-out;
        }

        @keyframes flashAnim {
            0% { filter: invert(0); }
            50% { filter: invert(1) hue-rotate(180deg); }
            100% { filter: invert(0); }
        }

        /* 伏線解除トースト通知 */
        #foreshadow-toast {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: linear-gradient(90deg, #ffb703, #ff477e);
            color: #000;
            font-weight: bold;
            font-size: 0.8rem;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(255,183,3,0.6);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 50;
        }

        #foreshadow-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 背景演出Canvas -->
        <canvas id="bg-canvas"></canvas>
        <div class="glitch-overlay"></div>

        <!-- 伏線回収通知トースト -->
        <div id="foreshadow-toast">⚡ 伏線回収：<span id="toast-text"></span></div>

        <!-- スタート画面 -->
        <div id="start-screen" class="screen active">
            <div class="title-logo">ECHOES OF<br>REASON</div>
            <div class="title-sub">- 記憶の伏線と7日間のループ -</div>
            <button class="btn" onclick="game.startNewGame()">物語を始める</button>
            <button class="btn btn-secondary" id="continue-btn" onclick="game.loadGame()" style="display:none;">記憶を再開する</button>
            <div style="margin-top:20px; font-size:0.75rem; color:var(--text-sub);">
                推奨：サウンドON / ループの果てに真実が待つ
            </div>
        </div>

        <!-- メイン画面 -->
        <div id="main-screen" class="screen">
            <!-- HUD スコアUI -->
            <div class="hud-header">
                <div class="hud-item">
                    <span class="hud-label">世界崩壊まで</span>
                    <span class="hud-value" id="hud-days">残り 7 日</span>
                </div>
                <div class="hud-item" style="text-align: right;">
                    <span class="hud-label">記憶同調率 (Sync)</span>
                    <span class="hud-value" id="hud-sync">0 %</span>
                </div>
            </div>

            <!-- ビジュアルエリア -->
            <div class="visual-area" id="visual-area">
                <div class="avatar-box" id="avatar-box">
                    <div class="avatar-icon" id="avatar-icon">👁️</div>
                </div>
            </div>

            <!-- ダイアログエリア -->
            <div class="dialog-box" id="dialog-box" onclick="game.handleDialogClick()">
                <div class="speaker-name" id="speaker-name">システム</div>
                <div class="dialog-text" id="dialog-text">...</div>
                <div class="dialog-hint" id="dialog-hint">TAP TO FAST-FORWARD▶</div>
            </div>

            <!-- 選択肢エリア -->
            <div class="choices-container" id="choices-container">
                <!-- Dynamic choices -->
            </div>
        </div>

        <!-- パズル・ミニゲーム モーダル -->
        <div id="puzzle-modal">
            <h3 style="color:var(--gold); margin-bottom:8px;">【記憶復元プロトコル】</h3>
            <p style="font-size:0.8rem; color:var(--text-sub); text-align:center;">
                タップまたはスワイプで数字を1〜8に並べ替えよ。
            </p>
            <div class="puzzle-success-msg" id="puzzle-success-msg">✔ 記憶領域の同期完了</div>
            <div class="puzzle-grid" id="puzzle-grid"></div>
            <button class="btn btn-secondary" id="puzzle-skip-btn" onclick="game.skipPuzzle()" style="width:auto; padding:8px 16px; font-size:0.8rem;">記憶を解析(スキップ)</button>
        </div>

        <!-- 結果 / エンディング画面 -->
        <div id="result-screen" class="screen">
            <div class="result-title" id="result-title">END</div>
            <div class="result-desc" id="result-desc">...</div>

    <script>
        /* --- Web Audio API による空間音響・ADSRエンベロープ・倍音合成エンジン --- */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.lastBeepTime = 0;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});
                }
            }

            playBeep(freq = 440, type = 'sine', duration = 0.1, randomize = false) {
                this.init();
                if (!this.ctx || this.ctx.state !== 'running') return;

                const now = performance.now();
                if (randomize && now - this.lastBeepTime < 35) return;
                this.lastBeepTime = now;

                try {
                    const currentTime = this.ctx.currentTime;
                    const finalFreq = randomize ? freq + (Math.random() * 35 - 17) : freq;
                    
                    const osc = this.ctx.createOscillator();
                    const filter = this.ctx.createBiquadFilter();
                    const gain = this.ctx.createGain();
                    
                    osc.type = type;
                    osc.frequency.setValueAtTime(finalFreq, currentTime);
                    if (randomize) {
                        osc.frequency.exponentialRampToValueAtTime(finalFreq * 0.94, currentTime + duration);
                    }
                    
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(2200, currentTime);

                    // ADSRエンベロープ (滑らかなアタック＆ナチュラルな減衰)
                    gain.gain.setValueAtTime(0.0001, currentTime);
                    gain.gain.linearRampToValueAtTime(0.035, currentTime + 0.012);
                    gain.gain.exponentialRampToValueAtTime(0.0001, currentTime + duration);
                    
                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    
                    osc.onended = () => {
                        try {
                            osc.disconnect();
                            filter.disconnect();
                            gain.disconnect();
                        } catch(e){}
                    };

                    osc.start(currentTime);
                    osc.stop(currentTime + duration);
                } catch(e){}
            }

            playRecallSound() {
                this.init();
                if (!this.ctx || this.ctx.state !== 'running') return;
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        this.playHarmonicChord(freq, idx === notes.length - 1 ? 0.65 : 0.32);
                    }, idx * 65);
                });
            }

            playHarmonicChord(baseFreq, duration) {
                this.init();
                if (!this.ctx || this.ctx.state !== 'running') return;
                try {
                    const currentTime = this.ctx.currentTime;
                    const gain = this.ctx.createGain();
                    const filter = this.ctx.createBiquadFilter();

                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(3200, currentTime);

                    // 空間反響感を高めた滑らかなADSRエンベロープ
                    gain.gain.setValueAtTime(0.0001, currentTime);
                    gain.gain.linearRampToValueAtTime(0.045, currentTime + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, currentTime + duration);
                    
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);

                    // 精緻な倍音合成 (基音 + 5度上のハーモニクス + サブオクターブ + 煌めきの高次倍音)
                    [1, 1.5, 0.5, 2].forEach((multiplier, i) => {
                        const osc = this.ctx.createOscillator();
                        osc.type = i === 3 ? 'sine' : (i === 2 ? 'triangle' : 'sine');
                        osc.frequency.setValueAtTime(baseFreq * multiplier, currentTime);
                        osc.connect(filter);
                        osc.start(currentTime);
                        osc.stop(currentTime + duration);
                    });
                } catch(e){}
            }

            playGlitchSound() {
                this.init();
                if (!this.ctx || this.ctx.state !== 'running') return;
                try {
                    const currentTime = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(80, currentTime);
                    osc.frequency.linearRampToValueAtTime(260, currentTime + 0.12);
                    gain.gain.setValueAtTime(0.05, currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, currentTime + 0.28);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(currentTime);
                    osc.stop(currentTime + 0.28);
                } catch(e){}
            }

            stopAll() {
                if (this.ctx && this.ctx.state === 'running') {
                    try {
                        this.ctx.suspend();
                    } catch(e){}
                }
            }
        }

        const sound = new SoundEngine();

        /* --- 多層（レイヤー）構造による奥行きのある背景パーティクル・エフェクト（被写界深度＆オーロラ連動深化） --- */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(layer) {
                this.layer = layer; // 1: 遠景(微細・低速), 2: 中景(標準), 3: 近景(大型・高速・高輝度)
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.angle = Math.random() * Math.PI * 2;
                this.oscSpeed = Math.random() * 0.015 + 0.008;
                if (this.layer === 1) {
                    this.size = Math.random() * 1.0 + 0.3;
                    this.speedY = -(Math.random() * 0.2 + 0.08);
                    this.alpha = Math.random() * 0.2 + 0.04;
                    this.blur = 3; // 遠景の被写界深度ブラー
                } else if (this.layer === 2) {
                    this.size = Math.random() * 1.8 + 0.7;
                    this.speedY = -(Math.random() * 0.42 + 0.2);
                    this.alpha = Math.random() * 0.35 + 0.12;
                    this.blur = 1.2; // 中景
                } else {
                    this.size = Math.random() * 2.8 + 1.2;
                    this.speedY = -(Math.random() * 0.75 + 0.35);
                    this.alpha = Math.random() * 0.6 + 0.25;
                    this.blur = 0; // 近景（シャープ）
                }
            }
            update() {
                this.y += this.speedY;
                this.angle += this.oscSpeed;
                this.x += Math.sin(this.angle) * 0.35;
                if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) this.reset();
            }
            draw(syncRate, unlockedCount) {
                // 記憶同調率および伏線回収数に呼応して滑らかに呼吸するオーロラ・ホログラフィックカラー
                let color;
                const progress = (syncRate / 100);
                const pulseAlpha = this.alpha * (0.85 + Math.sin(performance.now() * 0.002 + this.x) * 0.15);
                
                if (progress >= 0.75) {
                    const r = 255;
                    const g = Math.floor(190 + progress * 25);
                    const b = Math.floor(20 + progress * 40);
                    color = `rgba(${r}, ${g}, ${b}, ${pulseAlpha * 1.3})`;
                } else if (progress >= 0.4) {
                    const r = Math.floor(100 + 155 * progress);
                    const g = Math.floor(80 + progress * 45);
                    const b = Math.floor(140 + progress * 70);
                    color = `rgba(${r}, ${g}, ${b}, ${pulseAlpha * 1.15})`;
                } else {
                    const r = Math.floor(75 + progress * 60);
                    const g = Math.floor(95 + progress * 40);
                    const b = 255;
                    color = `rgba(${r}, ${g}, ${b}, ${pulseAlpha})`;
                }

                ctx.save();
                if (this.blur > 0 && ctx.filter !== undefined) {
                    ctx.filter = `blur(${this.blur}px)`;
                }
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // 階層別パーティクルプール生成 (計65粒)
        for (let i = 0; i < 22; i++) particles.push(new Particle(1));
        for (let i = 0; i < 28; i++) particles.push(new Particle(2));
        for (let i = 0; i < 15; i++) particles.push(new Particle(3));

        let isBgAnimating = true;
        let animFrameId = null;

        function animateBg() {
            if (!isBgAnimating) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const currentSync = window.game ? game.syncRate : 0;
            const currentUnlocked = window.game ? game.unlockedForeshadows.size : 0;
            particles.forEach(p => { p.update(); p.draw(currentSync, currentUnlocked); });
            animFrameId = requestAnimationFrame(animateBg);
        }

        // インタラクティブ背景：タップ・クリック時に微細な光の波紋（リップルエフェクト）を生成
        canvas.parentElement.addEventListener('pointerdown', (e) => {
            const rect = canvas.parentElement.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const ripple = document.createElement('div');
            ripple.className = 'ripple-effect';
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            ripple.style.width = '30px';
            ripple.style.height = '30px';
            ripple.style.marginLeft = '-15px';
            ripple.style.marginTop = '-15px';
            
            canvas.parentElement.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });

        function startBgAnimation() {
            if (!isBgAnimating) {
                isBgAnimating = true;
                animateBg();
            }
        }

        function stopBgAnimation() {
            isBgAnimating = false;
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }
        }

        // 画面のバックグラウンド移行時にCanvas描画ループを停止してCPU負荷を軽減
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopBgAnimation();
            } else {
                startBgAnimation();

        /* --- ゲームロジック・状態管理（ステートマシン導入） --- */
        const GAME_STATES = {
            IDLE: 'IDLE',
            TYPING: 'TYPING',
            WAIT_CHOICE: 'WAIT_CHOICE',
            PUZZLE: 'PUZZLE',
            RESULT: 'RESULT'
        };

        class GameEngine {
            constructor() {
                this.state = GAME_STATES.IDLE;
                this.currentScene = 'start';
                this.unlockedForeshadows = new Set();
                this.syncRate = 0;
                this.puzzleBoard = [1, 2, 3, 4, 5, 6, 7, 0, 8];
                this.allForeshadowsCount = 4;
                this.touchStartX = 0;
                this.touchStartY = 0;
                this.touchStartTime = 0;
                this.activeTimers = new Set();
                this.typeAnimFrame = null;
                this.isTransitionLocked = false;
                this.isPuzzleAnimating = false;
                this.isPuzzleClearing = false;
                this.lastSkipTimestamp = 0;
                this.currentFullText = '';
            }

            init() {
                this.checkSaveData();
                this.bindPuzzleTouchEvents();
                this.bindGlobalSkipEvents();
            }

            /* --- ライフサイクルクリーンアップ一元化 --- */
            cleanupTransition() {
                this.stopTypewriter();
                this.clearAllTimeouts();
                this.isPuzzleAnimating = false;
                this.isPuzzleClearing = false;
                this.isTransitionLocked = false;
                const mainScreen = document.getElementById('main-screen');
                if (mainScreen) {
                    mainScreen.classList.remove('flashback');
                }
            }

            bindGlobalSkipEvents() {
                const visualArea = document.getElementById('visual-area');
                if (visualArea) {
                    visualArea.addEventListener('pointerdown', (e) => {
                        if (this.state === GAME_STATES.TYPING) {
                            e.preventDefault();
                            this.completeTypewriter(true);
                        }
                    });
                }
            }

            /* --- 一括タイマーマネージャー --- */
            addTimeout(fn, delay) {
                const timerId = setTimeout(() => {
                    this.activeTimers.delete(timerId);
                    fn();
                }, delay);
                this.activeTimers.add(timerId);
                return timerId;
            }

            clearAllTimeouts() {
                this.activeTimers.forEach(id => clearTimeout(id));
                this.activeTimers.clear();
            }

            resetState() {
                this.cleanupTransition();

                const toast = document.getElementById('foreshadow-toast');
                if (toast) toast.classList.remove('show');

                const puzzleModal = document.getElementById('puzzle-modal');
                if (puzzleModal) puzzleModal.classList.remove('active');

                this.state = GAME_STATES.IDLE;
                this.currentScene = 'start';
                this.unlockedForeshadows.clear();
                this.syncRate = 0;
                this.isTransitionLocked = false;
                this.isPuzzleClearing = false;
                this.lastSkipTimestamp = 0;
                try {
                    localStorage.removeItem('echoes_save');
                } catch(e){}
            }

            bindPuzzleTouchEvents() {
                const grid = document.getElementById('puzzle-grid');
                if (!grid) return;

                let touchedTileIndex = -1;

                grid.addEventListener('pointerdown', (e) => {
                    if (this.state !== GAME_STATES.PUZZLE || this.isPuzzleAnimating || this.isPuzzleClearing) return;
                    this.touchStartX = e.clientX;
                    this.touchStartY = e.clientY;
                    this.touchStartTime = performance.now();
                    
                    const target = e.target.closest('.puzzle-tile');
                    if (target && !target.classList.contains('empty')) {
                        const tiles = Array.from(grid.children);
                        touchedTileIndex = tiles.indexOf(target);
                    } else {
                        touchedTileIndex = -1;
                    }
                }, { passive: false });

                grid.addEventListener('pointerup', (e) => {
                    if (this.state !== GAME_STATES.PUZZLE || this.isPuzzleAnimating || this.isPuzzleClearing) {
                        touchedTileIndex = -1;
                        return;
                    }
                    if (touchedTileIndex !== -1) {
                        const diffX = e.clientX - this.touchStartX;
                        const diffY = e.clientY - this.touchStartY;
                        const duration = performance.now() - (this.touchStartTime || 0);
                        const absX = Math.abs(diffX);
                        const absY = Math.abs(diffY);
                        
                        const minSwipeDist = Math.max(10, grid.clientWidth * 0.04);
                        if (duration < 450 && Math.max(absX, absY) >= minSwipeDist) {
                            this.handleDirectTileSwipe(touchedTileIndex, diffX, diffY);
                        } else if (duration < 400 && Math.max(absX, absY) < minSwipeDist) {
                            this.moveTile(touchedTileIndex);
                        }
                        touchedTileIndex = -1;
                    }
                }, { passive: true });

                grid.addEventListener('pointercancel', () => {
                    touchedTileIndex = -1;
                }, { passive: true });
            }

            checkSaveData() {
                const btn = document.getElementById('continue-btn');
                try {
                    const raw = localStorage.getItem('echoes_save');
                    if (raw) {
                        const data = JSON.parse(raw);
                        if (data && data.scene && SCENARIO[data.scene]) {
                            btn.style.display = 'inline-block';
                            return;
                        }
                    }
                } catch (e) {
                    console.warn("セーブデータの検証に失敗しました:", e);
                }
                btn.style.display = 'none';
            }

            startNewGame() {
                this.resetState();
                this.switchScreen('main-screen');
                this.renderScene('start');
            }

            loadGame() {
                try {
                    const raw = localStorage.getItem('echoes_save');
                    if (!raw) return;
                    const data = JSON.parse(raw);
                    if (data && data.scene && SCENARIO[data.scene]) {
                        this.stopTypewriter();
                        this.currentScene = data.scene;
                        this.unlockedForeshadows = new Set(Array.isArray(data.foreshadows) ? data.foreshadows : []);
                        this.syncRate = typeof data.sync === 'number' ? data.sync : 0;
                        this.switchScreen('main-screen');
                        this.renderScene(this.currentScene);
                        return;
                    }
                } catch (e) {
                    console.error("ロード処理中にエラーが発生したため、初期状態に戻します:", e);
                }
                this.startNewGame();
            }

            saveGame() {
                try {
                    const data = {
                        scene: this.currentScene,
                        foreshadows: Array.from(this.unlockedForeshadows),
                        sync: this.syncRate
                    };
                    localStorage.setItem('echoes_save', JSON.stringify(data));
                } catch (e) {
                    console.warn("セーブ保存に失敗しました:", e);
                }
            }

            switchScreen(screenId) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(screenId).classList.add('active');
            }

            unlockForeshadow(info) {
                if (!this.unlockedForeshadows.has(info.id)) {
                    this.unlockedForeshadows.add(info.id);
                    this.syncRate = Math.min(100, Math.round((this.unlockedForeshadows.size / this.allForeshadowsCount) * 100));
                    sound.playRecallSound();

                    const mainScreen = document.getElementById('main-screen');
                    mainScreen.classList.remove('flashback');
                    void mainScreen.offsetWidth;
                    mainScreen.classList.add('flashback');

                    const toast = document.getElementById('foreshadow-toast');
                    document.getElementById('toast-text').innerText = info.title;
                    toast.classList.add('show');
                    
                    this.addTimeout(() => toast.classList.remove('show'), 3000);
                }
            }

            renderScene(sceneKey) {
                this.cleanupTransition();
                this.currentScene = sceneKey;
                const node = SCENARIO[sceneKey];

                if (!node) return;

                // 伏線解放チェック
                if (node.foreshadow) {
                    this.unlockForeshadow(node.foreshadow);
                }

                // エンディング判定
                if (node.isEnd) {
                    this.showResult(node);
                    return;
                }

                // HUD更新
                document.getElementById('hud-days').innerText = `残り ${node.day} 日`;
                document.getElementById('hud-sync').innerText = `${this.syncRate} %`;

                // UI更新
                document.getElementById('speaker-name').innerText = node.speaker;
                document.getElementById('speaker-name').style.color = node.color || '#ff477e';
                document.getElementById('avatar-icon').innerText = node.icon || '👁️';
                document.getElementById('avatar-box').style.background = `radial-gradient(circle, ${node.color || '#5d6dff'} 0%, transparent 70%)`;

                // 選択肢準備
                this.setupChoices(node);

                // ダイアログ文字送り開始
                this.typeWriter(node.text);

                this.saveGame();
            }

            setupChoices(node) {
                const choicesBox = document.getElementById('choices-container');
                choicesBox.innerHTML = '';
                choicesBox.classList.add('disabled');
                this.isTransitionLocked = true;

                let choices = node.choices || [];

                if (node.dynamicChoices) {
                    choices = [];
                    choices.push({ text: "世界は本当に崩壊するのか？（標準の理解）", next: "normal_end" });

                    if (this.unlockedForeshadows.size >= 3) {
                        choices.push({
                            text: "⚡【真実の選択】これは脳内AI『エリス』と自分の記憶プログラムだ！",
                            next: "true_end",
                            isTruth: true
                        });
                    } else {
                        choices.push({ text: "❓（記憶の伏線が足りず、真実が見えない…）", next: "bad_end_2" });
                    }
                }

                choices.forEach(c => {
                    const btn = document.createElement('button');
                    btn.className = `choice-btn ${c.isTruth ? 'truth' : ''}`;
                    btn.innerHTML = `<span>${c.text}</span> <span>➔</span>`;
                    
                    let isPointerDown = false;
                    btn.addEventListener('pointerdown', (e) => {
                        if (this.state !== GAME_STATES.WAIT_CHOICE || this.isTransitionLocked) return;
                        isPointerDown = true;
                    });

                    btn.addEventListener('pointerup', (e) => {
                        if (!isPointerDown || this.state !== GAME_STATES.WAIT_CHOICE || this.isTransitionLocked) return;
                        isPointerDown = false;

                        e.preventDefault();
                        e.stopPropagation();
                        const now = performance.now();
                        if (now - this.lastSkipTimestamp < 300) {
                            return;
                        }
                        this.isTransitionLocked = true;
                        sound.playBeep(600, 'sine', 0.05);
                        
                        if (c.puzzle) {
                            this.startPuzzle(c.next);
                        } else {
                            this.renderScene(c.next);
                        }
                    });

                    btn.addEventListener('pointercancel', () => {
                        isPointerDown = false;
                    });

                    choicesBox.appendChild(btn);
                });
            }

            typeWriter(text) {
                this.stopTypewriter();
                
                const dialogEl = document.getElementById('dialog-text');
                const hintEl = document.getElementById('dialog-hint');
                
                if (dialogEl) dialogEl.innerText = '';
                this.currentFullText = text;
                this.state = GAME_STATES.TYPING;
                if (hintEl) hintEl.style.display = 'block';

                let idx = 0;
                let lastTime = performance.now();
                const charInterval = 28;

                const step = (now) => {
                    if (this.state !== GAME_STATES.TYPING) return;
                    if (now - lastTime >= charInterval) {
                        lastTime = now;
                        if (idx < text.length) {
                            if (dialogEl) dialogEl.innerText += text.charAt(idx);
                            idx++;
                            if (idx % 2 === 0) sound.playBeep(850, 'sine', 0.02, true);
                        } else {
                            this.completeTypewriter(false);
                            return;
                        }
                    }
                    this.typeAnimFrame = requestAnimationFrame(step);
                };
                this.typeAnimFrame = requestAnimationFrame(step);
            }

            handleDialogClick() {
                if (this.state === GAME_STATES.TYPING) {
                    this.completeTypewriter(true);
                } else if (this.state === GAME_STATES.WAIT_CHOICE && !this.isTransitionLocked) {
                    const choicesBox = document.getElementById('choices-container');
                    if (choicesBox && choicesBox.children.length > 0) {
                        const firstChoice = choicesBox.children[0];
                        if (firstChoice) {
                            firstChoice.classList.add('truth');
                            this.addTimeout(() => firstChoice.classList.remove('truth'), 150);
                        }
                    }
                }
            }

            completeTypewriter(isManualSkip = false) {
                if (this.state !== GAME_STATES.TYPING && !isManualSkip) return;
                
                this.stopTypewriter();
                const dialogEl = document.getElementById('dialog-text');
                const choicesBox = document.getElementById('choices-container');
                const hintEl = document.getElementById('dialog-hint');
                
                if (dialogEl && this.currentFullText) {
                    dialogEl.innerText = this.currentFullText;
                }
                if (hintEl) hintEl.style.display = 'none';

                if (isManualSkip) {
                    this.lastSkipTimestamp = performance.now();
                }

                this.state = GAME_STATES.WAIT_CHOICE;
                const lockDuration = isManualSkip ? 250 : 100;
                this.addTimeout(() => {
                    this.isTransitionLocked = false;
                    if (choicesBox) choicesBox.classList.remove('disabled');
                }, lockDuration);
            }

            stopTypewriter() {
                if (this.typeAnimFrame) {
                    cancelAnimationFrame(this.typeAnimFrame);
                    this.typeAnimFrame = null;
                }
            }

            /* --- スライドパズル ミニゲーム --- */
            startPuzzle(nextScene) {
                this.state = GAME_STATES.PUZZLE;
                this.puzzleNextScene = nextScene;
                this.isPuzzleClearing = false;
                this.isPuzzleAnimating = false;
                const modal = document.getElementById('puzzle-modal');
                const msg = document.getElementById('puzzle-success-msg');
                const skipBtn = document.getElementById('puzzle-skip-btn');

                if (msg) msg.classList.remove('show');
                if (skipBtn) skipBtn.style.display = 'inline-block';
                modal.classList.add('active');

                this.generateSolvablePuzzle();
                this.renderPuzzle();
            }

            generateSolvablePuzzle() {
                const winState = [1, 2, 3, 4, 5, 6, 7, 8, 0];
                
                // 数学的置換の反転数（インバージョン数）を算出し可解性と適正難易度を確実に保証する生成ルーチン
                const countInversions = (arr) => {
                    let inv = 0;
                    const clean = arr.filter(n => n !== 0);
                    for (let i = 0; i < clean.length; i++) {
                        for (let j = i + 1; j < clean.length; j++) {
                            if (clean[i] > clean[j]) inv++;
                        }
                    }
                    return inv;
                };

                do {
                    this.puzzleBoard = [1, 2, 3, 4, 5, 6, 7, 8, 0];
                    let movesCount = 42; // 適正な手数でシャッフル
                    let lastEmptyIdx = -1;

                    for (let i = 0; i < movesCount; i++) {
                        const emptyIdx = this.puzzleBoard.indexOf(0);
                        const neighbors = [];

                        const r = Math.floor(emptyIdx / 3);
                        const c = emptyIdx % 3;

                        if (r > 0) neighbors.push(emptyIdx - 3);
                        if (r < 2) neighbors.push(emptyIdx + 3);
                        if (c > 0) neighbors.push(emptyIdx - 1);
                        if (c < 2) neighbors.push(emptyIdx + 1);

                        const validNeighbors = neighbors.filter(idx => idx !== lastEmptyIdx);
                        const chosenIdx = validNeighbors.length > 0 
                            ? validNeighbors[Math.floor(Math.random() * validNeighbors.length)] 
                            : neighbors[0];

                        [this.puzzleBoard[chosenIdx], this.puzzleBoard[emptyIdx]] = [this.puzzleBoard[emptyIdx], this.puzzleBoard[chosenIdx]];
                        lastEmptyIdx = emptyIdx;
                    }
                } while (
                    JSON.stringify(this.puzzleBoard) === JSON.stringify(winState) || 
                    countInversions(this.puzzleBoard) % 2 !== 0
                );
            }

            renderPuzzle() {
                const grid = document.getElementById('puzzle-grid');
                grid.innerHTML = '';

                const emptyIdx = this.puzzleBoard.indexOf(0);
                const r2 = Math.floor(emptyIdx / 3), c2 = emptyIdx % 3;

                this.puzzleBoard.forEach((num, idx) => {
                    const tile = document.createElement('div');
                    const r1 = Math.floor(idx / 3), c1 = idx % 3;
                    const isMovable = num !== 0 && (Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1);

                    let classNames = ['puzzle-tile'];
                    if (num === 0) classNames.push('empty');
                    else if (isMovable) classNames.push('movable');

                    tile.className = classNames.join(' ');
                    tile.innerText = num !== 0 ? num : '';

                    tile.onclick = () => {
                        if (this.state !== GAME_STATES.PUZZLE || this.isPuzzleClearing || this.isPuzzleAnimating) return;
                        if (!this.moveTile(idx)) {
                            // 移動不可能なマスをクリックした際のシェイクフィードバック
                            tile.classList.remove('invalid-move');
                            void tile.offsetWidth;
                            tile.classList.add('invalid-move');
                            sound.playBeep(180, 'sawtooth', 0.08);
                        }
                    };
                    grid.appendChild(tile);
                });
            }

            moveTile(idx) {
                if (this.isPuzzleAnimating || this.isPuzzleClearing || this.state !== GAME_STATES.PUZZLE) return false;
                const emptyIdx = this.puzzleBoard.indexOf(0);
                const r1 = Math.floor(idx / 3), c1 = idx % 3;
                const r2 = Math.floor(emptyIdx / 3), c2 = emptyIdx % 3;

                if (Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1) {
                    this.isPuzzleAnimating = true;
                    const grid = document.getElementById('puzzle-grid');
                    const tiles = grid ? grid.children : null;
                    const movingTile = tiles ? tiles[idx] : null;

                    if (movingTile && grid) {
                        const tileWidth = movingTile.clientWidth;
                        const gap = 10;
                        const deltaX = (c2 - c1) * (tileWidth + gap);
                        const deltaY = (r2 - r1) * (tileWidth + gap);
                        
                        movingTile.classList.add('sliding');
                        movingTile.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                    }

                    sound.playBeep(450, 'triangle', 0.05);

                    this.addTimeout(() => {
                        [this.puzzleBoard[idx], this.puzzleBoard[emptyIdx]] = [this.puzzleBoard[emptyIdx], this.puzzleBoard[idx]];
                        this.isPuzzleAnimating = false;
                        this.renderPuzzle();
                        this.checkPuzzleWin();
                    }, 120);
                    return true;
                }
                return false;
            }

            handleDirectTileSwipe(tileIdx, diffX, diffY) {
                if (this.isPuzzleClearing || this.isPuzzleAnimating || this.state !== GAME_STATES.PUZZLE) return;
                
                const emptyIdx = this.puzzleBoard.indexOf(0);
                const r1 = Math.floor(tileIdx / 3), c1 = tileIdx % 3;
                const r2 = Math.floor(emptyIdx / 3), c2 = emptyIdx % 3;

                if (Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1) {
                    const absX = Math.abs(diffX);
                    const absY = Math.abs(diffY);
                    let isIntentMatch = false;

                    if (absX > absY) {
                        if ((diffX > 0 && c2 > c1) || (diffX < 0 && c2 < c1)) isIntentMatch = true;
                    } else {
                        if ((diffY > 0 && r2 > r1) || (diffY < 0 && r2 < r1)) isIntentMatch = true;
                    }

                    if (isIntentMatch) {
                        this.moveTile(tileIdx);
                    }
                } else {
                    // タップされたタイル自体が空きマスの隣接であれば、方向スワイプがなくても直接移動を許可するフォールバック
                    const grid = document.getElementById('puzzle-grid');
                    const tiles = grid ? grid.children : null;
                    const tile = tiles ? tiles[tileIdx] : null;
                    if (tile) {
                        tile.classList.remove('invalid-move');
                        void tile.offsetWidth;
                        tile.classList.add('invalid-move');
                        sound.playBeep(180, 'sawtooth', 0.08);
                    }
                }
            }

            handlePuzzleSwipe(diffX, diffY) {
                // 後方互換維持用フォールバック
                if (this.isPuzzleClearing || this.isPuzzleAnimating || this.state !== GAME_STATES.PUZZLE) return;
                const emptyIdx = this.puzzleBoard.indexOf(0);
                const r = Math.floor(emptyIdx / 3);
                const c = emptyIdx % 3;
                let targetIdx = -1;

                const absX = Math.abs(diffX);
                const absY = Math.abs(diffY);

                if (absX > absY * 1.4) {
                    if (diffX > 0 && c > 0) targetIdx = emptyIdx - 1;
                    else if (diffX < 0 && c < 2) targetIdx = emptyIdx + 1;
                } else if (absY > absX * 1.4) {
                    if (diffY > 0 && r > 0) targetIdx = emptyIdx - 3;
                    else if (diffY < 0 && r < 2) targetIdx = emptyIdx + 3;
                }

                if (targetIdx !== -1) {
                    this.moveTile(targetIdx);
                }
            }

            checkPuzzleWin() {
                const winState = [1, 2, 3, 4, 5, 6, 7, 8, 0];
                if (JSON.stringify(this.puzzleBoard) === JSON.stringify(winState)) {
                    this.isPuzzleClearing = true;
                    sound.playRecallSound();

                    const grid = document.getElementById('puzzle-grid');
                    if (grid) {
                        Array.from(grid.children).forEach(tile => {
                            if (!tile.classList.contains('empty')) {
                                tile.classList.add('success-glow');
                            }
                        });
                    }

                    const msg = document.getElementById('puzzle-success-msg');
                    const skipBtn = document.getElementById('puzzle-skip-btn');
                    if (msg) msg.classList.add('show');
                    if (skipBtn) skipBtn.style.display = 'none';

                    this.addTimeout(() => {
                        this.skipPuzzle();
                    }, 1400);
                }
            }

            skipPuzzle() {
                document.getElementById('puzzle-modal').classList.remove('active');
                this.renderScene(this.puzzleNextScene);
            }

            /* --- エンディング表示 --- */
            showResult(node) {
                this.state = GAME_STATES.RESULT;
                this.switchScreen('result-screen');
                sound.playGlitchSound();

                const titleEl = document.getElementById('result-title');
                titleEl.innerText = node.title;
                titleEl.className = `result-title ${node.type}`;

                document.getElementById('result-desc').innerText = node.text;

                // 伏線回収リスト描画
                const listEl = document.getElementById('recall-list');
                listEl.innerHTML = '';
                
                const allForeshadowDefs = [
                    { id: "key_girl", title: "言葉の違和感「また会えた」" },
                    { id: "key_clock", title: "時計の刻印『E.C.』" },
                    { id: "key_name", title: "偽りの名前への拒絶" },
                    { id: "key_noise", title: "エリスの正体「AIとドクター」" }
                ];

                allForeshadowDefs.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'recall-item';
                    const isUnlocked = this.unlockedForeshadows.has(item.id);
                    div.innerHTML = `${isUnlocked ? '✅' : '🔒'} <span>${isUnlocked ? item.title : '？？？？？？？？'}</span>`;
                    if (!isUnlocked) div.style.color = 'var(--text-sub)';
                    listEl.appendChild(div);
                });

                // スコア計算
                const completionRate = Math.round((this.unlockedForeshadows.size / this.allForeshadowsCount) * 100);
                document.getElementById('final-score').innerText = `${this.syncRate * 10} PTS`;
                document.getElementById('final-completion').innerText = `${completionRate} %`;
            }

            restartLoop() {
                this.resetState();
                this.switchScreen('start-screen');
                this.checkSaveData();
            }
        }

        const game = new GameEngine();
        window.addEventListener('DOMContentLoaded', () => {
            game.init();
            document.body.addEventListener('touchstart', () => sound.init(), { once: true });
            document.body.addEventListener('click', () => sound.init(), { once: true });
        });
    </script>
</body>
