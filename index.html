<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Rogue 3D - Ultimate Matrix Overdrive Fusion Reborn v2</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #010103;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      z-index: 1;
    }

    /* Screen Overlay Effects */
    #overdrive-screen-fx {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.3s ease;
      background: radial-gradient(circle, transparent 30%, rgba(255, 0, 128, 0.25) 80%, rgba(0, 255, 255, 0.4) 100%);
      box-shadow: inset 0 0 60px rgba(255, 0, 200, 0.6);
    }
    #overdrive-screen-fx.active {
      opacity: 1;
      animation: pulseVignette 0.8s infinite alternate ease-in-out;
    }
    @keyframes pulseVignette {
      0% { opacity: 0.7; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    /* Glitch Screen Overlay */
    #glitch-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 6;
      opacity: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 255, 255, 0.08),
        rgba(0, 255, 255, 0.08) 1px,
        transparent 1px,
        transparent 2px
      );
      transition: opacity 0.1s ease;
    }
    #glitch-overlay.active {
      opacity: 1;
      animation: glitchAnim 0.15s infinite;
    }
    @keyframes glitchAnim {
      0% { transform: translate(0, 0); filter: hue-rotate(0deg); }
      50% { transform: translate(-3px, 3px); filter: hue-rotate(90deg); }
      100% { transform: translate(3px, -2px); filter: hue-rotate(0deg); }
    }

    /* Cinematic Counter / Wireframe FX */
    #counter-fx {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 7;
      opacity: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, rgba(255,0,127,0.4) 70%, rgba(0,0,0,0.9) 100%);
      backdrop-filter: grayscale(1.0) contrast(2.0);
      transition: opacity 0.15s ease;
    }
    #counter-fx.active { opacity: 1; }

    /* Bullet Time Effect */
    #bullet-time-fx {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 7;
      opacity: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(0,212,255,0.25) 60%, rgba(0,0,0,0.7) 100%);
      backdrop-filter: grayscale(0.5) contrast(1.4);
      transition: opacity 0.2s ease;
    }
    #bullet-time-fx.active { opacity: 1; }

    /* 1. Cyber Matrix Kill & Domination Cinematic FX Overlay */
    #matrix-kill-fx {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 9;
      opacity: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,0,127,0.6) 40%, rgba(0,0,0,0.98) 90%);
      backdrop-filter: grayscale(1.0) contrast(3.5) brightness(1.6);
      transition: opacity 0.08s ease;
    }
    #matrix-kill-fx.active { opacity: 1; }

    /* QTE Prompt Overlay for Domination */
    #domination-prompt {
      position: absolute;
      top: 25%; left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 65;
      pointer-events: auto;
      text-align: center;
    }
    .dom-title {
      font-size: 28px;
      font-weight: 900;
      color: #00ffff;
      text-shadow: 0 0 20px #00ffff, 0 0 40px #ff007f;
      letter-spacing: 4px;
    }
    .dom-btn {
      padding: 16px 42px;
      font-size: 20px;
      font-weight: 900;
      color: #0b0c10;
      background: linear-gradient(45deg, #00ffff, #66fcf1);
      border: 3px solid #fff;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 30px #00ffff;
      animation: pulseDomBtn 0.4s infinite alternate;
    }
    @keyframes pulseDomBtn {
      0% { transform: scale(1); box-shadow: 0 0 20px #00ffff; }
      100% { transform: scale(1.1); box-shadow: 0 0 40px #ff007f, 0 0 60px #00ffff; }
    }

    /* Damage Flash Effect */
    #damage-flash {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 0, 85, 0.4);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease-out;
      z-index: 8;
    }

    /* UI Layer */
    #ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    /* Top HUD */
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      color: #fff;
      text-shadow: 0 0 8px #000;
      width: 100%;
    }
    .hud-stats {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hud-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hud-title {
      font-size: 16px;
      font-weight: 900;
      color: #66fcf1;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(102, 252, 241, 0.6);
    }
    .element-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .elem-tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .elem-tag.electric { background: #00d2ff; color: #000; box-shadow: 0 0 10px #00d2ff; }
    .elem-tag.fire { background: #ff3300; color: #fff; box-shadow: 0 0 10px #ff3300; }
    .elem-tag.ice { background: #00ffff; color: #000; box-shadow: 0 0 10px #00ffff; }
    .elem-tag.fusion-plasma { background: linear-gradient(45deg, #ff3300, #ff007f); color: #fff; box-shadow: 0 0 14px #ff3300; }
    .elem-tag.fusion-zero { background: linear-gradient(45deg, #00ffff, #00d2ff); color: #000; box-shadow: 0 0 14px #00ffff; }

    .bar-container {
      width: 210px;
      height: 16px;
      background: rgba(0,0,0,0.8);
      border: 1px solid #45a29e;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 10px rgba(102, 252, 241, 0.4);
    }
    .hp-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0844 0%, #ffb199 100%);
      transition: width 0.1s ease;
    }
    .od-bar-container {
      width: 210px;
      height: 12px;
      background: rgba(0,0,0,0.8);
      border: 1px solid #ff007f;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
    }
    .od-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff007f 0%, #7928ca 50%, #00dfd8 100%);
      transition: width 0.1s ease;
    }

    .floor-info {
      font-size: 20px;
      font-weight: 900;
      color: #c5c6c7;
      text-align: right;
      text-shadow: 0 0 10px rgba(255,255,255,0.4);
    }

    /* 3. AI Drone Assistant & Emotion HUD */
    #ai-drone-hud {
      position: absolute;
      top: 95px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(11, 12, 16, 0.88);
      border: 1px solid #66fcf1;
      border-radius: 10px;
      padding: 8px 14px;
      box-shadow: 0 0 15px rgba(102, 252, 241, 0.3);
      z-index: 12;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.3s ease, transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    #ai-drone-hud.active {
      opacity: 1;
      transform: translateY(0);
    }
    #ai-drone-hud.excited {
      border-color: #ff007f;
      box-shadow: 0 0 22px rgba(255, 0, 127, 0.7);
    }
    #ai-drone-hud.panic {
      border-color: #ff3366;
      box-shadow: 0 0 22px rgba(255, 51, 102, 0.8);
      animation: shakeAI 0.2s infinite alternate;
    }
    @keyframes shakeAI {
      0% { transform: translateY(0) translateX(-2px); }
      100% { transform: translateY(0) translateX(2px); }
    }
    .ai-avatar {
      width: 36px;
      height: 36px;
      border: 2px solid #66fcf1;
      border-radius: 50%;
      background: radial-gradient(circle, #66fcf1 0%, #0b0c10 80%);
      box-shadow: 0 0 10px #66fcf1;
      animation: pulseAvatar 1.2s infinite alternate ease-in-out;
    }
    @keyframes pulseAvatar {
      0% { transform: scale(1); box-shadow: 0 0 8px #66fcf1; }
      100% { transform: scale(1.08); box-shadow: 0 0 16px #66fcf1; }
    }
    .ai-text-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .ai-name {
      font-size: 10px;
      font-weight: 900;
      color: #66fcf1;
      letter-spacing: 1px;
    }
    .ai-msg {
      font-size: 12px;
      color: #fff;
      font-weight: bold;
      text-shadow: 0 0 6px rgba(255,255,255,0.6);
    }

    /* Boss Health Bar Overlay */
    #boss-hud {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 500px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 15;
    }
    .boss-name {
      color: #ff0055;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 3px;
      text-shadow: 0 0 12px #ff0055;
    }
    .boss-bar-container {
      width: 100%;
      height: 20px;
      background: rgba(0,0,0,0.85);
      border: 2px solid #ff0055;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
    }
    .boss-hp-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055 0%, #ff9900 100%);
      transition: width 0.1s ease;
    }

    /* Controls Bottom */
    .controls-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      height: 210px;
      pointer-events: auto;
    }

    /* Joystick */
    #joystick-area {
      width: 140px;
      height: 140px;
      background: rgba(255, 255, 255, 0.06);
      border: 2px dashed rgba(102, 252, 241, 0.4);
      border-radius: 50%;
      position: relative;
      margin-left: 10px;
      margin-bottom: 10px;
      box-shadow: 0 0 15px rgba(102, 252, 241, 0.2);
    }
    #joystick-knob {
      width: 56px;
      height: 56px;
      background: rgba(102, 252, 241, 0.8);
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 16px #66fcf1;
    }

    /* Action Buttons Array Grid */
    .btn-group {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(2, 64px);
      gap: 12px;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    .action-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid #66fcf1;
      background: rgba(11, 12, 16, 0.8);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 14px rgba(102, 252, 241, 0.4);
      user-select: none;
      position: relative;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s, background 0.1s;
    }
    .action-btn:active, .action-btn.active {
      background: #66fcf1;
      color: #0b0c10;
      transform: scale(0.9);
    }
    .btn-cd-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      height: 0%;
      transition: height 0.05s linear;
      pointer-events: none;
    }

    #fire-btn {
      border-color: #ff3366;
      box-shadow: 0 0 16px rgba(255, 51, 102, 0.7);
      grid-column: 3;
      grid-row: 2;
    }
    #fire-btn:active, #fire-btn.active { background: #ff3366; color: #fff; }

    #dash-btn {
      border-color: #ffaa00;
      box-shadow: 0 0 16px rgba(255, 170, 0, 0.6);
      grid-column: 2;
      grid-row: 2;
    }
    #jump-btn {
      grid-column: 3;
      grid-row: 1;
    }
    #skill-btn {
      border-color: #b026ff;
      box-shadow: 0 0 16px rgba(176, 38, 255, 0.6);
      grid-column: 1;
      grid-row: 2;
    }
    #counter-btn {
      border-color: #00ffff;
      background: rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 16px rgba(0, 255, 255, 0.7);
      grid-column: 1;
      grid-row: 1;
      font-size: 10px;
    }
    #od-btn {
      border-color: #ff007f;
      background: rgba(255, 0, 127, 0.25);
      box-shadow: 0 0 18px rgba(255, 0, 127, 0.9);
      grid-column: 2;
      grid-row: 1;
      display: flex;
    }
    #od-btn.ready {
      animation: pulseODBtn 0.6s infinite alternate;
    }
    @keyframes pulseODBtn {
      0% { transform: scale(1); box-shadow: 0 0 12px #ff007f; }
      100% { transform: scale(1.12); box-shadow: 0 0 26px #ff007f, 0 0 35px #00ffff; }
    }

    /* Modals & Banners */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 3, 7, 0.94);
      z-index: 100;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      backdrop-filter: blur(10px);
    }
    .modal-title {
      font-size: 30px;
      color: #66fcf1;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 0 0 16px #66fcf1;
    }
    .upgrade-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 92%;
      max-width: 400px;
    }
    .upgrade-card {
      background: #101622;
      border: 1px solid #45a29e;
      border-radius: 12px;
      padding: 16px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(102, 252, 241, 0.25);
      transform-style: preserve-3d;
      transition: transform 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .upgrade-card:hover {
      transform: translateY(-4px) rotateX(4deg);
      border-color: #66fcf1;
      box-shadow: 0 0 22px rgba(102, 252, 241, 0.6);
    }
    .upgrade-card:active {
      transform: scale(0.96);
      background: #1c2536;
    }
    .card-name {
      font-size: 16px;
      font-weight: bold;
      color: #66fcf1;
      display: flex;
      justify-content: space-between;
    }
    .card-desc {
      font-size: 13px;
      color: #c5c6c7;
    }

    .modal-btn {
      margin-top: 24px;
      padding: 14px 36px;
      font-size: 17px;
      font-weight: bold;
      color: #0b0c10;
      background: #66fcf1;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      box-shadow: 0 0 18px #66fcf1;
    }
    .modal-btn:active { transform: scale(0.95); }

    /* Cinematic KO Banner */
    #ko-banner {
      position: absolute;
      top: 40%; left: 50%;
      transform: translate(-50%, -50%) scale(0.7);
      font-size: 46px;
      font-weight: 900;
      font-style: italic;
      color: #fff;
      text-shadow: 0 0 25px #ff007f, 0 0 50px #00ffff;
      letter-spacing: 8px;
      pointer-events: none;
      opacity: 0;
      z-index: 50;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #ko-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.15);
    }

    /* Perfect Dodge Banner */
    #dodge-banner {
      position: absolute;
      top: 32%; left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      font-size: 36px;
      font-weight: 900;
      font-style: italic;
      color: #00ffff;
      text-shadow: 0 0 20px #00ffff, 0 0 40px #ffffff;
      letter-spacing: 5px;
      pointer-events: none;
      opacity: 0;
      z-index: 55;
      transition: all 0.2s ease-out;
    }
    #dodge-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.25);
    }

    /* Environment Warning Banner */
    #env-warning {
      position: absolute;
      top: 15%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      font-weight: 900;
      color: #ff3366;
      background: rgba(0,0,0,0.85);
      padding: 10px 24px;
      border: 2px solid #ff3366;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(255, 51, 102, 0.8);
      letter-spacing: 4px;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #env-warning.show {
      opacity: 1;
      animation: pulseWarn 0.5s infinite alternate;
    }
    @keyframes pulseWarn {
      0% { transform: translate(-50%, -50%) scale(1); }
      100% { transform: translate(-50%, -50%) scale(1.06); }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="overdrive-screen-fx"></div>
  <div id="glitch-overlay"></div>
  <div id="counter-fx"></div>
  <div id="bullet-time-fx"></div>
  <div id="matrix-kill-fx"></div>
  <div id="damage-flash"></div>
  <div id="ko-banner">SYSTEM PURGED</div>
  <div id="dodge-banner">PERFECT DODGE!</div>
  <div id="env-warning">WARNING: DATA STORM ACTIVE</div>

  <!-- QTE Domination Prompt -->
  <div id="domination-prompt">
    <div class="dom-title">SYNCHRONIZE DOMINATION</div>
    <button class="dom-btn" id="dom-btn">EXECUTE BLADE [Q / TAP]</button>
  </div>

  <!-- HUD -->
  <div id="ui-layer">
    <div class="hud-top">
      <div class="hud-stats">
        <div class="hud-title-row">
          <span class="hud-title">CYBER RUNNER 3D</span>
          <div class="element-tags" id="element-tags"></div>
        </div>
        <div class="bar-container">
          <div id="hp-bar" class="hp-bar"></div>
        </div>
        <div class="od-bar-container">
          <div id="od-bar" class="od-bar"></div>
        </div>
      </div>
      <div class="floor-info">
        <div>FLOOR <span id="floor-num">1</span></div>
        <div style="font-size:13px; color:#45a29e;">KILLS: <span id="kill-num">0</span></div>
      </div>
    </div>

    <!-- 3. AI Drone Assistant HUD -->
    <div id="ai-drone-hud">
      <div class="ai-avatar" id="ai-avatar-mesh"></div>
      <div class="ai-text-box">
        <span class="ai-name" id="ai-name-label">AI ASSISTANT // IRIS-9</span>
        <span class="ai-msg" id="ai-msg-text">システム正常稼働中...</span>
      </div>
    </div>

    <!-- Boss HP Overlay -->
    <div id="boss-hud">
      <div class="boss-name" id="boss-title">MEGABOSS: CYBER CORE</div>
      <div class="boss-bar-container">
        <div id="boss-hp-bar" class="boss-hp-bar"></div>
      </div>
    </div>

    <!-- Mobile Controls -->
    <div class="controls-bottom">
      <div id="joystick-area">
        <div id="joystick-knob"></div>
      </div>
      <div class="btn-group">
        <button id="counter-btn" class="action-btn">
          <span>SYNCHRO<br>BLADE</span>
        </button>
        <button id="od-btn" class="action-btn">
          <span>OVER<br>DRIVE</span>
        </button>
        <button id="jump-btn" class="action-btn">JUMP</button>
        <button id="skill-btn" class="action-btn">
          <span>EMP</span>
          <div id="skill-cd" class="btn-cd-overlay"></div>
        </button>
        <button id="dash-btn" class="action-btn">
          <span>DASH</span>
          <div id="dash-cd" class="btn-cd-overlay"></div>
        </button>
        <button id="fire-btn" class="action-btn">FIRE</button>
      </div>
    </div>
  </div>

  <!-- Upgrade Modal -->
  <div id="upgrade-modal" class="modal-overlay">
    <h2 class="modal-title">STAGE CLEAR - FUSION CORE</h2>
    <div style="color:#fff; margin-bottom:18px; font-size:14px;">モジュールを融合・覚醒させ、さらなる高みへ到達せよ</div>
    <div class="upgrade-list" id="upgrade-options"></div>
  </div>

  <!-- Game Over Modal -->
  <div id="gameover-modal" class="modal-overlay">
    <h2 class="modal-title" style="color:#ff3366; text-shadow:0 0 18px #ff3366;">SYSTEM OFFLINE</h2>
    <p style="color:#c5c6c7; margin-bottom: 22px; font-size:16px;">到達階層: <span id="final-floor">1</span></p>
    <button class="modal-btn" id="restart-btn">REBOOT SYSTEM</button>
  </div>

  <!-- Three.js + Postprocessing CDNs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <script>
    /* ==========================================================
       WEB AUDIO API DYNAMIC SYNTHESIZER & MUSIC ENGINE
    ========================================================== */
    let audioCtx = null;
    let musicNodeTimer = null;
    let musicStep = 0;
    let currentTempo = 0.15; // 150ms per step

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startDynamicMusicEngine();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function startDynamicMusicEngine() {
      if (musicNodeTimer) clearInterval(musicNodeTimer);

      const bassNotes = [110, 110, 146.83, 130.81, 98.0, 110, 164.81, 146.83];

      musicNodeTimer = setInterval(() => {
        if (!audioCtx || isGameOver) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = (playerStats.isOverdrive || megaBoss) ? 'sawtooth' : 'square';
        
        const noteFreq = bassNotes[musicStep % bassNotes.length];
        osc.frequency.setValueAtTime(noteFreq, audioCtx.currentTime);

        filter.type = 'lowpass';
        let cutoff = 800;
        if (playerStats.isOverdrive) cutoff = 2400;
        else if (megaBoss) cutoff = 1800;
        filter.frequency.setValueAtTime(cutoff, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.14);

        musicStep++;
      }, currentTempo * 1000);
    }

    const SFX = {
      playLaser() {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      },
      playExplosion() {
        initAudio();
        if (!audioCtx) return;
        const bufferSize = audioCtx.sampleRate * 0.4;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(300, audioCtx.currentTime);
        filter.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.4);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
      },
      playCounter() {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      },
      playDash() {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      },
      playHit() {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      }
    };

    /* ==========================================================
       GAME STATE & CONFIGURATION
    ========================================================== */
    const CONFIG = {
      gravity: -40,
      playerSpeed: 16,
      jumpVelocity: 17.5,
      dashSpeed: 45,
      dashDuration: 0.22,
      bulletSpeed: 48,
      bulletLifetime: 1.25
    };

    let floor = 1;
    let totalKills = 0;
    let isGameOver = false;
    let isPaused = false;
    let timeScale = 1.0;
    let hitStopTimer = 0;

    // Bullet Time & Perfect Dodge
    let isBulletTime = false;
    let bulletTimeTimer = 0;

    // Cinematic Counter State
    let isCounterActive = false;
    let counterTimer = 0;

    // 1. Cyber Matrix Domination / Cinematic KO state
    let isCinematicKO = false;
    let koTimer = 0;
    let koTargetPos = new THREE.Vector3();
    let waitingForDominationInput = false;

    // 3. AI Drone Assistant & Emotion State
    let aiEmotion = 'normal'; // 'normal', 'excited', 'panic'
    let aiBuffActive = false;
    let aiBuffTimer = 0;
    let emergencyShieldActive = false;

    // Grind Rail System
    let isGrinding = false;
    let currentRail = null;
    let railProgress = 0;
    let railSpeed = 35;

    // Environment Hazard Rules
    let currentEnvironment = 'normal'; // 'normal', 'gravity_shift', 'data_storm', 'overdrive_field'

    // Player Stats & Elemental Builds / Fusions / 2. Weapon Craft Modules
    const playerStats = {
      maxHp: 100,
      hp: 100,
      damage: 34,
      fireRate: 0.18,
      speedMult: 1.0,
      multishot: 1,
      dashCooldown: 1.3,
      lastDashTime: -99,
      skillCooldown: 6.5,
      lastSkillTime: -99,
      counterCooldown: 3.5,
      lastCounterTime: -99,
      isDashing: false,
      dashTimer: 0,
      dashDir: new THREE.Vector3(),
      invulnerableTimer: 0,
      odGauge: 0,
      maxOdGauge: 100,
      isOverdrive: false,
      odTimer: 0,
      elements: { electric: false, fire: false, ice: false },
      fusionType: 'none', // 'none', 'melt_plasma', 'absolute_zero'
      weaponModules: [] // 2. Real-time Weapon Craft Modules ('shotgun', 'laser', 'chain')
    };
    let lastShootTime = 0;

    // Juice Effects
    const cameraShake = { intensity: 0, duration: 0 };

    /* ==========================================================
       THREE.JS & SCENE SETUP
    ========================================================== */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010103);
    scene.fog = new THREE.FogExp2(0x010103, 0.009);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ReinhardToneMapping;
    container.appendChild(renderer.domElement);

    // Post-Processing Bloom
    const composer = new THREE.EffectComposer(renderer);
    const renderPass = new THREE.RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new THREE.UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      1.8, 
      0.45, 
      0.8
    );
    composer.addPass(bloomPass);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x66fcf1, 1.5);
    dirLight.position.set(25, 60, 25);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    /* ==========================================================
       DYNAMIC BACKGROUND (CYBER CITY & DATA STREAMS)
    ========================================================== */
    const bgGroup = new THREE.Group();
    scene.add(bgGroup);

    function createCyberCityBackground() {
      while(bgGroup.children.length > 0) { 
        bgGroup.remove(bgGroup.children[0]); 
      }

      const buildingMat = new THREE.MeshBasicMaterial({ color: 0x0f172a, wireframe: true });
      for (let i = 0; i < 55; i++) {
        const h = 50 + Math.random() * 110;
        const w = 14 + Math.random() * 20;
        const d = 14 + Math.random() * 20;
        const geo = new THREE.BoxGeometry(w, h, d);
        const mesh = new THREE.Mesh(geo, buildingMat);

        const angle = Math.random() * Math.PI * 2;
        const dist = 100 + Math.random() * 140;
        mesh.position.set(Math.cos(angle) * dist, h / 2 - 45, Math.sin(angle) * dist);
        bgGroup.add(mesh);
      }

      const streamCount = 800;
      const streamGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(streamCount * 3);
      for (let i = 0; i < streamCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 300;
        positions[i + 1] = Math.random() * 120 - 30;
        positions[i + 2] = (Math.random() - 0.5) * 300;
      }
      streamGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const streamMat = new THREE.PointsMaterial({ color: 0x00ffcc, size: 0.65, transparent: true, opacity: 0.65 });
      const streamParticles = new THREE.Points(streamGeo, streamMat);
      bgGroup.add(streamParticles);
      bgGroup.userData.particles = streamParticles;
    }
    createCyberCityBackground();

    /* ==========================================================
       ENTITIES, MATERIALS & PLAYER
    ========================================================== */
    const platforms = [];
    const grindRails = [];
    const enemies = [];
    const bullets = [];
    const enemyBullets = [];
    const particles = [];
    const trails = [];
    const hazards = [];
    const envObjects = [];
    const dataShards = []; // 2. Real-time Weapon Craft Shards
    let goalPortal = null;
    let megaBoss = null;

    const cyanNeonMat = new THREE.MeshStandardMaterial({ color: 0x66fcf1, emissive: 0x66fcf1, emissiveIntensity: 0.8, roughness: 0.2 });
    const redNeonMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.9, roughness: 0.2 });
    const purpleNeonMat = new THREE.MeshStandardMaterial({ color: 0xb026ff, emissive: 0xb026ff, emissiveIntensity: 0.9, roughness: 0.2 });

    // Player Mesh & Blade Attachment
    const playerGroup = new THREE.Group();
    const playerGeo = new THREE.CylinderGeometry(0.6, 0.6, 1.8, 16);
    const playerMat = new THREE.MeshStandardMaterial({ color: 0x66fcf1, roughness: 0.2, metalness: 0.85 });
    const playerMesh = new THREE.Mesh(playerGeo, playerMat);
    playerMesh.castShadow = true;
    playerGroup.add(playerMesh);

    // Dynamic Gun Mesh for 2. Weapon Craft System
    const gunGroup = new THREE.Group();
    const baseGunGeo = new THREE.BoxGeometry(0.3, 0.3, 0.95);
    const gunMat = new THREE.MeshStandardMaterial({ color: 0x1f2833, metalness: 0.95 });
    const baseGunMesh = new THREE.Mesh(baseGunGeo, gunMat);
    gunGroup.add(baseGunMesh);
    gunGroup.position.set(0.6, 0.2, -0.4);
    playerGroup.add(gunGroup);

    // Energy Blade (Synced Counter)
    const bladeGeo = new THREE.BoxGeometry(0.15, 0.2, 2.2);
    const bladeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
    const bladeMesh = new THREE.Mesh(bladeGeo, bladeMat);
    bladeMesh.position.set(0, 0.4, -1.2);
    bladeMesh.visible = false;
    playerGroup.add(bladeMesh);

    scene.add(playerGroup);

    const playerPhysics = {
      position: playerGroup.position,
      velocity: new THREE.Vector3(),
      isGrounded: false,
      radius: 0.7,
      height: 1.8
    };

    /* ==========================================================
       PARTICLES & JUICE FX
    ========================================================== */
    function triggerCameraShake(intensity, duration) {
      cameraShake.intensity = intensity;
      cameraShake.duration = duration;
    }

    function triggerHitStop(durationSec) {
      hitStopTimer = durationSec;
    }

    function triggerGlitchEffect(durationMs = 250) {
      const glitch = document.getElementById('glitch-overlay');
      glitch.classList.add('active');
      setTimeout(() => { glitch.classList.remove('active'); }, durationMs);
    }

    function spawnNeonParticles(pos, colorHex, count = 14, speedMult = 1.1) {
      for (let i = 0; i < count; i++) {
        const pGeo = new THREE.BoxGeometry(0.22, 0.22, 0.22);
        const pMat = new THREE.MeshBasicMaterial({ color: colorHex });
        const pMesh = new THREE.Mesh(pGeo, pMat);
        pMesh.position.copy(pos);

        const vel = new THREE.Vector3(
          (Math.random() - 0.5) * 18 * speedMult,
          (Math.random() * 14 + 3) * speedMult,
          (Math.random() - 0.5) * 18 * speedMult
        );

        scene.add(pMesh);
        particles.push({
          mesh: pMesh,
          velocity: vel,
          life: 0.45 + Math.random() * 0.35
        });
      }
    }

    function spawnHologramTrail() {
      const trailGeo = new THREE.CylinderGeometry(0.6, 0.6, 1.8, 12);
      const trailMat = new THREE.MeshBasicMaterial({
        color: playerStats.isOverdrive ? 0xff007f : (isBulletTime ? 0x00ffff : 0x66fcf1),
        transparent: true,
        opacity: 0.65,
        wireframe: true
      });
      const trailMesh = new THREE.Mesh(trailGeo, trailMat);
      trailMesh.position.copy(playerGroup.position);
      trailMesh.rotation.copy(playerGroup.rotation);
      scene.add(trailMesh);

      trails.push({ mesh: trailMesh, opacity: 0.65, life: 0.28 });
    }

    function updateTrails(dt) {
      for (let i = trails.length - 1; i >= 0; i--) {
        const t = trails[i];
        t.life -= dt;
        t.opacity = Math.max(0, t.life / 0.28 * 0.65);
        t.mesh.material.opacity = t.opacity;
        if (t.life <= 0) {
          scene.remove(t.mesh);
          trails.splice(i, 1);
        }
      }
    }

    function triggerLightningBeam(startPos, endPos, colorHex = 0x00d2ff) {
      const points = [startPos.clone()];
      const mid = startPos.clone().add(endPos).multiplyScalar(0.5);
      mid.x += (Math.random() - 0.5) * 3.5;
      mid.y += (Math.random() - 0.5) * 3.5;
      mid.z += (Math.random() - 0.5) * 3.5;
      points.push(mid);
      points.push(endPos.clone());

      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const mat = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 3 });
      const line = new THREE.Line(geo, mat);
      scene.add(line);

      setTimeout(() => { scene.remove(line); }, 90);
    }

    function triggerDamageFlash() {
      const flash = document.getElementById('damage-flash');
      flash.style.opacity = '1';
      setTimeout(() => { flash.style.opacity = '0'; }, 160);
    }

    function addODGauge(amount) {
      if (playerStats.isOverdrive) return;
      playerStats.odGauge = Math.min(playerStats.maxOdGauge, playerStats.odGauge + amount);
      const pct = (playerStats.odGauge / playerStats.maxOdGauge) * 100;
      document.getElementById('od-bar').style.width = pct + '%';

      const odBtn = document.getElementById('od-btn');
      if (playerStats.odGauge >= playerStats.maxOdGauge) {
        odBtn.classList.add('ready');
      } else {
        odBtn.classList.remove('ready');
      }
    }

    /* ==========================================================
       3. AI ASSISTANT DRONE & EMOTION SYSTEM
    ========================================================== */
    function setAIEmotion(emotion, msg, durationMs = 3500) {
      aiEmotion = emotion;
      const hud = document.getElementById('ai-drone-hud');
      document.getElementById('ai-msg-text').innerText = msg;

      hud.classList.remove('active', 'excited', 'panic');
      void hud.offsetWidth; // trigger reflow
      hud.classList.add('active');

      if (emotion === 'excited') hud.classList.add('excited');
      if (emotion === 'panic') hud.classList.add('panic');

      if (durationMs > 0) {
        setTimeout(() => {
          if (aiEmotion === emotion) {
            hud.classList.remove('excited', 'panic');
          }
        }, durationMs);
      }
    }

    function applyEnvironmentRules() {
      const envTypes = ['normal', 'gravity_shift', 'data_storm', 'overdrive_field'];
      currentEnvironment = floor > 1 ? envTypes[Math.floor(Math.random() * envTypes.length)] : 'normal';

      const warnEl = document.getElementById('env-warning');
      if (currentEnvironment !== 'normal') {
        let msg = '';
        let aiMsg = '';
        if (currentEnvironment === 'gravity_shift') {
          msg = 'WARNING: GRAVITY SHIFT ACTIVE';
          aiMsg = '重力異常検知！ジャンプ軌道が変化します。';
        }
        if (currentEnvironment === 'data_storm') {
          msg = 'WARNING: DATA STORM BLIZZARD';
          aiMsg = 'データ嵐発生！速度低下に注意せよ。';
        }
        if (currentEnvironment === 'overdrive_field') {
          msg = 'WARNING: OVERDRIVE RESONANCE FIELD';
          aiMsg = 'オーバードライブ共鳴域！機動力が全開です！';
        }

        warnEl.innerText = msg;
        warnEl.classList.add('show');
        setTimeout(() => { warnEl.classList.remove('show'); }, 3500);
        setAIEmotion('excited', aiMsg);
      } else {
        setAIEmotion('normal', 'フロートエリア侵入。周辺警戒せよ。');
      }
    }

    /* ==========================================================
       STAGE & ENVIRONMENT GENERATION
    ========================================================== */
    function clearStage() {
      platforms.forEach(p => scene.remove(p.mesh)); platforms.length = 0;
      grindRails.forEach(r => scene.remove(r.mesh)); grindRails.length = 0;
      enemies.forEach(e => scene.remove(e.mesh)); enemies.length = 0;
      bullets.forEach(b => scene.remove(b.mesh)); bullets.length = 0;
      enemyBullets.forEach(b => scene.remove(b.mesh)); enemyBullets.length = 0;
      hazards.forEach(h => scene.remove(h.mesh)); hazards.length = 0;
      envObjects.forEach(o => scene.remove(o.mesh)); envObjects.length = 0;
      dataShards.forEach(s => scene.remove(s.mesh)); dataShards.length = 0;
      particles.forEach(p => scene.remove(p.mesh)); particles.length = 0;
      trails.forEach(t => scene.remove(t.mesh)); trails.length = 0;

      if (goalPortal) scene.remove(goalPortal);
      if (megaBoss) { scene.remove(megaBoss.mesh); megaBoss = null; }

      document.getElementById('boss-hud').style.display = 'none';
      isGrinding = false;
      currentRail = null;
    }

    function createPlatform(x, y, z, width, depth, type = 'normal') {
      const height = 1;
      const geo = new THREE.BoxGeometry(width, height, depth);
      let lineClr = 0x45a29e;

      if (type === 'boost') lineClr = 0x00ffcc;
      if (type === 'disappear') lineClr = 0xffa000;
      if (type === 'moving') lineClr = 0xb026ff;

      const mat = new THREE.MeshStandardMaterial({ color: 0x121a2d, roughness: 0.5, metalness: 0.45 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y - height / 2, z);
      mesh.receiveShadow = true;
      scene.add(mesh);

      const edges = new THREE.EdgesGeometry(geo);
      const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: lineClr }));
      mesh.add(line);

      const bounds = {
        minX: x - width / 2, maxX: x + width / 2,
        minZ: z - depth / 2, maxZ: z + depth / 2,
        topY: y,
        mesh: mesh,
        type: type,
        initialY: y,
        initialX: x,
        timer: Math.random() * Math.PI * 2,
        active: true,
        width: width, depth: depth
      };

      if (type === 'boost') {
        const pad = new THREE.Mesh(new THREE.BoxGeometry(width * 0.4, 0.1, depth * 0.4), cyanNeonMat);
        pad.position.set(0, 0.55, 0);
        mesh.add(pad);
      }

      platforms.push(bounds);
      return bounds;
    }

    function createGrindRail(startPos, endPos) {
      const midPos = startPos.clone().add(endPos).multiplyScalar(0.5);
      midPos.y += 2.8;

      const curve = new THREE.QuadraticBezierCurve3(startPos, midPos, endPos);
      const tubeGeo = new THREE.TubeGeometry(curve, 28, 0.18, 8, false);
      const tubeMat = new THREE.MeshStandardMaterial({
        color: 0x00ffff,
        emissive: 0x00ffff,
        emissiveIntensity: 0.9,
        roughness: 0.1
      });
      const railMesh = new THREE.Mesh(tubeGeo, tubeMat);
      scene.add(railMesh);

      grindRails.push({
        mesh: railMesh,
        curve: curve,
        length: curve.getLength(),
        startPos: startPos,
        endPos: endPos
      });
    }

    function spawnEnergyBarrel(x, y, z) {
      const group = new THREE.Group();
      const geo = new THREE.CylinderGeometry(0.8, 0.8, 2.0, 12);
      const mat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.7, roughness: 0.3 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      group.add(mesh);

      group.position.set(x, y + 1.0, z);
      scene.add(group);

      envObjects.push({
        mesh: group,
        type: 'barrel',
        hp: 20,
        position: group.position
      });
    }

    function spawnGravityVoid(x, y, z) {
      const group = new THREE.Group();
      const geo = new THREE.SphereGeometry(1.2, 16, 16);
      const mat = new THREE.MeshStandardMaterial({ color: 0x7928ca, emissive: 0x7928ca, emissiveIntensity: 0.95, wireframe: true });
      const mesh = new THREE.Mesh(geo, mat);
      group.add(mesh);

      group.position.set(x, y + 2.0, z);
      scene.add(group);

      envObjects.push({
        mesh: group,
        type: 'gravity_void',
        pulseTimer: 0,
        position: group.position
      });
    }

    function createLaserFence(x, y, z) {
      const group = new THREE.Group();
      const fenceGeo = new THREE.CylinderGeometry(0.1, 0.1, 3, 8);

      const p1 = new THREE.Mesh(fenceGeo, redNeonMat); p1.position.set(-2, 1.5, 0);
      const p2 = new THREE.Mesh(fenceGeo, redNeonMat); p2.position.set(2, 1.5, 0);
      group.add(p1); group.add(p2);

      const beamGeo = new THREE.BoxGeometry(4, 0.2, 0.2);
      const beam = new THREE.Mesh(beamGeo, redNeonMat);
      beam.position.set(0, 1.5, 0);
      group.add(beam);

      group.position.set(x, y, z);
      scene.add(group);

      hazards.push({
        mesh: group,
        type: 'laser',
        timer: Math.random() * Math.PI,
        beamMesh: beam
      });
    }

    // 2. Real-time Weapon Craft Shard Drop
    function spawnDataShard(x, y, z) {
      const shardGeo = new THREE.OctahedronGeometry(0.55);
      const shardMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.9, roughness: 0.1 });
      const mesh = new THREE.Mesh(shardGeo, shardMat);
      mesh.position.set(x, y + 1.0, z);
      scene.add(mesh);

      const types = ['shotgun', 'laser', 'chain'];
      const shardType = types[Math.floor(Math.random() * types.length)];

      dataShards.push({
        mesh: mesh,
        type: shardType
      });
    }

    function spawnEnemy(x, y, z, type = 'slime') {
      const group = new THREE.Group();
      let color = type === 'slime' ? 0xff0055 : (type === 'shooter' ? 0xffaa00 : 0x00d2ff);
      let hp = type === 'slime' ? (40 + floor * 14) : (type === 'shooter' ? (65 + floor * 20) : (90 + floor * 25));

      const geo = type === 'slime' ? new THREE.SphereGeometry(0.85, 16, 16) : new THREE.BoxGeometry(1.3, 1.6, 1.3);
      const mat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.5, roughness: 0.3 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      group.add(mesh);

      group.position.set(x, y + 1, z);
      scene.add(group);

      enemies.push({
        mesh: group,
        hp: hp,
        maxHp: hp,
        type: type,
        speed: type === 'slime' ? 5.0 : (type === 'runner' ? 7.2 : 0),
        shootCooldown: 1.5,
        lastShoot: Math.random() * 1.5,
        frozenTimer: 0
      });
    }

    function spawnMegaBoss(x, y, z) {
      const group = new THREE.Group();
      const hp = 800 + floor * 280;

      const coreGeo = new THREE.BoxGeometry(4.0, 4.0, 4.0);
      const coreMesh = new THREE.Mesh(coreGeo, purpleNeonMat);
      coreMesh.castShadow = true;
      group.add(coreMesh);

      const ringGeo = new THREE.TorusGeometry(3.8, 0.35, 16, 32);
      const ringMesh = new THREE.Mesh(ringGeo, cyanNeonMat);
      ringMesh.rotation.x = Math.PI / 2;
      group.add(ringMesh);

      group.position.set(x, y + 4.5, z);
      scene.add(group);

      megaBoss = {
        mesh: group,
        coreMesh: coreMesh,
        ringMesh: ringMesh,
        hp: hp,
        maxHp: hp,
        phase: 1,
        attackTimer: 0,
        type: 'boss',
        frozenTimer: 0
      };

      document.getElementById('boss-hud').style.display = 'flex';
      document.getElementById('boss-title').innerText = `MEGABOSS: CYBER CORE [FLOOR ${floor}]`;
      document.getElementById('boss-hp-bar').style.width = '100%';

      setAIEmotion('panic', '警告：メガボス個体反応を検知！全力を出せ！', 5000);
    }

    function generateStage() {
      clearStage();
      playerPhysics.position.set(0, 3, 0);
      playerPhysics.velocity.set(0, 0, 0);
      applyEnvironmentRules();

      const isBossFloor = (floor % 5 === 0);

      if (isBossFloor) {
        createPlatform(0, 0, -24, 40, 40);
        spawnMegaBoss(0, 0, -28);
        spawnEnergyBarrel(-12, 0, -16);
        spawnEnergyBarrel(12, 0, -16);
      } else {
        createPlatform(0, 0, 0, 10, 10);
        let currentPos = new THREE.Vector3(0, 0, 0);
        let lastPlatformPos = currentPos.clone();

        const sectionCount = 6 + Math.min(floor, 12);

        for (let i = 0; i < sectionCount; i++) {
          const gap = 8 + Math.random() * 6;
          const angle = (Math.random() - 0.5) * 1.3;
          const heightDiff = (Math.random() - 0.25) * 3.5;

          currentPos.x += Math.sin(angle) * gap;
          currentPos.z -= Math.cos(angle) * gap;
          currentPos.y += heightDiff;

          const w = 7.5 + Math.random() * 4;
          const d = 7.5 + Math.random() * 4;

          const randType = Math.random();
          const pType = randType < 0.22 ? 'disappear' : (randType < 0.38 ? 'boost' : (randType < 0.52 ? 'moving' : 'normal'));
          createPlatform(currentPos.x, currentPos.y, currentPos.z, w, d, pType);

          if (i > 0 && Math.random() < 0.55) {
            createGrindRail(
              new THREE.Vector3(lastPlatformPos.x, lastPlatformPos.y + 1.2, lastPlatformPos.z),
              new THREE.Vector3(currentPos.x, currentPos.y + 1.2, currentPos.z)
            );
          }
          lastPlatformPos.copy(currentPos);

          if (Math.random() < 0.4 && pType === 'normal') {
            if (Math.random() < 0.5) spawnEnergyBarrel(currentPos.x, currentPos.y, currentPos.z);
            else spawnGravityVoid(currentPos.x, currentPos.y, currentPos.z);
          }

          if (Math.random() < 0.35 && pType === 'normal') {
            createLaserFence(currentPos.x, currentPos.y, currentPos.z);
          }

          const enemyCount = Math.floor(Math.random() * 2) + 1;
          for (let e = 0; e < enemyCount; e++) {
            const rType = Math.random();
            const type = rType < 0.4 ? 'slime' : (rType < 0.75 ? 'shooter' : 'runner');
            spawnEnemy(
              currentPos.x + (Math.random() - 0.5) * (w - 3),
              currentPos.y,
              currentPos.z + (Math.random() - 0.5) * (d - 3),
              type
            );
          }

          if (Math.random() < 0.5) {
            spawnDataShard(currentPos.x, currentPos.y, currentPos.z);
          }
        }

        currentPos.z -= 10;
        createPlatform(currentPos.x, currentPos.y, currentPos.z, 8, 8);

        const portalGeo = new THREE.TorusGeometry(2.0, 0.4, 16, 32);
        goalPortal = new THREE.Mesh(portalGeo, cyanNeonMat);
        goalPortal.position.set(currentPos.x, currentPos.y + 2.5, currentPos.z);
        scene.add(goalPortal);
      }

      document.getElementById('floor-num').innerText = floor;
    }

    /* ==========================================================
       INPUT SYSTEM (TOUCH & KEYBOARD)
    ========================================================== */
    const input = { x: 0, y: 0, jump: false, fire: false };

    const stickArea = document.getElementById('joystick-area');
    const stickKnob = document.getElementById('joystick-knob');
    let touchId = null;
    let stickCenter = { x: 0, y: 0 };
    const maxRadius = 48;

    stickArea.addEventListener('touchstart', (e) => {
      initAudio();
      const touch = e.changedTouches[0];
      touchId = touch.identifier;
      const rect = stickArea.getBoundingClientRect();
      stickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      handleStickMove(touch.clientX, touch.clientY);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (touchId === null) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === touchId) {
          handleStickMove(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
          break;
        }
      }
    }, { passive: false });

    function endStick(e) {
      if (touchId === null) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === touchId) {
          touchId = null;
          input.x = 0; input.y = 0;
          stickKnob.style.transform = `translate(-50%, -50%)`;
          break;
        }
      }
    }
    window.addEventListener('touchend', endStick);
    window.addEventListener('touchcancel', endStick);

    function handleStickMove(cx, cy) {
      let dx = cx - stickCenter.x;
      let dy = cy - stickCenter.y;
      const dist = Math.hypot(dx, dy);

      if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
      }
      stickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      input.x = dx / maxRadius;
      input.y = dy / maxRadius;
    }

    const jumpBtn = document.getElementById('jump-btn');
    const fireBtn = document.getElementById('fire-btn');
    const dashBtn = document.getElementById('dash-btn');
    const skillBtn = document.getElementById('skill-btn');
    const odBtn = document.getElementById('od-btn');
    const counterBtn = document.getElementById('counter-btn');
    const domBtn = document.getElementById('dom-btn');

    jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); input.jump = true; jumpBtn.classList.add('active'); if (isGrinding) jumpFromRail(); });
    jumpBtn.addEventListener('touchend', () => { input.jump = false; jumpBtn.classList.remove('active'); });
    fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); input.fire = true; fireBtn.classList.add('active'); });
    fireBtn.addEventListener('touchend', () => { input.fire = false; fireBtn.classList.remove('active'); });
    dashBtn.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); triggerDash(); });
    skillBtn.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); triggerSkill(); });
    odBtn.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); triggerOverdrive(); });
    counterBtn.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); triggerSynchroCounter(); });
    domBtn.addEventListener('click', () => { executeDominationFinish(); });
    domBtn.addEventListener('touchstart', (e) => { e.preventDefault(); executeDominationFinish(); });

    const keys = {};
    window.addEventListener('keydown', (e) => {
      initAudio();
      keys[e.code] = true;
      if (waitingForDominationInput && (e.code === 'KeyQ' || e.code === 'Space' || e.code === 'Enter')) {
        executeDominationFinish();
        return;
      }
      if (e.code === 'Space') { input.jump = true; if (isGrinding) jumpFromRail(); }
      if (e.code === 'KeyJ' || e.code === 'KeyZ') input.fire = true;
      if (e.code === 'ShiftLeft' || e.code === 'KeyK') triggerDash();
      if (e.code === 'KeyE' || e.code === 'KeyX') triggerSkill();
      if (e.code === 'KeyR' || e.code === 'KeyC') triggerOverdrive();
      if (e.code === 'KeyQ' || e.code === 'KeyV') triggerSynchroCounter();
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      if (e.code === 'Space') input.jump = false;
      if (e.code === 'KeyJ' || e.code === 'KeyZ') input.fire = false;
    });

    function updateKeyboardInput() {
      if (touchId === null) {
        let x = 0, y = 0;
        if (keys['KeyA'] || keys['ArrowLeft']) x -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) x += 1;
        if (keys['KeyW'] || keys['ArrowUp']) y -= 1;
        if (keys['KeyS'] || keys['ArrowDown']) y += 1;
        if (x !== 0 || y !== 0) {
          const len = Math.hypot(x, y);
          input.x = x / len;
          input.y = y / len;
        } else {
          input.x = 0; input.y = 0;
        }
      }
    }

    /* ==========================================================
       COMBAT, SYNCHRO COUNTER & 1. CYBER MATRIX DOMINATION
    ========================================================== */
    function checkPerfectDodge() {
      let isNearThreat = false;
      const dodgeRadius = 4.2;

      for (const eb of enemyBullets) {
        if (eb.mesh.position.distanceTo(playerGroup.position) < dodgeRadius) {
          isNearThreat = true;
          break;
        }
      }

      if (!isNearThreat) {
        for (const e of enemies) {
          if (e.mesh.position.distanceTo(playerGroup.position) < dodgeRadius + 1) {
            isNearThreat = true;
            break;
          }
        }
      }

      if (isNearThreat) {
        triggerPerfectDodge();
      }
    }

    function triggerPerfectDodge() {
      isBulletTime = true;
      bulletTimeTimer = 1.6;
      addODGauge(50);

      aiBuffActive = true;
      aiBuffTimer = 5.0;
      setAIEmotion('excited', 'パーフェクトドッジ成功！オーバークロックバフ起動！');

      document.getElementById('bullet-time-fx').classList.add('active');
      triggerGlitchEffect(300);

      const banner = document.getElementById('dodge-banner');
      banner.classList.add('show');
      setTimeout(() => { banner.classList.remove('show'); }, 950);

      SFX.playDash();
      triggerCameraShake(0.85, 0.3);
      spawnNeonParticles(playerGroup.position, 0x00ffff, 28, 2.2);
    }

    function triggerSynchroCounter() {
      const now = performance.now() / 1000;
      if (now - playerStats.lastCounterTime < playerStats.counterCooldown || isCounterActive) return;

      playerStats.lastCounterTime = now;
      isCounterActive = true;
      counterTimer = 0.35;
      timeScale = 0.1;

      bladeMesh.visible = true;
      document.getElementById('counter-fx').classList.add('active');

      SFX.playCounter();
      triggerCameraShake(1.2, 0.4);
      triggerGlitchEffect(280);
      spawnNeonParticles(playerGroup.position, 0x00ffff, 35, 2.5);

      const counterRadius = 8.5;
      enemies.forEach(e => {
        if (playerGroup.position.distanceTo(e.mesh.position) <= counterRadius) {
          applyDamageToEnemy(e, playerStats.damage * 4.5, 'electric');
        }
      });

      if (megaBoss && playerGroup.position.distanceTo(megaBoss.mesh.position) <= counterRadius + 4) {
        applyDamageToEnemy(megaBoss, playerStats.damage * 4.5, 'electric');
      }

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        if (eb.mesh.position.distanceTo(playerGroup.position) <= counterRadius) {
          spawnNeonParticles(eb.mesh.position, 0x00ffff, 10);
          scene.remove(eb.mesh);
          enemyBullets.splice(i, 1);
        }
      }
    }

    function updateSynchroCounter(dtReal) {
      if (!isCounterActive) return;
      counterTimer -= dtReal;
      if (counterTimer <= 0) {
        isCounterActive = false;
        timeScale = 1.0;
        bladeMesh.visible = false;
        document.getElementById('counter-fx').classList.remove('active');
      }
    }

    function updateBulletTime(dtReal) {
      if (!isBulletTime) return;
      bulletTimeTimer -= dtReal;
      if (bulletTimeTimer <= 0) {
        isBulletTime = false;
        document.getElementById('bullet-time-fx').classList.remove('active');
      }
    }

    function triggerOverdrive() {
      if (playerStats.odGauge < playerStats.maxOdGauge || playerStats.isOverdrive) return;

      playerStats.isOverdrive = true;
      playerStats.odTimer = 11.0;
      playerStats.odGauge = 0;
      document.getElementById('od-bar').style.width = '0%';
      document.getElementById('od-btn').classList.remove('ready');

      document.getElementById('overdrive-screen-fx').classList.add('active');
      bloomPass.strength = 3.4;

      SFX.playExplosion();
      triggerGlitchEffect(450);
      triggerCameraShake(1.3, 0.55);
      spawnNeonParticles(playerGroup.position, 0xff007f, 45, 2.2);
      setAIEmotion('excited', 'オーバードライブ最大出力！全システム解放！');
    }

    function triggerDash() {
      const now = performance.now() / 1000;
      const effectiveCooldown = playerStats.isOverdrive ? 0.08 : playerStats.dashCooldown;
      if (now - playerStats.lastDashTime < effectiveCooldown || playerStats.isDashing) return;

      if (isGrinding) jumpFromRail();
      checkPerfectDodge();

      playerStats.isDashing = true;
      playerStats.dashTimer = CONFIG.dashDuration;
      playerStats.lastDashTime = now;
      playerStats.invulnerableTimer = CONFIG.dashDuration + 0.18;

      if (Math.hypot(input.x, input.y) > 0.1) {
        playerStats.dashDir.set(input.x, 0, input.y).normalize();
      } else {
        playerStats.dashDir.set(0, 0, -1).applyQuaternion(playerGroup.quaternion);
      }

      SFX.playDash();
      spawnNeonParticles(playerGroup.position, playerStats.isOverdrive ? 0xff007f : 0x00ffcc, 18);
      spawnHologramTrail();
      triggerCameraShake(0.35, 0.15);
    }

    function triggerSkill() {
      const now = performance.now() / 1000;
      if (now - playerStats.lastSkillTime < playerStats.skillCooldown) return;

      playerStats.lastSkillTime = now;

      SFX.playExplosion();
      triggerCameraShake(1.0, 0.4);
      triggerGlitchEffect(220);
      spawnNeonParticles(playerGroup.position, 0xb026ff, 40, 1.8);
      setAIEmotion('excited', 'EMPパルス発動！周囲の電脳回路を麻痺させました');

      const empRadius = 22;
      enemies.forEach(e => {
        if (playerGroup.position.distanceTo(e.mesh.position) <= empRadius) {
          applyDamageToEnemy(e, playerStats.damage * 3.0, 'electric');
        }
      });

      if (megaBoss && playerGroup.position.distanceTo(megaBoss.mesh.position) <= empRadius + 5) {
        applyDamageToEnemy(megaBoss, playerStats.damage * 3.0, 'electric');
      }

      envObjects.forEach(o => {
        if (o.type === 'barrel' && playerGroup.position.distanceTo(o.position) <= empRadius) {
          explodeBarrel(o);
        }
      });
    }

    function shootBullet() {
      let targetPos = null;
      let minDist = 40;

      if (megaBoss) {
        targetPos = megaBoss.mesh.position;
      } else {
        enemies.forEach(e => {
          const d = playerGroup.position.distanceTo(e.mesh.position);
          if (d < minDist) { minDist = d; targetPos = e.mesh.position; }
        });
      }

      let aimDir = new THREE.Vector3();
      if (targetPos) {
        aimDir.subVectors(targetPos, playerGroup.position).normalize();
        aimDir.y += 0.04;
      } else {
        aimDir.set(0, 0, -1).applyQuaternion(playerGroup.quaternion);
      }

      const buffMult = aiBuffActive ? 2 : 1;
      const hasShotgun = playerStats.weaponModules.includes('shotgun');
      const baseShotCount = (playerStats.isOverdrive ? playerStats.multishot + 2 : playerStats.multishot);
      const shotCount = hasShotgun ? baseShotCount + 2 : baseShotCount;

      for (let i = 0; i < shotCount; i++) {
        const bulletGeo = new THREE.SphereGeometry(playerStats.isOverdrive ? 0.52 : 0.36, 8, 8);
        
        let mat = cyanNeonMat;
        if (playerStats.isOverdrive) mat = redNeonMat;
        else if (playerStats.fusionType === 'melt_plasma') mat = redNeonMat;
        else if (playerStats.fusionType === 'absolute_zero') mat = cyanNeonMat;
        else if (playerStats.elements.electric) mat = cyanNeonMat;
        else if (playerStats.elements.fire) mat = redNeonMat;

        const bullet = new THREE.Mesh(bulletGeo, mat);
        bullet.position.copy(playerGroup.position);
        bullet.position.y += 0.2;

        let spread = (i - (shotCount - 1) / 2) * (hasShotgun ? 0.22 : 0.12);
        let dir = aimDir.clone();
        dir.x += spread;
        dir.normalize();

        scene.add(bullet);
        bullets.push({
          mesh: bullet,
          velocity: dir.multiplyScalar(CONFIG.bulletSpeed * (playerStats.isOverdrive ? 1.3 : 1.0)),
          life: CONFIG.bulletLifetime,
          damage: playerStats.damage * (playerStats.isOverdrive ? 1.7 : 1.0) * buffMult,
          fusionType: playerStats.fusionType,
          isOverdrive: playerStats.isOverdrive
        });
      }

      SFX.playLaser();
      triggerCameraShake(playerStats.isOverdrive ? 0.22 : 0.08, 0.05);
    }

    function shootEnemyBullet(fromPos, targetPos, speed = 19, colorHex = 0xff0055) {
      const geo = new THREE.SphereGeometry(0.38, 8, 8);
      const mat = new THREE.MeshBasicMaterial({ color: colorHex });
      const bullet = new THREE.Mesh(geo, mat);
      bullet.position.copy(fromPos);

      const dir = new THREE.Vector3().subVectors(targetPos, fromPos).normalize();
      scene.add(bullet);

      enemyBullets.push({
        mesh: bullet,
        velocity: dir.multiplyScalar(speed),
        life: 3.5,
        damage: 18
      });
    }

    /* ==========================================================
       ELEMENTAL FUSIONS & WEAPON CRAFT SYSTEM
    ========================================================== */
    function applyDamageToEnemy(enemy, dmg, elemType = 'none') {
      enemy.hp -= dmg;
      addODGauge(dmg * 0.15);

      const hasElectric = playerStats.elements.electric || elemType === 'electric';
      const hasFire = playerStats.elements.fire;
      const hasIce = playerStats.elements.ice;
      const hasChain = playerStats.weaponModules.includes('chain');

      if (playerStats.fusionType === 'melt_plasma' || (hasElectric && hasFire) || hasChain) {
        spawnNeonParticles(enemy.mesh.position, 0xff3300, 22, 2.1);
        triggerLightningBeam(enemy.mesh.position, enemy.mesh.position.clone().add(new THREE.Vector3(0, 5, 0)), 0xff3300);
        
        enemies.forEach(other => {
          if (other !== enemy && other.mesh.position.distanceTo(enemy.mesh.position) < 14.0) {
            other.hp -= dmg * 0.9;
            triggerLightningBeam(enemy.mesh.position, other.mesh.position, 0xff3300);
          }
        });
        triggerGlitchEffect(140);
      }
      else if (playerStats.fusionType === 'absolute_zero' || (hasIce && hasElectric)) {
        for (let i = 0; i < 6; i++) {
          enemies.forEach(other => {
            if (other !== enemy && other.mesh.position.distanceTo(enemy.mesh.position) < 10.0) {
              other.hp -= dmg * 0.95;
              other.frozenTimer = 3.0;
            }
          });
        }
        spawnNeonParticles(enemy.mesh.position, 0x00ffff, 28, 2.6);
        triggerGlitchEffect(120);
      }
      else if (hasElectric) {
        enemies.forEach(other => {
          if (other !== enemy && other.mesh.position.distanceTo(enemy.mesh.position) < 8.5) {
            other.hp -= dmg * 0.55;
            triggerLightningBeam(enemy.mesh.position, other.mesh.position, 0x00d2ff);
          }
        });
      } else if (hasFire) {
        spawnNeonParticles(enemy.mesh.position, 0xff3300, 8);
        enemies.forEach(other => {
          if (other !== enemy && other.mesh.position.distanceTo(enemy.mesh.position) < 5) {
            other.hp -= dmg * 0.4;
          }
        });
      } else if (hasIce) {
        enemy.frozenTimer = 1.8;
        spawnNeonParticles(enemy.mesh.position, 0x00ffff, 6);
      }

      if (enemy.hp <= 0) {
        SFX.playExplosion();
        spawnNeonParticles(enemy.mesh.position, 0xff0055, 22);
        
        if (enemy.type === 'boss') {
          scene.remove(enemy.mesh);
          megaBoss = null;
          triggerMatrixDominationCinematic(enemy.mesh.position);
        } else {
          scene.remove(enemy.mesh);
          const idx = enemies.indexOf(enemy);
          if (idx !== -1) enemies.splice(idx, 1);
          totalKills++;
          document.getElementById('kill-num').innerText = totalKills;

          if (enemies.length === 0 && !megaBoss && goalPortal) {
            triggerMatrixDominationCinematic(enemy.mesh.position);
          }
        }
      }
    }

    // 2. Real-time Weapon Craft Module Pickup & Visual Mesh Modification
    function checkDataShardCollection(pos) {
      for (let i = dataShards.length - 1; i >= 0; i--) {
        const shard = dataShards[i];
        if (pos.distanceTo(shard.mesh.position) < 2.0) {
          collectWeaponModule(shard.type);
          scene.remove(shard.mesh);
          dataShards.splice(i, 1);
        }
      }
    }

    function collectWeaponModule(moduleType) {
      if (!playerStats.weaponModules.includes(moduleType)) {
        playerStats.weaponModules.push(moduleType);
      }

      // Visual transformation of gunMesh based on modules
      const addGeo = new THREE.BoxGeometry(0.4, 0.4, 0.6);
      let addMat = cyanNeonMat;
      if (moduleType === 'shotgun') { addGeo.scale(1.4, 0.8, 1.0); addMat = redNeonMat; }
      if (moduleType === 'laser') { addGeo.scale(0.8, 1.4, 1.4); addMat = cyanNeonMat; }
      if (moduleType === 'chain') { addGeo.scale(1.0, 1.0, 1.8); addMat = purpleNeonMat; }

      const modMesh = new THREE.Mesh(addGeo, addMat);
      modMesh.position.set(0, 0, -0.4 * playerStats.weaponModules.length);
      gunGroup.add(modMesh);

      SFX.playCounter();
      triggerGlitchEffect(200);
      setAIEmotion('excited', `ウェポンモジュール[${moduleType.toUpperCase()}]統合完了！形態変形！`);
      spawnNeonParticles(playerGroup.position, 0x00ffff, 20, 2.0);
    }

    function explodeBarrel(barrel) {
      SFX.playExplosion();
      spawnNeonParticles(barrel.position, 0xff3300, 40, 2.2);
      triggerCameraShake(1.1, 0.45);

      const radius = 13;
      enemies.forEach(e => {
        if (e.mesh.position.distanceTo(barrel.position) <= radius) {
          applyDamageToEnemy(e, 160, 'fire');
        }
      });

      if (megaBoss && megaBoss.mesh.position.distanceTo(barrel.position) <= radius + 3) {
        applyDamageToEnemy(megaBoss, 160, 'fire');
      }

      if (playerGroup.position.distanceTo(barrel.position) <= radius) {
        takeDamage(25);
      }

      scene.remove(barrel.mesh);
      const idx = envObjects.indexOf(barrel);
      if (idx !== -1) envObjects.splice(idx, 1);
    }

    /* ==========================================================
       PHYSICS & GRIND RAIL MECHANICS
    ========================================================== */
    function checkGrounded(pos) {
      const footY = pos.y - playerPhysics.height / 2;
      for (const p of platforms) {
        if (!p.active) continue;
        if (
          pos.x + playerPhysics.radius > p.minX &&
          pos.x - playerPhysics.radius < p.maxX &&
          pos.z + playerPhysics.radius > p.minZ &&
          pos.z - playerPhysics.radius < p.maxZ
        ) {
          if (footY <= p.topY && footY >= p.topY - 1.2) {
            if (p.type === 'boost') {
              playerPhysics.velocity.y = CONFIG.jumpVelocity * 1.45;
              spawnNeonParticles(pos, 0x00ffcc, 12);
            }
            if (p.type === 'disappear') {
              p.timer += 0.03;
              if (p.timer > 1.0) p.active = false;
            }
            return p.topY;
          }
        }
      }
      return null;
    }

    function checkGrindRailSnap(pos) {
      if (isGrinding) return;

      const snapRadius = 2.4;
      for (const rail of grindRails) {
        const p1 = rail.curve.getPoint(0);
        if (pos.distanceTo(p1) < snapRadius) {
          isGrinding = true;
          currentRail = rail;
          railProgress = 0;
          spawnNeonParticles(pos, 0x00ffff, 18);
          break;
        }
      }
    }

    function updateGrindRail(dt) {
      if (!isGrinding || !currentRail) return;

      railProgress += (railSpeed * dt) / currentRail.length;
      if (railProgress >= 1.0) {
        isGrinding = false;
        playerPhysics.velocity.y = 9;
        currentRail = null;
        return;
      }

      const railPos = currentRail.curve.getPoint(railProgress);
      playerGroup.position.copy(railPos);
      playerGroup.position.y += 0.9;

      spawnNeonParticles(playerGroup.position, 0x00ffff, 2, 0.5);
      if (Math.random() < 0.4) spawnHologramTrail();
    }

    function jumpFromRail() {
      if (!isGrinding) return;
      isGrinding = false;
      playerPhysics.velocity.y = CONFIG.jumpVelocity;
      playerPhysics.isGrounded = false;
      currentRail = null;
      spawnNeonParticles(playerGroup.position, 0x00ffff, 14);
    }

    function updatePlatforms(dt) {
      platforms.forEach(p => {
        if (!p.active) {
          p.mesh.scale.multiplyScalar(0.9);
          if (p.mesh.scale.x < 0.05) p.mesh.visible = false;
          return;
        }

        if (p.type === 'moving') {
          p.timer += dt * 2;
          const offsetY = Math.sin(p.timer) * 3.8;
          p.mesh.position.y = (p.initialY - 0.5) + offsetY;
          p.topY = p.initialY + offsetY;
        }
      });
    }

    function updatePlayer(dt) {
      updateKeyboardInput();

      if (playerStats.isOverdrive) {
        playerStats.odTimer -= dt;
        if (playerStats.odTimer <= 0) {
          playerStats.isOverdrive = false;
          document.getElementById('overdrive-screen-fx').classList.remove('active');
          bloomPass.strength = 1.8;
        }
      }

      if (aiBuffActive) {
        aiBuffTimer -= dt;
        if (aiBuffTimer <= 0) {
          aiBuffActive = false;
        }
      }

      if (playerStats.invulnerableTimer > 0) playerStats.invulnerableTimer -= dt;

      let envSpeedMult = 1.0;
      let gravMultiplier = 1.0;
      if (currentEnvironment === 'data_storm') envSpeedMult = 0.8;
      if (currentEnvironment === 'gravity_shift') gravMultiplier = 0.6;
      if (currentEnvironment === 'overdrive_field') envSpeedMult = 1.35;

      if (isGrinding) {
        updateGrindRail(dt);
      } else if (playerStats.isDashing) {
        playerStats.dashTimer -= dt;
        playerPhysics.position.x += playerStats.dashDir.x * CONFIG.dashSpeed * dt;
        playerPhysics.position.z += playerStats.dashDir.z * CONFIG.dashSpeed * dt;

        spawnNeonParticles(playerGroup.position, playerStats.isOverdrive ? 0xff007f : 0x66fcf1, 2);
        if (Math.random() < 0.5) spawnHologramTrail();

        if (playerStats.dashTimer <= 0) playerStats.isDashing = false;
      } else {
        const speed = CONFIG.playerSpeed * playerStats.speedMult * envSpeedMult * (playerStats.isOverdrive ? 1.45 : 1.0);
        playerPhysics.position.x += input.x * speed * dt;
        playerPhysics.position.z += input.y * speed * dt;

        checkGrindRailSnap(playerPhysics.position);
      }

      checkDataShardCollection(playerPhysics.position);

      if (Math.hypot(input.x, input.y) > 0.1) {
        const targetAngle = Math.atan2(input.x, input.y);
        playerGroup.rotation.y = THREE.MathUtils.lerp(playerGroup.rotation.y, targetAngle, 0.25);
      }

      if (!isGrinding) {
        const groundY = checkGrounded(playerPhysics.position);
        if (groundY !== null && playerPhysics.velocity.y <= 0) {
          playerPhysics.isGrounded = true;
          playerPhysics.velocity.y = 0;
          playerPhysics.position.y = groundY + playerPhysics.height / 2;
        } else {
          playerPhysics.isGrounded = false;
          playerPhysics.velocity.y += CONFIG.gravity * gravMultiplier * dt;
        }

        if (input.jump && playerPhysics.isGrounded) {
          playerPhysics.velocity.y = CONFIG.jumpVelocity;
          playerPhysics.isGrounded = false;
        }

        playerPhysics.position.y += playerPhysics.velocity.y * dt;
      }

      if (playerPhysics.position.y < -25) {
        takeDamage(playerStats.maxHp);
      }

      const effectiveFireRate = (playerStats.isOverdrive ? 0.06 : playerStats.fireRate) * (aiBuffActive ? 0.5 : 1);
      if (input.fire && performance.now() / 1000 - lastShootTime >= effectiveFireRate) {
        shootBullet();
        lastShootTime = performance.now() / 1000;
      }

      if (goalPortal) {
        goalPortal.rotation.z += dt * 2.8;
        if (playerPhysics.position.distanceTo(goalPortal.position) < 2.3) {
          triggerMatrixDominationCinematic(goalPortal.position);
        }
      }

      const now = performance.now() / 1000;
      const dashCDPct = Math.max(0, 1 - (now - playerStats.lastDashTime) / playerStats.dashCooldown);
      const skillCDPct = Math.max(0, 1 - (now - playerStats.lastSkillTime) / playerStats.skillCooldown);

      document.getElementById('dash-cd').style.height = (dashCDPct * 100) + '%';
      document.getElementById('skill-cd').style.height = (skillCDPct * 100) + '%';
    }

    function updateEnvObjects(dt) {
      envObjects.forEach(o => {
        if (o.type === 'gravity_void') {
          o.pulseTimer += dt * 3;
          o.mesh.rotation.y += dt * 2;
          o.mesh.rotation.z += dt * 1.5;

          const pullRadius = 15;
          enemies.forEach(e => {
            const d = e.mesh.position.distanceTo(o.position);
            if (d < pullRadius && d > 0.5) {
              const pullDir = new THREE.Vector3().subVectors(o.position, e.mesh.position).normalize();
              e.mesh.position.addScaledVector(pullDir, dt * 6.5);
              if (d < 1.8) applyDamageToEnemy(e, 38 * dt, 'none');
            }
          });
        }
      });
    }

    function updateHazards(dt) {
      hazards.forEach(h => {
        if (h.type === 'laser') {
          h.timer += dt * 3.2;
          const active = Math.sin(h.timer) > -0.2;
          h.beamMesh.visible = active;

          if (active && playerPhysics.position.distanceTo(h.mesh.position) < 2.6) {
            takeDamage(24 * dt);
          }
        }
      });
    }

    function updateEnemies(dt) {
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];

        if (enemy.frozenTimer > 0) {
          enemy.frozenTimer -= dt;
          continue;
        }

        const dist = enemy.mesh.position.distanceTo(playerGroup.position);

        if (enemy.type === 'slime' || enemy.type === 'runner') {
          if (dist < 26) {
            const dir = new THREE.Vector3().subVectors(playerGroup.position, enemy.mesh.position).normalize();
            enemy.mesh.position.x += dir.x * enemy.speed * dt;
            enemy.mesh.position.z += dir.z * enemy.speed * dt;

            if (dist < 1.4) takeDamage(22 * dt);
          }
        } else if (enemy.type === 'shooter') {
          enemy.lastShoot += dt;
          if (dist < 32 && enemy.lastShoot >= enemy.shootCooldown) {
            enemy.lastShoot = 0;
            shootEnemyBullet(enemy.mesh.position, playerGroup.position);
          }
        }
      }

      if (megaBoss) {
        megaBoss.ringMesh.rotation.z += dt * 2.0;
        megaBoss.ringMesh.rotation.y += dt * 1.4;

        megaBoss.attackTimer += dt;
        const interval = megaBoss.phase === 1 ? 1.2 : 0.7;

        if (megaBoss.hp < megaBoss.maxHp * 0.5 && megaBoss.phase === 1) {
          megaBoss.phase = 2;
          SFX.playExplosion();
          triggerCameraShake(1.1, 0.45);
          spawnNeonParticles(megaBoss.mesh.position, 0xff0055, 40);
          setAIEmotion('panic', 'ボスフェーズ2移行！攻撃パターンが強化されました！');
        }

        if (megaBoss.attackTimer >= interval) {
          megaBoss.attackTimer = 0;

          if (megaBoss.phase === 1) {
            const bulletCount = 8;
            for (let b = 0; b < bulletCount; b++) {
              const ang = (b / bulletCount) * Math.PI * 2;
              const target = megaBoss.mesh.position.clone().add(new THREE.Vector3(Math.cos(ang) * 10, -2, Math.sin(ang) * 10));
              shootEnemyBullet(megaBoss.mesh.position, target, 17);
            }
          } else {
            shootEnemyBullet(megaBoss.mesh.position, playerGroup.position, 28, 0xb026ff);
          }
        }
      }
    }

    function updateBullets(dt) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
