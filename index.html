<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HTMLスマホ用スロットゲーム - HYPER RUSH SLOT</title>
    <style>
        :root {
            --bg-color: #05050a;
            --primary-neon: #ff0055;
            --secondary-neon: #00f3ff;
            --accent-gold: #ffe600;
            --card-bg: rgba(20, 20, 35, 0.75);
            --font-family: 'Impact', 'Arial Black', sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
        }

        /* 画面全体揺れ・カメラワーク用コンテナ */
        #viewport {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            transform-origin: center center;
            transition: transform 0.05s ease-out;
            will-change: transform, filter;
        }

        /* カメラズーム・シェイク用アニメーション */
        .shake-light { animation: anim-shake-light 0.1s ease-out; }
        .shake-heavy { animation: anim-shake-heavy 0.18s ease-out; }
        .pulse-beat { animation: anim-pulse 0.08s ease-out; }

        @keyframes anim-shake-light {
            0% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(-2px, 3px) scale(1.008); }
            50% { transform: translate(3px, -2px) scale(1.005); }
            75% { transform: translate(-1px, -1px) scale(1.002); }
            100% { transform: translate(0, 0) scale(1); }
        }

        @keyframes anim-shake-heavy {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            20% { transform: translate(-6px, 5px) rotate(-1.5deg) scale(1.03); }
            40% { transform: translate(6px, -4px) rotate(1.2deg) scale(1.02); }
            60% { transform: translate(-4px, -3px) rotate(-0.8deg) scale(1.01); }
            80% { transform: translate(2px, 2px) rotate(0.4deg) scale(1.005); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1); }
        }

        @keyframes anim-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.018); }
            100% { transform: scale(1); }
        }

        /* フラッシュオーバーレイ */
        #flash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
            opacity: 0;
            background: white;
            transition: opacity 0.05s ease-out;
        }

        /* 背景Canvas */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            filter: drop-shadow(0 0 20px rgba(0, 243, 255, 0.15));
        }

        /* UIコンテナ */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
        }

        /* ヘッダー情報 */
        .header-ui {
            background: linear-gradient(135deg, rgba(28, 28, 50, 0.88), rgba(14, 14, 26, 0.95));
            border: 2px solid rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 18px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), inset 0 1px 3px rgba(255, 255, 255, 0.3), 0 0 25px rgba(0, 243, 255, 0.25);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a8aa0;
            font-weight: 800;
        }

        .stat-value {
            font-family: var(--font-family);
            font-size: 24px;
            background: linear-gradient(180deg, #fff, #a0a0a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(255,255,255,0.2);
        }

        .stat-value.score {
            background: linear-gradient(180deg, #ffe600, #ff8000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* フィーバーゲージ */
        .fever-container {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 6px;
            position: relative;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .fever-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--secondary-neon), var(--primary-neon), var(--accent-gold));
            box-shadow: 0 0 12px var(--primary-neon);
            transition: width 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .fever-bar::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.4), rgba(255,255,255,0));
            animation: fever-shimmer 1.5s infinite linear;
        }

        @keyframes fever-shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* スロットマシン表示エリア */
        .slot-machine-container {
            position: relative;
            width: 100%;
            height: 240px;
            margin: auto 0;
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slot-frame {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(20, 20, 35, 0.9), rgba(10, 10, 18, 0.95));
            border-radius: 20px;
            border: 3px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85), inset 0 2px 8px rgba(255, 255, 255, 0.12), inset 0 0 25px rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        /* アクリルパネル反射エフェクト（物理的な高級ガラス・上質な光沢感の追求） */
        .slot-frame::after {
            content: '';
            position: absolute;
            top: 0; left: -180%; width: 180%; height: 100%;
            background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, 0.32) 47%, rgba(0, 243, 255, 0.2) 50%, rgba(255, 255, 255, 0.1) 53%, transparent 65%);
            pointer-events: none;
            box-shadow: inset 0 0 50px rgba(0, 243, 255, 0.18), inset 0 1px 2px rgba(255, 255, 255, 0.4);
            animation: panel-reflection 4.2s infinite cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes panel-reflection {
            0% { left: -180%; opacity: 0; }
            10% { opacity: 1; }
            30% { left: 180%; opacity: 0; }
            100% { left: 180%; opacity: 0; }
        }

        /* リール線 */
        .payline {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            transform: translateY(-50%);
            z-index: 5;
            pointer-events: none;
            transition: all 0.15s ease;
        }

        .payline.reach {
            height: 4px;
            background: var(--secondary-neon);
            box-shadow: 0 0 12px var(--secondary-neon), 0 0 25px var(--secondary-neon);
            animation: payline-pulse 0.25s infinite alternate;
        }

        @keyframes payline-pulse {
            0% { opacity: 0.7; transform: translateY(-50%) scaleY(0.9); }
            100% { opacity: 1; transform: translateY(-50%) scaleY(1.3); }
        }

        .payline.active-win {
            height: 5px;
            background: var(--accent-gold);
            box-shadow: 0 0 15px var(--accent-gold), 0 0 30px var(--accent-gold);
        }

        /* 各リール */
        .reel-viewport {
            flex: 1;
            height: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .reel-viewport.reach-target {
            border-color: var(--secondary-neon);
            box-shadow: inset 0 0 25px rgba(0, 243, 255, 0.4), 0 0 15px rgba(0, 243, 255, 0.6);
            animation: reel-reach-glow 0.3s infinite alternate ease-in-out;
        }

        @keyframes reel-reach-glow {
            0% { box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.3), 0 0 10px rgba(0, 243, 255, 0.4); }
            100% { box-shadow: inset 0 0 30px rgba(0, 243, 255, 0.7), 0 0 25px rgba(0, 243, 255, 0.9); }
        }

        .reel-canvas {
            width: 100%;
            height: 100%;
        }

        /* メッセージポップアップ */
        #combo-popup {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-family: var(--font-family);
            font-size: 42px;
            font-style: italic;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 20px var(--primary-neon), 0 0 40px var(--accent-gold);
            pointer-events: none;
            opacity: 0;
            z-index: 20;
            white-space: nowrap;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.1s ease-out;
        }

        /* コントロールエリア */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 8px;
        }

        .stop-buttons {
            display: flex;
            gap: 8px;
            width: 100%;
            height: 75px;
        }

        .btn-stop {
            flex: 1;
            background: linear-gradient(180deg, #2a2a40, #151525);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            color: #fff;
            font-family: var(--font-family);
            font-size: 22px;
            letter-spacing: 1px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 6px 0 #0d0d18, 0 10px 20px rgba(0,0,0,0.4);
            transition: all 0.05s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-stop:active, .btn-stop.pressed {
            transform: translateY(5px) scale(0.96);
            box-shadow: 0 1px 0 #0d0d18, 0 0 18px rgba(0, 243, 255, 0.7);
            background: linear-gradient(180deg, #555580, #2c2c50);
            border-color: var(--secondary-neon);
            transition: transform 0.04s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-stop.active-ready {
            border-color: var(--secondary-neon);
            box-shadow: 0 6px 0 #008891, 0 0 15px rgba(0, 243, 255, 0.4);
        }

        .btn-stop.disabled {
            opacity: 0.4;
            filter: grayscale(1);
            pointer-events: none;
        }

        .main-actions {
            display: flex;
            gap: 8px;
            height: 65px;
        }

        .btn-spin {
            flex: 2;
            background: linear-gradient(180deg, #ff0055, #990033);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-family: var(--font-family);
            font-size: 28px;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 6px 0 #660022, 0 8px 25px rgba(255, 0, 85, 0.5);
            transition: all 0.05s ease;
            text-transform: uppercase;
        }

        .btn-spin:active {
            transform: translateY(5px) scale(0.97);
            box-shadow: 0 1px 0 #660022, 0 0 25px rgba(255, 0, 85, 0.8);
            transition: transform 0.04s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-auto {
            flex: 1;
            background: linear-gradient(180deg, #444466, #222233);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            color: #aaa;
            font-family: var(--font-family);
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 6px 0 #11111a;
            transition: all 0.05s ease;
        }

        .btn-auto.active {
            background: linear-gradient(180deg, #00f3ff, #008891);
            color: #000;
            font-weight: bold;
            box-shadow: 0 6px 0 #005560, 0 0 15px rgba(0, 243, 255, 0.6);
        }

        /* オーバーレイ画面 (START / GAMEOVER) */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 12, 0.9);
            backdrop-filter: blur(15px);
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            transition: opacity 0.2s ease;
        }

        .overlay-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .game-title {
            font-family: var(--font-family);
            font-size: 48px;
            line-height: 0.95;
            font-style: italic;
            background: linear-gradient(180deg, #fff 20%, #ff0055 60%, #ffe600 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px rgba(255, 0, 85, 0.8));
            transform: skewX(-5deg);
        }

        .subtitle {
            font-size: 14px;
            letter-spacing: 3px;
            color: var(--secondary-neon);
            margin-bottom: 40px;
            font-weight: bold;
        }

        .btn-start {
            width: 80%;
            max-width: 280px;
            height: 70px;
            background: linear-gradient(90deg, var(--primary-neon), var(--accent-gold));
            border: none;
            border-radius: 35px;
            color: #000;
            font-family: var(--font-family);
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.6);
            animation: pulse-btn 1s infinite alternate;
        }

        @keyframes pulse-btn {
            0% { transform: scale(0.98); box-shadow: 0 0 20px rgba(255, 0, 85, 0.6); }
            100% { transform: scale(1.05); box-shadow: 0 0 40px rgba(255, 230, 0, 0.9); }
        }

        .score-summary {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 20px;
        }

        .score-summary span {
            font-family: var(--font-family);
            font-size: 36px;
            color: var(--accent-gold);
            display: block;
        }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>

    <div id="viewport">
        <canvas id="bg-canvas"></canvas>

        <div class="ui-layer">
            <!-- HEADER -->
            <div class="header-ui">
                <div class="stat-box">
                    <span class="stat-label">TIME</span>
                    <span class="stat-value" id="time-display">45.0</span>
                </div>
                <div class="stat-box" style="align-items: center;">
                    <span class="stat-label">MULT</span>
                    <span class="stat-value" id="multiplier-display">x1</span>
                </div>
                <div class="stat-box" style="align-items: flex-end;">
                    <span class="stat-label">SCORE</span>
                    <span class="stat-value score" id="score-display">0</span>
                </div>
            </div>

            <!-- FEVER GAUGE -->
            <div class="fever-container">
                <div class="fever-bar" id="fever-bar"></div>
            </div>

            <!-- SLOT MACHINE -->
            <div class="slot-machine-container">
                <div id="combo-popup">GREAT!</div>
                <div class="slot-frame">
                    <div class="payline"></div>
                    <div class="reel-viewport"><canvas id="reel-0" class="reel-canvas"></canvas></div>
                    <div class="reel-viewport"><canvas id="reel-1" class="reel-canvas"></canvas></div>
                    <div class="reel-viewport"><canvas id="reel-2" class="reel-canvas"></canvas></div>
                </div>
            </div>

            <!-- CONTROLS -->
            <div class="control-panel">
                <div class="stop-buttons">
                    <button class="btn-stop disabled" id="stop-0">STOP 1</button>
                    <button class="btn-stop disabled" id="stop-1">STOP 2</button>
                    <button class="btn-stop disabled" id="stop-2">STOP 3</button>
                </div>
                <div class="main-actions">
                    <button class="btn-auto" id="btn-auto">AUTO: OFF</button>
                    <button class="btn-spin" id="btn-spin">SPIN!</button>
                </div>
            </div>
        </div>
    </div>

    <!-- START SCREEN -->
    <div class="overlay-screen" id="start-screen">
        <div class="game-title">HYPER RUSH<br>SLOT X</div>
        <div class="subtitle">ULTRA FAST ACTION SLOT</div>
        <button class="btn-start" id="btn-start">PLAY NOW</button>
    </div>

    <!-- GAME OVER SCREEN -->
    <div class="overlay-screen hidden" id="gameover-screen">
        <div class="game-title">TIME UP!</div>
        <div class="score-summary">
            FINAL SCORE
            <span id="final-score">0</span>
        </div>
        <button class="btn-start" id="btn-restart">RETRY</button>
    </div>

    <script>
        /**
         * Web Audio API Synthesizer & Sound FX Engine
         */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.compressor = null;
                this.delayNode = null;
                this.isMuted = false;
                this.clickBuffer = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    
                    this.compressor = this.ctx.createDynamicsCompressor();
                    this.compressor.threshold.setValueAtTime(-16, this.ctx.currentTime);
                    this.compressor.knee.setValueAtTime(24, this.ctx.currentTime);
                    this.compressor.ratio.setValueAtTime(8, this.ctx.currentTime);
                    this.compressor.attack.setValueAtTime(0.001, this.ctx.currentTime);
                    this.compressor.release.setValueAtTime(0.08, this.ctx.currentTime);

                    // 空間的奥行き（リバーブ／ディレイ）エフェクトの構築
                    this.delayNode = this.ctx.createDelay();
                    this.delayNode.delayTime.setValueAtTime(0.12, this.ctx.currentTime);
                    const delayFeedback = this.ctx.createGain();
                    delayFeedback.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    const delayFilter = this.ctx.createBiquadFilter();
                    delayFilter.type = 'lowpass';
                    delayFilter.frequency.setValueAtTime(2500, this.ctx.currentTime);

                    this.delayNode.connect(delayFilter);
                    delayFilter.connect(delayFeedback);
                    delayFeedback.connect(this.delayNode);

                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.setValueAtTime(0.85, this.ctx.currentTime);

                    this.compressor.connect(this.masterGain);
                    this.compressor.connect(this.delayNode);
                    this.delayNode.connect(this.masterGain);
                    this.masterGain.connect(this.ctx.destination);

                    // クリックノイズ用バッファを事前生成（発音レスポンスの高速化）
                    this.clickBuffer = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * 0.03), this.ctx.sampleRate);
                    const output = this.clickBuffer.getChannelData(0);
                    for (let i = 0; i < output.length; i++) {
                        output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (output.length * 0.3));
                    }
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playSynthWave(freq, type, duration, vol = 0.1) {
                if (!this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                
                // ポップノイズを防ぐスムースエンベロープ (Attack -> Decay)
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(vol, now + 0.003);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                
                osc.connect(gain);
                gain.connect(this.compressor || this.ctx.destination);
                osc.start(now);
                osc.stop(now + duration);
            }

            playSpin() {
                this.playSynthWave(150, 'sawtooth', 0.04, 0.02);
            }

            playReach() {
                if (!this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();
                
                osc.type = 'sawtooth';
                osc2.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, now);
                osc.frequency.exponentialRampToValueAtTime(1174.66, now + 0.35);
                osc2.frequency.setValueAtTime(293.66, now);
                osc2.frequency.exponentialRampToValueAtTime(587.33, now + 0.35);
                
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1800, now);
                filter.frequency.exponentialRampToValueAtTime(5500, now + 0.35);

                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(0.32, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
                
                osc.connect(filter);
                osc2.connect(filter);
                filter.connect(gain);
                gain.connect(this.delayNode || this.compressor || this.ctx.destination);
                osc.start(now);
                osc2.start(now);
                osc.stop(now + 0.4);
                osc2.stop(now + 0.4);
            }

            playStop(pitchMultiplier = 1) {
                if (!this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                
                // メインのロック音
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200 * pitchMultiplier, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.08);
                
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(0.4, now + 0.001);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
                
                osc.connect(gain);
                gain.connect(this.compressor || this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);

                // 事前生成バッファを利用した即応メカニカルクリック
                if (this.clickBuffer) {
                    const whiteNoise = this.ctx.createBufferSource();
                    whiteNoise.buffer = this.clickBuffer;
                    
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(1500, now);
                    filter.Q.setValueAtTime(1.5, now);

                    const noiseGain = this.ctx.createGain();
                    noiseGain.gain.setValueAtTime(0.2, now);
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);

                    whiteNoise.connect(filter);
                    filter.connect(noiseGain);
                    noiseGain.connect(this.compressor || this.ctx.destination);
                    whiteNoise.start(now);
                }
            }

            playWin() {
                if (!this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00]; // C5, E5, G5, C6, E6, G6, C7
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const filter = this.ctx.createBiquadFilter();
                    const startTime = now + idx * 0.05;
                    
                    osc.type = idx >= notes.length - 2 ? 'sawtooth' : 'triangle';
                    osc.frequency.setValueAtTime(freq, startTime);
                    
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(3500 + idx * 400, startTime);

                    gain.gain.setValueAtTime(0.0001, startTime);
                    gain.gain.linearRampToValueAtTime(0.25, startTime + 0.005);
                    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.35);
                    
                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.delayNode || this.compressor || this.ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.35);
                });
            }

            playFever() {
                if (!this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const startTime = now + idx * 0.06;
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0.0001, startTime);
                    gain.gain.linearRampToValueAtTime(0.2, startTime + 0.003);
                    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.3);
                    osc.connect(gain);
                    gain.connect(this.compressor || this.ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.3);
                });
            }

            playBeat() {
                if (!this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.07);
                
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(0.22, now + 0.002);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);
                
                osc.connect(gain);
                gain.connect(this.compressor || this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.07);
            }
        }

        const sound = new SoundEngine();

        /**
         * シンボルデータ定義
         */
        const SYMBOLS = [
            { id: '7', color: '#ff0055', score: 500, label: '7' },
            { id: 'BAR', color: '#ffe600', score: 300, label: 'BAR' },
            { id: 'GEM', color: '#00f3ff', score: 200, label: '★' },
            { id: 'BELL', color: '#ff9900', score: 150, label: '🔔' },
            { id: 'CHERRY', color: '#ff2244', score: 100, label: '🍒' },
            { id: 'LEMON', color: '#ccff00', score: 50, label: '🍋' }
        ];

        /**
         * Canvas描画キャッシュ管理（描画パフォーマンス極限最適化）
         */
        const symbolCacheStore = new Map();
        const MAX_CACHE_SIZE = 100;

        function clearSymbolCache() {
            symbolCacheStore.clear();
        }

        function getCachedSymbolCanvas(symbol, height, isHighlighted, isSpinning) {
            const h = Math.max(1, Math.round(height));
            const key = `${symbol.id}_${h}_${isHighlighted ? 1 : 0}_${isSpinning ? 1 : 0}`;
            if (symbolCacheStore.has(key)) {
                return symbolCacheStore.get(key);
            }

            if (symbolCacheStore.size > MAX_CACHE_SIZE) {
                const firstKey = symbolCacheStore.keys().next().value;
                symbolCacheStore.delete(firstKey);
            }

            const offCanvas = document.createElement('canvas');
            const padding = Math.ceil(h * 0.35);
            const size = Math.round(h + padding * 2);
            offCanvas.width = size;
            offCanvas.height = Math.round(size * (isSpinning ? 1.4 : 1.0));
            const ctx = offCanvas.getContext('2d');

            const center = Math.round(size / 2);
            const centerY = Math.round(offCanvas.height / 2);
            ctx.translate(center, centerY);

            if (isSpinning) {
                // 高度なモーションブラー＆ストレッチ表現
                ctx.scale(0.9, 1.35);
                ctx.globalAlpha = 0.65;
            }

            if (isHighlighted) {
                const glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, h * 0.45);
                glowGrad.addColorStop(0, 'rgba(255, 230, 0, 0.7)');
                glowGrad.addColorStop(1, 'rgba(255, 230, 0, 0)');
                ctx.fillStyle = glowGrad;
                ctx.beginPath();
                ctx.arc(0, 0, Math.round(h * 0.45), 0, Math.PI * 2);
                ctx.fill();
            }

            // 立体的なシャドウ＆リッチグラデーションテキスト
            ctx.font = `900 ${Math.floor(h * 0.45)}px 'Impact', 'Arial Black', sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (!isSpinning) {
                ctx.shadowColor = isHighlighted ? '#ffffff' : 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = isHighlighted ? 20 : 10;
                ctx.shadowOffsetY = 3;
            } else {
                ctx.shadowColor = symbol.color;
                ctx.shadowBlur = 15;
            }

            ctx.fillStyle = symbol.color;
            ctx.fillText(symbol.label, 0, 0);

            // インナーハイライト（非回転時）
            if (!isSpinning && !isHighlighted) {
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.35);';
                ctx.fillText(symbol.label, 0, -1);
            }

            symbolCacheStore.set(key, offCanvas);
            return offCanvas;
        }

        /**
         * リール管理クラス（高精度弾性イージング・判定完全同期・高速キャッシュ描画）
         */
        class Reel {
            constructor(canvasId, index, onCompleteStop) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.index = index;
                this.symbols = [...SYMBOLS, ...SYMBOLS];
                this.position = Math.floor(Math.random() * this.symbols.length);
                this.speed = 0;
                this.state = 'IDLE'; // IDLE, SPINNING, STOPPING
                this.targetPos = 0;
                this.stopProgress = 0;
                this.startStopPos = 0;
                this.stoppedSymbol = null;
                this.isHighlighted = false;
                this.isReach = false;
                this.onCompleteStop = onCompleteStop;
                this.blurIntensity = 0;
                this.resize();
            }

            resize() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = Math.floor(rect.width * window.devicePixelRatio);
                this.canvas.height = Math.floor(rect.height * window.devicePixelRatio);
                this.symbolHeight = this.canvas.height / 3;
                clearSymbolCache();
            }

            spin() {
                if (this.state !== 'IDLE') return;
                this.state = 'SPINNING';
                this.isHighlighted = false;
                this.isReach = false;
                this.stoppedSymbol = null;
                this.speed = 1.0 + Math.random() * 0.15;
            }

            setReachMode(isReach) {
                this.isReach = isReach;
                if (isReach && this.state === 'SPINNING') {
                    this.speed = 1.35;
                }
            }

            stop() {
                if (this.state !== 'SPINNING') return;
                this.state = 'STOPPING';
                this.stopProgress = 0;
                this.startStopPos = this.position;
                
                // 目押し即応：タップした瞬間に最も近いグリッド位置（ビタ止まりターゲット）を正確に特定
                const currentPos = this.position % this.symbols.length;
                const distanceToNext = 1.0 - (currentPos % 1.0);
                // 押し込んだ瞬間の見えがかり位置に目押し通りビタ着地
                this.targetPos = Math.ceil(this.position + (distanceToNext < 0.25 ? 1.0 : 0.0));

                // 中央ライン(i=1)に確定するシンボルを正確に算出
                const centerIdx = (this.targetPos + 1) % this.symbols.length;
                this.stoppedSymbol = this.symbols[centerIdx];
            }

            get isSpinning() {
                return this.state === 'SPINNING';
            }

            get isIdle() {
                return this.state === 'IDLE';
            }

            update(dt) {
                if (this.state === 'SPINNING') {
                    this.position = (this.position + this.speed * dt * 60) % this.symbols.length;
                    if (Math.random() < 0.08) sound.playSpin();
                } else if (this.state === 'STOPPING') {
                    // フレームレート変動に影響されない正規化イージング進捗
                    this.stopProgress = Math.min(1.0, this.stopProgress + dt * 18.0);
                    if (this.stopProgress >= 1.0) {
                        this.position = this.targetPos % this.symbols.length;
                        this.state = 'IDLE';
                        sound.playStop(1 + this.index * 0.25);
                        if (this.onCompleteStop) {
                            this.onCompleteStop(this.index);
                        }
                    } else {
                        // 鋭いビタ止まり感を実現する微調整された弾性イージング
                        const t = this.stopProgress;
                        const s = 0.28; // 目押しの打感に最適な反発係数
                        const easeOutBack = 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
                        this.position = this.startStopPos + (this.targetPos - this.startStopPos) * easeOutBack;
                    }
                }
            }

            draw() {
                const ctx = this.ctx;
                const w = this.canvas.width;
                const h = this.canvas.height;
                const sh = this.symbolHeight;

                ctx.clearRect(0, 0, w, h);

                const offset = (this.position % 1) * sh;
                const baseIdx = Math.floor(this.position);

                for (let i = -1; i <= 3; i++) {
                    const symIdx = (baseIdx + i + this.symbols.length * 10) % this.symbols.length;
                    const symbol = this.symbols[symIdx];
                    const y = (i * sh) - offset;
                    const isCenterLine = (i === 1);
                    const isHigh = isCenterLine && this.isHighlighted && this.state === 'IDLE';
                    const isSpinning = this.state === 'SPINNING';

                    const cachedCanvas = getCachedSymbolCanvas(symbol, sh, isHigh, isSpinning);
                    // 端数誤差による滲みを防止するピクセル丸め
                    const drawX = Math.round((w - cachedCanvas.width) / 2);
                    const drawY = Math.round(y + (sh - cachedCanvas.height) / 2);

                    ctx.drawImage(cachedCanvas, drawX, drawY);

                    // テンパイ時のスピード残像・ダイナミックオーラ演出
                    if (this.isReach && isSpinning && isCenterLine) {
                        ctx.save();
                        ctx.globalCompositeOperation = 'screen';
                        ctx.fillStyle = 'rgba(0, 243, 255, 0.15)';
                        ctx.fillRect(0, y, w, sh);
                        ctx.restore();
                    }
                }
            }
        }

        /**
         * メインゲーム管理（堅牢なステートマシンと同期）
         */
        class Game {
            constructor() {
                this.viewport = document.getElementById('viewport');
                this.flashOverlay = document.getElementById('flash-overlay');
                this.bgCanvas = document.getElementById('bg-canvas');
                this.bgCtx = this.bgCanvas.getContext('2d');
                this.paylineEl = document.querySelector('.payline');

                this.reels = [
                    new Reel('reel-0', 0, (idx) => this.onReelComplete(idx)),
                    new Reel('reel-1', 1, (idx) => this.onReelComplete(idx)),
                    new Reel('reel-2', 2, (idx) => this.onReelComplete(idx))
                ];

                this.score = 0;
                this.multiplier = 1;
                this.timeRemaining = 45.0;
                this.feverGauge = 0;
                this.isFever = false;
                this.gameState = 'START'; // START, PLAYING, GAMEOVER
                this.isEvaluating = false;
                this.isReach = false;
                this.autoMode = false;
                // dt駆動の一元タイマーマネージャー
                this.evalTimer = -1;
                this.autoStopTimers = [-1, -1, -1];
                this.feverTimer = -1;
                this.shakeTimer = -1;
                this.flashTimer = -1;
                this.comboTimer = -1;
                this.pulseTimer = -1;
                this.lastTime = performance.now();
                this.beatTimer = 0;

                // UI Elements
                this.scoreEl = document.getElementById('score-display');
                this.timeEl = document.getElementById('time-display');
                this.multEl = document.getElementById('multiplier-display');
                this.feverBar = document.getElementById('fever-bar');
                this.comboPopup = document.getElementById('combo-popup');

                this.btnSpin = document.getElementById('btn-spin');
                this.btnAuto = document.getElementById('btn-auto');
                this.stopBtns = [
                    document.getElementById('stop-0'),
                    document.getElementById('stop-1'),
                    document.getElementById('stop-2')
                ];

                // UI Cache for diff rendering
                this._uiCache = {
                    score: null,
                    timeStr: null,
                    mult: null,
                    feverPct: null
                };

                this.initEvents();
                this.resizeBg();
                requestAnimationFrame(this.loop.bind(this));
            }

            initEvents() {
                window.addEventListener('resize', () => {
                    this.resizeBg();
                    this.reels.forEach(r => r.resize());
                });

                const activePointers = new Set();
                const addFastListener = (el, handler) => {
                    const triggerDown = (e) => {
                        if (e) {
                            if (e.cancelable) e.preventDefault();
                            if (e.pointerId !== undefined && activePointers.has(e.pointerId)) return;
                            if (e.pointerId !== undefined) activePointers.add(e.pointerId);
                        }
                        sound.init();
                        el.classList.add('pressed');
                        handler();
                    };

                    const triggerUp = (e) => {
                        if (e && e.pointerId !== undefined) activePointers.delete(e.pointerId);
                        el.classList.remove('pressed');
                    };

                    el.addEventListener('pointerdown', triggerDown, { passive: false });
                    el.addEventListener('pointerup', triggerUp, { passive: false });
                    el.addEventListener('pointercancel', triggerUp, { passive: false });
                    el.addEventListener('pointerleave', triggerUp, { passive: false });
                    el.addEventListener('click', (e) => {
                        if (e.cancelable) e.preventDefault();
                    }, { passive: false });
                };

                addFastListener(document.getElementById('btn-start'), () => this.startGame());
                addFastListener(document.getElementById('btn-restart'), () => this.startGame());
                addFastListener(this.btnSpin, () => this.handleSpinAction());

                this.stopBtns.forEach((btn, idx) => {
                    addFastListener(btn, () => this.stopReel(idx));
                });

                addFastListener(this.btnAuto, () => {
                    this.autoMode = !this.autoMode;
                    this.btnAuto.classList.toggle('active', this.autoMode);
                    this.btnAuto.innerText = `AUTO: ${this.autoMode ? 'ON' : 'OFF'}`;
                    if (!this.autoMode) {
                        this.clearAutoTimers();
                    } else if (this.gameState === 'PLAYING' && !this.isEvaluating) {
                        this.handleSpinAction();
                    }
                });

                window.addEventListener('keydown', (e) => {
                    if (this.gameState !== 'PLAYING' || e.repeat) return;
                    sound.init();
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.btnSpin.classList.add('pressed');
                        this.handleSpinAction();
                    } else if (e.key === '1' || e.key === '2' || e.key === '3') {
                        const idx = parseInt(e.key) - 1;
                        if (this.stopBtns[idx]) {
                            this.stopBtns[idx].classList.add('pressed');
                        }
                        this.stopReel(idx);
                    }
                });

                window.addEventListener('keyup', (e) => {
                    if (e.code === 'Space') {
                        this.btnSpin.classList.remove('pressed');
                    } else if (e.key === '1' || e.key === '2' || e.key === '3') {
                        const idx = parseInt(e.key) - 1;
                        if (this.stopBtns[idx]) {
                            this.stopBtns[idx].classList.remove('pressed');
                        }
                    }
                });
            }

            clearAutoTimers() {
                this.evalTimer = -1;
                this.autoStopTimers = [-1, -1, -1];
            }

            resizeBg() {
                this.bgCanvas.width = window.innerWidth * window.devicePixelRatio;
                this.bgCanvas.height = window.innerHeight * window.devicePixelRatio;
            }

            startGame() {
                sound.init();
                this.score = 0;
                this.multiplier = 1;
                this.timeRemaining = 45.0;
                this.feverGauge = 0;
                this.isFever = false;
                this.isEvaluating = false;
                this.clearAutoTimers();
                this.gameState = 'PLAYING';

                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('gameover-screen').classList.add('hidden');

                this.updateUI(true);
                this.triggerSpin();
            }

            handleSpinAction() {
                if (this.gameState !== 'PLAYING' || this.isEvaluating) return;

                const allIdle = this.reels.every(r => r.isIdle);
                if (allIdle) {
                    this.triggerSpin();
                } else {
                    const nextToStop = this.reels.findIndex(r => r.isSpinning);
                    if (nextToStop !== -1) {
                        this.stopReel(nextToStop);
                    }
                }
            }

            triggerSpin() {
                if (this.gameState !== 'PLAYING' || this.isEvaluating) return;
                const allIdle = this.reels.every(r => r.isIdle);
                if (!allIdle) return; // 二重回転発火防止 Guard

                this.clearAutoTimers();
                this.isReach = false;
                this.paylineEl.classList.remove('active-win', 'reach');
                this.reels.forEach(r => {
                    r.spin();
                    r.canvas.parentElement.classList.remove('reach-target');
                });
                this.updateStopButtonsState();
                this.triggerCameraShake('light');

                if (this.autoMode) {
                    // dt駆動タイマー：秒単位で自動停止キューを設定
                    this.autoStopTimers = [0.12, 0.22, 0.32];
                }
            }

            stopReel(index) {
                if (this.gameState !== 'PLAYING' || this.isEvaluating) return;
                const reel = this.reels[index];
                if (reel && reel.isSpinning) {
                    reel.stop();
                    this.triggerCameraShake('light');
                    this.updateStopButtonsState();
                }
            }

            checkReachCondition() {
                // リールが2つ停止し、1つが回転中の状態で判定
                const idleReels = this.reels.filter(r => r.isIdle);
                if (idleReels.length === 2 && !this.isReach) {
                    const stoppedIdxs = this.reels.map((r, i) => r.isIdle ? i : -1).filter(i => i !== -1);
                    const symA = this.reels[stoppedIdxs[0]].stoppedSymbol;
                    const symB = this.reels[stoppedIdxs[1]].stoppedSymbol;
                    
                    if (symA && symB && symA.id === symB.id) {
                        // テンパイ成立！
                        this.isReach = true;
                        const spinningIdx = this.reels.findIndex(r => r.isSpinning);
                        if (spinningIdx !== -1) {
                            this.reels[spinningIdx].setReachMode(true);
                            this.reels[spinningIdx].canvas.parentElement.classList.add('reach-target');
                            this.paylineEl.classList.add('reach');
                            sound.playReach();
                            this.triggerCameraShake('light');
                        }
                    }
                }
            }

            onReelComplete(index) {
                this.updateStopButtonsState();
                this.checkReachCondition();

                // アトミックなステートチェックにより二重発火を完全に抑止し同期精度を最大化
                if (this.gameState === 'PLAYING' && !this.isEvaluating && this.reels.every(r => r.isIdle)) {
                    this.isEvaluating = true;
                    this.isReach = false;
                    this.paylineEl.classList.remove('reach');
                    this.reels.forEach(r => r.canvas.parentElement.classList.remove('reach-target'));
                    
                    // 次フレームで確実に描画と判定を同期
                    requestAnimationFrame(() => {
                        this.evaluateResult();
                    });
                }
            }

            updateStopButtonsState() {
                this.reels.forEach((reel, idx) => {
                    const btn = this.stopBtns[idx];
                    if (reel.isSpinning) {
                        btn.classList.remove('disabled');
                        btn.classList.add('active-ready');
                    } else {
                        btn.classList.add('disabled');
                        btn.classList.remove('active-ready');
                        btn.classList.remove('pressed');
                    }
                });
            }

            evaluateResult() {
                const s0 = this.reels[0].stoppedSymbol;
                const s1 = this.reels[1].stoppedSymbol;
                const s2 = this.reels[2].stoppedSymbol;

                if (!s0 || !s1 || !s2) {
                    this.isEvaluating = false;
                    return;
                }

                let winAmount = 0;
                let comboText = '';

                // 全揃い (JACKPOT)
                if (s0.id === s1.id && s1.id === s2.id) {
                    winAmount = s0.score * 3 * this.multiplier;
                    comboText = `JACKPOT! +${winAmount}`;
                    this.reels.forEach(r => r.isHighlighted = true);
                    this.paylineEl.classList.add('active-win');
                    this.triggerFlash('#ffe600');
                    this.triggerCameraShake('heavy');
                    sound.playWin();
                    this.addFever(35);
                } 
                // テンパイヒット（左2つ、右2つ、両端）
                else if (s0.id === s1.id || s1.id === s2.id || s0.id === s2.id) {
                    if (s0.id === s1.id) {
                        this.reels[0].isHighlighted = true;
                        this.reels[1].isHighlighted = true;
                        winAmount = s0.score * this.multiplier;
                    } else if (s1.id === s2.id) {
                        this.reels[1].isHighlighted = true;
                        this.reels[2].isHighlighted = true;
                        winAmount = s1.score * this.multiplier;
                    } else {
                        this.reels[0].isHighlighted = true;
                        this.reels[2].isHighlighted = true;
                        winAmount = s0.score * this.multiplier;
                    }
                    comboText = `GREAT! +${winAmount}`;
                    this.paylineEl.classList.add('active-win');
                    sound.playWin();
                    this.addFever(15);
                }

                if (winAmount > 0) {
                    this.score += winAmount;
                    this.showComboText(comboText);
                } else {
                    this.addFever(5);
                }

                this.updateUI();

                // 評価完了ウェイトをdt駆動タイマー(秒)にセット
                this.evalTimer = winAmount > 0 ? 0.35 : 0.12;
            }

            addFever(amount) {
                if (this.isFever) return;
                this.feverGauge += amount;
                if (this.feverGauge >= 100) {
                    this.triggerFeverMode();
                }
            }

            triggerFeverMode() {
                this.isFever = true;
                this.feverGauge = 100;
                this.multiplier = 3;
                this.feverTimer = 7.0; // 7秒間のフィーバー(dt管理)
                sound.playFever();
                this.showComboText("HYPER FEVER!!");
                this.triggerFlash('#ff0055');
            }

            triggerCameraShake(type) {
                const className = type === 'heavy' ? 'shake-heavy' : 'shake-light';
                this.viewport.classList.remove('shake-light', 'shake-heavy');
                requestAnimationFrame(() => {
                    this.viewport.classList.add(className);
                });
                this.shakeTimer = type === 'heavy' ? 0.18 : 0.1;
            }

            triggerFlash(color = '#ffffff') {
                this.flashOverlay.style.background = color;
                this.flashOverlay.style.opacity = '0.8';
                this.flashTimer = 0.06; // 60ms
            }

            showComboText(text) {
                this.comboPopup.innerText = text;
                this.comboPopup.style.opacity = '1';
                this.comboPopup.style.transform = 'translate(-50%, -50%) scale(1.35) rotate(-4deg)';
                this.comboPopup.style.transition = 'transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.4), opacity 0.15s ease-out';
                this.comboTimer = 0.45; // 450ms
            }

            updateUI(force = false) {
                const formattedScore = this.score.toLocaleString();
                if (force || this._uiCache.score !== formattedScore) {
                    this._uiCache.score = formattedScore;
                    this.scoreEl.innerText = formattedScore;
                }

                const timeStr = Math.max(0, this.timeRemaining).toFixed(1);
                if (force || this._uiCache.timeStr !== timeStr) {
                    this._uiCache.timeStr = timeStr;
                    this.timeEl.innerText = timeStr;
                }

                const multStr = `x${this.multiplier}`;
                if (force || this._uiCache.mult !== multStr) {
                    this._uiCache.mult = multStr;
                    this.multEl.innerText = multStr;
                }

                const feverPct = `${Math.min(100, Math.max(0, this.feverGauge))}%`;
                if (force || this._uiCache.feverPct !== feverPct) {
                    this._uiCache.feverPct = feverPct;
                    this.feverBar.style.width = feverPct;
                }
            }

            gameOver() {
                this.gameState = 'GAMEOVER';
                this.clearAutoTimers();
                this.paylineEl.classList.remove('active-win');
                document.getElementById('final-score').innerText = this.score.toLocaleString();
                document.getElementById('gameover-screen').classList.remove('hidden');
            }

            drawBackground(now) {
                const ctx = this.bgCtx;
                const w = this.bgCanvas.width;
                const h = this.bgCanvas.height;

                if (!this.particles) {
                    // よりリッチなマルチレイヤー・パララックスパーティクル群の構築
                    this.particles = Array.from({ length: 64 }, (_, i) => ({
                        x: Math.random() * w,
                        y: Math.random() * h,
                        vx: (Math.random() - 0.5) * 0.35,
                        vy: (Math.random() - 0.5) * 0.35 - 0.25,
                        size: Math.random() * 4.2 + 0.6,
                        alpha: Math.random() * 0.75 + 0.2,
                        layer: i % 3 + 1 // 1:遠景, 2:中景, 3:近景
                    }));
                }

                ctx.clearRect(0, 0, w, h);

                const cx = w / 2;
                const cy = h / 2;
                const radius = Math.max(w, h) * 0.9;

                // シネマティックなリッチグラデーション背景
                const bgGrad = ctx.createRadialGradient(cx, cy, 20, cx, cy, radius);
                if (this.isFever) {
                    const pulse = Math.sin(now * 0.014) * 0.3 + 0.85;
                    const hueShift = Math.sin(now * 0.005) * 30;
                    bgGrad.addColorStop(0, `hsla(${330 + hueShift}, 100%, 40%, ${pulse * 0.95})`);
                    bgGrad.addColorStop(0.45, '#2b0020');
                    bgGrad.addColorStop(0.8, '#0d0216');
                    bgGrad.addColorStop(1, '#04010a');
                } else {
                    bgGrad.addColorStop(0, '#18183c');
                    bgGrad.addColorStop(0.55, '#0a0a1e');
                    bgGrad.addColorStop(1, '#030309');
                }
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, w, h);

                // 立体深度を強調したマルチレイヤー・パララックスパーティクル描画
                ctx.save();
                this.particles.forEach(p => {
                    const speedMultiplier = p.layer * (this.isFever ? 2.4 : 1.0);
                    p.x += p.vx * speedMultiplier;
                    p.y += p.vy * speedMultiplier;
                    if (p.x < 0) p.x = w;
                    if (p.x > w) p.x = 0;
                    if (p.y < 0) p.y = h;
                    if (p.y > h) p.y = 0;

                    const currentAlpha = p.alpha * (p.layer * 0.38 + 0.2);
                    ctx.shadowColor = this.isFever ? '#ff0055' : '#00f3ff';
                    ctx.shadowBlur = p.layer * 8;
                    ctx.fillStyle = this.isFever ? `rgba(255, 30, 130, ${currentAlpha})` : `rgba(0, 243, 255, ${currentAlpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * (p.layer * 0.35 + 0.45), 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.restore();

                // 空気感が熱を帯びて発光するようなシネマティックな同心環とライティング
                ctx.save();
                const ringPulse = Math.sin(now * 0.005) * 0.06 + 1.0;
                const ringPulse2 = Math.cos(now * 0.004) * 0.08 + 1.0;

                ctx.strokeStyle = this.isFever ? 'rgba(255, 0, 100, 0.35)' : 'rgba(0, 243, 255, 0.15)';
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.arc(cx, cy, Math.min(w, h) * 0.42 * ringPulse, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = this.isFever ? 'rgba(255, 220, 0, 0.22)' : 'rgba(255, 255, 255, 0.06)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(cx, cy, Math.min(w, h) * 0.58 / ringPulse2, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            loop(now) {
                // dt制限（タブ非アクティブからの復帰時などの極端な飛びを防止）
                const dt = Math.min((now - this.lastTime) / 1000, 0.1);
                this.lastTime = now;

                if (this.gameState === 'PLAYING') {
                    this.timeRemaining -= dt;
                    if (this.timeRemaining <= 0) {
                        this.timeRemaining = 0;
                        this.gameOver();
                    }

                    // --- dt駆動タイマー一元制御 ---
                    // 1. オートストップ制御
                    for (let i = 0; i < 3; i++) {
                        if (this.autoStopTimers[i] > 0) {
                            this.autoStopTimers[i] -= dt;
                            if (this.autoStopTimers[i] <= 0) {
                                this.autoStopTimers[i] = -1;
                                this.stopReel(i);
                            }
                        }
                    }

                    // 2. 結果評価ウェイトタイマー
                    if (this.evalTimer > 0) {
                        this.evalTimer -= dt;
                        if (this.evalTimer <= 0) {
                            this.evalTimer = -1;
                            this.isEvaluating = false;
                            if (this.autoMode && this.gameState === 'PLAYING') {
                                this.triggerSpin();
                            }
                        }
                    }

                    // 3. フィーバータイマー
                    if (this.isFever && this.feverTimer > 0) {
                        this.feverTimer -= dt;
                        if (this.feverTimer <= 0) {
                            this.isFever = false;
                            this.feverGauge = 0;
                            this.multiplier = 1;
                        }
                    }

                    // 4. カメラシェイクタイマー
                    if (this.shakeTimer > 0) {
                        this.shakeTimer -= dt;
                        if (this.shakeTimer <= 0) {
                            this.viewport.classList.remove('shake-light', 'shake-heavy');
                        }
                    }

                    // 5. フラッシュタイマー
                    if (this.flashTimer > 0) {
                        this.flashTimer -= dt;
                        if (this.flashTimer <= 0) {
                            this.flashOverlay.style.opacity = '0';
                        }
                    }

                    // 6. コンボ表示タイマー
                    if (this.comboTimer > 0) {
                        this.comboTimer -= dt;
                        if (this.comboTimer <= 0) {
                            this.comboPopup.style.opacity = '0';
                            this.comboPopup.style.transform = 'translate(-50%, -50%) scale(0.5)';
                        }
                    }

                    this.updateUI();

                    // ビート同期演出（引き算の美学：フィーバー時のみ視覚脈動を強調し、画面のチラつきを抑制）
                    this.beatTimer += dt;
                    const beatInterval = this.isFever ? (60 / 160) : (60 / 120);
                    if (this.beatTimer >= beatInterval) {
                        this.beatTimer = 0;
                        if (this.isFever) {
                            sound.playBeat();
                            this.pulseTimer = 0.06;
                            this.viewport.classList.add('pulse-beat');
                        }
                    }

                    if (this.pulseTimer > 0) {
                        this.pulseTimer -= dt;
                        if (this.pulseTimer <= 0) {
                            this.viewport.classList.remove('pulse-beat');
                        }
                    }
                }

                // BG & リールの描画
                this.drawBackground(now);
                this.reels.forEach(reel => {
                    reel.update(dt);
                    reel.draw();
                });

                requestAnimationFrame(this.loop.bind(this));
            }
        }

        // ゲーム起動
        window.addEventListener('load', () => {
            new Game();
        });
    </script>
</body>
