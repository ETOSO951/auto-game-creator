<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLADE ZERO - 3D斬撃アクション</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            background-color: #030307;
            color: #ffffff;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        .font-orbitron {
            font-family: 'Orbitron', monospace;
        }
        .glass-dark {
            background: rgba(8, 8, 16, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .neon-glow-cyan {
            text-shadow: 0 0 16px rgba(0, 240, 255, 0.6);
        }
        .neon-glow-crimson {
            text-shadow: 0 0 16px rgba(255, 30, 80, 0.8);
        }
        /* スラッシュトレイル描画用キャンバス */
        #trailCanvas {
            pointer-events: none;
        }
        /* 被弾・一閃フラッシュ */
        @keyframes flashRed {
            0% { opacity: 0.7; }
            100% { opacity: 0; }
        }
        .flash-hit {
            animation: flashRed 0.25s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }
        @keyframes flashCyan {
            0% { opacity: 0.85; }
            100% { opacity: 0; }
        }
        .flash-crit {
            animation: flashCyan 0.35s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }
    </style>
</head>
<body class="relative w-screen h-screen bg-[#030307]">

    <!-- 3Dレンダリング用コンテナ -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- 斬撃エフェクト描画用2Dオーバーレイ -->
    <canvas id="trailCanvas" class="absolute inset-0 z-10"></canvas>

    <!-- 画面衝撃フラッシュ -->
    <div id="damageOverlay" class="absolute inset-0 z-20 pointer-events-none bg-rose-600 opacity-0"></div>
    <div id="critOverlay" class="absolute inset-0 z-20 pointer-events-none bg-cyan-400 opacity-0"></div>

    <!-- メインHUD (ゲームプレイ中) -->
    <div id="hud" class="absolute inset-0 z-20 pointer-events-none flex flex-col justify-between p-5 md:p-8 opacity-0 transition-opacity duration-500">
        <!-- 上部ステータスバー -->
        <div class="flex justify-between items-start w-full max-w-4xl mx-auto">
            <!-- 体力 & EXゲージ -->
            <div class="glass-dark px-5 py-3 rounded-2xl flex flex-col gap-2 min-w-[170px] md:min-w-[240px]">
                <div>
                    <div class="flex justify-between text-[10px] tracking-widest text-zinc-400 font-orbitron mb-1">
                        <span>HEALTH</span>
                        <span id="hpText" class="text-white font-bold">100%</span>
                    </div>
                    <div class="w-full h-2 bg-zinc-950/80 rounded-full overflow-hidden border border-white/10">
                        <div id="hpBar" class="h-full bg-gradient-to-r from-emerald-400 to-cyan-400 w-full transition-all duration-300"></div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between text-[9px] tracking-widest text-zinc-400 font-orbitron mb-1">
                        <span>KATANA EX</span>
                        <span id="exText" class="text-cyan-400">0%</span>
                    </div>
                    <div class="w-full h-1.5 bg-zinc-950/80 rounded-full overflow-hidden border border-cyan-500/20">
                        <div id="exBar" class="h-full bg-gradient-to-r from-cyan-400 to-pink-500 w-0 transition-all duration-200"></div>
                    </div>
                </div>
            </div>

            <!-- コンボ & スコア -->
            <div class="text-right">
                <div id="comboContainer" class="transform scale-90 transition-transform duration-150 origin-right">
                    <span id="comboVal" class="text-4xl md:text-6xl font-black font-orbitron tracking-tighter neon-glow-cyan text-cyan-300">0</span>
                    <span class="text-xs md:text-sm font-bold font-orbitron text-zinc-400 tracking-widest ml-1">HITS</span>
                </div>
                <div class="text-[11px] font-orbitron tracking-widest text-zinc-500 mt-1">
                    SCORE <span id="scoreVal" class="text-white font-bold ml-1">000000</span>
                </div>
            </div>
        </div>

        <!-- 下部操作パネル -->
        <div class="flex justify-between items-end w-full max-w-4xl mx-auto">
            <!-- 操作ガイダンス -->
            <div class="glass-dark px-4 py-2 rounded-xl text-[11px] text-zinc-400 border border-white/5">
                <span class="text-cyan-400 font-bold">画面スワイプ / ドラッグ</span> で遠中近すべての敵を先制斬撃<br>
                迫りくる機械兵を両断しコンボを繋げ
            </div>

            <!-- 必殺一閃ボタン (EX 100%で発動可能) -->
            <button id="exSlashBtn" class="pointer-events-auto glass-dark px-6 py-3.5 rounded-2xl border border-cyan-400/40 text-cyan-400 font-orbitron font-bold tracking-widest text-xs md:text-sm transition-all transform active:scale-95 disabled:opacity-30 disabled:border-white/10 disabled:text-zinc-500" disabled>
                一閃 [EX]
            </button>
        </div>
    </div>

    <!-- スタート画面 -->
    <div id="startScreen" class="absolute inset-0 z-30 flex flex-col items-center justify-center p-6 bg-gradient-to-b from-black/80 via-[#05050f]/95 to-black/90 backdrop-blur-md transition-opacity duration-500">
        <div class="max-w-md w-full text-center">
            <div class="inline-block text-[11px] tracking-[0.4em] text-cyan-400 font-orbitron mb-3 px-3 py-1 rounded-full border border-cyan-500/20 bg-cyan-950/30">
                CYBERNETIC BLADE SYSTEM
            </div>
            <h1 class="text-5xl md:text-6xl font-black font-orbitron tracking-wider text-white mb-2 neon-glow-cyan">
                BLADE<span class="text-rose-500">ZERO</span>
            </h1>
            <p class="text-zinc-400 text-xs md:text-sm mb-8 leading-relaxed font-light">
                画面を一閃せよ。迫るサイバー機械兵を両断する<br class="hidden sm:inline">ハイスピード3D斬撃アクション。
            </p>

            <button id="startBtn" class="pointer-events-auto w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-500 via-sky-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-orbitron font-black text-sm tracking-widest shadow-[0_0_30px_rgba(0,240,255,0.35)] transition-all transform hover:scale-[1.02] active:scale-95">
                START MISSION
            </button>
            <div class="mt-8 text-[10px] text-zinc-600 font-orbitron tracking-widest">
                SWIPE TO CUT // MINIMALIST STRIKE
            </div>
        </div>
    </div>

    <!-- リザルト画面 -->
    <div id="gameOverScreen" class="absolute inset-0 z-30 hidden flex-col items-center justify-center p-6 bg-black/90 backdrop-blur-xl">
        <div class="glass-dark max-w-sm w-full p-8 rounded-3xl text-center border border-white/10 shadow-[0_0_50px_rgba(0,0,0,0.8)]">
            <div id="resultTitle" class="text-3xl font-black font-orbitron text-rose-500 neon-glow-crimson mb-2">SIGNAL LOST</div>
            <p class="text-zinc-400 text-xs mb-6">任務終了。ブレードコアの再起動が必要です。</p>

            <div class="space-y-3 mb-8 text-left bg-black/40 p-4 rounded-xl border border-white/5">
                <div class="flex justify-between text-xs font-orbitron">
                    <span class="text-zinc-400">TOTAL SCORE</span>
                    <span id="finalScore" class="font-bold text-white">0</span>
                </div>
                <div class="flex justify-between text-xs font-orbitron">
                    <span class="text-zinc-400">MAX COMBO</span>
                    <span id="finalCombo" class="font-bold text-cyan-400">0 HITS</span>
                </div>
                <div class="flex justify-between text-xs font-orbitron">
                    <span class="text-zinc-400">ENEMIES SLAIN</span>
                    <span id="finalKills" class="font-bold text-emerald-400">0</span>
                </div>
            </div>

            <button id="retryBtn" class="w-full py-3.5 rounded-xl bg-white hover:bg-zinc-200 text-black font-orbitron font-bold text-xs tracking-widest transition-all active:scale-95">
                RE-ENGAGE
            </button>
        </div>
    </div>

    <!-- ゲームロジック -->
    <script>
        /* ========================================================
           1. サウンド & BGM合成システム (Web Audio API)
           ======================================================== */
        class AudioSystem {
            constructor() {
                this.ctx = null;
                this.bgmInterval = null;
                this.step = 0;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            startBGM() {
                if (this.bgmInterval) return;
                // 125BPM ミニマル・サイバーシンセベース ループ
                const intervalTime = (60 / 125) * 500; // 16分音符相当
                const bassNotes = [110, 110, 146.83, 110, 98, 110, 164.81, 130.81];

                this.bgmInterval = setInterval(() => {
                    if (!this.ctx || this.ctx.state !== 'running') return;
                    const now = this.ctx.currentTime;
                    const freq = bassNotes[this.step % bassNotes.length];

                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const filter = this.ctx.createBiquadFilter();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now);

                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(450, now);
                    filter.frequency.exponentialRampToValueAtTime(120, now + 0.18);
                    filter.Q.value = 4.0;

                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.2);

                    this.step++;
                }, intervalTime);
            }
            stopBGM() {
                if (this.bgmInterval) {
                    clearInterval(this.bgmInterval);
                    this.bgmInterval = null;
                }
            }
            playSlash() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const bufferSize = this.ctx.sampleRate * 0.12;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.25));
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1800, now);
                filter.frequency.exponentialRampToValueAtTime(300, now + 0.12);
                filter.Q.value = 3.0;

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);
            }
            playHit() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.exponentialRampToValueAtTime(120, now + 0.18);

                gain.gain.setValueAtTime(0.45, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.18);
            }
            playSpecialSlash() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.45);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.45);
            }
            playDamage() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(80, now);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        /* ========================================================
           2. 3Dゲームエンジン & 斬撃インタラクション
           ======================================================== */
        class BladeZeroGame {
            constructor() {
                this.audio = new AudioSystem();
                this.container = document.getElementById('canvas-container');
                this.trailCanvas = document.getElementById('trailCanvas');
                this.trailCtx = this.trailCanvas.getContext('2d');

                // ゲーム状態
                this.state = 'START';
                this.hp = 100;
                this.maxHp = 100;
                this.ex = 0;
                this.score = 0;
                this.combo = 0;
                this.maxCombo = 0;
                this.kills = 0;
                this.hitStopFrames = 0;
                this.cameraShake = 0;

                // 入力管理
                this.pointerDown = false;
                this.activePointerId = null;
                this.strokePoints = [];

                // 3D環境初期化
                this.initThree();
                this.initResize();
                this.initInput();
                this.initUIEvents();

                // オブジェクト管理
                this.enemies = [];
                this.particles = [];
                this.debris = [];
                this.spawnTimer = 0;

                this.animate = this.animate.bind(this);
                requestAnimationFrame(this.animate);
            }

            initThree() {
                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.FogExp2(0x030309, 0.035);

                this.camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
                this.camera.position.set(0, 1.8, 4.8);
                this.baseCamPos = this.camera.position.clone();

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.1;
                this.container.appendChild(this.renderer.domElement);

                // ライティング
                const ambientLight = new THREE.AmbientLight(0x0e111a, 2.5);
                this.scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0x00f0ff, 1.2);
                dirLight.position.set(5, 10, 7);
                this.scene.add(dirLight);

                const redRim = new THREE.PointLight(0xff0055, 3.0, 15);
                redRim.position.set(0, 1, 0);
                this.scene.add(redRim);

                // グリッド
                const grid = new THREE.GridHelper(60, 40, 0x00f0ff, 0x131a28);
                grid.position.y = -0.5;
                this.scene.add(grid);
                this.grid = grid;

                // ネオン柱
                const pillarGeo = new THREE.BoxGeometry(0.8, 18, 0.8);
                const pillarMat = new THREE.MeshBasicMaterial({ color: 0x071527, wireframe: true });
                this.pillars = [];
                for (let i = 0; i < 14; i++) {
                    const p = new THREE.Mesh(pillarGeo, pillarMat);
                    const angle = (i / 14) * Math.PI * 2;
                    p.position.set(Math.cos(angle) * 16, 4, Math.sin(angle) * 16 - 8);
                    this.scene.add(p);
                    this.pillars.push(p);
                }

                this.createKatana();
            }

            createKatana() {
                this.katanaGroup = new THREE.Group();
                const bladeGeo = new THREE.BoxGeometry(0.025, 0.06, 1.6);
                const bladeMat = new THREE.MeshStandardMaterial({
                    color: 0x00f0ff,
                    emissive: 0x00d0ee,
                    emissiveIntensity: 0.8,
                    metalness: 0.9,
                    roughness: 0.1
                });
                const blade = new THREE.Mesh(bladeGeo, bladeMat);
                blade.position.z = -0.8;
                this.katanaGroup.add(blade);

                const tsubaGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.02, 16);
                const darkMat = new THREE.MeshBasicMaterial({ color: 0x111116 });
                const tsuba = new THREE.Mesh(tsubaGeo, darkMat);
                tsuba.rotation.x = Math.PI / 2;
                this.katanaGroup.add(tsuba);

                const hiltGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.4, 8);
                const hilt = new THREE.Mesh(hiltGeo, darkMat);
                hilt.rotation.x = Math.PI / 2;
                hilt.position.z = 0.22;
                this.katanaGroup.add(hilt);

                this.katanaGroup.position.set(0.55, -0.45, -0.9);
                this.katanaGroup.rotation.set(-0.25, 0.35, -0.3);
                this.camera.add(this.katanaGroup);
                this.scene.add(this.camera);

                this.katanaRestPos = this.katanaGroup.position.clone();
                this.katanaRestRot = this.katanaGroup.rotation.clone();
            }

            initResize() {
                const onResize = () => {
                    const w = window.innerWidth;
                    const h = window.innerHeight;
                    this.camera.aspect = w / h;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(w, h);
                    this.trailCanvas.width = w;
                    this.trailCanvas.height = h;
                };
                window.addEventListener('resize', onResize);
                onResize();
            }

            initInput() {
                const onDown = (e) => {
                    if (this.state !== 'PLAYING') return;
                    this.audio.init();
                    this.pointerDown = true;
                    this.activePointerId = e.pointerId;
                    
                    // ポインターキャプチャの設定（画面外に指が抜けても軌跡・切断を維持）
                    try {
                        e.target.setPointerCapture?.(e.pointerId);
                    } catch (err) {}

                    this.strokePoints = [];
                    this.strokePoints.push({ x: e.clientX, y: e.clientY, time: performance.now() });
                };

                const onMove = (e) => {
                    if (!this.pointerDown || this.state !== 'PLAYING') return;
                    if (this.activePointerId !== null && e.pointerId !== this.activePointerId) return;

                    this.strokePoints.push({ x: e.clientX, y: e.clientY, time: performance.now() });

                    if (this.strokePoints.length >= 2) {
                        const p1 = this.strokePoints[this.strokePoints.length - 2];
                        const p2 = this.strokePoints[this.strokePoints.length - 1];
                        const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                        if (dist > 14) {
                            this.executeSlash(p1, p2);
                        }
                    }
                };

                const onUp = (e) => {
                    if (this.activePointerId !== null && e.pointerId === this.activePointerId) {
                        this.pointerDown = false;
                        this.activePointerId = null;
                        try {
                            e.target.releasePointerCapture?.(e.pointerId);
                        } catch (err) {}
                    }
                };

                window.addEventListener('pointerdown', onDown);
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
                window.addEventListener('pointercancel', onUp);
            }

            initUIEvents() {
                document.getElementById('startBtn').addEventListener('click', () => {
                    this.audio.init();
                    this.audio.startBGM();
                    this.startGame();
                });
                document.getElementById('retryBtn').addEventListener('click', () => {
                    this.audio.init();
                    this.audio.startBGM();
                    this.startGame();
                });
                document.getElementById('exSlashBtn').addEventListener('click', () => {
                    this.triggerExSlash();
                });
            }

            startGame() {
                this.hp = 100;
                this.ex = 0;
                this.score = 0;
                this.combo = 0;
                this.maxCombo = 0;
                this.kills = 0;
                this.spawnTimer = 0;

                this.enemies.forEach(e => this.scene.remove(e.mesh));
                this.debris.forEach(d => this.scene.remove(d.mesh));
                this.enemies = [];
                this.debris = [];
                this.particles = [];

                this.updateHUD();

                document.getElementById('startScreen').classList.add('opacity-0');
                setTimeout(() => document.getElementById('startScreen').classList.add('hidden'), 500);
                document.getElementById('gameOverScreen').classList.add('hidden');
                document.getElementById('gameOverScreen').classList.remove('flex');

                const hud = document.getElementById('hud');
                hud.classList.remove('opacity-0');

                this.state = 'PLAYING';
            }

            triggerGameOver() {
                this.state = 'GAMEOVER';
                this.audio.stopBGM();
                this.audio.playDamage();

                document.getElementById('finalScore').innerText = this.score;
                document.getElementById('finalCombo').innerText = `${this.maxCombo} HITS`;
                document.getElementById('finalKills').innerText = this.kills;

                const screen = document.getElementById('gameOverScreen');
                screen.classList.remove('hidden');
                screen.classList.add('flex');
            }

            updateHUD() {
                const hpBar = document.getElementById('hpBar');
                const hpText = document.getElementById('hpText');
                const exBar = document.getElementById('exBar');
                const exText = document.getElementById('exText');
                const exBtn = document.getElementById('exSlashBtn');
                const scoreVal = document.getElementById('scoreVal');
                const comboVal = document.getElementById('comboVal');

                const hpPercent = Math.max(0, Math.min(100, (this.hp / this.maxHp) * 100));
                hpBar.style.width = `${hpPercent}%`;
                hpText.innerText = `${Math.ceil(hpPercent)}%`;

                exBar.style.width = `${this.ex}%`;
                exText.innerText = `${Math.floor(this.ex)}%`;

                if (this.ex >= 100) {
                    exBtn.removeAttribute('disabled');
                    exBtn.classList.add('border-pink-500', 'text-pink-400', 'shadow-[0_0_20px_rgba(255,0,128,0.5)]');
                } else {
                    exBtn.setAttribute('disabled', 'true');
                    exBtn.classList.remove('border-pink-500', 'text-pink-400', 'shadow-[0_0_20px_rgba(255,0,128,0.5)]');
                }

                scoreVal.innerText = String(this.score).padStart(6, '0');
                comboVal.innerText = this.combo;

                const comboCont = document.getElementById('comboContainer');
                comboCont.style.transform = 'scale(1.25)';
                setTimeout(() => { comboCont.style.transform = 'scale(1.0)'; }, 100);
            }

            /* ========================================================
               3. 斬撃レイキャスト判定 (Z軸レンジ拡張)
               ======================================================== */
            executeSlash(p1, p2) {
                this.audio.playSlash();
                this.swingKatana(p1, p2);

                const raycaster = new THREE.Raycaster();
                const midX = ((p1.x + p2.x) * 0.5 / window.innerWidth) * 2 - 1;
                const midY = -((p1.y + p2.y) * 0.5 / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera({ x: midX, y: midY }, this.camera);

                let hitCount = 0;

                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const enemy = this.enemies[i];
                    const screenPos = enemy.mesh.position.clone().project(this.camera);
                    const ex = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
                    const ey = (-(screenPos.y * 0.5) + 0.5) * window.innerHeight;

                    const distToLine = this.pointToSegmentDistance(ex, ey, p1.x, p1.y, p2.x, p2.y);
                    const hitRadius = (window.innerHeight * 0.18) / Math.max(0.6, enemy.mesh.position.z + 2.0);

                    // 改善案1: Z軸判定レンジを遠方(-6.0)から手前手前(3.8)まで大幅に拡張
                    if (distToLine < hitRadius && enemy.mesh.position.z > -6.0 && enemy.mesh.position.z < 3.8) {
                        this.sliceEnemy(enemy, i, p1, p2);
                        hitCount++;
                    }
                }

                if (hitCount > 0) {
                    this.audio.playHit();
                    this.hitStopFrames = 5;
                    this.cameraShake = 0.16;
                    this.combo += hitCount;
                    if (this.combo > this.maxCombo) this.maxCombo = this.combo;
                    this.score += hitCount * 250 * Math.min(this.combo, 15);
                    this.ex = Math.min(100, this.ex + hitCount * 14);
                    this.triggerCritFlash();
                    this.updateHUD();
                }
            }

            pointToSegmentDistance(px, py, x1, y1, x2, y2) {
                const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
                if (l2 === 0) return Math.hypot(px - x1, py - y1);
                let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
                t = Math.max(0, Math.min(1, t));
                return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
            }

            swingKatana(p1, p2) {
                const dx = (p2.x - p1.x) / window.innerWidth;
                const dy = (p2.y - p1.y) / window.innerHeight;
                this.katanaGroup.position.set(0.1 + dx * 0.8, -0.2 - dy * 0.5, -0.7);
                this.katanaGroup.rotation.set(-0.6 + dy * 2.0, 0.2 + dx * 2.5, -0.6);
            }

            triggerCritFlash() {
                const crit = document.getElementById('critOverlay');
                crit.classList.remove('flash-crit');
                void crit.offsetWidth;
                crit.classList.add('flash-crit');
            }

            triggerDamageFlash() {
                const dmg = document.getElementById('damageOverlay');
                dmg.classList.remove('flash-hit');
                void dmg.offsetWidth;
                dmg.classList.add('flash-hit');
            }

            /* ========================================================
               4. 敵の切断 & パーティクル生成
               ======================================================== */
            sliceEnemy(enemy, index, p1, p2) {
                const mesh = enemy.mesh;
                const pos = mesh.position.clone();
                this.scene.remove(mesh);
                this.enemies.splice(index, 1);
                this.kills++;

                const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
                const size = enemy.type === 'heavy' ? 0.7 : 0.45;
                const halfGeo = new THREE.BoxGeometry(size, size * 0.5, size);
                const matCut = new THREE.MeshStandardMaterial({
                    color: enemy.color,
                    emissive: 0x00f0ff,
                    emissiveIntensity: 0.6,
                    metalness: 0.8,
                    roughness: 0.2
                });

                const pA = new THREE.Mesh(halfGeo, matCut);
                pA.position.copy(pos);
                pA.position.y += 0.15;
                this.scene.add(pA);
                this.debris.push({
                    mesh: pA,
                    vx: -Math.cos(angle) * 0.08 - 0.04,
                    vy: 0.08 + Math.random() * 0.05,
                    vz: 0.02,
                    rx: Math.random() * 0.2,
                    ry: Math.random() * 0.2,
                    life: 1.0
                });

                const pB = new THREE.Mesh(halfGeo, matCut);
                pB.position.copy(pos);
                pB.position.y -= 0.15;
                this.scene.add(pB);
                this.debris.push({
                    mesh: pB,
                    vx: Math.cos(angle) * 0.08 + 0.04,
                    vy: 0.04 - Math.random() * 0.05,
                    vz: 0.02,
                    rx: -Math.random() * 0.2,
                    ry: -Math.random() * 0.2,
                    life: 1.0
                });

                for (let k = 0; k < 18; k++) {
                    const spd = Math.random() * 0.22 + 0.05;
                    const spAngle = Math.random() * Math.PI * 2;
                    this.particles.push({
                        x: pos.x,
                        y: pos.y,
                        z: pos.z,
                        vx: Math.cos(spAngle) * spd,
                        vy: Math.sin(spAngle) * spd,
                        vz: (Math.random() - 0.5) * spd,
                        color: Math.random() > 0.4 ? '#00f0ff' : '#ff0055',
                        size: Math.random() * 4 + 2,
                        life: 1.0
                    });
                }
            }

            /* ========================================================
               5. 必殺一閃 [EX SLASHER]
               ======================================================== */
            triggerExSlash() {
                if (this.ex < 100 || this.state !== 'PLAYING') return;
                this.ex = 0;
                this.audio.playSpecialSlash();
                this.hitStopFrames = 18;
                this.cameraShake = 0.35;
                this.triggerCritFlash();

                const enemyCount = this.enemies.length;
                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const enemy = this.enemies[i];
                    this.sliceEnemy(enemy, i, { x: 0, y: window.innerHeight * 0.5 }, { x: window.innerWidth, y: window.innerHeight * 0.5 });
                }

                this.combo += Math.max(1, enemyCount);
                if (this.combo > this.maxCombo) this.maxCombo = this.combo;
                this.score += 5000 + enemyCount * 1000;
                this.updateHUD();
            }

            /* ========================================================
               6. 敵の出現管理
               ======================================================== */
            spawnEnemy() {
                const types = ['drone', 'ninja', 'heavy'];
                const type = types[Math.floor(Math.random() * (this.score > 4000 ? 3 : 2))];

                let geo, color;
                if (type === 'drone') {
                    geo = new THREE.OctahedronGeometry(0.42);
                    color = 0xff0055;
                } else if (type === 'ninja') {
                    geo = new THREE.ConeGeometry(0.35, 0.9, 5);
                    color = 0xbf00ff;
                } else {
                    geo = new THREE.DodecahedronGeometry(0.65);
                    color = 0xff3b00;
                }

                const mat = new THREE.MeshStandardMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.65,
                    roughness: 0.3,
                    metalness: 0.8
                });

                const mesh = new THREE.Mesh(geo, mat);
                const spreadX = (Math.random() - 0.5) * 3.4;
                const spreadY = Math.random() * 1.8 + 0.4;
                mesh.position.set(spreadX, spreadY, -16);

                this.scene.add(mesh);

                this.enemies.push({
                    mesh,
                    type,
                    color,
                    speed: type === 'ninja' ? 0.085 : (type === 'drone' ? 0.065 : 0.045),
                    sineOff: Math.random() * Math.PI * 2,
                    attackSign: false
                });
            }

            /* ========================================================
               7. メインゲームループ
               ======================================================== */
            animate(time) {
                requestAnimationFrame(this.animate);

                if (this.hitStopFrames > 0) {
                    this.hitStopFrames--;
                    this.renderTrailCanvas();
                    return;
                }

                const delta = 0.016;

                if (this.state === 'PLAYING') {
                    this.spawnTimer += delta;
                    const spawnInterval = Math.max(0.6, 1.7 - (this.score / 15000) * 0.9);
                    if (this.spawnTimer > spawnInterval) {
                        this.spawnTimer = 0;
                        this.spawnEnemy();
                    }

                    for (let i = this.enemies.length - 1; i >= 0; i--) {
                        const enemy = this.enemies[i];
                        const m = enemy.mesh;

                        m.position.z += enemy.speed;

                        if (enemy.type === 'ninja') {
                            m.position.x += Math.sin(time * 0.005 + enemy.sineOff) * 0.02;
                            m.rotation.y += 0.08;
                        } else {
                            m.rotation.x += 0.03;
                            m.rotation.y += 0.04;
                        }

                        if (m.position.z > -1.0 && !enemy.attackSign) {
                            enemy.attackSign = true;
                            m.material.emissiveIntensity = 1.4;
                        }

                        // 被弾判定
                        if (m.position.z >= 4.0) {
                            this.scene.remove(m);
                            this.enemies.splice(i, 1);
                            this.hp -= (enemy.type === 'heavy' ? 32 : 18);
                            this.combo = 0;
                            this.audio.playDamage();
                            this.triggerDamageFlash();
                            this.cameraShake = 0.22;
                            this.updateHUD();

                            if (this.hp <= 0) {
                                this.triggerGameOver();
                                break;
                            }
                        }
                    }

                    for (let i = this.debris.length - 1; i >= 0; i--) {
                        const d = this.debris[i];
                        d.mesh.position.x += d.vx;
                        d.mesh.position.y += d.vy;
                        d.mesh.position.z += d.vz;
                        d.vy -= 0.004;
                        d.mesh.rotation.x += d.rx;
                        d.mesh.rotation.y += d.ry;
                        d.life -= 0.02;
                        d.mesh.scale.multiplyScalar(0.98);

                        if (d.life <= 0) {
                            this.scene.remove(d.mesh);
                            this.debris.splice(i, 1);
                        }
                    }

                    this.grid.position.z = (this.grid.position.z + 0.04) % 1.5;
                }

                this.katanaGroup.position.lerp(this.katanaRestPos, 0.12);
                this.katanaGroup.rotation.x += (this.katanaRestRot.x - this.katanaGroup.rotation.x) * 0.12;
                this.katanaGroup.rotation.y += (this.katanaRestRot.y - this.katanaGroup.rotation.y) * 0.12;
                this.katanaGroup.rotation.z += (this.katanaRestRot.z - this.katanaGroup.rotation.z) * 0.12;

                if (this.cameraShake > 0.001) {
                    this.camera.position.x = this.baseCamPos.x + (Math.random() - 0.5) * this.cameraShake;
                    this.camera.position.y = this.baseCamPos.y + (Math.random() - 0.5) * this.cameraShake;
                    this.cameraShake *= 0.88;
                } else {
                    this.camera.position.copy(this.baseCamPos);
                }

                this.renderer.render(this.scene, this.camera);
                this.renderTrailCanvas();
            }

            /* ========================================================
               8. 斬撃軌跡 & パーティクル描画
               ======================================================== */
            renderTrailCanvas() {
                const ctx = this.trailCtx;
                ctx.clearRect(0, 0, this.trailCanvas.width, this.trailCanvas.height);

                const now = performance.now();
                this.strokePoints = this.strokePoints.filter(p => now - p.time < 120);

                if (this.strokePoints.length >= 2) {
                    ctx.save();
                    ctx.shadowBlur = 18;
                    ctx.shadowColor = '#00f0ff';
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    ctx.strokeStyle = 'rgba(0, 240, 255, 0.75)';
                    ctx.lineWidth = 8;
                    ctx.beginPath();
                    ctx.moveTo(this.strokePoints[0].x, this.strokePoints[0].y);
                    for (let i = 1; i < this.strokePoints.length; i++) {
                        ctx.lineTo(this.strokePoints[i].x, this.strokePoints[i].y);
                    }
                    ctx.stroke();

                    ctx.shadowBlur = 4;
                    ctx.shadowColor = '#ffffff';
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    ctx.restore();
                }

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.z += p.vz;
                    p.life -= 0.035;

                    const screenPos = new THREE.Vector3(p.x, p.y, p.z).project(this.camera);
                    const sx = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
                    const sy = (-(screenPos.y * 0.5) + 0.5) * window.innerHeight;

                    if (screenPos.z < 1.0 && p.life > 0) {
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = Math.max(0, p.life);
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = p.color;
                        ctx.beginPath();
                        ctx.arc(sx, sy, p.size * p.life, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.globalAlpha = 1.0;
                    }

                    if (p.life <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new BladeZeroGame();
        });
    </script>
