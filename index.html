<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON RUSH - HYPER ACTION</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #05050a;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 854px;
            background: linear-gradient(135deg, #0b091a 0%, #1a0b2e 100%);
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.2);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Layers */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }

        .interactive {
            pointer-events: auto;
        }

        /* HUD */
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .score-board {
            text-align: left;
        }

        .score-label {
            font-size: 10px;
            letter-spacing: 2px;
            color: #00ffcc;
            text-transform: uppercase;
        }

        .score-value {
            font-size: 32px;
            font-weight: 900;
            font-family: monospace;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .combo-badge {
            background: rgba(255, 0, 128, 0.2);
            border: 2px solid #ff0080;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            color: #ff0080;
            text-shadow: 0 0 8px #ff0080;
            transform: scale(1);
            transition: transform 0.1s;
        }

        .combo-badge.pulse {
            transform: scale(1.3);
        }

        /* Fever Gauge */
        .fever-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
            position: relative;
        }

        .fever-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff0080, #ffcc00);
            box-shadow: 0 0 10px #ff0080;
            transition: width 0.1s linear;
        }

        /* Screens (Start / Gameover) */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .game-title {
            font-size: 48px;
            font-weight: 900;
            font-style: italic;
            text-align: center;
            background: linear-gradient(180deg, #fff 0%, #00ffcc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 255, 204, 0.6);
            margin-bottom: 5px;
            letter-spacing: -1px;
        }

        .game-subtitle {
            font-size: 12px;
            letter-spacing: 6px;
            color: #ff0080;
            margin-bottom: 40px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn {
            background: linear-gradient(135deg, #00ffcc 0%, #0088ff 100%);
            color: #05050a;
            border: none;
            padding: 18px 48px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.8);
        }

        .instructions {
            margin-top: 30px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            line-height: 1.6;
        }

        .instructions span {
            color: #00ffcc;
            font-weight: bold;
        }

        /* Game Over Specific */
        .gameover-stats {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 40px;
            border-radius: 16px;
            margin-bottom: 30px;
            text-align: center;
        }

        .gameover-stats .label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        .gameover-stats .val {
            font-size: 36px;
            font-weight: 900;
            color: #ff0080;
            font-family: monospace;
            text-shadow: 0 0 10px rgba(255, 0, 128, 0.5);
        }

        /* Flash overlay for damage/fever */
        #flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.1s;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas for Game Graphics -->
        <canvas id="gameCanvas"></canvas>

        <!-- Flash Effect Layer -->
        <div id="flash-overlay"></div>

        <!-- UI Layer -->
        <div class="ui-layer">
            <div class="hud-top">
                <div class="score-board">
                    <div class="score-label">SCORE</div>
                    <div class="score-value" id="current-score">000000</div>
                    <div class="fever-container">
                        <div class="fever-fill" id="fever-fill"></div>
                    </div>
                </div>
                <div class="combo-badge" id="combo-badge" style="display: none;">
                    <span id="combo-count">0</span> COMBO
                </div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <div class="game-title">NEON<br>RUSH</div>
            <div class="game-subtitle">Hyper Dopamine Action</div>
            <button class="btn interactive" id="start-btn">PLAY NOW</button>
            <div class="instructions">
                TAP to <span>JUMP / REVERSE</span><br>
                Collect Orbs &bull; Dodge Spikes &bull; Enter Fever
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="screen hidden">
            <div class="game-title" style="font-size: 36px; margin-bottom: 20px; color: #ff0080; -webkit-text-fill-color: #ff0080;">GAME OVER</div>
            <div class="gameover-stats">
                <div class="label">FINAL SCORE</div>
                <div class="val" id="final-score">000000</div>
            </div>
            <button class="btn interactive" id="restart-btn">RETRY</button>
        </div>
    </div>

    <script>
        // --- SOUND SYSTEM (Web Audio API) ---
        class SoundManager {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playTone(freq, type, duration, vol = 0.08, slideTo = null, fadeOut = true) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const t = this.ctx.currentTime;
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, t);
                    if (slideTo) {
                        osc.frequency.exponentialRampToValueAtTime(Math.max(10, slideTo), t + duration);
                    }
                    gain.gain.setValueAtTime(vol, t);
                    if (fadeOut) {
                        gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
                    } else {
                        gain.gain.linearRampToValueAtTime(0, t + duration);
                    }
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + duration);
                } catch(e) {}
            }
            jump() {
                this.playTone(320, 'sine', 0.12, 0.08, 580);
                this.playTone(160, 'triangle', 0.08, 0.04, 300);
            }
            score() {
                this.playTone(784, 'sine', 0.08, 0.06, 1174);
            }
            hit() {
                this.playTone(140, 'sawtooth', 0.25, 0.15, 30);
            }
            fever() {
                if (!this.ctx) return;
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'sine', 0.12, 0.08), i * 50);
                });
            }
        }

        const sound = new SoundManager();

        // --- GAME CONFIG & STATE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let baseScale = 1; // 解像度相対化のためのスケール基準値
        function resize() {
            width = canvas.parentElement.clientWidth;
            height = canvas.parentElement.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            // 基準高さ（800px）に対するスケール比率を算出
            baseScale = height / 800;
        }
        window.addEventListener('resize', resize);
        resize();

        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let combo = 0;
        let comboTimer = 0;
        let feverGauge = 0;
        let isFever = false;
        let feverTimer = 0;
        let screenShake = 0;
        let hitStop = 0;

        // 速度スムーズ遷移＆入力先行入力用変数
        let currentSpeed = 300 * baseScale;
        let jumpBufferTimer = 0;
        let lastInputTime = 0;

        // --- OBJECT POOL SYSTEM (Zero-GC) ---
        class ObjectPool {
            constructor(createFn, initialSize = 40) {
                this.createFn = createFn;
                this.pool = [];
                for (let i = 0; i < initialSize; i++) {
                    const obj = this.createFn();
                    obj.active = false;
                    this.pool.push(obj);
                }
            }
            get() {
                let obj = null;
                for (let i = 0; i < this.pool.length; i++) {
                    if (!this.pool[i].active) {
                        obj = this.pool[i];
                        break;
                    }
                }
                if (!obj) {
                    obj = this.createFn();
                    this.pool.push(obj);
                }
                obj.active = true;
                return obj;
            }
            clear() {
                for (let i = 0; i < this.pool.length; i++) {
                    this.pool[i].active = false;
                }
            }
            forEachActive(fn) {
                for (let i = 0; i < this.pool.length; i++) {
                    if (this.pool[i].active) fn(this.pool[i]);
                }
            }
        }

        // --- GAME OBJECTS ---
        class Player {
            constructor() {
                this.baseSize = 24;
                this.baseGravity = 0.75;
                this.baseJumpForce = 11.5;
                this.trail = [];
                this.reset();
            }

            get size() { return this.baseSize * baseScale; }

            reset() {
                this.x = Math.max(60, width * 0.18);
                this.y = height / 2;
                this.prevX = this.x;
                this.prevY = this.y;
                this.vy = 0;
                this.gravityDir = 1; // 1: down, -1: up
                this.rotation = 0;
                this.prevRotation = 0;
                this.trail.length = 0;
                for (let i = 0; i < 10; i++) {
                    this.trail.push({ x: this.x, y: this.y });
                }
            }

            update(dtFixed) {
                this.prevX = this.x;
                this.prevY = this.y;
                this.prevRotation = this.rotation;

                // 重力計算とイージングの効いたスムーズな加速
                const gravity = this.baseGravity * baseScale * 3500;
                this.vy += gravity * this.gravityDir * dtFixed;
                
                // ターミナルベロシティのクランプ
                const maxTerminalVel = 850 * baseScale;
                if (Math.abs(this.vy) > maxTerminalVel) {
                    this.vy = Math.sign(this.vy) * maxTerminalVel;
                }

                this.y += this.vy * dtFixed;

                // 画面上下境界の吸い付くようなクッション運動（ソフトダンパー）
                const margin = this.size * 0.55;
                const cushionRange = 25 * baseScale;

                if (this.gravityDir === -1 && this.y < margin + cushionRange) {
                    const depth = Math.max(0, (margin + cushionRange - this.y) / cushionRange);
                    this.vy += depth * 1400 * baseScale * dtFixed;
                } else if (this.gravityDir === 1 && this.y > height - margin - cushionRange) {
                    const depth = Math.max(0, (this.y - (height - margin - cushionRange)) / cushionRange);
                    this.vy -= depth * 1400 * baseScale * dtFixed;
                }

                if (this.y < margin) {
                    this.y = margin;
                    if (this.vy < 0) this.vy *= -0.15; // ソフトなクッション反発
                } else if (this.y > height - margin) {
                    this.y = height - margin;
                    if (this.vy > 0) this.vy *= -0.15;
                }

                this.rotation += 7.5 * this.gravityDir * dtFixed;

                // Trail
                const lastTrail = this.trail.shift();
                lastTrail.x = this.x;
                lastTrail.y = this.y;
                this.trail.push(lastTrail);
            }

            jump() {
                this.gravityDir *= -1;
                const targetVelocity = this.baseJumpForce * baseScale * 60;
                // 微少な慣性イージングを付与した滑らかな初速切替
                this.vy = -this.gravityDir * targetVelocity + (this.vy * 0.15);
                sound.jump();

                for (let i = 0; i < 8; i++) {
                    spawnParticle(this.x, this.y, '#00ffcc', true);
                }
            }

            // SAT用頂点算出（指定座標・角度対応）
            getVerticesAt(x, y, rotation, scaleFactor = 1.0) {
                const s = this.size * scaleFactor * 0.5;
                const c = s * 0.35;
                const cos = Math.cos(rotation);
                const sin = Math.sin(rotation);
                
                const localVerts = [
                    { x: -s + c, y: -s }, { x: s - c, y: -s },
                    { x: s, y: -s + c }, { x: s, y: s - c },
                    { x: s - c, y: s }, { x: -s + c, y: s },
                    { x: -s, y: s - c }, { x: -s, y: -s + c }
                ];
                
                return localVerts.map(v => ({
                    x: x + (v.x * cos - v.y * sin),
                    y: y + (v.x * sin + v.y * cos)
                }));
            }

            getVertices(scaleFactor = 1.0) {
                return this.getVerticesAt(this.x, this.y, this.rotation, scaleFactor);
            }

            draw(alpha = 1.0) {
                const drawX = this.prevX + (this.x - this.prevX) * alpha;
                const drawY = this.prevY + (this.y - this.prevY) * alpha;
                const drawRot = this.prevRotation + (this.rotation - this.prevRotation) * alpha;
                const curSize = this.size;

                // Draw trail
                for (let i = 0; i < this.trail.length; i++) {
                    let trailAlpha = (i + 1) / this.trail.length;
                    let t = this.trail[i];
                    ctx.fillStyle = isFever ? `rgba(255, 0, 128, ${trailAlpha * 0.3})` : `rgba(0, 255, 204, ${trailAlpha * 0.22})`;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, curSize * 0.65 * trailAlpha, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(drawRot);

                ctx.shadowBlur = isFever ? 20 : 12;
                ctx.shadowColor = isFever ? '#ff0080' : '#00ffcc';
                ctx.fillStyle = isFever ? '#ff0080' : '#00ffcc';
                ctx.fillRect(-curSize / 2, -curSize / 2, curSize, curSize);

                ctx.fillStyle = '#fff';
                ctx.fillRect(-curSize / 4, -curSize / 4, curSize / 2, curSize / 2);

                ctx.restore();
            }
        }

        class Particle {
            constructor() {
                this.active = false;
            }
            init(x, y, color, burst = false) {
                this.x = x;
                this.y = y;
                this.prevX = x;
                this.prevY = y;
                this.color = color;
                const angle = burst ? Math.random() * Math.PI * 2 : (Math.random() - 0.5) * 0.5;
                const speed = (burst ? Math.random() * 320 + 100 : Math.random() * 160 + 50) * baseScale;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.size = (Math.random() * 3.5 + 1.8) * baseScale;
                this.life = 1.0;
                this.decay = Math.random() * 1.6 + 1.2;
            }
            update(dtFixed) {
                this.prevX = this.x;
                this.prevY = this.y;
                this.x += this.vx * dtFixed;
                this.y += this.vy * dtFixed;
                this.life -= this.decay * dtFixed;
                if (this.life <= 0) this.active = false;
            }
            draw(alpha = 1.0) {
                const drawX = this.prevX + (this.x - this.prevX) * alpha;
                const drawY = this.prevY + (this.y - this.prevY) * alpha;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color;
                ctx.fillRect(drawX, drawY, this.size, this.size);
                ctx.restore();
            }
        }

        class Obstacle {
            constructor() {
                this.active = false;
            }
            init() {
                this.x = width + 60 * baseScale;
                this.prevX = this.x;
                this.w = 32 * baseScale;
                this.topH = Math.random() * (height * 0.38) + 50 * baseScale;
                this.gap = (isFever ? 230 : 165) * baseScale;
                this.bottomH = height - (this.topH + this.gap);
                this.passed = false;
                this.nearMissedTop = false;
                this.nearMissedBottom = false;
                this.color = '#ff3366';
            }
            update(speed, dtFixed) {
                this.prevX = this.x;
                this.x -= speed * dtFixed;
                if (this.x < -100 * baseScale) {
                    this.active = false;
                }
            }
            getTopAABB(currX = this.x) {
                return { x: currX, y: 0, w: this.w, h: this.topH };
            }
            getBottomAABB(currX = this.x) {
                return { x: currX, y: height - this.bottomH, w: this.w, h: this.bottomH };
            }
            draw(alpha = 1.0) {
                const drawX = this.prevX + (this.x - this.prevX) * alpha;
                ctx.save();
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;

                ctx.fillRect(drawX, 0, this.w, this.topH);
                ctx.fillRect(drawX, height - this.bottomH, this.w, this.bottomH);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(drawX, 0, this.w, this.topH);
                ctx.strokeRect(drawX, height - this.bottomH, this.w, this.bottomH);

                ctx.restore();
            }
        }

        class Collectible {
            constructor() {
                this.active = false;
            }
            init(obs) {
                this.x = obs.x + obs.w / 2;
                this.prevX = this.x;
                this.y = obs.topH + (obs.gap / 2);
                this.prevY = this.y;
                this.size = 14 * baseScale;
                this.collected = false;
                this.angle = 0;
                this.prevAngle = 0;
            }
            update(speed, dtFixed) {
                this.prevX = this.x;
                this.prevY = this.y;
                this.prevAngle = this.angle;
                this.x -= speed * dtFixed;
                this.angle += 6.0 * dtFixed;
                if (this.x < -100 * baseScale || this.collected) {
                    this.active = false;
                }
            }
            draw(alpha = 1.0) {
                if (this.collected) return;
                const drawX = this.prevX + (this.x - this.prevX) * alpha;
                const drawY = this.prevY + (this.y - this.prevY) * alpha;
                const drawAngle = this.prevAngle + (this.angle - this.prevAngle) * alpha;

                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(drawAngle);
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ffcc00';
                ctx.fillStyle = '#ffcc00';
                
                ctx.beginPath();
                ctx.moveTo(0, -this.size);
                ctx.lineTo(this.size, 0);
                ctx.lineTo(0, this.size);
                ctx.lineTo(-this.size, 0);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        class FloatingText {
            constructor() {
                this.active = false;
            }
            init(x, y, text, color = '#00ffcc') {
                this.x = x;
                this.y = y;
                this.prevX = x;
                this.prevY = y;
                this.text = text;
                this.color = color;
                this.life = 1.0;
                this.vy = -35 * baseScale;
            }
            update(dtFixed) {
                this.prevX = this.x;
                this.prevY = this.y;
                this.y += this.vy * dtFixed;
                this.life -= 1.4 * dtFixed;
                if (this.life <= 0) this.active = false;
            }
            draw(alpha = 1.0) {
                const drawX = this.prevX + (this.x - this.prevX) * alpha;
                const drawY = this.prevY + (this.y - this.prevY) * alpha;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.font = `900 ${Math.floor(13 * baseScale)}px sans-serif`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fillText(this.text, drawX, drawY);
                ctx.restore();
            }
        }

        // --- SEPARATING AXIS THEOREM (SAT) OBB COLLISION & NEAR MISS ---
        function getAABBVertices(box) {
            return [
                { x: box.x, y: box.y },
                { x: box.x + box.w, y: box.y },
                { x: box.x + box.w, y: box.y + box.h },
                { x: box.x, y: box.y + box.h }
            ];
        }

        function projectPolygon(vertices, axis) {
            let min = Infinity, max = -Infinity;
            for (let i = 0; i < vertices.length; i++) {
                const dot = vertices[i].x * axis.x + vertices[i].y * axis.y;
                if (dot < min) min = dot;
                if (dot > max) max = dot;
            }
            return { min, max };
        }

        function checkSATCollision(poly1, poly2) {
            const polys = [poly1, poly2];
            for (let i = 0; i < polys.length; i++) {
                const poly = polys[i];
                for (let j = 0; j < poly.length; j++) {
                    const p1 = poly[j];
                    const p2 = poly[(j + 1) % poly.length];
                    const normal = { x: -(p2.y - p1.y), y: p2.x - p1.x };
                    const len = Math.hypot(normal.x, normal.y);
                    if (len === 0) continue;
                    normal.x /= len;
                    normal.y /= len;

                    const proj1 = projectPolygon(poly1, normal);
                    const proj2 = projectPolygon(poly2, normal);

                    if (proj1.max <= proj2.min || proj2.max <= proj1.min) {
                        return false;
                    }
                }
            }
            return true;
        }

        // --- POOL INSTANTIATION ---
        const particlePool = new ObjectPool(() => new Particle(), 120);
        const obstaclePool = new ObjectPool(() => new Obstacle(), 15);
        const collectiblePool = new ObjectPool(() => new Collectible(), 15);
        const textPool = new ObjectPool(() => new FloatingText(), 10);

        function spawnParticle(x, y, color, burst = false) {
            const p = particlePool.get();
            p.init(x, y, color, burst);
        }

        function spawnText(x, y, text, color) {
            const t = textPool.get();
            t.init(x, y, text, color);
        }

        // --- INITIALIZATION ---
        const player = new Player();
        let spawnTimer = 0;

        // --- CONTROLS ---
        function triggerAction(e) {
            if (e.target.closest && e.target.closest('.interactive')) return;
            
            if (e.type === 'touchstart' || e.type === 'pointerdown') {
                if (e.cancelable && !e.target.closest('.interactive')) {
                    e.preventDefault();
                }
            }

            // マルチタッチや連打時の過剰な重力反転を防ぐ入力制限（クールダウン）
            const now = performance.now();
            if (now - lastInputTime < 80) return;
            lastInputTime = now;

            if (gameState === 'PLAYING') {
                jumpBufferTimer = 0.15;
            }
        }

        window.addEventListener('pointerdown', triggerAction, { passive: false });
        window.addEventListener('touchstart', triggerAction, { passive: false });
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (e.repeat) return;
                const now = performance.now();
                if (now - lastInputTime < 80) return;
                lastInputTime = now;
                if (gameState === 'PLAYING') {
                    jumpBufferTimer = 0.15;
                }
            }
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            sound.init();
            startGame();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            sound.init();
            startGame();
        });

        function startGame() {
            gameState = 'PLAYING';
            score = 0;
            combo = 0;
            feverGauge = 0;
            isFever = false;
            feverTimer = 0;
            jumpBufferTimer = 0;
            currentSpeed = 300 * baseScale;
            spawnTimer = 0;

            particlePool.clear();
            obstaclePool.clear();
            collectiblePool.clear();
            textPool.clear();

            player.reset();

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('combo-badge').style.display = 'none';
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            sound.hit();
            screenShake = 30;
            hitStop = 20;

            const flash = document.getElementById('flash-overlay');
            flash.style.background = 'rgba(255, 0, 50, 0.5)';
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 200);

            document.getElementById('final-score').innerText = String(Math.floor(score)).padStart(6, '0');
            document.getElementById('gameover-screen').classList.remove('hidden');
        }

        // --- FIXED TIMESTEP & INTERPOLATION GAME LOOP ---
        const FIXED_DT = 1 / 60;
        let accumulator = 0;
        let lastTime = performance.now();

        function updateGamePhysics(dtFixed) {
            if (jumpBufferTimer > 0) {
                jumpBufferTimer -= dtFixed;
                player.jump();
                jumpBufferTimer = 0;
            }

            let targetSpeed = (isFever ? 540 : 320) * baseScale;
            currentSpeed += (targetSpeed - currentSpeed) * (1 - Math.exp(-9.0 * dtFixed));

            if (isFever) {
                feverTimer -= dtFixed;
                feverGauge = Math.max(0, (feverTimer / 5.0) * 100);
                if (feverTimer <= 0) {
                    isFever = false;
                }
            }

            spawnTimer += dtFixed;
            if (spawnTimer >= (isFever ? 0.75 : 1.25)) {
                spawnTimer = 0;
                const obs = obstaclePool.get();
                obs.init();
                const col = collectiblePool.get();
                col.init(obs);
            }

            // 高速移動時にも破綻しない動的スケーリング・精密Hitbox判定
            const speedFactor = Math.min(1.25, currentSpeed / (320 * baseScale));
            const playerHitVerts = player.getVertices(0.74); 
            const playerNearVerts = player.getVertices(1.15 * speedFactor); 

            obstaclePool.forEachActive(obs => {
                obs.update(currentSpeed, dtFixed);

                if (!obs.passed && obs.x + obs.w < player.x) {
                    obs.passed = true;
                    score += isFever ? 200 : 100;
                    sound.score();
                }

                const topAABB = obs.getTopAABB();
                const bottomAABB = obs.getBottomAABB();
                const topVerts = getAABBVertices(topAABB);
                const bottomVerts = getAABBVertices(bottomAABB);

                if (checkSATCollision(playerHitVerts, topVerts) || checkSATCollision(playerHitVerts, bottomVerts)) {
                    gameOver();
                    return;
                }

                if (!obs.nearMissedTop && checkSATCollision(playerNearVerts, topVerts)) {
                    obs.nearMissedTop = true;
                    score += 150;
                    spawnText(player.x, player.y - 20, 'NEAR MISS!', '#00ffcc');
                    sound.score();
                }
                if (!obs.nearMissedBottom && checkSATCollision(playerNearVerts, bottomVerts)) {
                    obs.nearMissedBottom = true;
                    score += 150;
                    spawnText(player.x, player.y + 20, 'NEAR MISS!', '#00ffcc');
                    sound.score();
                }
            });

            collectiblePool.forEachActive(col => {
                col.update(currentSpeed, dtFixed);

                const dist = Math.hypot(player.x - col.x, player.y - col.y);
                if (!col.collected && dist < (player.size * 0.5 + col.size)) {
                    col.collected = true;
                    score += 500;
                    combo++;
                    comboTimer = 3.0;
                    sound.score();

                    const comboBadge = document.getElementById('combo-badge');
                    document.getElementById('combo-count').innerText = combo;
                    comboBadge.style.display = 'block';
                    comboBadge.classList.add('pulse');
                    setTimeout(() => comboBadge.classList.remove('pulse'), 100);

                    if (!isFever) {
                        feverGauge += 15;
                        if (feverGauge >= 100) {
                            isFever = true;
                            feverTimer = 5.0;
                            feverGauge = 100;
                            sound.fever();
                            screenShake = 15;
                        }
                    }

                    for (let p = 0; p < 12; p++) {
                        spawnParticle(col.x, col.y, '#ffcc00', true);
                    }
                }
            });

            if (combo > 0) {
                comboTimer -= dtFixed;
                if (comboTimer <= 0) {
                    combo = 0;
                    document.getElementById('combo-badge').style.display = 'none';
                }
            }

            textPool.forEachActive(t => t.update(dtFixed));
            player.update(dtFixed);
            score += (isFever ? 120 : 60) * dtFixed;
        }

        function renderGame(alpha) {
            ctx.save();

            if (screenShake > 0) {
                let offsetX = (Math.random() - 0.5) * screenShake * baseScale;
                let offsetY = (Math.random() - 0.5) * screenShake * baseScale;
                ctx.translate(offsetX, offsetY);
                screenShake *= 0.88;
                if (screenShake < 0.1) screenShake = 0;
            }

            ctx.fillStyle = isFever ? 'rgba(26, 11, 46, 0.35)' : 'rgba(11, 9, 26, 0.35)';
            ctx.fillRect(-30, -30, width + 60, height + 60);

            obstaclePool.forEachActive(obs => obs.draw(alpha));
            collectiblePool.forEachActive(col => col.draw(alpha));
            particlePool.forEachActive(p => p.draw(alpha));
            textPool.forEachActive(t => t.draw(alpha));

            if (gameState === 'PLAYING') {
                player.draw(alpha);
            }

            ctx.restore();
        }

        function updateUI() {
            document.getElementById('current-score').innerText = String(Math.floor(score)).padStart(6, '0');
            document.getElementById('fever-fill').style.width = feverGauge + '%';
        }

        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let frameTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            if (frameTime > 0.1) frameTime = 0.1;

            if (hitStop > 0) {
                hitStop--;
                requestAnimationFrame(loop);
                return;
            }

            accumulator += frameTime;

            while (accumulator >= FIXED_DT) {
                if (gameState === 'PLAYING') {
                    updateGamePhysics(FIXED_DT);
                }
                particlePool.forEachActive(p => p.update(FIXED_DT));
                accumulator -= FIXED_DT;
            }

            // 補間係数（alpha）を用いた滑らかな高リフレッシュレート対応レンダリング
            const alpha = accumulator / FIXED_DT;
            renderGame(alpha);
            updateUI();

            requestAnimationFrame(loop);
        }

        // Start initial loop
        requestAnimationFrame(loop);
    </script>
</body>
</html>
