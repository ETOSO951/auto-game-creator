<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG - Gear Stats Visible</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000; --accent: #ffae00; --text: #fff;
            --hp: #00ff41; --mp: #0081ff; --spd: #f1c40f; --border: #444; --gold: #ffd700;
        }
        * { font-family: 'DotGothic16', sans-serif; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; overflow: hidden; }
        #game-container { width: 100%; max-width: 500px; height: 100vh; display: flex; flex-direction: column; border: 2px solid var(--border); position: relative; }
        
        #get-notification {
            display: none; position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
            width: 85%; background: rgba(0,0,0,0.98); border: 2px solid var(--accent);
            padding: 15px; z-index: 2000; text-align: center; box-shadow: 0 0 20px rgba(255,174,0,0.5);
        }

        #top-bar { padding: 10px; border-bottom: 2px solid var(--border); display: flex; justify-content: space-between; background: #111; align-items: center;}
        .btn-state { background: #000; color: #fff; border: 2px solid #fff; padding: 5px 15px; cursor: pointer; font-size: 0.8em;}
        #gold-display { color: var(--gold); font-size: 0.9em; }

        #battle-display { display: none; flex-direction: column; padding: 15px; background: #080808; border-bottom: 2px solid var(--border); }
        .gauge-container { width: 100%; background: #222; height: 8px; border: 1px solid #fff; margin-top: 2px; position: relative; }
        .gauge-bar { height: 100%; transition: width 0.2s; }
        .mp-val { font-size: 0.7em; text-align: right; color: var(--mp); margin-top: 1px; }
        .buff-indicator { font-size: 0.7em; color: var(--accent); margin-top: 2px; min-height: 1.1em; display: flex; gap: 8px; }

        #message-area { flex: 1; padding: 20px; line-height: 1.6; overflow-y: auto; border-bottom: 2px solid var(--border); background: #050505; white-space: pre-wrap; }
        #choices-area { padding: 10px; min-height: 180px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; background: #000; }
        .btn { padding: 10px; background: #000; color: #fff; border: 1px solid #fff; text-align: left; cursor: pointer; font-size: 0.85em; }
        .btn:active { background: #fff; color: #000; }
        .btn:disabled { color: #444; border-color: #444; opacity: 0.6; }

        #status-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; overflow-y: auto; padding: 20px; flex-direction: column; }
        .status-box { border: 2px solid #fff; padding: 15px; margin-bottom: 15px; background: #000; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 0.85em; }
        .equip-slot { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #333; cursor: pointer; align-items: center; }
        .stat-badge { font-size: 0.8em; color: var(--hp); margin-left: 5px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="get-notification" onclick="this.style.display='none'">
        <div id="notif-title" style="color:var(--accent); font-size:1.1em; margin-bottom:8px;">★ MESSAGE ★</div>
        <div id="notif-content" style="font-size:0.9em;"></div>
    </div>

<div id="top-bar">
    <button class="btn-state" onclick="openStatus()">MENU</button>
    <div style="text-align: right;">
        <div id="gold-display">0 G</div>
        <div id="lv-info" style="font-size: 0.75em; color: var(--hp);">Lv.1</div>
        <div id="exp-info" style="font-size: 0.6em; color: #ccc;">NEXT: 50</div>
    </div>
</div>

    
    <div id="battle-display">
        <div class="unit-info">
            <div style="display:flex; justify-content:space-between;"><span id="e-name">---</span><span id="e-hp-num" style="font-size:0.75em;"></span></div>
            <div class="gauge-container"><div id="e-hp-bar" class="gauge-bar" style="background:var(--hp);"></div></div>
            <div id="e-buffs" class="buff-indicator"></div>
        </div>
        <div class="unit-info" style="margin-top:12px;">
            <div style="display:flex; justify-content:space-between;"><span>YOU</span><span id="p-hp-num" style="font-size:0.75em;"></span></div>
            <div class="gauge-container"><div id="p-hp-bar" class="gauge-bar" style="background:var(--hp);"></div></div>
            <div class="gauge-container"><div id="p-mp-bar" class="gauge-bar" style="background:var(--mp);"></div></div>
            <div id="p-mp-num" class="mp-val"></div>
            <div id="p-buffs" class="buff-indicator"></div>
        </div>
    </div>

    <div id="message-area"></div>
    <div id="choices-area"></div>
</div>

<div id="status-modal">
    <div class="status-box">
        <h2 style="margin:0 0 10px 0; border-bottom:1px solid #fff; font-size:1em;">ステータス</h2>
        <div id="full-stats" class="stats-grid"></div>
    </div>
    <div class="status-box">
        <div style="display:flex; gap:5px; margin-bottom:10px;">

        </div>
        <div id="sub-menu-content"></div>
    </div>
    <button class="btn" style="text-align:center;" onclick="closeStatus()">閉じる</button>
</div>

function getStat(k) {
    const m = { hp:'maxHp', atk:'baseAtk', def:'baseDef', spd:'baseSpd', hpr:'baseHpr', mpr:'baseMpr' , mp:'maxMp'};
    let val = player[m[k]] || 0;
    for (let s in player.equipment) if(player.equipment[s]) val += player.equipment[s][k] || 0;
    return val;
}

function getElementRate(skillElem, target, isPlayer) {
    if (!skillElem) return 1.0; 
    
    if (isPlayer) {
        // プレイヤーのデフォルト耐性は1.2とする
        let rate = 1.2;
        
        // 装備品から該当属性の耐性を合算
        // 例: アイテムに { res_fire: 0.2 } があればダメージ20%軽減
        for (let s in player.equipment) {
            const it = player.equipment[s];
            if (it) {
                if (skillElem === "火" && it.res_fire) rate -= it.res_fire;
                if (skillElem === "氷" && it.res_ice) rate -= it.res_ice;
                if (skillElem === "雷" && it.res_bolt) rate -= it.res_bolt;
                if (skillElem === "毒" && it.res_poison) rate -= it.res_poison;
                if (skillElem === "闇" && it.res_dark) rate -= it.res_dark;
                if (skillElem === "光" && it.res_light) rate -= it.res_light;
            }
        }
        // 最低でも-10倍（1000%吸収）までに制限
        return Math.max(-10, rate);
    } else {
        return (target.resistances && target.resistances[skillElem] !== undefined) 
               ? target.resistances[skillElem] : 1.0;
    }
}

function applyCondition(target, condName) {
    if (!target.conditions) target.conditions = [];
    // 既にかかっている場合はターン数を上書き（更新）
    const existing = target.conditions.find(c => c.name === condName);
    if (existing) {
        existing.turns = CONDITION_DB[condName].duration;
        return false; 
    }
    // 新規付与
    target.conditions.push({ 
        name: condName, 
        turns: CONDITION_DB[condName].duration, // ターン数をセット
        ...CONDITION_DB[condName] 
    });
    return true;
}

async function startBattle(data) {
    isBattle = true;
    pBuffs = { atk:0, def:0, spd:0 };

    // ★重要: 連打防止のため、まず選択肢エリアをクリアする
    document.getElementById('choices-area').innerHTML = "";

    // ステータスにばらつきを与える処理
    const v = data.variance || 0;
    const r = () => (1 - v + Math.random() * v * 2);

    currentEnemy = { 
        ...data, 
        maxHp: Math.round(data.hp * r()),
        atk:   Math.round(data.atk * r()),
        def:   Math.round(data.def * r()),
        spd:   Math.round(data.spd * r()),
        intel: Math.round(data.intel * r()),
        exp:   Math.round(data.exp * r()),
        gold:  Math.round(data.gold * r())
    };
    
    currentEnemy.hp = currentEnemy.maxHp;
    currentEnemy.curAtk = currentEnemy.atk;
    currentEnemy.curDef = currentEnemy.def;

    // バトル画面の表示と更新
    document.getElementById('battle-display').style.display = 'flex';
    updateVisualBars(currentEnemy);

    // 素早さ比較で先行を決定
    const pSpd = getStat('spd');
    if (pSpd >= currentEnemy.spd) {
        updateMessage(`あなたの先制攻撃！`);
        isPlayerTurn = true; 
        showBattleMenu(); // 自分のターンの時だけメニューを出す
    } else {
        updateMessage(`${currentEnemy.name}が素早く襲いかかってきた！`);
        isPlayerTurn = false; 
        await new Promise(r => setTimeout(r, 800));
        enemyTurn(); // 敵の攻撃が終わるまでメニューは出ない
    }
}

async function executeSkill(sn) {
    const s = SKILL_DB[sn];
    player.mp -= s.mp;
    document.getElementById('choices-area').innerHTML = "";

    updateMessage(`あなたの ${sn}！`);
    await new Promise(r => setTimeout(r, 500));

    // --- 命中判定 ---
    const acc = s.accuracy !== undefined ? s.accuracy : 1.0;
    if (Math.random() > acc) {
        updateMessage("ミス！ 攻撃は当たらなかった。");
        await new Promise(r => setTimeout(r, 800));
        battleTurnProcess();
        return;
    }

    let pCondAtk = 0;
    if (player.conditions) player.conditions.forEach(c => pCondAtk += (c.atkMod || 0));
    const curAtk = getStat('atk') + (pBuffs.atk || 0) + pCondAtk;
    const eRate = getElementRate(s.element, currentEnemy, false);
    
    // 急所フラグ
    let isCritOccurred = false;

    // ダメージ計算関数
    const calc = (p) => {
        const critRate = s.crit !== undefined ? s.crit : 0.05;
        const isCrit = Math.random() < critRate;
        let dmg = Math.round(p * (curAtk / 10) * (1 - VARIATION + Math.random() * VARIATION * 2));
        
        if (isCrit) {
            isCritOccurred = true; 
            dmg = Math.round(dmg * 1.25 * eRate); // 急所1.25倍
        } else {
            dmg = Math.max(1, Math.round(dmg * eRate) - Math.floor(currentEnemy.curDef / 2));
        }
        return dmg;
    };

    // --- メイン処理 ---
    let log = "";
    if (s.type === "damage") {
        let d = calc(s.power);
        currentEnemy.hp = Math.max(0, currentEnemy.hp - d);
        if(isCritOccurred) log += "★会心の一撃！ ";
        log += `${currentEnemy.name}に ${d} ダメージ！`;
    } 
    else if (s.type === "burst" || s.type === "multi") {
        let total = 0, hits = 0;
        let maxHits = s.type === "burst" ? (s.times || 2) : 10;
        for(let i=0; i < maxHits; i++) {
            if(s.type === "multi" && i > 0 && Math.random() > (s.chance || 0.5)) break;
            let d = calc(s.power);
            currentEnemy.hp = Math.max(0, currentEnemy.hp - d);
            total += d; hits++;
            updateMessage(`${isCritOccurred ? "★" : ""}${hits}ヒット！ ${d}点`);
            updateVisualBars(currentEnemy);
            await new Promise(r => setTimeout(r, 300));
            if(currentEnemy.hp <= 0) break;
        }
        log = `【${hits}連撃】 合計 ${total} ダメージ！`;
    }
    else if (s.type === "heal") {
        let v = Math.floor(s.power * (curAtk / 10));
        player.hp = Math.min(getStat('hp'), player.hp + v);
        log = `HPが ${v} 回復した！`;
    }
    else if (s.type === "buff") {
        pBuffs[s.stat] = (pBuffs[s.stat] || 0) + s.power;
        log = `${STAT_LABELS[s.stat]}が ${s.power} 上がった！`;
    }

    updateMessage(log);

    // --- 特殊効果(Effects)の処理：hp以外(砂かけ等)に対応 ---
    if (s.effects) {
        s.effects.forEach(eff => {
            let target = eff.target === "self" ? player : currentEnemy;
            let targetName = eff.target === "self" ? "あなた" : target.name;

            if (eff.stat === "hp") {
                // 自傷や吸収
                if(eff.target === "self") player.hp = Math.max(0, player.hp + eff.value);
                else currentEnemy.hp = Math.max(0, currentEnemy.hp + eff.value);
                updateMessage(document.getElementById('message-area').innerText + `\n${targetName}に ${eff.value} の影響！`);
            } else {
                // ステータス変化（砂かけ: enemy/def/-7 など）
                if (eff.target === "enemy") {
                    // 敵の現在のステータスを直接書き換え
                    if (eff.stat === "def") currentEnemy.curDef = Math.max(0, currentEnemy.curDef + eff.value);
                    if (eff.stat === "atk") currentEnemy.atk = Math.max(1, currentEnemy.atk + eff.value);
                } else {
                    // プレイヤーはバフ変数に加算
                    pBuffs[eff.stat] = (pBuffs[eff.stat] || 0) + eff.value;
                }
                updateMessage(document.getElementById('message-area').innerText + `\n${targetName}の${STAT_LABELS[eff.stat] || eff.stat}が変化した！`);
            }
        });
    }

    // --- 状態異常(Conditions) ---
    if (s.conditions) {
        s.conditions.forEach(cDef => {
            let target = (cDef.chance < 0) ? player : currentEnemy;
            if (Math.random() < Math.abs(cDef.chance)) {
                if (applyCondition(target, cDef.name)) {
                    updateMessage(document.getElementById('message-area').innerText + `\n${(target===player?"あなた":target.name)}は【${cDef.name}】になった！`);
                }
            }
        });
    }

    updateVisualBars(currentEnemy);

    if (player.hp <= 0) { await new Promise(r => setTimeout(r, 800)); moveScene("gameover"); return; }
    if (currentEnemy.hp <= 0) { await new Promise(r => setTimeout(r, 800)); finishBattle(true); return; }

    await new Promise(r => setTimeout(r, 800));
    battleTurnProcess();
}

// バトル開始時に「誰のターンか」を決めるための変数を追加（グローバル付近）
let isPlayerTurn = true; 

async function battleTurnProcess() {
    updateVisualBars(currentEnemy);

    // --- [追加] 自動回復の内部関数 ---
    const processRegen = async (target, label) => {
        const isTargetPlayer = (target === player);
        const maxHp = isTargetPlayer ? getStat('hp') : target.maxHp;
        const maxMp = (isTargetPlayer ? target.maxMp : (target.maxMp || 0));

        // 回復値の取得 (プレイヤーは装備込のステータス、敵は基礎値)
        let hpRegen = isTargetPlayer ? getStat('hpr') : (target.hpr || 0);
        let mpRegen = isTargetPlayer ? getStat('mpr') : (target.mpr || 0);

        let messages = [];
        if (hpRegen > 0 && target.hp < maxHp) {
            const actualHp = Math.min(hpRegen, maxHp - target.hp);
            target.hp += actualHp;
            messages.push(`HPが ${actualHp} 回復`);
        }
        if (mpRegen > 0 && isTargetPlayer && target.mp < maxMp) {
            const actualMp = Math.min(mpRegen, maxMp - target.mp);
            target.mp += actualMp;
            messages.push(`MPが ${actualMp} 回復`);
        }

        if (messages.length > 0) {
           
            updateVisualBars(currentEnemy);
            await new Promise(r => setTimeout(r, 600));
        }
    };

    // --- 状態異常ダメージと治癒の内部関数 (既存) ---
    const processConditions = async (target, label) => {
        if (!target.conditions || target.conditions.length === 0) return;
        
        let totalDmg = 0;
        let healedNames = [];
        const maxHp = (target === player) ? getStat('hp') : target.maxHp;
        const isTargetPlayer = (target === player);

        target.conditions = target.conditions.filter(c => {
            if (c.dotRate && c.dotRate > 0) {
                const rate = getElementRate(c.element, target, isTargetPlayer);
                let d = Math.floor(maxHp * c.dotRate * rate);
                totalDmg += Math.max(1, d);
            }
            c.turns--;
            if (c.turns <= 0) {
                healedNames.push(c.name);
                return false; 
            }
            return true;
        });

        if (totalDmg > 0) {
            target.hp = Math.max(0, target.hp - totalDmg);
            updateMessage(`${label}は状態異常で ${totalDmg} ダメージ！`);
            updateVisualBars(currentEnemy);
            await new Promise(r => setTimeout(r, 800));
        }

        if (healedNames.length > 0) {
            updateMessage(`${label}の【${healedNames.join('、')}】が治った！`);
            await new Promise(r => setTimeout(r, 800));
        }
    };

    // --- ターン処理の実行順序 ---
    if (isPlayerTurn) {
        await processConditions(player, "あなた");
        if (player.hp > 0) await processRegen(player, "あなた"); // [追加] プレイヤー回復
    } else {
        await processConditions(currentEnemy, currentEnemy.name);
        if (currentEnemy.hp > 0) await processRegen(currentEnemy, currentEnemy.name); // [追加] 敵回復
    }

    if (currentEnemy.hp <= 0) { finishBattle(true); return; }
    if (player.hp <= 0) { moveScene("gameover"); return; }

    if (isPlayerTurn) {
        isPlayerTurn = false;
        await enemyTurn();
    } else {
        isPlayerTurn = true;
        showBattleMenu();
    }
}

async function enemyTurn() {
    if(!isBattle || !currentEnemy) return;
    document.getElementById('choices-area').innerHTML = "";
    
    let e = currentEnemy;
    let eCondAtk = 0;
    if (e.conditions) e.conditions.forEach(c => eCondAtk += (c.atkMod || 0));
    const curDef = getStat('def') + (pBuffs.def || 0);
    
    // スキル選択
    let sn = (e.skills && Math.random() * 100 < (e.intel || 30)) 
             ? e.skills[Math.floor(Math.random() * e.skills.length)] : "通常攻撃";
    const s = SKILL_DB[sn] || SKILL_DB["通常攻撃"];
    const eRate = getElementRate(s.element, player, true);
    
    updateMessage(`${e.name}の ${sn}！`);
    await new Promise(r => setTimeout(r, 600));

    // 命中判定
    if (Math.random() > (s.accuracy || 1.0)) {
        updateMessage(`${e.name}の攻撃は外れた！`);
        await new Promise(r => setTimeout(r, 800));
        battleTurnProcess();
        return;
    }

    let isCritOccurred = false;
    const calcE = (power) => {
        const critRate = s.crit !== undefined ? s.crit : 0.05;
        const isCrit = Math.random() < critRate;
        let dmg = Math.round(power * ((e.atk + eCondAtk) / 10) * (1 - VARIATION + Math.random() * VARIATION * 2));
        if (isCrit) {
            isCritOccurred = true;
            dmg = Math.round(dmg * 1.25 * eRate);
        } else {
            dmg = Math.max(1, Math.round(dmg * eRate) - Math.floor(curDef / 2));
        }
        return dmg;
    };

    // 技の実行
    let log = "";
    if (s.type === "damage") {
        let d = calcE(s.power);
        player.hp = Math.max(0, player.hp - d);
        if(isCritOccurred) log += "！！痛恨の一撃！！ ";
        log += `あなたに ${d} ダメージ！`;
    } 
    else if (s.type === "burst" || s.type === "multi") {
        let total = 0, hits = 0;
        let maxHits = s.type === "burst" ? (s.times || 2) : 10;
        for(let i=0; i < maxHits; i++) {
            if(s.type === "multi" && i > 0 && Math.random() > (s.chance || 0.5)) break;
            let d = calcE(s.power);
            player.hp = Math.max(0, player.hp - d);
            total += d; hits++;
            updateMessage(`${isCritOccurred ? "！！" : ""}${hits}ヒット！ ${d}ダメージ！`);
            updateVisualBars(e);
            await new Promise(r => setTimeout(r, 300));
            if(player.hp <= 0) break;
        }
        log = `${e.name}の猛攻！ 合計 ${total} ダメージ！`;
    }
    else if (s.type === "heal") {
        let v = Math.floor(s.power * (e.atk / 10));
        e.hp = Math.min(e.maxHp, e.hp + v);
        log = `${e.name}のHPが ${v} 回復した！`;
    }
    else if (s.type === "buff") {
        if(s.stat === "def") e.curDef += s.power;
        if(s.stat === "atk") e.atk += s.power;
        log = `${e.name}の ${STAT_LABELS[s.stat] || s.stat} が上がった！`;
    }

    updateMessage(log);

    // --- 敵のEffects処理（自傷やデバフ） ---
    if (s.effects) {
        s.effects.forEach(eff => {
            let target = eff.target === "self" ? e : player;
            if (eff.stat === "hp") {
                target.hp = Math.max(0, target.hp + eff.value);
                let tName = eff.target === "self" ? e.name : "あなた";
                updateMessage(document.getElementById('message-area').innerText + `\n${tName}に ${eff.value} の反動！`);
            } else {
                // 砂かけ等を敵が使った場合（target: enemy ならプレイヤーのデバフ）
                if (eff.target === "enemy") {
                    pBuffs[eff.stat] = (pBuffs[eff.stat] || 0) + eff.value;
                } else {
                    if (eff.stat === "def") e.curDef = Math.max(0, e.curDef + eff.value);
                    if (eff.stat === "atk") e.atk = Math.max(1, e.atk + eff.value);
                }
                updateMessage(document.getElementById('message-area').innerText + `\n${eff.target==="self"?e.name:"あなた"}の${STAT_LABELS[eff.stat]||eff.stat}が変化！`);
            }
        });
    }

    // --- 敵の状態異常付与 ---
    if (s.conditions) {
        s.conditions.forEach(cDef => {
            if (Math.random() < cDef.chance) {
                if (applyCondition(player, cDef.name)) {
                    updateMessage(document.getElementById('message-area').innerText + `\nあなたは【${cDef.name}】になった！`);
                }
            }
        });
    }

    updateVisualBars(e);

    if (player.hp <= 0) { await new Promise(r => setTimeout(r, 800)); moveScene("gameover"); return; }
    if (e.hp <= 0) { await new Promise(r => setTimeout(r, 800)); finishBattle(true); return; }

    await new Promise(r => setTimeout(r, 800));
    battleTurnProcess();
}

function updateVisualBars(e) {
    const mhp = getStat('hp'), mmp = player.maxMp;
    document.getElementById('p-hp-bar').style.width = (player.hp/mhp*100)+"%";
    document.getElementById('p-hp-num').innerText = `${player.hp}/${mhp}`;
    document.getElementById('p-mp-bar').style.width = (player.mp/mmp*100)+"%";
    document.getElementById('p-mp-num').innerText = `${player.mp}/${mmp}`;
    let pBuffTxt = "";
    for(let k in pBuffs) if(pBuffs[k]>0) pBuffTxt += `<span>${STAT_LABELS[k]}+${pBuffs[k]}</span>`;
    document.getElementById('p-buffs').innerHTML = pBuffTxt;
    if(e){
        document.getElementById('e-hp-bar').style.width = (e.hp/e.maxHp*100)+"%";
        document.getElementById('e-hp-num').innerText = `${Math.ceil(e.hp)}/${e.maxHp}`;
        document.getElementById('e-name').innerText = e.name;
    }
}

function useItem(name) {
    const it = ITEM_DB[name];
    if (!it) {
        notify("ERROR", "このアイテムは使えません。");
        return;
    }

    // --- 使用条件のチェック (満タン時は使わせない例) ---
    const mhp = getStat('hp');
    const mmp = player.maxMp;
    if (it.hp > 0 && player.hp >= mhp && !it.atk && !it.def) {
        notify("ITEM", "HPが満タンです！");
        return;
    }

    // アイテム消費
    player.consumables[name]--;
    let log = `【${name}】を使用した。\n`;

    // --- 効果の発動 ---
    // 1. 回復系
    if (it.hp) {
        let healAmount = Math.min(it.hp, mhp - player.hp);
        player.hp += healAmount;
        log += `HPが ${healAmount} 回復した。`;
    }
    if (it.mp) {
        let healMp = Math.min(it.mp, mmp - player.mp);
        player.mp += healMp;
        log += `MPが ${healMp} 回復した。`;
    }

    // 2. 状態異常治療
    if (it.cure) {
        if (player.conditions && player.conditions.length > 0) {
            if (it.cure === "all") {
                player.conditions = [];
                log += "すべての状態異常が治った！";
            } else {
                const idx = player.conditions.findIndex(c => c.name === it.cure);
                if (idx !== -1) {
                    player.conditions.splice(idx, 1);
                    log += `【${it.cure}】が治った！`;
                }
            }
        }
    }

    // 3. 永続強化系
    if (it.atk) { player.baseAtk += it.atk; log += `攻撃力が ${it.atk} 上がった！`; }
    if (it.def) { player.baseDef += it.def; log += `防御力が ${it.def} 上がった！`; }
    if (it.maxHp) { player.maxHp += it.maxHp; player.hp += it.maxHp; log += `最大HPが増えた！`; }

    // --- 使用後の処理 ---
    if (isBattle) {
        // 戦闘中の場合
        document.getElementById('choices-area').innerHTML = "";
        updateMessage(log);
        setTimeout(battleTurnProcess, 800);
    } else {
        // メニュー画面の場合
        notify("ITEM", log);
        renderStatus();   // 左側のステータス更新
        updateTopBar();   // 上部のバー更新
        showItemMenu();   // アイテム一覧の個数表示を更新
    }
}

/** * 共通関数：シーン移動（拡張版）
 * choices 内に condition (関数) や chance (数値) がある場合、それらを評価して表示を切り替えます。
 * */

function moveScene(id) {
    const s = scenarios[id]; 
    if(!s) return;

    // バトル表示の制御
    if(id === "gameover" || id === "start") {
        isBattle = false;
        document.getElementById('battle-display').style.display = 'none';
    }

    // シーン開始時のアクション実行
    if(s.action) s.action();

    // メッセージの更新
    updateMessage(s.text);

    let cs = [];

    // --- ショップ商品の処理 (複数ステータス対応版) ---
    if(s.shop) {
        s.shop.forEach(([type, info, price]) => {
            // 消費アイテムか装備品かで名前の取得元を変える
            const name = type === 'item' ? info : info.name;
            
            cs.push({ 
                text: `${name}(${price}G)`, 
                disabled: player.gold < price, 
                action: () => {
                    player.gold -= price;
                    
                    if(type === 'item') { 
                        // 消費アイテムの処理
                        player.consumables[name] = (player.consumables[name] || 0) + 1; 
                        notify("SHOP", `【${name}】を購入！`); 
                    } else {
                        // 装備品の処理：infoオブジェクト内の全ステータスを継承
                        const item = { 
                            id: Math.random().toString(36).substr(2,9), 
                            slot: type,
                            // 初期値を0で埋めておく
                            hp:0, atk:0, def:0, spd:0, hpr:0, mpr:0,
                            res_fire:0, res_ice:0, res_dark:0,
                            ...info // info(名前やステータス)で上書き
                        };
                        
                        // ITEM_RANDOM(0.4) に基づいて数値プロパティのみ個体差を算出
                        for (let key in item) {
                            if (typeof item[key] === 'number' && key !== 'id') {
                                // 耐性値(0.1など)が小さいため、誤差が出ないよう四捨五入を調整
                                const multiplier = (1 - ITEM_RANDOM) + Math.random() * ITEM_RANDOM * 2;
                                item[key] = Math.round(item[key] * multiplier * 100) / 100;
                            }
                        }
                        
                        player.inventory.push(item);
                        notify("SHOP", `【${item.name}】を購入！`);
                    }
                    updateGold(); 
                    moveScene(id); // 購入後にショップ画面をリフレッシュ
                }
            });
        });
    }

    // --- 選択肢の処理 ---
    if(s.choices) {
        const filteredChoices = s.choices.filter(c => {
            if (c.chance !== undefined && Math.random() > c.chance) return false;
            if (c.condition !== undefined && !c.condition()) return false;
            return true;
        });

        const mappedChoices = filteredChoices.map(c => {
            if (c.action === "BATTLE") {
                return { ...c, action: () => startBattle(s.battle) };
            }
            return c;
        });

        cs = [...cs, ...mappedChoices];
    }

    // ボタンを描画
    renderChoices(cs);
}

/**
 * 確率に基づいて次のシーンIDを決定する
 * @param {Array} branches - [{id: "scene1", weight: 70}, {id: "scene2", weight: 30}]
 */
function pickRandomNext(branches) {
    const totalWeight = branches.reduce((sum, b) => sum + (b.weight || 1), 0);
    let random = Math.random() * totalWeight;
    
    for (const branch of branches) {
        if (random < branch.weight) return branch.id;
        random -= branch.weight;
    }
    return branches[0].id;
}

function checkLevelUp() {
    let leveled = false;
    while(player.exp >= player.nextExp) {
        player.level++;
        player.exp -= player.nextExp;
        player.nextExp = Math.floor(player.nextExp * 1.5);
        
        // ステータス上昇
        player.maxHp += 15;
        player.maxMp += 5;
        player.baseAtk += 5;
        player.baseDef += 3;
        player.baseHpr += 1;
        player.baseMpr += 0.5;
        player.hp = getStat('hp');
        player.mp = player.maxMp;
        
        leveled = true;
        notify("LEVEL UP", `Lv.${player.level}になった！`);
    }
    // レベルアップしてもしてなくても、経験値が動いたら更新
    updateTopBar(); 
}

/**
 * 装備品を生成してインベントリに追加する補助関数
 * 通常ステータスは整数、耐性ステータスは小数第一位に整形します。
 */

function createAndAddGear(slot, info, showNotif = true) {
    let newItem = { 
        id: Math.random().toString(36).substr(2, 9), 
        slot: slot,
        hp: 0, atk: 0, def: 0, spd: 0, hpr: 0, mpr: 0, 
        res_fire: 0, res_ice: 0, res_dark: 0 
    };

    // 形式判定（配列なら古い宝箱形式、オブジェクトなら新形式）
    if (Array.isArray(info)) {
        newItem.name = info[0];
        newItem[info[2]] = info[1];
    } else {
        newItem = { ...newItem, ...info };
    }

    let statLogs = []; 
    for (let key in newItem) {
        if (typeof newItem[key] === 'number' && key !== 'id' && newItem[key] !== 0) {
            // ランダム補正 (0.6倍 〜 1.4倍)
            const multiplier = (1 - ITEM_RANDOM) + Math.random() * ITEM_RANDOM * 2;
            let finalVal = newItem[key] * multiplier;

            // --- 型の撃ち分け ---
            if (key.startsWith('res_')) {
                finalVal = Math.round(finalVal * 10) / 10; // 属性耐性は小数第一位
            } else {
                finalVal = Math.round(finalVal); // その他（atk, def, mpr等）は整数
            }
            
            newItem[key] = finalVal;

            // 通知用テキスト作成
            if (finalVal !== 0) {
                const label = STAT_LABELS[key] || key;
                const sign = finalVal > 0 ? "+" : "";
                statLogs.push(`${label}${sign}${finalVal}`);
            }
        }
    }

    player.inventory.push(newItem);

    if (showNotif) {
        const detailTxt = statLogs.length > 0 ? 
            `<br><span style="font-size:0.8em; color:var(--hp)">${statLogs.join(' / ')}</span>` : "";
        notify("ITEM GET", `【${newItem.name}】を入手！${detailTxt}`);
    }
}

        document.getElementById('battle-display').style.display = 'none';
    }

    if(s.action) s.action();
    updateMessage(s.text);

    let cs = [];
    if(s.shop) {
        s.shop.forEach(([type, info, price]) => {
            const name = type === 'item' ? info : (Array.isArray(info) ? info[0] : info.name);
            cs.push({ 
                text: `${name}(${price}G)`, 
                disabled: player.gold < price, 
                action: () => {
                    player.gold -= price;
                    if(type === 'item') { 
                        player.consumables[name] = (player.consumables[name] || 0) + 1; 
                        notify("SHOP", `【${name}】を購入！`); 
                    } else {
                        createAndAddGear(type, info, true); // 詳細通知付きで生成
                    }
                    updateGold(); 
                    moveScene(id); 
                }
            });
        });
    }

    if(s.choices) {
        const filteredChoices = s.choices.filter(c => {
            if (c.chance !== undefined && Math.random() > c.chance) return false;
            if (c.condition !== undefined && !c.condition()) return false;
            return true;
        });
        const mappedChoices = filteredChoices.map(c => {
            if (c.action === "BATTLE") return { ...c, action: () => startBattle(s.battle) };
            return c;
        });
        cs = [...cs, ...mappedChoices];
    }
    renderChoices(cs);
}

// MP回復と通知の処理
function handlePlayerRegen() {
    let totalMpr = player.baseMpr || 0;
    // 装備品のmprを合計
    for (let slot in player.equipment) {
        if (player.equipment[slot] && player.equipment[slot].mpr) {
            totalMpr += player.equipment[slot].mpr;
        }
    }

    if (totalMpr > 0 && player.hp > 0) {
        player.mp = Math.min(player.maxMp, player.mp + totalMpr);
        // 回復したことをログに流す（任意）
        // notify("REGEN", `MPが ${totalMpr} 回復！`, "#0081ff"); 
        updateBattleDisplay();
    }
}

function calculateDamage(attackerAtk, targetDef, skill, elementRate) {
    // 1. 命中判定
    const acc = skill.accuracy !== undefined ? skill.accuracy : 1.0;
    if (Math.random() > acc) {
        return { damage: 0, isMiss: true, isCrit: false };
    }

    // 2. 急所判定
    const critChance = skill.critRate !== undefined ? skill.critRate : 0.05; // デフォルト5%
    const isCrit = Math.random() < critChance;

    // 3. ダメージ計算
    // 急所時は防御力を0として扱い、最終ダメージを1.5倍にする
    const effectiveDef = isCrit ? 0 : Math.floor(targetDef / 2);
    let dmg = Math.round(skill.power * (attackerAtk / 10) * (1 - VARIATION + Math.random() * VARIATION * 2));
    
    dmg = Math.max(1, Math.round(dmg * elementRate) - effectiveDef);
    
    if (isCrit) {
        dmg = Math.round(dmg * 1.5);
    }

    return { damage: dmg, isMiss: false, isCrit: isCrit };
}

function restartGame() { initPlayer(); moveScene("start"); }
initPlayer(); moveScene("start");

showTitle();
</script>
