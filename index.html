<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON RUSH - HYPER ACTION</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #05050a;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 854px;
            background: linear-gradient(135deg, #0b091a 0%, #1a0b2e 100%);
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.2);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Layers */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }

        .interactive {
            pointer-events: auto;
        }

        /* HUD */
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .score-board {
            text-align: left;
        }

        .score-label {
            font-size: 10px;
            letter-spacing: 2px;
            color: #00ffcc;
            text-transform: uppercase;
        }

        .score-value {
            font-size: 32px;
            font-weight: 900;
            font-family: monospace;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .combo-badge {
            background: rgba(255, 0, 128, 0.2);
            border: 2px solid #ff0080;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            color: #ff0080;
            text-shadow: 0 0 8px #ff0080;
            transform: scale(1);
            transition: transform 0.1s;
        }

        .combo-badge.pulse {
            transform: scale(1.3);
        }

        /* Fever Gauge */
        .fever-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
            position: relative;
        }

        .fever-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff0080, #ffcc00);
            box-shadow: 0 0 10px #ff0080;
            transition: width 0.1s linear;
        }

        /* Screens (Start / Gameover) */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(26, 11, 46, 0.9) 0%, rgba(5, 5, 10, 0.95) 100%);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        @keyframes floatTitle {
            0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 20px rgba(0, 255, 204, 0.6)); }
            50% { transform: translateY(-8px) scale(1.02); filter: drop-shadow(0 0 35px rgba(255, 0, 128, 0.9)); }
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .game-title {
            font-size: 52px;
            font-weight: 900;
            font-style: italic;
            text-align: center;
            background: linear-gradient(180deg, #fff 0%, #00ffcc 50%, #ff0080 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 255, 204, 0.8);
            margin-bottom: 5px;
            letter-spacing: -1px;
            animation: floatTitle 2.5s ease-in-out infinite;
        }

        .game-subtitle {
            font-size: 12px;
            letter-spacing: 6px;
            color: #ff0080;
            margin-bottom: 40px;
            text-transform: uppercase;
            font-weight: bold;
        }

        @keyframes pulseBtn {
            0%, 100% { box-shadow: 0 0 25px rgba(0, 255, 204, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.5); }
            50% { box-shadow: 0 0 45px rgba(255, 0, 128, 0.9), inset 0 0 25px rgba(255, 255, 255, 0.8); }
        }

        .btn {
            background: linear-gradient(135deg, #00ffcc 0%, #ff0080 100%);
            color: #fff;
            border: none;
            padding: 20px 56px;
            font-size: 20px;
            font-weight: 900;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.6);
            animation: pulseBtn 1.5s infinite;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        .btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.8);
        }

        .instructions {
            margin-top: 30px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            line-height: 1.6;
        }

        .instructions span {
            color: #00ffcc;
            font-weight: bold;
        }

        /* Game Over Specific */
        .gameover-stats {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 40px;
            border-radius: 16px;
            margin-bottom: 30px;
            text-align: center;
        }

        .gameover-stats .label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        .gameover-stats .val {
            font-size: 36px;
            font-weight: 900;
            color: #ff0080;
            font-family: monospace;
            text-shadow: 0 0 10px rgba(255, 0, 128, 0.5);
        }

        /* Flash overlay for damage/fever */
        #flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.1s;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas for Game Graphics -->
        <canvas id="gameCanvas"></canvas>

        <!-- Flash Effect Layer -->
        <div id="flash-overlay"></div>

        <!-- UI Layer -->
        <div class="ui-layer">
            <div class="hud-top">
                <div class="score-board">
                    <div class="score-label">SCORE / BEST: <span id="best-score-display" style="color: #fff;">000000</span></div>
                    <div class="score-value" id="current-score">000000</div>
                    <div class="fever-container">
                        <div class="fever-fill" id="fever-fill"></div>
                    </div>
                </div>
                <div class="combo-badge" id="combo-badge" style="display: none;">
                    <span id="combo-count">0</span> COMBO
                </div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <div class="game-title">NEON<br>RUSH</div>
            <div class="game-subtitle">Hyper Dopamine Action</div>
            <button class="btn interactive" id="start-btn">PLAY NOW</button>
            <div class="instructions">
                TAP to <span>JUMP / REVERSE</span><br>
                Collect Orbs &bull; Dodge Spikes &bull; Enter Fever
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="screen hidden">
            <div class="game-title" style="font-size: 36px; margin-bottom: 20px; color: #ff0080; -webkit-text-fill-color: #ff0080;">GAME OVER</div>
            <div class="gameover-stats" style="margin-bottom: 15px;">
                <div class="label">FINAL SCORE</div>
                <div class="val" id="final-score">000000</div>
            </div>
            <div class="gameover-stats" style="padding: 10px 40px; margin-bottom: 25px;">
                <div class="label">BEST SCORE</div>
                <div class="val" id="final-best-score" style="color: #00ffcc; font-size: 24px;">000000</div>
            </div>
            <button class="btn interactive" id="restart-btn">RETRY</button>
        </div>
    </div>

    <script>
        // --- SOUND SYSTEM (Web Audio API) ---
        class SoundManager {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playTone(freq, type, duration, vol = 0.08, slideTo = null, fadeOut = true) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const t = this.ctx.currentTime;
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, t);
                    if (slideTo) {
                        osc.frequency.exponentialRampToValueAtTime(Math.max(10, slideTo), t + duration);
                    }
                    gain.gain.setValueAtTime(vol, t);
                    if (fadeOut) {
                        gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
                    } else {
                        gain.gain.linearRampToValueAtTime(0, t + duration);
                    }
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + duration);
                } catch(e) {}
            }
            jump() {
                this.playTone(320, 'sine', 0.12, 0.08, 580);
                this.playTone(160, 'triangle', 0.08, 0.04, 300);
            }
            score() {
                this.playTone(784, 'sine', 0.08, 0.06, 1174);
            }
            hit() {
                this.playTone(140, 'sawtooth', 0.25, 0.15, 30);
            }
            fever() {
                if (!this.ctx) return;
                [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'square', 0.15, 0.1, f * 1.5), i * 45);
                });
            }
            extremeCombo() {
                this.playTone(1200, 'sine', 0.1, 0.1, 1800);
            }
        }

        const sound = new SoundManager();

        // --- GAME CONFIG & VIRTUAL VIEWPORT ---
        const VIRTUAL_WIDTH = 480;
        const VIRTUAL_HEIGHT = 854;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width = VIRTUAL_WIDTH;
        let height = VIRTUAL_HEIGHT;

        function resize() {
            const containerW = canvas.parentElement.clientWidth;
            const containerH = canvas.parentElement.clientHeight;
            canvas.width = containerW * window.devicePixelRatio;
            canvas.height = containerH * window.devicePixelRatio;
        }
        window.addEventListener('resize', resize);
        resize();

        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let combo = 0;
        let comboTimer = 0;
        let feverGauge = 0;
        let isFever = false;
        let feverTimer = 0;
        let screenShake = 0;
        let hitStop = 0;

        // --- GAME CONFIGURATION ---
        const CONFIG = {
            PHYSICS: {
                GRAVITY: 2800,
                JUMP_IMPULSE: 700,
                TERMINAL_VEL: 880,
                CUSHION_RANGE: 34,
                SPRING_K: 2400,
                REVERSE_KICK: 1.12, // 反転直後の瞬間推進力
            },
            HITBOX: {
                PLAYER_SCALE: 0.82, // 理不尽な角当たり死を完全排除するHitboxインセット補正
                NEAR_MISS_SCALE: 1.48
            },
            SPEED: {
                NORMAL: 320,
                FEVER: 550,
                EASE: 9.0
            },
            GAMEPLAY: {
                SPAWN_INTERVAL_NORMAL: 1.25,
                SPAWN_INTERVAL_FEVER: 0.75,
                FEVER_DURATION: 5.0,
                JUMP_BUFFER_TIME: 0.12
            }
        };

        let currentSpeed = CONFIG.SPEED.NORMAL;
        let jumpBufferTimer = 0;

        // --- OBJECT POOL SYSTEM (Zero-GC) ---
        class ObjectPool {
            constructor(createFn, initialSize = 40) {
                this.createFn = createFn;
                this.pool = [];
                for (let i = 0; i < initialSize; i++) {
                    const obj = this.createFn();
                    obj.active = false;
                    this.pool.push(obj);
                }
            }
            get() {
                let obj = null;
                for (let i = 0; i < this.pool.length; i++) {
                    if (!this.pool[i].active) {
                        obj = this.pool[i];
                        break;
                    }
                }
                if (!obj) {
                    obj = this.createFn();
                    this.pool.push(obj);
                }
                obj.active = true;
                return obj;
            }
            clear() {
                for (let i = 0; i < this.pool.length; i++) {
                    this.pool[i].active = false;
                }
            }
            forEachActive(fn) {
                for (let i = 0; i < this.pool.length; i++) {
                    if (this.pool[i].active) fn(this.pool[i]);
                }
            }
        }

        // --- GAME OBJECTS ---
        class Player {
            constructor() {
                this.size = 24;
                this.trail = [];
                this.squishX = 1.0;
                this.squishY = 1.0;
                this.reset();
            }

            reset() {
                this.x = 80;
                this.y = VIRTUAL_HEIGHT / 2;
                this.prevX = this.x;
                this.prevY = this.y;
                this.vy = 0;
                this.gravityDir = 1; // 1: down, -1: up
                this.rotation = 0;
                this.prevRotation = 0;
                this.squishX = 1.0;
                this.squishY = 1.0;
                this.trail.length = 0;
                for (let i = 0; i < 10; i++) {
                    this.trail.push({ x: this.x, y: this.y });
                }
            }

            update(dtFixed) {
                this.prevX = this.x;
                this.prevY = this.y;
                this.prevRotation = this.rotation;

                // 伸縮トランスフォームのスムーズ復元（変形イージング）
                this.squishX += (1.0 - this.squishX) * 14.0 * dtFixed;
                this.squishY += (1.0 - this.squishY) * 14.0 * dtFixed;

                // CONFIG定数に基づく重力・最高速度の計算
                this.vy += CONFIG.PHYSICS.GRAVITY * this.gravityDir * dtFixed;

                if (Math.abs(this.vy) > CONFIG.PHYSICS.TERMINAL_VEL) {
                    this.vy = Math.sign(this.vy) * CONFIG.PHYSICS.TERMINAL_VEL;
                }

                this.y += this.vy * dtFixed;

                // 画面上下境界の滑らかなスプリング（弾性ダンパー）処理
                const margin = this.size * 0.5;
                const cushionRange = CONFIG.PHYSICS.CUSHION_RANGE;

                if (this.gravityDir === -1 && this.y < margin + cushionRange) {
                    const depth = (margin + cushionRange - this.y) / cushionRange;
                    this.vy += depth * CONFIG.PHYSICS.SPRING_K * dtFixed;
                } else if (this.gravityDir === 1 && this.y > VIRTUAL_HEIGHT - margin - cushionRange) {
                    const depth = (this.y - (VIRTUAL_HEIGHT - margin - cushionRange)) / cushionRange;
                    this.vy -= depth * CONFIG.PHYSICS.SPRING_K * dtFixed;
                }

                if (this.y < margin) {
                    this.y = margin;
                    if (this.vy < 0) this.vy = 0;
                    this.squishX = 1.35;
                    this.squishY = 0.7;
                } else if (this.y > VIRTUAL_HEIGHT - margin) {
                    this.y = VIRTUAL_HEIGHT - margin;
                    if (this.vy > 0) this.vy = 0;
                    this.squishX = 1.35;
                    this.squishY = 0.7;
                }

                // スムーズな回転アニメーション
                this.rotation += 9.5 * this.gravityDir * dtFixed;

                // トレイル座標更新
                const lastTrail = this.trail.shift();
                lastTrail.x = this.x;
                lastTrail.y = this.y;
                this.trail.push(lastTrail);
            }

            jump() {
                this.gravityDir *= -1;
                // ネオンエネルギー反転：初速に推進乗数を掛け即時ベクトル上書き（手応えのある反転感）
                this.vy = -this.gravityDir * CONFIG.PHYSICS.JUMP_IMPULSE * CONFIG.PHYSICS.REVERSE_KICK;
                
                // ジャンプ時のSquish & Stretch（潰れ・伸びフィードバック）
                this.squishX = 0.65;
                this.squishY = 1.4;

                sound.jump();

                for (let i = 0; i < 10; i++) {
                    spawnParticle(this.x, this.y, isFever ? '#ff0080' : '#00ffcc', true);
                }
            }

            // Zero-GC 頂点算出（インセット補正と幾何学的正確性を両立）
            fillVertices(outVerts, scaleFactor = 1.0) {
                const halfSize = (this.size * 0.5) * scaleFactor;
                const cos = Math.cos(this.rotation);
                const sin = Math.sin(this.rotation);
                
                const localX = [-halfSize, halfSize, halfSize, -halfSize];
                const localY = [-halfSize, -halfSize, halfSize, halfSize];

                for (let i = 0; i < 4; i++) {
                    outVerts[i].x = this.x + (localX[i] * cos - localY[i] * sin);
                    outVerts[i].y = this.y + (localX[i] * sin + localY[i] * cos);
                }
            }

            draw(alpha = 1.0) {
                // レンダリング専用の補間描画座標算出（物理ロジックから完全に分離）
                const drawX = this.prevX + (this.x - this.prevX) * alpha;
                const drawY = this.prevY + (this.y - this.prevY) * alpha;
                const drawRot = this.prevRotation + (this.rotation - this.prevRotation) * alpha;
                const curSize = this.size;

                // Draw trail
                for (let i = 0; i < this.trail.length; i++) {
                    let trailAlpha = (i + 1) / this.trail.length;
                    let t = this.trail[i];
                    ctx.fillStyle = isFever ? `rgba(255, 0, 128, ${trailAlpha * 0.3})` : `rgba(0, 255, 204, ${trailAlpha * 0.22})`;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, curSize * 0.65 * trailAlpha, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(drawRot);
                ctx.scale(this.squishX, this.squishY);

                ctx.shadowBlur = isFever ? 20 : 12;
                ctx.shadowColor = isFever ? '#ff0080' : '#00ffcc';
                ctx.fillStyle = isFever ? '#ff0080' : '#00ffcc';
                ctx.fillRect(-curSize / 2, -curSize / 2, curSize, curSize);

                ctx.fillStyle = '#fff';
                ctx.fillRect(-curSize / 4, -curSize / 4, curSize / 2, curSize / 2);

                ctx.restore();
            }
        }

        class Particle {
            constructor() {
                this.active = false;
            }
            init(x, y, color, burst = false) {
                this.x = x;
                this.y = y;
                this.prevX = x;
                this.prevY = y;
                this.color = color;
                const angle = burst ? Math.random() * Math.PI * 2 : (Math.random() - 0.5) * 0.5;
                const speed = burst ? Math.random() * 320 + 100 : Math.random() * 160 + 50;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.size = Math.random() * 3.5 + 1.8;
                this.life = 1.0;
                this.decay = Math.random() * 1.6 + 1.2;
            }
            update(dtFixed) {
                this.prevX = this.x;
                this.prevY = this.y;
                this.x += this.vx * dtFixed;
                this.y += this.vy * dtFixed;
                this.life -= this.decay * dtFixed;
                if (this.life <= 0) this.active = false;
            }
            draw(alpha = 1.0) {
                const drawX = this.prevX + (this.x - this.prevX) * alpha;
                const drawY = this.prevY + (this.y - this.prevY) * alpha;
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.fillRect(drawX, drawY, this.size, this.size);
            }
        }

        class Obstacle {
            constructor() {
                this.active = false;
            }
            init() {
                this.x = VIRTUAL_WIDTH + 60;
                this.prevX = this.x;
                this.w = 36;
                this.topH = Math.random() * (VIRTUAL_HEIGHT * 0.38) + 60;
                this.gap = isFever ? 240 : 175;
                this.bottomH = VIRTUAL_HEIGHT - (this.topH + this.gap);
                this.passed = false;
                this.nearMissedTop = false;
                this.nearMissedBottom = false;
                this.color = '#ff3366';
            }
            update(speed, dtFixed) {
                this.prevX = this.x;
                this.x -= speed * dtFixed;
                if (this.x < -100) {
                    this.active = false;
                }
            }
            getTopAABB(currX = this.x) {
                return { x: currX, y: 0, w: this.w, h: this.topH };
            }
            getBottomAABB(currX = this.x) {
                return { x: currX, y: VIRTUAL_HEIGHT - this.bottomH, w: this.w, h: this.bottomH };
            }
            draw(alpha = 1.0) {
                const drawX = this.prevX + (this.x - this.prevX) * alpha;
                ctx.save();
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;

                ctx.fillRect(drawX, 0, this.w, this.topH);
                ctx.fillRect(drawX, VIRTUAL_HEIGHT - this.bottomH, this.w, this.bottomH);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(drawX, 0, this.w, this.topH);
                ctx.strokeRect(drawX, VIRTUAL_HEIGHT - this.bottomH, this.w, this.bottomH);

                ctx.restore();
            }
        }

        class Collectible {
            constructor() {
                this.active = false;
            }
            init(obs) {
                this.x = obs.x + obs.w / 2;
                this.prevX = this.x;
                this.y = obs.topH + (obs.gap / 2);
                this.prevY = this.y;
                this.size = 14;
                this.collected = false;
                this.angle = 0;
                this.prevAngle = 0;
            }
            update(speed, dtFixed) {
                this.prevX = this.x;
                this.prevY = this.y;
                this.prevAngle = this.angle;
                this.x -= speed * dtFixed;
                this.angle += 6.0 * dtFixed;
                if (this.x < -100 || this.collected) {
                    this.active = false;
                }
            }
            draw(alpha = 1.0) {
                if (this.collected) return;
                const drawX = this.prevX + (this.x - this.prevX) * alpha;
                const drawY = this.prevY + (this.y - this.prevY) * alpha;
                const drawAngle = this.prevAngle + (this.angle - this.prevAngle) * alpha;

                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(drawAngle);
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ffcc00';
                ctx.fillStyle = '#ffcc00';
                
                ctx.beginPath();
                ctx.moveTo(0, -this.size);
                ctx.lineTo(this.size, 0);
                ctx.lineTo(0, this.size);
                ctx.lineTo(-this.size, 0);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        class FloatingText {
            constructor() {
                this.active = false;
            }
            init(x, y, text, color = '#00ffcc') {
                this.x = x;
                this.y = y;
                this.prevX = x;
                this.prevY = y;
                this.text = text;
                this.color = color;
                this.life = 1.0;
                this.vy = -35;
            }
            update(dtFixed) {
                this.prevX = this.x;
                this.prevY = this.y;
                this.y += this.vy * dtFixed;
                this.life -= 1.4 * dtFixed;
                if (this.life <= 0) this.active = false;
            }
            draw(alpha = 1.0) {
                const drawX = this.prevX + (this.x - this.prevX) * alpha;
                const drawY = this.prevY + (this.y - this.prevY) * alpha;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.font = '900 14px sans-serif';
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fillText(this.text, drawX, drawY);
                ctx.restore();
            }
        }

        // --- SEPARATING AXIS THEOREM (SAT) OBB COLLISION & NEAR MISS (Zero-GC Optimization) ---
        // 判定用のプレアロケーションバッファ（メモリ再利用によるGCジャダー防止）
        const staticPlayerVertsHit = Array.from({ length: 4 }, () => ({ x: 0, y: 0 }));
        const staticPlayerVertsNear = Array.from({ length: 4 }, () => ({ x: 0, y: 0 }));
        const staticTopAABBVerts = Array.from({ length: 4 }, () => ({ x: 0, y: 0 }));
        const staticBottomAABBVerts = Array.from({ length: 4 }, () => ({ x: 0, y: 0 }));

        function fillAABBVertices(outVerts, box) {
            outVerts[0].x = box.x;         outVerts[0].y = box.y;
            outVerts[1].x = box.x + box.w; outVerts[1].y = box.y;
            outVerts[2].x = box.x + box.w; outVerts[2].y = box.y + box.h;
            outVerts[3].x = box.x;         outVerts[3].y = box.y + box.h;
        }

        function checkSATCollisionZeroGC(poly1, count1, poly2, count2) {
            for (let p = 0; p < 2; p++) {
                const poly = p === 0 ? poly1 : poly2;
                const count = p === 0 ? count1 : count2;

                for (let i = 0; i < count; i++) {
                    const p1 = poly[i];
                    const p2 = poly[(i + 1) % count];
                    
                    let nx = -(p2.y - p1.y);
                    let ny = p2.x - p1.x;
                    const len = Math.hypot(nx, ny);
                    if (len === 0) continue;
                    nx /= len;
                    ny /= len;

                    let min1 = Infinity, max1 = -Infinity;
                    for (let j = 0; j < count1; j++) {
                        const dot = poly1[j].x * nx + poly1[j].y * ny;
                        if (dot < min1) min1 = dot;
                        if (dot > max1) max1 = dot;
                    }

                    let min2 = Infinity, max2 = -Infinity;
                    for (let j = 0; j < count2; j++) {
                        const dot = poly2[j].x * nx + poly2[j].y * ny;
                        if (dot < min2) min2 = dot;
                        if (dot > max2) max2 = dot;
                    }

                    if (max1 <= min2 || max2 <= min1) {
                        return false;
                    }
                }
            }
            return true;
        }

        // --- POOL INSTANTIATION ---
        const particlePool = new ObjectPool(() => new Particle(), 120);
        const obstaclePool = new ObjectPool(() => new Obstacle(), 15);
        const collectiblePool = new ObjectPool(() => new Collectible(), 15);
        const textPool = new ObjectPool(() => new FloatingText(), 10);

        function spawnParticle(x, y, color, burst = false) {
            const p = particlePool.get();
            p.init(x, y, color, burst);
        }

        function spawnText(x, y, text, color) {
            const t = textPool.get();
            t.init(x, y, text, color);
        }

        // --- INITIALIZATION ---
        const player = new Player();
        let spawnTimer = 0;

        // --- CONTROLS & INPUT BUFFERING ---
        function handleInput(e) {
            if (e.target.closest && e.target.closest('.interactive')) return;

            if (e.type === 'touchstart') {
                if (e.cancelable) e.preventDefault();
            } else if (e.type === 'pointerdown' && e.cancelable) {
                if (!e.target.closest('.interactive')) {
                    e.preventDefault();
                }
            }

            if (gameState === 'PLAYING') {
                // 入力バッファタイマーに正確なウィンドウ時間を割り当て、操作の取りこぼしを完全に防止
                jumpBufferTimer = CONFIG.GAMEPLAY.JUMP_BUFFER_TIME;
            }
        }

        window.addEventListener('pointerdown', handleInput, { passive: false });
        window.addEventListener('touchstart', handleInput, { passive: false });
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (e.repeat) return;
                if (gameState === 'PLAYING') {
                    jumpBufferTimer = CONFIG.GAMEPLAY.JUMP_BUFFER_TIME;
                }
            }
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            sound.init();
            startGame();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            sound.init();
            startGame();
        });

        function startGame() {
            gameState = 'PLAYING';
            score = 0;
            combo = 0;
            feverGauge = 0;
            isFever = false;
            feverTimer = 0;
            jumpBufferTimer = 0;
            currentSpeed = CONFIG.SPEED.NORMAL;
            spawnTimer = 0;

            particlePool.clear();
            obstaclePool.clear();
            collectiblePool.clear();
            textPool.clear();

            player.reset();

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('combo-badge').style.display = 'none';
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            sound.hit();
            screenShake = 30;
            hitStop = 20;

            const flash = document.getElementById('flash-overlay');
            flash.style.background = 'rgba(255, 0, 50, 0.5)';
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 200);

            document.getElementById('final-score').innerText = String(Math.floor(score)).padStart(6, '0');
            document.getElementById('gameover-screen').classList.remove('hidden');
        }

        // --- FIXED TIMESTEP & INTERPOLATION GAME LOOP ---
        const FIXED_DT = 1 / 60;
        let accumulator = 0;
        let lastTime = performance.now();

        function updateGamePhysics(dtFixed) {
            // 先行入力バッファの正確な時間減衰と即時消費処理
            if (jumpBufferTimer > 0) {
                player.jump();
                jumpBufferTimer = 0;
            }
            jumpBufferTimer = Math.max(0, jumpBufferTimer - dtFixed);

            let targetSpeed = isFever ? CONFIG.SPEED.FEVER : CONFIG.SPEED.NORMAL;
            currentSpeed += (targetSpeed - currentSpeed) * (1 - Math.exp(-CONFIG.SPEED.EASE * dtFixed));

            if (isFever) {
                feverTimer -= dtFixed;
                feverGauge = Math.max(0, (feverTimer / CONFIG.GAMEPLAY.FEVER_DURATION) * 100);
                if (feverTimer <= 0) {
                    isFever = false;
                }
            }

            spawnTimer += dtFixed;
            const spawnInterval = isFever ? CONFIG.GAMEPLAY.SPAWN_INTERVAL_FEVER : CONFIG.GAMEPLAY.SPAWN_INTERVAL_NORMAL;
            if (spawnTimer >= spawnInterval) {
                spawnTimer = 0;
                const obs = obstaclePool.get();
                obs.init();
                const col = collectiblePool.get();
                col.init(obs);
            }

            // 理不尽な角当たり死を完全排除するHitboxインセット(CONFIG.HITBOX.PLAYER_SCALE)およびNearMiss領域の緻密なチューニング
            player.fillVertices(staticPlayerVertsHit, CONFIG.HITBOX.PLAYER_SCALE);
            player.fillVertices(staticPlayerVertsNear, CONFIG.HITBOX.NEAR_MISS_SCALE);

            let hasHit = false;
            obstaclePool.forEachActive(obs => {
                if (hasHit) return;

                obs.update(currentSpeed, dtFixed);

                if (!obs.passed && obs.x + obs.w < player.x) {
                    obs.passed = true;
                    score += isFever ? 200 : 100;
                    sound.score();
                }

                fillAABBVertices(staticTopAABBVerts, obs.getTopAABB());
                fillAABBVertices(staticBottomAABBVerts, obs.getBottomAABB());

                // 1. 衝突判定 (Zero-GC: 4頂点 vs 4頂点)
                const isHitTop = checkSATCollisionZeroGC(staticPlayerVertsHit, 4, staticTopAABBVerts, 4);
                const isHitBottom = checkSATCollisionZeroGC(staticPlayerVertsHit, 4, staticBottomAABBVerts, 4);

                if (isHitTop || isHitBottom) {
                    hasHit = true;
                    gameOver();
                    return;
                }

                // 2. ニアミス判定 (Zero-GC)
                if (!obs.nearMissedTop && checkSATCollisionZeroGC(staticPlayerVertsNear, 4, staticTopAABBVerts, 4)) {
                    obs.nearMissedTop = true;
                    score += 150;
                    spawnText(player.x, player.y - 24, 'NEAR MISS!', '#00ffcc');
                    sound.score();
                }
                if (!obs.nearMissedBottom && checkSATCollisionZeroGC(staticPlayerVertsNear, 4, staticBottomAABBVerts, 4)) {
                    obs.nearMissedBottom = true;
                    score += 150;
                    spawnText(player.x, player.y + 24, 'NEAR MISS!', '#ff0080');
                    sound.score();
                }
            });

            collectiblePool.forEachActive(col => {
                col.update(currentSpeed, dtFixed);

                const dist = Math.hypot(player.x - col.x, player.y - col.y);
                if (!col.collected && dist < (player.size * 0.5 + col.size)) {
                    col.collected = true;
                    score += 500;
                    combo++;
                    comboTimer = 3.0;
                    sound.score();

                    const comboBadge = document.getElementById('combo-badge');
                    document.getElementById('combo-count').innerText = combo;
                    comboBadge.style.display = 'block';
                    comboBadge.classList.add('pulse');
                    setTimeout(() => comboBadge.classList.remove('pulse'), 100);

                    if (combo % 5 === 0) {
                        sound.extremeCombo();
                        spawnText(player.x, player.y - 45, `${combo} COMBO!!`, '#ff0080');
                        screenShake += 8;
                    }

                    if (!isFever) {
                        feverGauge += 18;
                        if (feverGauge >= 100) {
                            isFever = true;
                            feverTimer = 5.0;
                            feverGauge = 100;
                            sound.fever();
                            screenShake = 25;
                            const flash = document.getElementById('flash-overlay');
                            flash.style.background = 'radial-gradient(circle, rgba(255,0,128,0.8) 0%, rgba(0,255,204,0.4) 100%)';
                            flash.style.opacity = '1';
                            setTimeout(() => flash.style.opacity = '0', 400);
                        }
                    }

                    for (let p = 0; p < 18; p++) {
                        spawnParticle(col.x, col.y, isFever ? '#ff0080' : '#ffcc00', true);
                    }
                }
            });

            if (combo > 0) {
                comboTimer -= dtFixed;
                if (comboTimer <= 0) {
                    combo = 0;
                    document.getElementById('combo-badge').style.display = 'none';
                }
            }

            textPool.forEachActive(t => t.update(dtFixed));
            player.update(dtFixed);
            score += (isFever ? 120 : 60) * dtFixed;
        }

        function renderGame(alpha) {
            ctx.save();
            // 仮想解像度 (480x854) を実画面へビューポートマッピング
            ctx.scale(canvas.width / VIRTUAL_WIDTH, canvas.height / VIRTUAL_HEIGHT);

            if (screenShake > 0) {
                let offsetX = (Math.random() - 0.5) * screenShake;
                let offsetY = (Math.random() - 0.5) * screenShake;
                ctx.translate(offsetX, offsetY);
                screenShake *= 0.88;
                if (screenShake < 0.1) screenShake = 0;
            }

            ctx.shadowBlur = 0; // ルート描画前のグローバルシャドウクリア
            ctx.fillStyle = isFever ? 'rgba(26, 11, 46, 0.35)' : 'rgba(11, 9, 26, 0.35)';
            ctx.fillRect(-30, -30, VIRTUAL_WIDTH + 60, VIRTUAL_HEIGHT + 60);

            // 障害物・アイテムの描画
            obstaclePool.forEachActive(obs => obs.draw(alpha));
            collectiblePool.forEachActive(col => col.draw(alpha));

            // パーティクル一括描画（共通のシャドウBlurを一回だけ適用して描画負荷を大幅削減）
            ctx.save();
            ctx.shadowBlur = 4;
            ctx.shadowColor = isFever ? '#ff0080' : '#00ffcc';
            particlePool.forEachActive(p => p.draw(alpha));
            ctx.restore();

            // UIテキスト描画
            textPool.forEachActive(t => t.draw(alpha));

            // プレイヤー描画
            if (gameState === 'PLAYING') {
                player.draw(alpha);
            }

            ctx.restore();
        }

        function updateUI() {
            document.getElementById('current-score').innerText = String(Math.floor(score)).padStart(6, '0');
            document.getElementById('fever-fill').style.width = feverGauge + '%';
        }

        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let frameTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            if (frameTime > 0.1) frameTime = 0.1;

            if (hitStop > 0) {
                hitStop--;
                requestAnimationFrame(loop);
                return;
            }

            accumulator += frameTime;

            // 完全なFixed Timestepによる物理・ゲームロジックの非依存化処理
            while (accumulator >= FIXED_DT) {
                if (gameState === 'PLAYING') {
                    updateGamePhysics(FIXED_DT);
                }
                particlePool.forEachActive(p => p.update(FIXED_DT));
                accumulator -= FIXED_DT;
            }

            // レンダリング用の alpha 補間係数（どんなリフレッシュレートのディスプレイでも一貫した滑らかさを提供）
            const alpha = accumulator / FIXED_DT;
            renderGame(alpha);
            updateUI();

            requestAnimationFrame(loop);
        }

        // Start initial loop
        requestAnimationFrame(loop);
    </script>
</body>
</html>
