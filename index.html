<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ステージクリア型2Dアクションゲーム</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    background: #111;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    touch-action: none;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  #game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 480px;
    max-height: 850px;
    background: #1a1e29;
    box-shadow: 0 0 25px rgba(0,0,0,0.8);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }
  /* UI オーバーレイ */
  .overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(10, 14, 25, 0.9);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
    z-index: 20;
  }
  .hidden { display: none !important; }

  h1 {
    font-size: 2.2rem;
    color: #ffd000;
    text-shadow: 0 0 12px rgba(255,208,0,0.6);
    margin-bottom: 16px;
    text-align: center;
  }
  h2 {
    font-size: 1.8rem;
    color: #00ffcc;
    margin-bottom: 12px;
    text-shadow: 0 0 8px rgba(0,255,204,0.5);
  }
  p {
    color: #ddd;
    font-size: 0.95rem;
    text-align: center;
    margin-bottom: 24px;
    line-height: 1.6;
  }
  .btn {
    background: linear-gradient(135deg, #ffcc00, #ff8800);
    border: none;
    color: #111;
    font-weight: 800;
    font-size: 1.1rem;
    padding: 14px 32px;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(255,160,0,0.4);
    transition: transform 0.1s;
    margin: 6px;
  }
  .btn:active {
    transform: scale(0.95);
  }

  /* 上部ステータスバー */
  #hud {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 16px;
    background: rgba(16, 20, 32, 0.85);
    border-bottom: 2px solid #2d3748;
    font-size: 0.95rem;
    font-weight: bold;
    pointer-events: none;
    z-index: 10;
  }
  .hud-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .heart {
    color: #ff3366;
    font-size: 1.2rem;
  }

  /* スマホ用タッチコントローラー */
  #touch-controls {
    position: absolute;
    bottom: 12px;
    left: 0;
    width: 100%;
    height: 120px;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    pointer-events: none;
    z-index: 10;
  }
  .d-pad {
    display: flex;
    gap: 14px;
    pointer-events: auto;
    align-items: center;
  }
  .action-pad {
    display: flex;
    gap: 14px;
    pointer-events: auto;
    align-items: center;
  }
  .ctrl-btn {
    width: 60px;
    height: 60px;
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5rem;
    font-weight: bold;
    color: #fff;
    touch-action: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .ctrl-btn:active, .ctrl-btn.active {
    background: rgba(255, 208, 0, 0.5);
    border-color: #ffd000;
    transform: scale(0.92);
  }
</style>
</head>
<body>

<div id="game-container">
  <!-- HUD -->
  <div id="hud">
    <div class="hud-item">
      <span>STAGE:</span> <span id="hud-stage" style="color:#00ffcc">1</span>
    </div>
    <div class="hud-item" id="hud-hearts">
      <span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span>
    </div>
    <div class="hud-item">
      <span>COIN:</span> <span id="hud-coins" style="color:#ffd000">0</span>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <!-- タッチコントローラー -->
  <div id="touch-controls">
    <div class="d-pad">
      <div class="ctrl-btn" id="btn-left">◀</div>
      <div class="ctrl-btn" id="btn-right">▶</div>
    </div>
    <div class="action-pad">
      <div class="ctrl-btn" id="btn-attack" style="font-size: 1.1rem; background: rgba(255,80,80,0.3); border-color:#ff5050;">⚔</div>
      <div class="ctrl-btn" id="btn-jump" style="font-size: 1.1rem; background: rgba(0,255,200,0.3); border-color:#00ffcc;">JUMP</div>
    </div>
  </div>

  <!-- スタート画面 -->
  <div id="screen-start" class="overlay">
    <h1>STAGE ACTION 2D</h1>
    <p>
      【操作方法】<br>
      ◀ / ▶: 左右移動<br>
      JUMP: ジャンプ<br>
      ⚔: 剣攻撃 (敵を踏んでも倒せます)<br>
      <br>
      敵やトゲを避けてゴールポールを目指そう！<br>
      (キーボード: A/D または 矢印キー, W/Spaceでジャンプ, J/Zで攻撃)
    </p>
    <button class="btn" id="btn-start">GAME START</button>
  </div>

  <!-- ステージクリア画面 -->
  <div id="screen-clear" class="overlay hidden">
    <h2>STAGE CLEAR!</h2>
    <p id="clear-msg">ステージ踏破完了！</p>
    <button class="btn" id="btn-next">NEXT STAGE</button>
  </div>

  <!-- 全クリ画面 -->
  <div id="screen-allclear" class="overlay hidden">
    <h1 style="color:#00ffcc;">ALL STAGES CLEARED!</h1>
    <p id="allclear-msg">おめでとうございます！<br>すべてのステージを制覇しました！</p>
    <button class="btn" id="btn-title">TITLE TO PLAY AGAIN</button>
  </div>

  <!-- ゲームオーバー画面 -->
  <div id="screen-gameover" class="overlay hidden">
    <h2 style="color:#ff3366">GAME OVER</h2>
    <p id="gameover-msg">トラップまたは敵に倒されました…</p>
    <button class="btn" id="btn-retry">RETRY STAGE</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // 解像度（横幅360, 縦幅640のスマホ縦画面）
  const V_WIDTH = 360;
  const V_HEIGHT = 640;
  canvas.width = V_WIDTH;
  canvas.height = V_HEIGHT;

  const hudStage = document.getElementById('hud-stage');
  const hudHearts = document.getElementById('hud-hearts');
  const hudCoins = document.getElementById('hud-coins');
  const screenStart = document.getElementById('screen-start');
  const screenClear = document.getElementById('screen-clear');
  const screenAllClear = document.getElementById('screen-allclear');
  const screenGameOver = document.getElementById('screen-gameover');

  let gameState = 'START'; // START, PLAYING, CLEAR, ALLCLEAR, GAMEOVER
  let currentStageIndex = 0;
  let totalCoins = 0;

  // 入力状態
  const input = {
    left: false,
    right: false,
    jump: false,
    attack: false
  };

  // タッチ入力設定
  function bindTouchBtn(elementId, key) {
    const el = document.getElementById(elementId);
    const startHandler = (e) => {
      e.preventDefault();
      input[key] = true;
      el.classList.add('active');
    };
    const endHandler = (e) => {
      e.preventDefault();
      input[key] = false;
      el.classList.remove('active');
    };
    el.addEventListener('touchstart', startHandler, { passive: false });
    el.addEventListener('touchend', endHandler, { passive: false });
    el.addEventListener('touchcancel', endHandler, { passive: false });
    el.addEventListener('mousedown', startHandler);
    el.addEventListener('mouseup', endHandler);
    el.addEventListener('mouseleave', endHandler);
  }

  bindTouchBtn('btn-left', 'left');
  bindTouchBtn('btn-right', 'right');
  bindTouchBtn('btn-jump', 'jump');
  bindTouchBtn('btn-attack', 'attack');

  // キーボード入力
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') input.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') input.right = true;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') input.jump = true;
    if (e.key === 'z' || e.key === 'Z' || e.key === 'j' || e.key === 'J') input.attack = true;
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') input.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') input.right = false;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') input.jump = false;
    if (e.key === 'z' || e.key === 'Z' || e.key === 'j' || e.key === 'J') input.attack = false;
  });

  // カメラ
  const camera = { x: 0, y: 0 };

  // ステージデータ定義
  // 1マス = 32px
  // T: 地形(Tile), S: トゲ(Spike), C: コイン(Coin), E: 敵(Slime), F: 敵(Flyer), G: ゴール(Goal), P: プレイヤー初期
  const STAGES = [
    // ステージ 1: 基本操作・チュートリアル
    {
      name: "1-1 緑の平原",
      map: [
        "..................................................",
        "..................................................",
        "..................................................",
        "...............................................G..",
        "......................CCC.....................TT..",
        "....................TTTTTTT...................TT..",
        ".............C.C..............C.C.............TT..",
        "...........TTTTTT............TTTTT............TT..",
        "...P...................E..............E.......TT..",
        "TTTTTTT...TTTTTTTTTT...TTTTTTTTTTTTTTTTTTTTTTTTT..",
        "TTTTTTT...TTTTTTTTTT...TTTTTTTTTTTTTTTTTTTTTTTTT..",
        "TTTTTTTSSSSTTTTTTTTTSSSTTTTTTTTTTTTTTTTTTTTTTTTT..",
      ]
    },
    // ステージ 2: 空中足場とトゲ
    {
      name: "1-2 浮島のアスレチック",
      map: [
        "........................................................",
        "........................................................",
        ".....................................................G..",
        "....................................................TT..",
        "..........................C..C...C..................TT..",
        "...................TTT...TTTTTTTTTT.................TT..",
        "............C.C......................TTT............TT..",
        "..........TTTTTT........E..................E........TT..",
        "...P...............TTTTTTTT..............TTTTTT.....TT..",
        "TTTTTT..............................................TT..",
        "TTTTTTSSSTTTTTTTSSSSSSSSSSSSSTTTTTTTSSSSSSSSSSSSSSSSSTTT",
        "TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT",
      ]
    },
    // ステージ 3: 難関ステージ
    {
      name: "1-3 危険な要塞",
      map: [
        "..................................................................",
        "..................................................................",
        "...............................................................G..",
        "..............................................................TT..",
        "........................C...C.......C.........................TT..",
        ".............C.C......TTTT.TTTT...TTTTT........TTTT...........TT..",
        "...........TTTTTT.............................................TT..",
        "...................E..........E...........E.........E.........TT..",
        "...P.............TTTTTT.....TTTTTT......TTTTT....TTTTTT.......TT..",
        "TTTTT...TTT...................................................TT..",
        "TTTTTSSSTTTSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSTTT.",
        "TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT.",
      ]
    }
  ];

  const TILE_SIZE = 32;

  // ゲーム内オブジェクト
  let platforms = [];
  let spikes = [];
  let coins = [];
  let enemies = [];
  let goal = { x: 0, y: 0, w: 24, h: 48 };
  let particles = [];

  // プレイヤークラス
  const player = {
    x: 0,
    y: 0,
    w: 24,
    h: 30,
    vx: 0,
    vy: 0,
    speed: 3.5,
    jumpPower: -8.8,
    isGrounded: false,
    facing: 1, // 1: 右, -1: 左
    hp: 3,
    maxHp: 3,
    invincibleTimer: 0,
    isAttacking: false,
    attackTimer: 0,
    attackBox: { x: 0, y: 0, w: 28, h: 26 },

    reset(x, y) {
      this.x = x;
      this.y = y;
      this.vx = 0;
      this.vy = 0;
      this.isGrounded = false;
      this.facing = 1;
      this.hp = this.maxHp;
      this.invincibleTimer = 0;
      this.isAttacking = false;
      this.attackTimer = 0;
    },

    takeDamage(amount = 1) {
      if (this.invincibleTimer > 0) return;
      this.hp -= amount;
      this.invincibleTimer = 60; // 1秒無敵
      this.vy = -5;
      this.vx = -this.facing * 3;
      spawnParticles(this.x + this.w/2, this.y + this.h/2, '#ff3366', 10);
      updateHUD();
      if (this.hp <= 0) {
        gameOver("体力がなくなりました");
      }
    },

    update() {
      // 左右移動
      if (input.left) {
        this.vx = -this.speed;
        this.facing = -1;

      } else if (input.right) {
        this.vx = this.speed;
        this.facing = 1;
      } else {
        this.vx *= 0.7;
        if (Math.abs(this.vx) < 0.1) this.vx = 0;
      }

      // ジャンプ
      if (input.jump && this.isGrounded) {
        this.vy = this.jumpPower;
        this.isGrounded = false;
        spawnParticles(this.x + this.w/2, this.y + this.h, '#fff', 5);
      }

      // 攻撃処理
      if (input.attack && !this.isAttacking && this.attackTimer === 0) {
        this.isAttacking = true;
        this.attackTimer = 18; // フレーム数
        spawnParticles(this.x + (this.facing === 1 ? this.w + 10 : -10), this.y + this.h / 2, '#ffd000', 6);
      }

      if (this.attackTimer > 0) {
        this.attackTimer--;
        if (this.attackTimer < 8) {
          this.isAttacking = false;
        }
      }

      // 重力
      this.vy += 0.38;
      if (this.vy > 10) this.vy = 10;

      // X方向の移動と衝突
      this.x += this.vx;
      this.checkCollisionX();

      // Y方向の移動と衝突
      this.y += this.vy;
      this.isGrounded = false;
      this.checkCollisionY();

      // 画面外落下死
      if (this.y > V_HEIGHT + 200) {
        this.takeDamage(3);
      }

      // 無敵時間カウント
      if (this.invincibleTimer > 0) {
        this.invincibleTimer--;
      }

      // 攻撃判定ボックス更新
      this.attackBox.x = this.facing === 1 ? this.x + this.w : this.x - this.attackBox.w;
      this.attackBox.y = this.y + 2;
    },

    checkCollisionX() {
      platforms.forEach(p => {
        if (checkRectOverlap(this.x, this.y, this.w, this.h, p.x, p.y, p.w, p.h)) {
          if (this.vx > 0) {
            this.x = p.x - this.w;
          } else if (this.vx < 0) {
            this.x = p.x + p.w;
          }
          this.vx = 0;
        }
      });
    },

    checkCollisionY() {
      platforms.forEach(p => {
        if (checkRectOverlap(this.x, this.y, this.w, this.h, p.x, p.y, p.w, p.h)) {
          if (this.vy > 0) {
            this.y = p.y - this.h;
            this.vy = 0;
            this.isGrounded = true;
          } else if (this.vy < 0) {
            this.y = p.y + p.h;
            this.vy = 0;
          }
        }
      });
    },

    draw() {
      if (this.invincibleTimer > 0 && Math.floor(this.invincibleTimer / 4) % 2 === 0) {
        return; // 点滅
      }

      const drawX = Math.round(this.x - camera.x);
      const drawY = Math.round(this.y - camera.y);

      ctx.save();
      // 胴体
      ctx.fillStyle = '#00ffcc';
      ctx.fillRect(drawX, drawY + 8, this.w, this.h - 8);

      // 頭部
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(drawX + 3, drawY, this.w - 6, 8);

      // 目
      ctx.fillStyle = '#111';
      const eyeX = this.facing === 1 ? drawX + this.w - 7 : drawX + 4;
      ctx.fillRect(eyeX, drawY + 3, 3, 3);

      // 剣攻撃エフェクト
      if (this.isAttacking) {
        ctx.fillStyle = '#ffd000';
        ctx.shadowColor = '#ffd000';
        ctx.shadowBlur = 8;
        const atkX = Math.round(this.attackBox.x - camera.x);
        const atkY = Math.round(this.attackBox.y - camera.y);
        ctx.fillRect(atkX, atkY, this.attackBox.w, this.attackBox.h);
      }
      ctx.restore();
    }
  };

  // 矩形判定ヘルパー
  function checkRectOverlap(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
  }

  // 敵クラス
  class Enemy {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.w = 26;
      this.h = 24;
      this.vx = -1.2;
      this.vy = 0;
      this.alive = true;
      this.patrolRange = 90;
      this.startX = x;
    }

    update() {
      if (!this.alive) return;

      this.x += this.vx;
      if (Math.abs(this.x - this.startX) > this.patrolRange) {
        this.vx *= -1;
      }

      // 地形ブロック衝突による反転
      platforms.forEach(p => {
        if (checkRectOverlap(this.x, this.y, this.w, this.h, p.x, p.y, p.w, p.h)) {
          this.vx *= -1;
          this.x += this.vx * 2;
        }
      });

      // プレイヤーの剣攻撃との判定
      if (player.isAttacking) {
        if (checkRectOverlap(this.x, this.y, this.w, this.h, player.attackBox.x, player.attackBox.y, player.attackBox.w, player.attackBox.h)) {
          this.defeat();
          return;
        }
      }

      // プレイヤーとの接触判定
      if (checkRectOverlap(this.x, this.y, this.w, this.h, player.x, player.y, player.w, player.h)) {
        // 踏みつけ判定 (プレイヤーが落下中かつ足元が敵の上半分)
        if (player.vy > 0 && player.y + player.h - player.vy <= this.y + 12) {
          player.vy = player.jumpPower * 0.75; // バウンド
          this.defeat();
        } else {
          player.takeDamage(1);
        }
      }
    }

    defeat() {
      this.alive = false;
      spawnParticles(this.x + this.w/2, this.y + this.h/2, '#ff4444', 12);
      totalCoins += 2;
      updateHUD();
    }

    draw() {
      if (!this.alive) return;
      const drawX = Math.round(this.x - camera.x);
      const drawY = Math.round(this.y - camera.y);

      ctx.save();
      ctx.fillStyle = '#ff3366';
      // スライム風ドーム
      ctx.beginPath();
      ctx.arc(drawX + this.w / 2, drawY + this.h - 8, this.w / 2, Math.PI, 0);
      ctx.lineTo(drawX + this.w, drawY + this.h);
      ctx.lineTo(drawX, drawY + this.h);
      ctx.fill();

      // 目
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(drawX + 5, drawY + 8, 4, 4);
      ctx.fillRect(drawX + 16, drawY + 8, 4, 4);
      ctx.fillStyle = '#000';
      ctx.fillRect(drawX + 6, drawY + 9, 2, 2);
      ctx.fillRect(drawX + 17, drawY + 9, 2, 2);
      ctx.restore();
    }
  }

  // パーティクル
  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      const angle = Math.random() * Math.PI * 2;
      const spd = Math.random() * 4 + 1;
      this.vx = Math.cos(angle) * spd;
      this.vy = Math.sin(angle) * spd;
      this.life = 1.0;
      this.decay = Math.random() * 0.05 + 0.03;
      this.color = color;
      this.size = Math.random() * 4 + 2;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life -= this.decay;
      return this.life > 0;
    }
    draw() {
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.life);
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x - camera.x, this.y - camera.y, this.size, this.size);
      ctx.restore();
    }
  }

  function spawnParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
      particles.push(new Particle(x, y, color));
    }
  }

  // ステージロード
  function loadStage(index) {
    const stageData = STAGES[index];
    platforms = [];
    spikes = [];
    coins = [];
    enemies = [];
    particles = [];

    const map = stageData.map;
    const startOffsetY = V_HEIGHT - (map.length * TILE_SIZE) - 60; // 画面下部寄り配置

    for (let row = 0; row < map.length; row++) {
      const line = map[row];
      for (let col = 0; col < line.length; col++) {
        const char = line[col];
        const x = col * TILE_SIZE;
        const y = startOffsetY + row * TILE_SIZE;

        if (char === 'T') {
          platforms.push({ x, y, w: TILE_SIZE, h: TILE_SIZE });
        } else if (char === 'S') {
          spikes.push({ x, y: y + 12, w: TILE_SIZE, h: 20 });
        } else if (char === 'C') {
          coins.push({ x: x + 8, y: y + 8, w: 16, h: 16, taken: false });
        } else if (char === 'E') {
          enemies.push(new Enemy(x, y + 8));
        } else if (char === 'G') {
          goal = { x: x + 6, y: y - 24, w: 20, h: 56 };
        } else if (char === 'P') {
          player.reset(x, y);
        }
      }
    }

    camera.x = 0;
    camera.y = 0;
    updateHUD();
  }

  function updateHUD() {
    hudStage.innerText = STAGES[currentStageIndex].name.split(' ')[0];
    hudCoins.innerText = totalCoins;
    hudHearts.innerHTML = '';
    for (let i = 0; i < player.maxHp; i++) {
      const span = document.createElement('span');
      span.className = 'heart';
      span.innerText = i < player.hp ? '♥' : '♡';
      hudHearts.appendChild(span);
    }
  }

  function gameOver(msg) {
    gameState = 'GAMEOVER';
    document.getElementById('gameover-msg').innerText = msg;
    screenGameOver.classList.remove('hidden');
  }

  function stageClear() {
    gameState = 'CLEAR';
    if (currentStageIndex < STAGES.length - 1) {
      document.getElementById('clear-msg').innerText = `${STAGES[currentStageIndex].name} をクリア！`;
      screenClear.classList.remove('hidden');
    } else {
      gameState = 'ALLCLEAR';
      document.getElementById('allclear-msg').innerHTML = `全ステージ踏破達成！<br>獲得コイン数: ${totalCoins}`;
      screenAllClear.classList.remove('hidden');
    }
  }

  // メインループ
  let lastTime = performance.now();
  function gameLoop(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    // 背景描画
    ctx.fillStyle = '#171b26';
    ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

    // 背景装飾（パララックス風山並み）
    ctx.fillStyle = '#22293a';
    for (let i = 0; i < 6; i++) {
      const bx = i * 140 - (camera.x * 0.2) % 140;
      ctx.beginPath();
      ctx.moveTo(bx - 30, V_HEIGHT);
      ctx.lineTo(bx + 70, V_HEIGHT - 180);
      ctx.lineTo(bx + 170, V_HEIGHT);
      ctx.fill();
    }

    if (gameState === 'PLAYING') {
      player.update();

      // カメラ追従 (横方向中央に補間)
      const targetCamX = player.x - V_WIDTH / 2 + player.w / 2;
      camera.x += (targetCamX - camera.x) * 0.1;
      if (camera.x < 0) camera.x = 0;

      // 敵更新
      enemies.forEach(e => e.update());

      // コイン収集判定
      coins.forEach(c => {
        if (!c.taken && checkRectOverlap(player.x, player.y, player.w, player.h, c.x, c.y, c.w, c.h)) {
          c.taken = true;
          totalCoins++;
          spawnParticles(c.x + c.w/2, c.y + c.h/2, '#ffd000', 8);
          updateHUD();
        }
      });

      // トゲ接触判定
      spikes.forEach(s => {
        if (checkRectOverlap(player.x, player.y, player.w, player.h, s.x, s.y, s.w, s.h)) {
          player.takeDamage(1);
        }
      });

      // ゴール判定
      if (checkRectOverlap(player.x, player.y, player.w, player.h, goal.x, goal.y, goal.w, goal.h)) {
        stageClear();
      }
    }

    // 地形描画
    platforms.forEach(p => {
      const px = Math.round(p.x - camera.x);
      const py = Math.round(p.y - camera.y);
      if (px + p.w < -20 || px > V_WIDTH + 20) return;

      // ブロック描画
      ctx.fillStyle = '#3e4a61';
      ctx.fillRect(px, py, p.w, p.h);
      ctx.fillStyle = '#5c6b8a';
      ctx.fillRect(px, py, p.w, 4); // 上面ハイライト
      ctx.strokeStyle = '#272f3d';
      ctx.strokeRect(px, py, p.w, p.h);
    });

    // トゲ描画
    spikes.forEach(s => {
      const sx = Math.round(s.x - camera.x);
      const sy = Math.round(s.y - camera.y);
      ctx.fillStyle = '#e53e3e';
      const spikeCount = 3;
      const spikeW = s.w / spikeCount;
      for (let i = 0; i < spikeCount; i++) {
        ctx.beginPath();
        ctx.moveTo(sx + i * spikeW, sy + s.h);
        ctx.lineTo(sx + (i + 0.5) * spikeW, sy);
        ctx.lineTo(sx + (i + 1) * spikeW, sy + s.h);
        ctx.fill();
      }
    });

    // コイン描画
    coins.forEach(c => {
      if (c.taken) return;
      const cx = Math.round(c.x - camera.x);
      const cy = Math.round(c.y - camera.y);
      ctx.save();
      ctx.fillStyle = '#ffd000';
      ctx.shadowColor = '#ffd000';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(cx + c.w / 2, cy + c.h / 2, c.w / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    // ゴールフラッグ描画
    const gx = Math.round(goal.x - camera.x);
    const gy = Math.round(goal.y - camera.y);
    ctx.fillStyle = '#888';
    ctx.fillRect(gx, gy, 4, goal.h); // ポール
    ctx.fillStyle = '#00ffcc';
    ctx.beginPath();
    ctx.moveTo(gx + 4, gy);
    ctx.lineTo(gx + 26, gy + 12);
    ctx.lineTo(gx + 4, gy + 24);
    ctx.fill(); // 旗

    // 敵描画
    enemies.forEach(e => e.draw());

    // プレイヤー描画
    player.draw();

    // パーティクル更新・描画
    for (let i = particles.length - 1; i >= 0; i--) {
      if (particles[i].update()) {
        particles[i].draw();
      } else {
        particles.splice(i, 1);
      }
    }

    requestAnimationFrame(gameLoop);
  }

  // ボタン設定
  document.getElementById('btn-start').onclick = () => {
    currentStageIndex = 0;
    totalCoins = 0;
    loadStage(currentStageIndex);
    screenStart.classList.add('hidden');
    gameState = 'PLAYING';
  };

  document.getElementById('btn-retry').onclick = () => {
    loadStage(currentStageIndex);
    screenGameOver.classList.add('hidden');
    gameState = 'PLAYING';
  };

  document.getElementById('btn-next').onclick = () => {
    currentStageIndex++;
    loadStage(currentStageIndex);
    screenClear.classList.add('hidden');
    gameState = 'PLAYING';
  };

  document.getElementById('btn-title').onclick = () => {
    screenAllClear.classList.add('hidden');
    screenStart.classList.remove('hidden');
    gameState = 'START';
  };

  requestAnimationFrame(gameLoop);
})();
</script>
</body>
