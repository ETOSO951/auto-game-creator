<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>斬影 - ZANEI: CYBERNETIC SLASHER</title>
  <style>
    :root {
      --bg: #03050b;
      --accent: #00ffcc;
      --accent-glow: rgba(0, 255, 204, 0.4);
      --danger: #ff0055;
      --danger-glow: rgba(255, 0, 85, 0.5);
      --warning: #ffaa00;
      --font-main: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: var(--font-main);
      color: #fff;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Minimal Cinematic Vignette & Chromatic Aberration */
    #vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.8);
      background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0, 0, 0, 0.15) 50%);
      background-size: 100% 4px;
      transition: box-shadow 0.4s ease;
    }
    #vignette.danger {
      box-shadow: inset 0 0 180px rgba(255, 0, 85, 0.8);
      animation: vignettePulse 1s ease infinite alternate;
    }
    @keyframes vignettePulse {
      0% { box-shadow: inset 0 0 120px rgba(255, 0, 85, 0.5); }
      100% { box-shadow: inset 0 0 200px rgba(255, 0, 85, 0.9); }
    }

    /* アイデア3: クロマティックアベレーション＆フィルムノイズレイヤー */
    .glitch-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease;
      background: rgba(255, 0, 85, 0.05);
      mix-blend-mode: screen;
    }
    .glitch-overlay.active {
      opacity: 1;
      animation: glitchAnim 0.2s steps(2, start) infinite;
    }
    @keyframes glitchAnim {
      0% { transform: translate(2px, -2px); filter: hue-rotate(90deg); }
      50% { transform: translate(-2px, 2px); filter: hue-rotate(-90deg); }
      100% { transform: translate(0, 0); filter: none; }
    }

    /* UI Base Layer */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }

    .unified-panel, .score-panel {
      background: rgba(3, 5, 11, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: opacity 0.4s ease, transform 0.4s ease, background 0.4s ease, border-color 0.4s ease;
      opacity: 0.4;
    }
    .unified-panel.active, .score-panel.active,
    .unified-panel:hover, .score-panel:hover {
      opacity: 1;
      background: rgba(3, 5, 11, 0.75);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .unified-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 260px;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 8px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 700;
    }

    .bar-outer {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 1.5px;
      overflow: hidden;
    }

    .bar-inner {
      width: 100%;
      height: 100%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
      transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hp-inner {
      background: linear-gradient(90deg, var(--danger), var(--accent));
    }

    .score-panel {
      text-align: right;
    }

    .floor-indicator {
      font-size: 8px;
      letter-spacing: 2px;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 2px;
    }

    .score-val {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }

    .boss-hud {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      max-width: 85%;
      background: rgba(11, 3, 5, 0.75);
      border: 1px solid rgba(255, 0, 85, 0.25);
      border-radius: 12px;
      padding: 12px 20px;
      display: none;
      flex-direction: column;
      gap: 6px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(255, 0, 85, 0.15);
    }
    .boss-hud.active { display: flex; }
    .boss-bar { background: linear-gradient(90deg, var(--danger), var(--warning)); }

    .feed-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      text-align: center;
    }
    .kill-feed {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--accent);
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      text-shadow: 0 0 16px var(--accent-glow);
    }
    .kill-feed.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Touch Controls */
    .touch-surface {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: auto;
      display: none;
      z-index: 8;
    }
    @media (hover: none) and (pointer: coarse) {
      .touch-surface { display: block; }
    }

    .dynamic-stick {
      position: absolute;
      width: 100px;
      height: 100px;
      border: 1px solid rgba(0, 255, 204, 0.3);
      background: rgba(0, 255, 204, 0.03);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      backdrop-filter: blur(4px);
      z-index: 15;
    }
    .dynamic-stick.active { display: block; }

    .dynamic-nub {
      width: 40px;
      height: 40px;
      background: rgba(0, 255, 204, 0.8);
      border-radius: 50%;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .touch-actions {
      position: absolute;
      bottom: 32px;
      right: 32px;
      display: none;
      gap: 14px;
      align-items: flex-end;
      pointer-events: auto;
      z-index: 15;
    }
    @media (hover: none) and (pointer: coarse) {
      .touch-actions { display: flex; }
    }

    .act-btn {
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s ease, background 0.2s ease, opacity 0.3s ease;
      backdrop-filter: blur(8px);
      opacity: 0.4;
    }
    .touch-actions:active .act-btn, .act-btn:active {
      opacity: 0.95;
      transform: scale(0.92);
    }

    .btn-slash {
      width: 72px; height: 72px; font-size: 13px;
      background: rgba(255, 0, 85, 0.25);
      border-color: rgba(255, 0, 85, 0.5);
      box-shadow: 0 0 20px var(--danger-glow);
    }
    .btn-skill, .btn-jump {
      width: 52px; height: 52px; font-size: 9px;
    }
    .btn-skill {
      background: rgba(0, 136, 255, 0.2);
      border-color: rgba(0, 136, 255, 0.4);
    }
    .btn-jump {
      background: rgba(0, 255, 204, 0.15);
      border-color: rgba(0, 255, 204, 0.3);
    }

    /* Screen Overlays & Cinematic Glitch Effects (アイデア1, 2) */
    .screen-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 100;
      background: rgba(3, 5, 11, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
      transition: opacity 0.5s ease, visibility 0.5s;
    }
    .screen-overlay.hidden {
      opacity: 0; visibility: hidden; pointer-events: none;
    }

    .screen-title {
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 900;
      letter-spacing: 6px;
      color: #fff;
      margin-bottom: 8px;
      text-transform: uppercase;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
      position: relative;
    }
    
    /* アイデア2: グリッチアニメーション付きタイトル */
    .screen-overlay:not(.hidden) .screen-title {
      animation: titleGlitch 2s infinite;
    }
    @keyframes titleGlitch {
      0%, 90%, 100% { transform: none; text-shadow: 0 0 30px rgba(255, 255, 255, 0.15); }
      92% { transform: translate(-3px, 1px); text-shadow: 3px 0 var(--danger), -3px 0 var(--accent); }
      95% { transform: translate(3px, -1px); text-shadow: -3px 0 var(--danger), 3px 0 var(--accent); }
    }

    .screen-sub {
      color: rgba(255, 255, 255, 0.4);
      font-size: 10px;
      letter-spacing: 4px;
      margin-bottom: 36px;
      font-weight: 600;
    }

    /* アイデア2: サマリーデータログの美学 */
    .data-summary-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 16px 28px;
      margin-bottom: 30px;
      text-align: left;
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--accent);
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: inset 0 0 15px rgba(0, 255, 204, 0.05);
    }
    .data-summary-box span {
      color: rgba(255, 255, 255, 0.7);
    }

    .primary-btn {
      pointer-events: auto;
      background: #fff;
      color: #03050b;
      border: none;
      padding: 16px 44px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 45px rgba(0, 255, 204, 0.35);
      background: var(--accent);
    }

    .selector-container {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 580px;
    }
    .select-card {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 18px 20px;
      cursor: pointer;
      width: 140px;
      text-align: center;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .select-card.selected, .select-card:hover {
      background: rgba(0, 255, 204, 0.06);
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.15);
      transform: translateY(-2px);
    }
    .card-name {
      font-weight: 700;
      font-size: 12px;
      color: #fff;
      margin-bottom: 4px;
    }
    .card-detail {
      font-size: 8px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 1px;
    }

    .perk-cards {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 820px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .perk-card {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 28px 22px;
      width: 230px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: left;
    }
    .perk-card:hover {
      background: rgba(0, 255, 204, 0.06);
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 12px 35px rgba(0, 255, 204, 0.12);
    }
    .perk-title {
      font-weight: 700;
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .perk-desc {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.5;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="vignette"></div>
  <div id="glitch-overlay" class="glitch-overlay"></div>

  <!-- Ingame Minimal HUD -->
  <div class="ui-layer">
    <div class="hud-top">
      <div id="unified-panel" class="unified-panel">
        <div class="hud-row">
          <span>VITAL</span>
          <span id="biome-label" style="color: var(--accent);">NEON CITY</span>
        </div>
        <div class="bar-outer">
          <div id="hp-bar" class="bar-inner hp-inner"></div>
        </div>
        <div class="hud-row" style="margin-top: 2px;">
          <span>SKILL [E]</span>
        </div>
        <div class="bar-outer">
          <div id="skill-bar" class="bar-inner"></div>
        </div>
      </div>

      <div id="score-panel" class="score-panel">
        <div id="floor-badge" class="floor-indicator">FLOOR 1</div>
        <div id="score-display" class="score-val">0</div>
      </div>
    </div>

    <div id="boss-hud" class="boss-hud">
      <div class="hud-row">
        <span id="boss-name" style="color: var(--danger);">OVERLORD</span>
        <span id="boss-hp-val" style="color: #fff;">100%</span>
      </div>
      <div class="bar-outer">
        <div id="boss-hp-bar" class="bar-inner boss-bar"></div>
      </div>
    </div>

    <div class="feed-container">
      <div id="kill-feed" class="kill-feed">SLASHED</div>
    </div>
  </div>

  <div id="touch-surface" class="touch-surface">
    <div id="dynamic-stick" class="dynamic-stick">
      <div id="dynamic-nub" class="dynamic-nub"></div>
    </div>
  </div>
  <div id="touch-actions" class="touch-actions">
    <button id="btn-skill" class="act-btn btn-skill">技能</button>
    <button id="btn-jump" class="act-btn btn-jump">JUMP</button>
    <button id="btn-slash" class="act-btn btn-slash">斬</button>
  </div>

  <!-- Start Screen (アイデア1: アトラクトデモ背景対応) -->
  <div id="screen-start" class="screen-overlay">
    <h1 class="screen-title">斬影 : ZANEI</h1>
    <p class="screen-sub">CYBERNETIC SLASHER</p>
    
    <div style="font-size: 8px; letter-spacing: 3px; color: rgba(255,255,255,0.3); margin-bottom: 14px; font-weight: 700;">WEAPON TYPE</div>
    <div class="selector-container" id="weapon-selector">
      <div class="select-card selected" data-val="saber">
        <div class="card-name">セイバー</div>
        <div class="card-detail">標準バランス</div>
      </div>
      <div class="select-card" data-val="odachi">
        <div class="card-name">大太刀</div>
        <div class="card-detail">高威力・高リーチ</div>
      </div>
      <div class="select-card" data-val="dual">
        <div class="card-name">双刀</div>
        <div class="card-detail">超高速連撃</div>
      </div>
    </div>

    <button id="btn-start" class="primary-btn">ENTER NET</button>
  </div>

  <!-- Roguelike Perk Screen -->
  <div id="screen-perk" class="screen-overlay hidden">
    <h2 class="screen-title" style="font-size: 28px;">FLOOR CLEAR</h2>
    <p class="screen-sub">ニューラルモジュールを選択</p>
    <div id="perk-list" class="perk-cards"></div>
  </div>

  <!-- Game Over Screen (アイデア2: データサマリー演出) -->
  <div id="screen-gameover" class="screen-overlay hidden">
    <h1 class="screen-title" style="color: var(--danger);">DISCONNECTED</h1>
    <p class="screen-sub">シグナルが切断されました</p>
    <div class="data-summary-box" id="gameover-summary">
      <div>SESSION_FLOOR: <span id="summary-floor">1</span></div>
      <div>FINAL_SCORE: <span id="summary-score">0</span></div>
      <div>STATUS: <span style="color: var(--danger);">NEURAL_COLLAPSE</span></div>
    </div>
    <button id="btn-restart" class="primary-btn">REBOOT</button>
  </div>

  <script>
    /* ========================================================
       1. Synthesizer (Web Audio API)
       ======================================================== */
    class SoundFX {
      constructor() { this.ctx = null; }
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      play(type) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.ctx.destination);

        if (type === 'slash') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.18);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.start(now); osc.stop(now + 0.18);
        } else if (type === 'hit') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'jump') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(250, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        }
      }
    }
    const audio = new SoundFX();

    /* ========================================================
       2. Input System & Dynamic Touch
       ======================================================== */
    class InputSystem {
      constructor() {
        this.commands = { slash: 0, jump: 0, skill: 0 };
        this.keys = {};
        window.addEventListener('keydown', e => {
          if (!this.keys[e.code]) {
            this.keys[e.code] = true;
            if (e.code === 'KeyJ' || e.code === 'Space') this.push('slash');
            if (e.code === 'KeyK') this.push('jump');
            if (e.code === 'KeyE') this.push('skill');
          }
        });
        window.addEventListener('keyup', e => { this.keys[e.code] = false; });
      }
      push(cmd) {
        this.commands[cmd] = 10;
        triggerHUDActive();
      }
      consume(cmd) {
        if (this.commands[cmd] > 0) { this.commands[cmd] = 0; return true; }
        return false;
      }
      update() {
        for (let k in this.commands) if (this.commands[k] > 0) this.commands[k]--;
      }
      clear() { this.commands.slash = 0; this.commands.jump = 0; this.commands.skill = 0; }
    }
    const inputSys = new InputSystem();

    let hudActiveTimer = 0;
    function triggerHUDActive() {
      const panel = document.getElementById('unified-panel');
      const scorePanel = document.getElementById('score-panel');
      panel.classList.add('active');
      scorePanel.classList.add('active');
      hudActiveTimer = 1.5;
    }

    /* ========================================================
       3. Three.js Engine Setup
       ======================================================== */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x03050b);
    scene.fog = new THREE.FogExp2(0x03050b, 0.025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 120);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x00ffcc, 1.5);
    dirLight.position.set(30, 50, 30);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0x00ffcc, 2.0, 40);
    scene.add(pointLight);

    const GAME_STATE = { TITLE: 0, PLAYING: 1, PERK_SELECT: 2, GAMEOVER: 3 };
    let state = GAME_STATE.TITLE;

    const stats = {
      maxHp: 100, hp: 100, score: 0, floor: 1,
      moveSpeed: 12.0, slashDamage: 45, slashRange: 4.5,
      skillCooldown: 0, skillMaxCooldown: 6.0, weaponType: 'saber'
    };

    let enemies = [], particles = [], platforms = [], boss = null, portal = null;
    let cameraShake = 0, hitStopFrames = 0;
    const raycaster = new THREE.Raycaster();

    const BIOMES = [
      { name: 'NEON CITY', color: 0x0a1122, lightColor: 0x00ffcc },
      { name: 'DATA SECTOR', color: 0x220a1c, lightColor: 0xff0055 },
      { name: 'DEEP MATRIX', color: 0x111122, lightColor: 0x0088ff }
    ];

    /* ========================================================
       4. Player Setup
       ======================================================== */
    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0c1322, roughness: 0.2, metalness: 0.9 });
    const bodyMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.18, 1.1, 12), bodyMat);
    bodyMesh.position.y = 0.55;
    playerGroup.add(bodyMesh);

    const bladeMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 2.0, roughness: 0.1 });
    const katanaGroup = new THREE.Group();
    katanaGroup.position.set(0.38, 0.55, 0);
    const bladeMesh = new THREE.Mesh(new THREE.BoxGeometry(0.03, 1.2, 0.07), bladeMat);
    bladeMesh.position.set(0, 0.45, 0.25);
    bladeMesh.rotation.x = Math.PI / 4;
    katanaGroup.add(bladeMesh);
    playerGroup.add(katanaGroup);

    const slashArc = new THREE.Mesh(
      new THREE.RingGeometry(1.4, 4.0, 32, 1, 0, Math.PI),
      new THREE.MeshBasicMaterial({ color: 0x00ffcc, side: THREE.DoubleSide, transparent: true, opacity: 0, blending: THREE.AdditiveBlending })
    );
    slashArc.rotation.x = Math.PI / 2;
    slashArc.position.y = 0.55;
    playerGroup.add(slashArc);

    const playerPhysics = {
      position: new THREE.Vector3(), prevPosition: new THREE.Vector3(),
      velocity: new THREE.Vector3(), quaternion: new THREE.Quaternion(), prevQuaternion: new THREE.Quaternion(),
      targetQuaternion: new THREE.Quaternion(), isGrounded: false,
      isSlashing: false, slashTime: 0, slashDuration: 0.2, slashHitTriggered: false
    };

    function applyWeapon(type) {
      stats.weaponType = type;
      if (type === 'saber') { stats.slashDamage = 45; stats.slashRange = 4.5; bladeMesh.scale.set(1, 1, 1); }
      else if (type === 'odachi') { stats.slashDamage = 75; stats.slashRange = 6.0; bladeMesh.scale.set(1.6, 1.3, 1.4); }
      else if (type === 'dual') { stats.slashDamage = 35; stats.slashRange = 3.8; bladeMesh.scale.set(0.7, 0.8, 0.8); }
    }

    /* ========================================================
       5. Stage & Enemy Generation
       ======================================================== */
    function clearLevel() {
      platforms.forEach(p => scene.remove(p)); platforms = [];
      enemies.forEach(e => scene.remove(e.group)); enemies = [];
      if (boss) { scene.remove(boss.group); boss = null; document.getElementById('boss-hud').classList.remove('active'); }
      if (portal) { scene.remove(portal); portal = null; }
    }

    function createPlatform(x, y, z, w, h, d, color = 0x0a1122) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.7 })
      );
      mesh.position.set(x, y, z);
      mesh.receiveShadow = true; mesh.castShadow = true;
      scene.add(mesh);
      platforms.push(mesh);
      return mesh;
    }

    function generateStage(floorNum) {
      clearLevel();
      const isBoss = (floorNum % 3 === 0);
      const biome = BIOMES[(floorNum - 1) % BIOMES.length];

      scene.background.set(biome.color);
      scene.fog.color.set(biome.color);
      dirLight.color.set(biome.lightColor);
      pointLight.color.set(biome.lightColor);

      document.getElementById('biome-label').textContent = isBoss ? 'BOSS ARENA' : biome.name;
      document.getElementById('biome-label').style.color = `#${biome.lightColor.toString(16)}`;

      createPlatform(0, -0.5, 0, 14, 1, 14, biome.color);
      playerPhysics.position.set(0, 2, 0);
      playerPhysics.prevPosition.copy(playerPhysics.position);
      playerPhysics.velocity.set(0, 0, 0);

      if (isBoss) {
        createPlatform(0, -0.5, -20, 18, 1, 20, biome.color);
        spawnBoss(0, 1.5, -22);
      } else {
        const pathLen = 5 + floorNum;
        let currPos = new THREE.Vector3(0, -0.5, 0);

        for (let i = 0; i < pathLen; i++) {
          currPos.x += (Math.random() - 0.5) * 12;
          currPos.z -= (8 + Math.random() * 6);
          currPos.y += (Math.random() - 0.4) * 3;
          createPlatform(currPos.x, currPos.y, currPos.z, 6 + Math.random() * 4, 1, 6 + Math.random() * 4, biome.color);

          if (i > 0) {
            const count = 1 + Math.floor(Math.random() * 2);
            for (let e = 0; e < count; e++) {
              spawnEnemy(currPos.x + (Math.random() - 0.5) * 3, currPos.y + 1.2, currPos.z + (Math.random() - 0.5) * 3);
            }
          }
        }

        currPos.z -= 10;
        createPlatform(currPos.x, currPos.y, currPos.z, 8, 1, 8, biome.color);
        portal = new THREE.Mesh(
          new THREE.TorusGeometry(1.8, 0.25, 16, 32),
          new THREE.MeshBasicMaterial({ color: biome.lightColor, wireframe: true })
        );
        portal.position.set(currPos.x, currPos.y + 2.2, currPos.z);
        scene.add(portal);
      }
    }

    function spawnEnemy(x, y, z) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      const mesh = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.8, 0),
        new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.1, metalness: 0.9, emissive: 0xff0055, emissiveIntensity: 1.0 })
      );
      mesh.castShadow = true;
      group.add(mesh);
      scene.add(group);

      enemies.push({
        group, mesh,
        position: new THREE.Vector3(x, y, z),
        prevPosition: new THREE.Vector3(x, y, z),
        hp: 50 + stats.floor * 15, maxHp: 50 + stats.floor * 15,
        speed: 5.5, velocity: new THREE.Vector3()
      });
    }

    function spawnBoss(x, y, z) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      const mesh = new THREE.Mesh(
        new THREE.IcosahedronGeometry(1.6, 1),
        new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.1, metalness: 0.9, emissive: 0xff0055, emissiveIntensity: 1.5 })
      );
      mesh.castShadow = true;
      group.add(mesh);
      scene.add(group);

      boss = {
        group, mesh,
        position: new THREE.Vector3(x, y, z),
        prevPosition: new THREE.Vector3(x, y, z),
        hp: 800 + stats.floor * 250, maxHp: 800 + stats.floor * 250, speed: 5.0
      };

      document.getElementById('boss-hud').classList.add('active');
      document.getElementById('boss-name').textContent = `OVERLORD : FLOOR ${stats.floor}`;
    }

    /* ========================================================
       6. Combat System, Upgrades & FX
       ======================================================== */
    function triggerGlitchEffect() {
      const overlay = document.getElementById('glitch-overlay');
      overlay.classList.add('active');
      setTimeout(() => overlay.classList.remove('active'), 200);
    }

    function triggerSlash() {
      if (playerPhysics.isSlashing) return;
      playerPhysics.isSlashing = true;
      playerPhysics.slashTime = playerPhysics.slashDuration;
      playerPhysics.slashHitTriggered = false;

      audio.play('slash');
      slashArc.material.opacity = 0.9;
      slashArc.scale.set(stats.slashRange * 0.5, stats.slashRange * 0.5, 1);
      katanaGroup.rotation.y = -Math.PI * 0.7;
    }

    function triggerSkill() {
      if (stats.skillCooldown > 0) return;
      stats.skillCooldown = stats.skillMaxCooldown;
      audio.play('slash');
      triggerGlitchEffect();
      playerPhysics.velocity.add(new THREE.Vector3(0, 0, -1).applyQuaternion(playerPhysics.quaternion).multiplyScalar(22));
      showFeed('【閃光】 サイバーダッシュ！');
    }

    function executeSlashHit() {
      const pPos = playerPhysics.position;
      
      if (boss && pPos.distanceTo(boss.position) <= stats.slashRange + 1.5) {
        boss.hp -= stats.slashDamage;
        audio.play('hit');
        hitStopFrames = 6; cameraShake = 0.5;
        spawnParticles(boss.position.clone(), 0xff0055);
        triggerHUDActive();
        
        const pct = Math.max(0, (boss.hp / boss.maxHp) * 100);
        document.getElementById('boss-hp-bar').style.width = `${pct}%`;
        document.getElementById('boss-hp-val').textContent = `${Math.round(pct)}%`;

        if (boss.hp <= 0) {
          stats.score += 2000;
          showFeed('BOSS DESTROYED +2000');
          scene.remove(boss.group); boss = null;
          document.getElementById('boss-hud').classList.remove('active');
          portal = new THREE.Mesh(
            new THREE.TorusGeometry(1.8, 0.25, 16, 32),
            new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true })
          );
          portal.position.set(pPos.x, pPos.y + 1, pPos.z - 6);
          scene.add(portal);
        }
      }

      enemies.forEach((enemy, idx) => {
        if (pPos.distanceTo(enemy.position) <= stats.slashRange) {
          enemy.hp -= stats.slashDamage;
          audio.play('hit');
          hitStopFrames = 8; cameraShake = 0.4;
          spawnParticles(enemy.position.clone(), 0x00ffcc);
          triggerHUDActive();

          if (enemy.hp <= 0) {
            stats.score += 100;
            showFeed('SLASHED +100');
            scene.remove(enemy.group);
            enemies.splice(idx, 1);
          }
        }
      });
      updateHUD();
    }

    function showFeed(msg) {
      const feed = document.getElementById('kill-feed');
      feed.textContent = msg;
      feed.classList.add('show');
      setTimeout(() => feed.classList.remove('show'), 900);
    }

    function spawnParticles(pos, color) {
      const geom = new THREE.BoxGeometry(0.12, 0.12, 0.12);
      const mat = new THREE.MeshBasicMaterial({ color });
      for (let i = 0; i < 20; i++) {
        const p = new THREE.Mesh(geom, mat);
        p.position.copy(pos);
        const vel = new THREE.Vector3((Math.random() - 0.5) * 14, Math.random() * 12 + 4, (Math.random() - 0.5) * 14);
        scene.add(p);
        particles.push({ mesh: p, vel, life: 0.6 });
      }
    }

    /* ========================================================
       7. Touch Controls & UI Management
       ======================================================== */
    const stick = { active: false, x: 0, y: 0, identifier: null };
    const touchSurface = document.getElementById('touch-surface');
    const dynamicStick = document.getElementById('dynamic-stick');
    const dynamicNub = document.getElementById('dynamic-nub');

    touchSurface.addEventListener('touchstart', e => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (!stick.active && t.clientX < window.innerWidth / 2) {
          stick.active = true;
          stick.identifier = t.identifier;
          dynamicStick.style.left = `${t.clientX}px`;
          dynamicStick.style.top = `${t.clientY}px`;
          dynamicStick.classList.add('active');
          dynamicNub.style.transform = 'translate(-50%, -50%)';
          stick.x = 0; stick.y = 0;
        } else if (t.clientX >= window.innerWidth / 2) {
          inputSys.push('slash');
        }
      }
    }, { passive: false });

    touchSurface.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!stick.active) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === stick.identifier) {
          const rect = dynamicStick.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const dx = t.clientX - centerX;
          const dy = t.clientY - centerY;
          const dist = Math.min(35, Math.hypot(dx, dy));
          const angle = Math.atan2(dy, dx);
          stick.x = (Math.cos(angle) * dist) / 35;
          stick.y = (Math.sin(angle) * dist) / 35;
          dynamicNub.style.transform = `translate(calc(-50% + ${stick.x * 30}px), calc(-50% + ${stick.y * 30}px))`;
        }
      }
    }, { passive: false });

    touchSurface.addEventListener('touchend', e => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === stick.identifier) {
          stick.active = false;
          stick.identifier = null;
          stick.x = 0; stick.y = 0;
          dynamicStick.classList.remove('active');
        }
      }
    }, { passive: false });

    document.getElementById('btn-slash').addEventListener('touchstart', (e) => { e.stopPropagation(); inputSys.push('slash'); });
    document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.stopPropagation(); inputSys.push('jump'); });
    document.getElementById('btn-skill').addEventListener('touchstart', (e) => { e.stopPropagation(); inputSys.push('skill'); });

    document.querySelectorAll('#weapon-selector .select-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('#weapon-selector .select-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        applyWeapon(card.getAttribute('data-val'));
      });
    });

    const PERKS = [
      { name: 'アタック強化', desc: '斬撃攻撃力 +30%', apply: () => stats.slashDamage = Math.round(stats.slashDamage * 1.3) },
      { name: 'レンジ拡張', desc: '斬撃リーチ +25%', apply: () => stats.slashRange *= 1.25 },
      { name: 'ナノリペア', desc: 'HP全回復 & 最大HP +30', apply: () => { stats.maxHp += 30; stats.hp = stats.maxHp; } }
    ];

    function showPerkScreen() {
      state = GAME_STATE.PERK_SELECT;
      const screen = document.getElementById('screen-perk');
      const list = document.getElementById('perk-list');
      list.innerHTML = '';

      PERKS.forEach(perk => {
        const card = document.createElement('div');
        card.className = 'perk-card';
        card.innerHTML = `<div class="perk-title">${perk.name}</div><div class="perk-desc">${perk.desc}</div>`;
        card.onclick = () => {
          perk.apply();
          stats.floor++;
          screen.classList.add('hidden');
          generateStage(stats.floor);
          state = GAME_STATE.PLAYING;
        };
        list.appendChild(card);
      });
      screen.classList.remove('hidden');
    }

    function updateHUD() {
      const hpPct = Math.max(0, (stats.hp / stats.maxHp) * 100);
      document.getElementById('hp-bar').style.width = `${hpPct}%`;
      const skillPct = Math.max(0, (1 - stats.skillCooldown / stats.skillMaxCooldown) * 100);
      document.getElementById('skill-bar').style.width = `${skillPct}%`;
      document.getElementById('score-display').textContent = stats.score;
      document.getElementById('floor-badge').textContent = `FLOOR ${stats.floor}`;

      const vignette = document.getElementById('vignette');
      if (hpPct < 30) {
        vignette.classList.add('danger');
        triggerHUDActive();
      } else {
        vignette.classList.remove('danger');
      }
    }

    function gameOver() {
      state = GAME_STATE.GAMEOVER;
      triggerGlitchEffect();
      document.getElementById('boss-hud').classList.remove('active');
      
      // アイデア2: サマリーデータのタイピング・数値反映演出
      document.getElementById('summary-floor').textContent = stats.floor;
      document.getElementById('summary-score').textContent = stats.score;
      document.getElementById('screen-gameover').classList.remove('hidden');
    }

    function startGame() {
      audio.init();
      stats.hp = stats.maxHp; stats.score = 0; stats.floor = 1; stats.skillCooldown = 0;
      inputSys.clear();
      updateHUD();
      generateStage(stats.floor);
      document.getElementById('screen-start').classList.add('hidden');
      document.getElementById('screen-gameover').classList.add('hidden');
      state = GAME_STATE.PLAYING;
    }

    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-restart').addEventListener('click', startGame);

    // 初期タイトル用ステージ生成
    generateStage(1);

    /* ========================================================
       8. Main Game Loop
       ======================================================== */
    const FIXED_TIMESTEP = 1 / 60;
    let accumulator = 0, lastTime = performance.now();

    function update(delta) {
      if (state === GAME_STATE.TITLE) {
        // アイデア1: タイトル画面用アトラクトデモ（背景自動旋回・微小移動）
        playerGroup.position.y = 2 + Math.sin(performance.now() * 0.002) * 0.5;
        playerGroup.rotation.y += delta * 0.5;
        camera.position.set(0, 8, 14);
        camera.lookAt(playerGroup.position);
        return;
      }

      if (state !== GAME_STATE.PLAYING) return;
      inputSys.update();
      if (stats.skillCooldown > 0) stats.skillCooldown = Math.max(0, stats.skillCooldown - delta);

      if (hudActiveTimer > 0) {
        hudActiveTimer -= delta;
        if (hudActiveTimer <= 0) {
          document.getElementById('unified-panel').classList.remove('active');
          document.getElementById('score-panel').classList.remove('active');
        }
      }

      playerPhysics.prevPosition.copy(playerPhysics.position);
      playerPhysics.prevQuaternion.copy(playerPhysics.quaternion);

      let mx = 0, mz = 0;
      if (inputSys.keys['KeyW'] || inputSys.keys['ArrowUp']) mz -= 1;
      if (inputSys.keys['KeyS'] || inputSys.keys['ArrowDown']) mz += 1;
      if (inputSys.keys['KeyA'] || inputSys.keys['ArrowLeft']) mx -= 1;
      if (inputSys.keys['KeyD'] || inputSys.keys['ArrowRight']) mx += 1;
      if (stick.active) { mx = stick.x; mz = stick.y; }

      const moveVec = new THREE.Vector2(mx, mz);
      if (moveVec.length() > 0.1) {
        moveVec.normalize();
        const angle = Math.atan2(moveVec.x, moveVec.y) + Math.PI;
        playerPhysics.targetQuaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), angle);
        playerPhysics.quaternion.slerp(playerPhysics.targetQuaternion, 0.25);
        playerPhysics.velocity.x = moveVec.x * stats.moveSpeed;
        playerPhysics.velocity.z = moveVec.y * stats.moveSpeed;
        triggerHUDActive();
      } else {
        playerPhysics.velocity.x *= 0.8; playerPhysics.velocity.z *= 0.8;
      }

      if (inputSys.consume('jump') && playerPhysics.isGrounded) {
        playerPhysics.velocity.y = 13.5;
        playerPhysics.isGrounded = false;
        audio.play('jump');
        triggerHUDActive();
      }
      if (inputSys.consume('skill')) triggerSkill();

      playerPhysics.velocity.y -= 35.0 * delta;
      playerPhysics.position.addScaledVector(playerPhysics.velocity, delta);

      playerPhysics.isGrounded = false;
      raycaster.set(playerPhysics.position.clone().add(new THREE.Vector3(0, 0.4, 0)), new THREE.Vector3(0, -1, 0));
      const hits = raycaster.intersectObjects(platforms);
      if (hits.length > 0 && hits[0].distance <= 0.7 && playerPhysics.velocity.y <= 0) {
        playerPhysics.position.y = hits[0].point.y + 0.55;
        playerPhysics.velocity.y = 0;
        playerPhysics.isGrounded = true;
      }

      if (playerPhysics.position.y < -12) { stats.hp = 0; updateHUD(); gameOver(); }

      if (inputSys.consume('slash') && !playerPhysics.isSlashing) triggerSlash();

      if (playerPhysics.isSlashing) {
        playerPhysics.slashTime -= delta;
        const prog = 1.0 - (playerPhysics.slashTime / playerPhysics.slashDuration);
        katanaGroup.rotation.y = -Math.PI * 0.7 + prog * Math.PI * 1.4;

        if (!playerPhysics.slashHitTriggered && prog >= 0.2 && prog <= 0.7) {
          executeSlashHit();
          playerPhysics.slashHitTriggered = true;
        }
        if (playerPhysics.slashTime <= 0) {
          playerPhysics.isSlashing = false;
          slashArc.material.opacity = 0;
          katanaGroup.rotation.y = 0;
        }
      }

      // Boss Logic
      if (boss) {
        const dir = playerPhysics.position.clone().sub(boss.position);
        dir.y = 0; dir.normalize();
        boss.position.add(dir.multiplyScalar(boss.speed * delta));
        boss.mesh.rotation.y += delta * 3;
        if (boss.position.distanceTo(playerPhysics.position) < 2.0) {
          stats.hp -= 20 * delta; updateHUD(); triggerHUDActive();
          triggerGlitchEffect();
          if (stats.hp <= 0) gameOver();
        }
      }

      // Enemy Logic
      enemies.forEach(e => {
        const dir = playerPhysics.position.clone().sub(e.position);
        dir.y = 0; dir.normalize();
        e.position.add(dir.multiplyScalar(e.speed * delta));
        e.mesh.rotation.y += delta * 2;
        if (e.position.distanceTo(playerPhysics.position) < 1.4) {
          stats.hp -= 15 * delta; updateHUD(); triggerHUDActive();
          triggerGlitchEffect();
          if (stats.hp <= 0) gameOver();
        }
      });

      if (portal) {
        portal.rotation.z += delta * 2;
        if (playerPhysics.position.distanceTo(portal.position) < 2.0) {
          showPerkScreen();
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.mesh.position.addScaledVector(p.vel, delta);
        p.life -= delta;
        p.mesh.scale.multiplyScalar(0.92);
        if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
      }
    }

    function animate(now) {
      requestAnimationFrame(animate);
      const rawDelta = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      if (hitStopFrames > 0) {
        hitStopFrames--; renderer.render(scene, camera); return;
      }

      accumulator += rawDelta;
      while (accumulator >= FIXED_TIMESTEP) {
        update(FIXED_TIMESTEP);
        accumulator -= FIXED_TIMESTEP;
      }

      if (state === GAME_STATE.PLAYING) {
        playerGroup.position.copy(playerPhysics.position);
        playerGroup.quaternion.copy(playerPhysics.quaternion);

        const targetCam = playerGroup.position.clone().add(new THREE.Vector3(0, 7.5, 9.5));
        camera.position.lerp(targetCam, 0.15);
        if (cameraShake > 0) {
          camera.position.x += (Math.random() - 0.5) * cameraShake;
          camera.position.y += (Math.random() - 0.5) * cameraShake;
          cameraShake = Math.max(0, cameraShake - rawDelta * 3);
        }
        camera.lookAt(playerGroup.position);
        pointLight.position.copy(playerGroup.position).add(new THREE.Vector3(0, 2, 0));
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    requestAnimationFrame(animate);
  </script>
</body>
