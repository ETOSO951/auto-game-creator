<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ローグライクリバーシ (Roguelike Reversi)</title>
    <style>
        :root {
            --bg-color: #05070c;
            --panel-bg: rgba(14, 20, 34, 0.9);
            --panel-border: rgba(56, 189, 248, 0.4);
            --panel-border-glow: rgba(56, 189, 248, 0.8);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.8);
            --player-color: #38bdf8;
            --enemy-color: #f43f5e;
            --accent: #fbbf24;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --board-bg: #0a1120;
            --cell-bg: #162238;
            --cell-hover: #1e293b;
            --ambient-hue: 195deg;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
            background-image: 
                radial-gradient(circle at 50% -20%, hsla(var(--ambient-hue), 80%, 60%, 0.3) 0%, transparent 70%),
                radial-gradient(circle at 50% 120%, rgba(244, 63, 94, 0.2) 0%, transparent 70%);
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
        }

        /* 洗練されたガラスモフィズムオーラ */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.85);
            pointer-events: none;
            z-index: 100;
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            position: relative;
            background: rgba(11, 15, 25, 0.65);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.85), inset 0 0 30px rgba(56, 189, 248, 0.05);
            border-left: 1px solid var(--panel-border);
            border-right: 1px solid var(--panel-border);
            padding-top: max(8px, env(safe-area-inset-top, 8px));
            padding-bottom: max(8px, env(safe-area-inset-bottom, 8px));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* スクリーン管理 */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: scale(0.96);
            z-index: 1;
        }

        .screen.active {
            opacity: 1;
            pointer-events: all;
            transform: scale(1);
            z-index: 10;
        }

        /* タイトル画面 */
        #start-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 24px;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }

        .logo-sub {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-top: 8px;
            letter-spacing: 4px;
        }

        /* ボタン（有機的スプリングフィードバック） */
        .btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(14, 165, 233, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.3);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, filter 0.2s ease;
            width: 80%;
            max-width: 280px;
            outline: none;
            will-change: transform;
        }

        .btn:hover {
            filter: brightness(1.15);
            box-shadow: 0 8px 30px rgba(14, 165, 233, 0.7), 0 0 20px rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: scale(0.92) translateY(1px);
            box-shadow: 0 2px 10px rgba(14, 165, 233, 0.4);
        }

        /* ゲーム画面（引き算の美学による余白と極限のスリム化） */
        #game-screen {
            justify-content: space-between;
            gap: 4px;
            padding: 6px 12px;
        }

        /* ステータスヘッダー：1行に完全に溶け込むミニマル・インフォバー */
        .header-panel {
            background: rgba(14, 20, 34, 0.5);
            border: 1px solid rgba(56, 189, 248, 0.12);
            border-radius: 10px;
            padding: 4px 8px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .stage-info {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.65rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        /* 遺物ドロワーボタン（洗練されたミニマルアイコン） */
        .relic-toggle-btn {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.25);
            color: var(--primary);
            font-size: 0.6rem;
            padding: 2px 5px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .relic-toggle-btn:hover {
            background: rgba(56, 189, 248, 0.2);
        }

        /* 遺物スライド式ドロワー */
        .relic-drawer {
            position: absolute;
            top: 50px;
            left: 12px;
            right: 12px;
            background: rgba(14, 20, 34, 0.95);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 25;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
        }
        .relic-drawer.open {
            display: flex;
            animation: fadeInDrawer 0.25s ease;
        }
        @keyframes fadeInDrawer {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stage-badge {
            background: rgba(56, 189, 248, 0.08);
            color: var(--primary);
            padding: 1px 5px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.15);
            font-size: 0.65rem;
        }

        .fighters {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            justify-content: flex-end;
        }

        .fighter {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .fighter-name {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        .hp-bar-bg {
            width: 60px;
            height: 5px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2.5px;
            overflow: hidden;
            position: relative;
        }

        .hp-bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.25s ease;
            border-radius: 2.5px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        .hp-bar-delay {
            display: none;
        }

        .player .hp-bar-fill { background: var(--primary); }
        .enemy .hp-bar-fill { background: var(--enemy-color); }

        .hp-text {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-main);
            min-width: 42px;
            text-align: right;
        }

        /* 盤面 */
        .board-container {
            width: 100%;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            perspective: 1200px;
        }

        .board {
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 75%),
                linear-gradient(145deg, rgba(10, 17, 32, 0.98), rgba(18, 28, 48, 0.92));
            border: 2px solid rgba(56, 189, 248, 0.7);
            border-radius: 24px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 7px;
            padding: 12px;
            box-shadow: 
                inset 0 0 55px rgba(0, 0, 0, 0.95),
                inset 0 2px 6px rgba(255, 255, 255, 0.25),
                0 28px 70px rgba(0, 0, 0, 0.85),
                0 0 60px rgba(56, 189, 248, 0.5),
                0 0 25px rgba(56, 189, 248, 0.3) inset;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            position: relative;
            overflow: hidden;
            transition: box-shadow 0.4s ease, border-color 0.4s ease;
        }

        .board.wave-active {
            border-color: rgba(56, 189, 248, 0.9);
            box-shadow: 
                inset 0 0 50px rgba(0, 0, 0, 0.95),
                0 24px 70px rgba(0, 0, 0, 0.8),
                0 0 60px rgba(56, 189, 248, 0.65),
                0 0 25px rgba(56, 189, 248, 0.4) inset;
        }

        /* ノイズを抑えたクリーンな盤面環境 */

        /* ターンチェンジ時の波紋エフェクト */
        .board::after {
            content: '';
            position: absolute;
            inset: -100%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.4) 0%, transparent 60%);
            opacity: 0;
            pointer-events: none;
            transform: scale(0.2);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2;
        }

        .board.wave-active::after {
            opacity: 1;
            transform: scale(1.5);
        }

        .cell {
            background: linear-gradient(135deg, rgba(28, 39, 58, 0.8), rgba(12, 19, 34, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.12), inset 0 -4px 8px rgba(0, 0, 0, 0.7);
            transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
            touch-action: none;
            will-change: background, transform;
            perspective: 600px;
            z-index: 2;
        }

        .cell.valid {
            background: rgba(56, 189, 248, 0.15);
            box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.3);
        }

        .cell.hover-target {
            background: rgba(56, 189, 248, 0.25);
            box-shadow: inset 0 0 0 2px var(--primary);
        }

        .cell.valid::after {
            content: '';
            width: 14px;
            height: 14px;
            background: rgba(56, 189, 248, 0.7);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--primary);
            animation: pulseValid 1.2s infinite alternate ease-in-out;
            pointer-events: none;
        }

        /* 【新機能】属性エレメンタルセルのハイライト演出 */
        .cell.fire-cell { background: radial-gradient(circle, rgba(249, 115, 22, 0.35) 0%, rgba(28, 39, 58, 0.8) 70%); border-color: rgba(249, 115, 22, 0.6); }
        .cell.ice-cell { background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, rgba(28, 39, 58, 0.8) 70%); border-color: rgba(56, 189, 248, 0.6); }
        .cell.electric-cell { background: radial-gradient(circle, rgba(234, 179, 8, 0.35) 0%, rgba(28, 39, 58, 0.8) 70%); border-color: rgba(234, 179, 8, 0.6); }
        .cell.poison-cell { background: radial-gradient(circle, rgba(168, 85, 247, 0.35) 0%, rgba(28, 39, 58, 0.8) 70%); border-color: rgba(168, 85, 247, 0.6); }

        @keyframes pulseValid {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0.9; }
        }

        /* タッチプレビュー：視覚ノイズを排除したエレガントな発光とミニマルドット */
        .cell.hover-target::after {
            content: attr(data-preview-count);
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--primary);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.9);
            pointer-events: none;
        }

        /* ひっくり返しプレビュー */
        .cell.preview-flip .disc {
            opacity: 0.55;
            filter: brightness(1.4) drop-shadow(0 0 8px var(--primary));
            transform: scale(0.88);
            transition: transform 0.15s ease, opacity 0.15s ease, filter 0.15s ease;
        }

        /* 敵のターゲットフォーカス */
        .cell.enemy-target::before {
            content: '';
            position: absolute;
            inset: 2px;
            border: 2px solid var(--enemy-color);
            border-radius: 6px;
            box-shadow: 0 0 12px var(--enemy-color);
            z-index: 5;
            animation: focusTarget 0.4s ease-out;
        }

        @keyframes focusTarget {
            0% { transform: scale(1.4); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* フローティングダメージテキスト（弾力バウンド・閃光付き） */
        .damage-popup {
            position: absolute;
            font-weight: 900;
            font-size: 1.6rem;
            pointer-events: none;
            z-index: 30;
            animation: floatDamageDynamic 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            text-shadow: 0 4px 12px rgba(0,0,0,0.9), 0 0 10px currentColor;
            letter-spacing: -1px;
        }

        .damage-popup.player-dmg { color: #f43f5e; }
        .damage-popup.enemy-dmg { color: #38bdf8; }
        .damage-popup.critical { 
            color: #fbbf24; 
            font-size: 2.2rem;
            text-shadow: 0 0 20px #f59e0b, 0 4px 12px rgba(0,0,0,0.9);
        }

        @keyframes floatDamageDynamic {
            0% { opacity: 0; transform: translate(-50%, 10px) scale(0.3) rotate(-5deg); }
            25% { opacity: 1; transform: translate(-50%, -20px) scale(1.3) rotate(3deg); }
            40% { transform: translate(-50%, -15px) scale(1) rotate(0deg); }
            80% { opacity: 1; transform: translate(-50%, -35px) scale(0.95); }
            100% { opacity: 0; transform: translate(-50%, -50px) scale(0.7); }
        }

        /* 減衰計算付き画面振動 & RGB色収差風演出 */
        .shake {
            animation: shakeScreenImpact 0.32s cubic-bezier(0.36, 0.07, 0.19, 0.97);
            filter: drop-shadow(2px 0px rgba(244, 63, 94, 0.4)) drop-shadow(-2px 0px rgba(56, 189, 248, 0.4));
        }

        .shake-heavy {
            animation: shakeScreenHeavy 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97);
            filter: drop-shadow(4px 0px rgba(244, 63, 94, 0.8)) drop-shadow(-4px 0px rgba(56, 189, 248, 0.8));
        }

        @keyframes shakeScreenImpact {
            0%, 100% { transform: translate(0, 0) scale(1); }
            15% { transform: translate(-7px, 5px) scale(1.01); }
            30% { transform: translate(6px, -5px) scale(0.99); }
            50% { transform: translate(-4px, 3px) scale(1.005); }
            70% { transform: translate(3px, -2px); }
            85% { transform: translate(-1px, 1px); }
        }

        @keyframes shakeScreenHeavy {
            0%, 100% { transform: translate(0, 0) scale(1); }
            12% { transform: translate(-14px, 10px) rotate(-1.5deg) scale(1.02); }
            28% { transform: translate(12px, -10px) rotate(1.2deg) scale(0.98); }
            45% { transform: translate(-8px, 6px) scale(1.01); }
            65% { transform: translate(6px, -4px) rotate(-0.5deg); }
            82% { transform: translate(-3px, 2px); }
        }

        /* 石（最高峰の光学ジェムストーン質感・ガラス屈折ライティング & 虹彩リムライト） */
        .disc {
            width: 82%;
            height: 82%;
            border-radius: 50%;
            position: absolute;
            transform-style: preserve-3d;
            will-change: transform, box-shadow, filter;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }

        /* 内部シャドウと表層屈折レンズハイライト（動的光源追従感） */
        .disc::before {
            content: '';
            position: absolute;
            top: 4%;
            left: 8%;
            width: 56%;
            height: 40%;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.6) 35%, rgba(255, 255, 255, 0) 80%);
            border-radius: 50%;
            filter: blur(0.5px);
            pointer-events: none;
            z-index: 3;
            mix-blend-mode: overlay;
            animation: discSpecularShift 6s infinite alternate ease-in-out;
        }

        @keyframes discSpecularShift {
            0% { transform: translate(0, 0) scale(1); opacity: 0.9; }
            50% { transform: translate(2.5px, 2px) scale(1.06); opacity: 1; }
            100% { transform: translate(-1.5px, 1.5px) scale(0.96); opacity: 0.95; }
        }

        /* 石のエッジ虹彩イリデッセンスリムライト */
        .disc::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4), transparent 50%, rgba(56, 189, 248, 0.3));
            pointer-events: none;
            z-index: 1;
            opacity: 0.8;
            mix-blend-mode: screen;
        }

        .disc.player {
            background: radial-gradient(circle at 30% 20%, #ffffff 0%, #7dd3fc 22%, #0284c7 60%, #0369a1 88%, #082f49 100%);
            box-shadow: 
                0 16px 35px rgba(0, 0, 0, 0.9),
                inset 0 -10px 18px rgba(2, 132, 199, 0.98),
                inset 0 6px 12px rgba(255, 255, 255, 0.95),
                0 0 50px rgba(56, 189, 248, 1),
                0 0 20px rgba(255, 255, 255, 0.6) inset;
        }

        .disc.enemy {
            background: radial-gradient(circle at 30% 20%, #ffffff 0%, #fda4af 22%, #e11d48 60%, #be123c 88%, #4c0519 100%);
            box-shadow: 
                0 16px 35px rgba(0, 0, 0, 0.9),
                inset 0 -10px 18px rgba(190, 18, 60, 0.98),
                inset 0 6px 12px rgba(255, 255, 255, 0.95),
                0 0 50px rgba(244, 63, 94, 1),
                0 0 20px rgba(255, 255, 255, 0.6) inset;
        }

        .disc.flip-anim {
            animation: flipDisc3D 0.42s cubic-bezier(0.34, 1.6, 0.64, 1);
        }

        @keyframes flipDisc3D {
            0% { 
                transform: scale(1) translateZ(0) rotateY(0deg) rotateX(0deg); 
                filter: brightness(1) drop-shadow(0 0 0px rgba(255,255,255,0));
            }
            42% { 
                transform: scale(1.7) translateZ(110px) rotateY(84deg) rotateX(28deg); 
                filter: brightness(3.5) drop-shadow(0 0 42px rgba(255, 255, 255, 1));
            }
            58% {
                transform: scale(1.7) translateZ(110px) rotateY(96deg) rotateX(28deg); 
                filter: brightness(3.5) drop-shadow(0 0 42px rgba(255, 255, 255, 1));
            }
            100% { 
                transform: scale(1) translateZ(0) rotateY(180deg) rotateX(0deg); 
                filter: brightness(1) drop-shadow(0 0 0px rgba(255,255,255,0));
            }
        }

        /* コントロールパネル：引き算の美学に基づくミニマルコンパクト化 */
        .controls-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .panel-title {
            font-size: 0.65rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .skills-list {
            display: flex;
            gap: 6px;
        }

        .skill-card {
            flex: 1;
            background: rgba(20, 28, 45, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 6px 8px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            will-change: transform;
        }

        .skill-card:hover {
            border-color: rgba(56, 189, 248, 0.5);
            transform: translateY(-1px);
        }

        .skill-card:active {
            transform: scale(0.96);
        }

        .skill-card.active {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .skill-card.selected {
            border-color: var(--accent);
            background: rgba(245, 158, 11, 0.25);
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.7);
        }

        .skill-card.disabled {
            opacity: 0.35;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        /* ターン・パス通知バナー */
        .toast-banner {
            position: absolute;
            top: 50%;

</head>
<body>

        <!-- 報酬選択モーダル -->

    <script>
        // --- ゲーム状態管理 ---
        const BOARD_SIZE = 6;
        const EMPTY = 0;
        const PLAYER = 1;
        const ENEMY = 2;

        let gameState = {
            stage: 1,
            mapNode: 1,
            playerMaxHp: 30,
            playerHp: 30,
            enemyMaxHp: 20,
            enemyHp: 20,
            enemyShield: 0,
            enemyPhase: 1,
            board: [],
            specialCells: [],
            enemyType: 'normal',
            enemyTalent: null,
            floorRule: null,
            currentTurn: PLAYER,
            isProcessing: false,
            stats: {
                kills: 0,
                totalFlips: 0,
                score: 0
            },
            relics: [],
            curses: [],
            skills: [
                { id: 'double_strike', name: '重撃 Lv.1', desc: '次の1手でダメージ2倍', level: 1, ready: true },
                { id: 'snipe', name: 'スナイプ Lv.1', desc: '任意の空マスに直接石を配置', level: 1, ready: true }
            ],
            potions: [
                { id: 'potion_heal', name: 'ハイポーション', desc: 'HPを20回復する', count: 1 },
                { id: 'potion_power', name: '力の霊薬', desc: '次のプレイヤーの着手ダメージが3倍になる', count: 1 }
            ],

            // 【新機能】属性システム・エレメンタルストック
            elementalAffinity: 'fire', // 'fire' | 'ice' | 'thunder' | 'poison'
            enemyFrozen: false,
            materials: 3 // 遺物分解・クラフト用素材
        };

        // 呪物プール
        const CURSE_POOL = [
            { id: 'blood_debt', name: '血の負債', desc: '毎ターン開始時、HPが3減少するが与ダメージが1.3倍になる' },
            { id: 'heavy_stone', name: '重圧の呪い', desc: 'ひっくり返せる枚数が常に1枚減少する（最低1枚）' }
        ];

        // スキルプール
        const SKILL_POOL = [
            { id: 'bomb', name: 'ボム', desc: '着手したマスの周囲の敵石を消滅させる' },
            { id: 'heal_skill', name: '治癒', desc: 'HPを12回復する（即座に発動）', instant: true },
            { id: 'shield_bash', name: 'シールドバッシュ', desc: 'シールドを展開し、次ターンの被ダメージを半減する' }
        ];

        // 遺物プール（シナジー・クラフト対応）
        const RELIC_POOL = [
            { id: 'vampire', name: '吸血の牙', desc: '石を返した時、返した枚数分HPを回復する（棘の鎧共鳴で反撃時もHP吸収）', tier: 1 },
            { id: 'corner_master', name: '角の支配者', desc: '四隅に石を置いた時、敵に10ダメージを与える', tier: 1 },
            { id: 'spikes', name: '棘の鎧', desc: '敵ターン終了時、相手に2ダメージを与える', tier: 1 },
            { id: 'overgrowth', name: '巨人の加護', desc: '最大HPが15増加し、HPが回復する', tier: 1 },
            { id: 'cursed_blade', name: '呪いの刃', desc: '与えるダメージが1.5倍になるが、毎ターン開始時HPが2減少する', tier: 1 },
            { id: 'auto_shield', name: 'エーテルバリア', desc: '石を4枚以上反転させた時、自動でシールドを展開し被弾を半減する', tier: 1 },
            { id: 'gem_resonance', name: '宝石の共鳴', desc: '毎ターン開始時、生存している石の数に応じて追加スコアを獲得する', tier: 1 },
            { id: 'blood_vampire', name: '真祖の牙 (上位)', desc: '吸血の牙と棘の鎧が融合。石を返すごとにHPを2回復し敵に反撃ダメージを与える', tier: 2 }
        ];

        // ポーションプール
        const POTION_POOL = [
            { id: 'potion_heal', name: 'ハイポーション', desc: 'HPを20回復する', count: 1 },
            { id: 'potion_power', name: '力の霊薬', desc: '次のプレイヤーの着手ダメージが3倍になる', count: 1 }
        ];

        // Canvas / パーティクル
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let isParticleLoopRunning = false;

        function createParticles(x, y, color, count = 24, isBurst = false) {
            const types = ['circle', 'spark', 'ring', 'glow'];
            // 3層のパララックス効果（遠景・中景・近景）
            const layers = [0.55, 1.0, 1.5];
            
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * (isBurst ? 13 : 7.0) + 2.0);
                const layer = layers[Math.floor(Math.random() * layers.length)];
                
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed * layer,
                    vy: Math.sin(angle) * speed * layer - (isBurst ? 0.8 : 0),
                    gravity: isBurst ? 0.16 : 0.06,
                    size: (Math.random() * (isBurst ? 7.5 : 4.5) + 1.8) * layer,
                    color,
                    alpha: 1,
                    type: types[Math.floor(Math.random() * types.length)],
                    life: 0.010 + Math.random() * 0.018,
                    spin: (Math.random() - 0.5) * 0.35,
                    rotation: Math.random() * Math.PI
                });
            }
            if (!isParticleLoopRunning) {
                isParticleLoopRunning = true;
                requestAnimationFrame(updateParticles);
            }
        }

        function updateParticles() {
            // ネオンブルーム＆オーロラ残像トレイル表現
            ctx.fillStyle = 'rgba(5, 7, 12, 0.16)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const len = particles.length;
            if (len === 0) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                isParticleLoopRunning = false;
                return;
            }

            // 加算合成による最高峰のブルーム発光
            ctx.globalCompositeOperation = 'lighter';

            for (let i = len - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.vx *= 0.94;
                p.vy *= 0.94;
                p.rotation += p.spin;
                p.alpha -= p.life;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.strokeStyle = p.color;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);

                // ネオンブルーム（高輝度シャドウ＆RGB色収差レイヤー）
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 36;

                // 速度ベクトルに連動したモーションブラー引き延ばし
                const speedSq = p.vx * p.vx + p.vy * p.vy;
                if (speedSq > 2.0 && p.type !== 'ring') {
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(-p.vx * 2.5, -p.vy * 2.5);
                    ctx.lineWidth = p.size * 1.4;
                    ctx.strokeStyle = p.color;
                    ctx.stroke();
                }

                if (p.type === 'spark') {
                    // RGB色収差風のマルチストローク発光
                    ctx.beginPath();
                    ctx.moveTo(-p.size * 5.5, 0); ctx.lineTo(p.size * 5.5, 0);
                    ctx.moveTo(0, -p.size * 5.5); ctx.lineTo(0, p.size * 5.5);
                    ctx.lineWidth = 4.0;
                    ctx.stroke();
                    
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.9)';
                    ctx.lineWidth = 2.0;
                    ctx.stroke();

                    // コアの純白スパーク
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                } else if (p.type === 'ring') {
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size * 4.5, 0, Math.PI * 2);
                    ctx.lineWidth = 2.8;
                    ctx.stroke();
                } else if (p.type === 'glow') {
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size * 3.2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size * 2.0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            if (particles.length > 0) {
                requestAnimationFrame(updateParticles);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                isParticleLoopRunning = false;
            }
        }

        // アンビエント：ターン切替時ウェーブ効果
        function triggerTurnWave() {
            const board = document.getElementById('board');
            if (!board) return;
            board.classList.remove('wave-active');
            void board.offsetWidth;
            board.classList.add('wave-active');
            setTimeout(() => board.classList.remove('wave-active'), 600);
        }

        // --- 画面遷移 ---
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // --- 初期化 & ゲーム開始 ---
        document.getElementById('start-btn').addEventListener('click', () => {
            initNewGame();
            showMapScreen();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            showScreen('start-screen');
        });

        document.getElementById('leave-shop-btn').addEventListener('click', () => {
            startStage();
        });

        // 遺物ドロワーのトグル動作
        document.getElementById('relic-toggle-btn').addEventListener('click', () => {
            const drawer = document.getElementById('relic-drawer');
            drawer.classList.toggle('open');
            if (drawer.classList.contains('open')) {
                const listContainer = document.getElementById('relics-list-container');
                listContainer.innerHTML = '';
                if (gameState.relics.length === 0 && gameState.curses.length === 0) {
                    listContainer.innerHTML = '<span style="font-size:0.65rem; color:var(--text-sub);">なし</span>';
                } else {
                    gameState.relics.forEach(r => {
                        const badge = document.createElement('div');
                        badge.className = 'relic-badge';
                        badge.textContent = r.name;
                        listContainer.appendChild(badge);
                    });
                    gameState.curses.forEach(c => {
                        const badge = document.createElement('div');
                        badge.className = 'relic-badge';
                        badge.style.borderColor = 'rgba(244,63,94,0.4)';
                        badge.style.color = '#f43f5e';
                        badge.textContent = `[呪] ${c.name}`;
                        listContainer.appendChild(badge);
                    });
                }
            }
        });

        function initNewGame() {
            gameState.stage = 1;
            gameState.mapNode = 1;
            gameState.playerMaxHp = 30;
            gameState.playerHp = 30;
            gameState.relics = [];
            gameState.stats = { kills: 0, totalFlips: 0, score: 0 };
            // 【新機能3】永続アビリティ・称号ツリーによる初期バフ適用
            gameState.materials = 5;
            if (localStorage.getItem('roguelike_reversi_ascend')) {
                gameState.playerMaxHp += 10;
                gameState.playerHp = gameState.playerMaxHp;
                gameState.materials += 3;
            }
        }

        function showMapScreen() {
            document.getElementById('map-subtitle').textContent = `FLOOR ${gameState.stage} - 進行ルート（素材: ${gameState.materials}）`;
            const container = document.getElementById('map-nodes-container');
            container.innerHTML = '';

            const routes = [
                { type: 'battle', title: '⚔️ 属性戦闘エリア', desc: '炎・氷・雷の属性石を操り敵を撃破する。' },
                { type: 'elite', title: '🔥 マルチボス討伐', desc: '特殊アビリティを持つ強敵との死闘。' },
                { type: 'event', title: '🔮 エレメンタル祭壇', desc: '属性の祝福を受け、新たな力に目覚める。' },
                { type: 'shop', title: '💰 商人・クラフト工房', desc: '遺物の分解・合成・融合および補給。' }
            ];

            // 【新機能1】マルチレイヤー分岐マップ拡張＆属性共鳴ポイント
            const currentFloorData = [
                [
                    { id: 1, type: 'battle', title: '⚔️ 属性戦闘エリア', desc: '炎・氷の属性石を操る通常ステージ。', next: [2, 3] },
                    { id: 2, type: 'event', title: '🔮 エレメンタル祭壇', desc: '属性の祝福を受け、最大HPや素材を獲得。', next: [4, 5] },
                    { id: 3, type: 'elite', title: '🔥 エリート戦', desc: '強力なアビリティを持つ強敵との死闘。', next: [4, 5] },
                    { id: 4, type: 'shop', title: '💰 商人・クラフト工房', desc: '遺物の分解・合成・覚醒スキル強化。', next: [6] },
                    { id: 5, type: 'battle', title: '⚡ 磁気嵐ステージ', desc: '危険な特殊ルールが適用される激戦区。', next: [6] },
                    { id: 6, type: 'boss', title: '👑 フロアガーディアン', desc: '第1階層の最終ボス。', next: [] }
                ]
            ];

            routes.forEach(r => {
                const card = document.createElement('div');
                card.className = 'reward-card';
                card.innerHTML = `
                    <div class="reward-card-title">${r.title}</div>
                    <div class="reward-card-desc">${r.desc} (共鳴蓄積: ${gameState.elementalAffinity})</div>
                `;
                card.addEventListener('click', () => {
                    if (r.type === 'shop') {
                        showShopScreen();
                    } else if (r.type === 'event') {
                        showEventModal();
                    } else {
                        gameState.enemyType = (r.type === 'elite' || gameState.stage % 3 === 0) ? 'boss' : (Math.random() > 0.5 ? 'thorn' : 'aggressive');
                        startStage();

        function startStage() {
            sequencer.reset();
            
            // 呪物「血の負債」によるターン開始時ペナルティ
            if (hasCurse('blood_debt')) {
                gameState.playerHp = Math.max(1, gameState.playerHp - 3);
            }

            // エネミータイプの調整
