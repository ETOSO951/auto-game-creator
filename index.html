<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Rogue 3D - Ultimate Overdrive Fusion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020205;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      z-index: 1;
    }

    /* Screen Overlay Effects */
    #overdrive-screen-fx {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.3s ease;
      background: radial-gradient(circle, transparent 30%, rgba(255, 0, 128, 0.25) 80%, rgba(0, 255, 255, 0.4) 100%);
      box-shadow: inset 0 0 50px rgba(255, 0, 200, 0.5);
    }
    #overdrive-screen-fx.active {
      opacity: 1;
      animation: pulseVignette 0.8s infinite alternate ease-in-out;
    }
    @keyframes pulseVignette {
      0% { opacity: 0.7; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    /* Glitch Screen Overlay for Bullet Time / Fusion */
    #glitch-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 6;
      opacity: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 255, 255, 0.05),
        rgba(0, 255, 255, 0.05) 1px,
        transparent 1px,
        transparent 2px
      );
      transition: opacity 0.1s ease;
    }
    #glitch-overlay.active {
      opacity: 1;
      animation: glitchAnim 0.15s infinite;
    }
    @keyframes glitchAnim {
      0% { transform: translate(0, 0); filter: hue-rotate(0deg); }
      50% { transform: translate(-2px, 2px); filter: hue-rotate(90deg); }
      100% { transform: translate(2px, -1px); filter: hue-rotate(0deg); }
    }

    /* Perfect Dodge / SlowMo Monochrome Flash */
    #bullet-time-fx {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 7;
      opacity: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(0,212,255,0.2) 60%, rgba(0,0,0,0.6) 100%);
      backdrop-filter: grayscale(0.6) contrast(1.3);
      transition: opacity 0.2s ease;
    }
    #bullet-time-fx.active { opacity: 1; }

    /* Damage Flash Effect */
    #damage-flash {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 0, 85, 0.35);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease-out;
      z-index: 8;
    }

    /* UI Overlay */
    #ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }

    /* Top HUD */
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      color: #fff;
      text-shadow: 0 0 6px #000;
      width: 100%;
    }
    .hud-stats {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hud-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .hud-title {
      font-size: 14px;
      font-weight: 800;
      color: #66fcf1;
      letter-spacing: 1.5px;
    }
    .element-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .elem-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .elem-tag.electric { background: #00d2ff; color: #000; box-shadow: 0 0 8px #00d2ff; }
    .elem-tag.fire { background: #ff3300; color: #fff; box-shadow: 0 0 8px #ff3300; }
    .elem-tag.ice { background: #00ffff; color: #000; box-shadow: 0 0 8px #00ffff; }
    .elem-tag.fusion-plasma { background: linear-gradient(45deg, #00d2ff, #ff3300); color: #fff; box-shadow: 0 0 10px #ff3300; }
    .elem-tag.fusion-zero { background: linear-gradient(45deg, #00ffff, #00d2ff); color: #000; box-shadow: 0 0 10px #00ffff; }

    .bar-container {
      width: 190px;
      height: 14px;
      background: rgba(0,0,0,0.7);
      border: 1px solid #45a29e;
      border-radius: 7px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 8px rgba(102, 252, 241, 0.3);
    }
    .hp-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0844 0%, #ffb199 100%);
      transition: width 0.1s ease;
    }
    .od-bar-container {
      width: 190px;
      height: 10px;
      background: rgba(0,0,0,0.7);
      border: 1px solid #ff007f;
      border-radius: 5px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 8px rgba(255, 0, 127, 0.4);
    }
    .od-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff007f 0%, #7928ca 50%, #00dfd8 100%);
      transition: width 0.1s ease;
    }

    .floor-info {
      font-size: 18px;
      font-weight: 800;
      color: #c5c6c7;
      text-align: right;
    }

    /* Boss Health Bar Overlay */
    #boss-hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 450px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 15;
    }
    .boss-name {
      color: #ff0055;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #ff0055;
    }
    .boss-bar-container {
      width: 100%;
      height: 18px;
      background: rgba(0,0,0,0.8);
      border: 2px solid #ff0055;
      border-radius: 9px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
    }
    .boss-hp-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055 0%, #ff9900 100%);
      transition: width 0.1s ease;
    }

    /* Controls Bottom */
    .controls-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      height: 200px;
      pointer-events: auto;
    }

    /* Joystick */
    #joystick-area {
      width: 130px;
      height: 130px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed rgba(102, 252, 241, 0.3);
      border-radius: 50%;
      position: relative;
      margin-left: 10px;
      margin-bottom: 10px;
    }
    #joystick-knob {
      width: 50px;
      height: 50px;
      background: rgba(102, 252, 241, 0.7);
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px #66fcf1;
    }

    /* Action Buttons Array Grid */
    .btn-group {
      display: grid;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(2, 58px);
      gap: 10px;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    .action-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid #66fcf1;
      background: rgba(11, 12, 16, 0.75);
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 10px rgba(102, 252, 241, 0.4);
      user-select: none;
      position: relative;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .action-btn:active, .action-btn.active {
      background: #66fcf1;
      color: #0b0c10;
      transform: scale(0.92);
    }
    .btn-cd-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      height: 0%;
      transition: height 0.1s linear;
      pointer-events: none;
    }

    #fire-btn {
      border-color: #ff3366;
      box-shadow: 0 0 12px rgba(255, 51, 102, 0.6);
      grid-column: 3;
      grid-row: 2;
    }
    #fire-btn:active, #fire-btn.active { background: #ff3366; color: #fff; }

    #dash-btn {
      border-color: #ffaa00;
      box-shadow: 0 0 12px rgba(255, 170, 0, 0.5);
      grid-column: 2;
      grid-row: 2;
    }
    #jump-btn {
      grid-column: 3;
      grid-row: 1;
    }
    #skill-btn {
      border-color: #b026ff;
      box-shadow: 0 0 12px rgba(176, 38, 255, 0.5);
      grid-column: 1;
      grid-row: 2;
    }
    #od-btn {
      border-color: #ff007f;
      background: rgba(255, 0, 127, 0.2);
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
      grid-column: 2;
      grid-row: 1;
      display: flex;
    }
    #od-btn.ready {
      animation: pulseODBtn 0.6s infinite alternate;
    }
    @keyframes pulseODBtn {
      0% { transform: scale(1); box-shadow: 0 0 10px #ff007f; }
      100% { transform: scale(1.1); box-shadow: 0 0 22px #ff007f, 0 0 30px #00ffff; }
    }

    /* Modals & Banners */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(3, 4, 8, 0.92);
      z-index: 100;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      backdrop-filter: blur(8px);
    }
    .modal-title {
      font-size: 26px;
      color: #66fcf1;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 12px #66fcf1;
    }
    .upgrade-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 90%;
      max-width: 380px;
    }
    .upgrade-card {
      background: #101622;
      border: 1px solid #45a29e;
      border-radius: 10px;
      padding: 14px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(102, 252, 241, 0.2);
      transition: transform 0.1s, background 0.1s, border-color 0.1s;
    }
    .upgrade-card:active {
      transform: scale(0.96);
      background: #1c2536;
      border-color: #66fcf1;
    }
    .card-name {
      font-size: 15px;
      font-weight: bold;
      color: #66fcf1;
      display: flex;
      justify-content: space-between;
    }
    .card-desc {
      font-size: 12px;
      color: #c5c6c7;
    }

    .modal-btn {
      margin-top: 22px;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: bold;
      color: #0b0c10;
      background: #66fcf1;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 0 15px #66fcf1;
    }
    .modal-btn:active { transform: scale(0.95); }

    /* Cinematic KO Banner */
    #ko-banner {
      position: absolute;
      top: 40%; left: 50%;
      transform: translate(-50%, -50%) scale(0.7);
      font-size: 42px;
      font-weight: 900;
      font-style: italic;
      color: #fff;
      text-shadow: 0 0 20px #ff007f, 0 0 40px #00ffff;
      letter-spacing: 6px;
      pointer-events: none;
      opacity: 0;
      z-index: 50;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #ko-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.1);
    }

    /* Perfect Dodge Action Announcement Banner */
    #dodge-banner {
      position: absolute;
      top: 30%; left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      font-size: 32px;
      font-weight: 900;
      font-style: italic;
      color: #00ffff;
      text-shadow: 0 0 15px #00ffff, 0 0 30px #ffffff;
      letter-spacing: 4px;
      pointer-events: none;
      opacity: 0;
      z-index: 55;
      transition: all 0.2s ease-out;
    }
    #dodge-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.2);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="overdrive-screen-fx"></div>
  <div id="glitch-overlay"></div>
  <div id="bullet-time-fx"></div>
  <div id="damage-flash"></div>
  <div id="ko-banner">SYSTEM PURGED</div>
  <div id="dodge-banner">PERFECT DODGE!</div>

  <!-- HUD -->
  <div id="ui-layer">
    <div class="hud-top">
      <div class="hud-stats">
        <div class="hud-title-row">
          <span class="hud-title">CYBER RUNNER</span>
          <div class="element-tags" id="element-tags"></div>
        </div>
        <div class="bar-container">
          <div id="hp-bar" class="hp-bar"></div>
        </div>
        <div class="od-bar-container">
          <div id="od-bar" class="od-bar"></div>
        </div>
      </div>
      <div class="floor-info">
        <div>FLOOR <span id="floor-num">1</span></div>
        <div style="font-size:12px; color:#45a29e;">KILLS: <span id="kill-num">0</span></div>
      </div>
    </div>

    <!-- Boss HP Overlay -->
    <div id="boss-hud">
      <div class="boss-name" id="boss-title">MEGABOSS: CYBER CORE</div>
      <div class="boss-bar-container">
        <div id="boss-hp-bar" class="boss-hp-bar"></div>
      </div>
    </div>

    <!-- Mobile Controls -->
    <div class="controls-bottom">
      <div id="joystick-area">
        <div id="joystick-knob"></div>
      </div>
      <div class="btn-group">
        <button id="od-btn" class="action-btn">
          <span>OVER<br>DRIVE</span>
        </button>
        <button id="jump-btn" class="action-btn">JUMP</button>
        <button id="skill-btn" class="action-btn">
          <span>EMP</span>
          <div id="skill-cd" class="btn-cd-overlay"></div>
        </button>
        <button id="dash-btn" class="action-btn">
          <span>DASH</span>
          <div id="dash-cd" class="btn-cd-overlay"></div>
        </button>
        <button id="fire-btn" class="action-btn">FIRE</button>
      </div>
    </div>
  </div>

  <!-- Upgrade Modal -->
  <div id="upgrade-modal" class="modal-overlay">
    <h2 class="modal-title">STAGE CLEAR</h2>
    <div style="color:#fff; margin-bottom:15px; font-size:13px;">サイバーモジュールをロードしてビルドを覚醒させよ</div>
    <div class="upgrade-list" id="upgrade-options"></div>
  </div>

  <!-- Game Over Modal -->
  <div id="gameover-modal" class="modal-overlay">
    <h2 class="modal-title" style="color:#ff3366; text-shadow:0 0 15px #ff3366;">SYSTEM OFFLINE</h2>
    <p style="color:#c5c6c7; margin-bottom: 20px;">到達階層: <span id="final-floor">1</span></p>
    <button class="modal-btn" id="restart-btn">REBOOT SYSTEM</button>
  </div>

  <!-- Three.js + Postprocessing CDNs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <script>
    /* ==========================================================
       GAME STATE & CONFIGURATION
    ========================================================== */
    const CONFIG = {
      gravity: -38,
      playerSpeed: 15,
      jumpVelocity: 16.5,
      dashSpeed: 42,
      dashDuration: 0.22,
      bulletSpeed: 45,
      bulletLifetime: 1.2
    };

    let floor = 1;
    let totalKills = 0;
    let isGameOver = false;
    let isPaused = false;
    let timeScale = 1.0;
    let hitStopTimer = 0;

    // Bullet Time & Perfect Dodge
    let isBulletTime = false;
    let bulletTimeTimer = 0;

    // Cinematic KO state
    let isCinematicKO = false;
    let koTimer = 0;
    let koTargetPos = new THREE.Vector3();

    // Grind Rail System Variables
    let isGrinding = false;
    let currentRail = null;
    let railProgress = 0;
    let railSpeed = 32;

    // Player Stats & Elemental Builds
    const playerStats = {
      maxHp: 100,
      hp: 100,
      damage: 32,
      fireRate: 0.20,
      speedMult: 1.0,
      multishot: 1,
      dashCooldown: 1.4,
      lastDashTime: -99,
      skillCooldown: 7.0,
      lastSkillTime: -99,
      isDashing: false,
      dashTimer: 0,
      dashDir: new THREE.Vector3(),
      invulnerableTimer: 0,
      // Overdrive & Elements
      odGauge: 0,
      maxOdGauge: 100,
      isOverdrive: false,
      odTimer: 0,
      elements: { electric: false, fire: false, ice: false }
    };
    let lastShootTime = 0;

    // Juice Effects
    const cameraShake = { intensity: 0, duration: 0 };

    /* ==========================================================
       THREE.JS & SCENE SETUP
    ========================================================== */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020206);
    scene.fog = new THREE.FogExp2(0x020206, 0.010);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ReinhardToneMapping;
    container.appendChild(renderer.domElement);

    // Post-Processing Bloom
    const composer = new THREE.EffectComposer(renderer);
    const renderPass = new THREE.RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new THREE.UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      1.6, // intensity
      0.4, // radius
      0.82 // threshold
    );
    composer.addPass(bloomPass);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x66fcf1, 1.3);
    dirLight.position.set(20, 50, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    /* ==========================================================
       DYNAMIC BACKGROUND (CYBER CITY & DATA STREAMS)
    ========================================================== */
    const bgGroup = new THREE.Group();
    scene.add(bgGroup);

    function createCyberCityBackground() {
      while(bgGroup.children.length > 0) { 
        bgGroup.remove(bgGroup.children[0]); 
      }

      const buildingMat = new THREE.MeshBasicMaterial({ color: 0x121b2d, wireframe: true });
      for (let i = 0; i < 45; i++) {
        const h = 40 + Math.random() * 90;
        const w = 12 + Math.random() * 18;
        const d = 12 + Math.random() * 18;
        const geo = new THREE.BoxGeometry(w, h, d);
        const mesh = new THREE.Mesh(geo, buildingMat);

        const angle = Math.random() * Math.PI * 2;
        const dist = 90 + Math.random() * 120;
        mesh.position.set(Math.cos(angle) * dist, h / 2 - 40, Math.sin(angle) * dist);
        bgGroup.add(mesh);
      }

      const streamCount = 700;
      const streamGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(streamCount * 3);
      for (let i = 0; i < streamCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 250;
        positions[i + 1] = Math.random() * 100 - 20;
        positions[i + 2] = (Math.random() - 0.5) * 250;
      }
      streamGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const streamMat = new THREE.PointsMaterial({ color: 0x00ffcc, size: 0.6, transparent: true, opacity: 0.6 });
      const streamParticles = new THREE.Points(streamGeo, streamMat);
      bgGroup.add(streamParticles);
      bgGroup.userData.particles = streamParticles;
    }
    createCyberCityBackground();

    /* ==========================================================
       ENTITIES, MATERIALS & PLAYER
    ========================================================== */
    const platforms = [];
    const grindRails = [];
    const enemies = [];
    const bullets = [];
    const enemyBullets = [];
    const particles = [];
    const trails = [];
    const hazards = [];
    const envObjects = [];
    let goalPortal = null;
    let megaBoss = null;

    // Standard Materials
    const cyanNeonMat = new THREE.MeshStandardMaterial({ color: 0x66fcf1, emissive: 0x66fcf1, emissiveIntensity: 0.7, roughness: 0.2 });
    const redNeonMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.8, roughness: 0.2 });
    const purpleNeonMat = new THREE.MeshStandardMaterial({ color: 0xb026ff, emissive: 0xb026ff, emissiveIntensity: 0.8, roughness: 0.2 });

    // Player Mesh
    const playerGroup = new THREE.Group();
    const playerGeo = new THREE.CylinderGeometry(0.6, 0.6, 1.8, 16);
    const playerMat = new THREE.MeshStandardMaterial({ color: 0x66fcf1, roughness: 0.2, metalness: 0.8 });
    const playerMesh = new THREE.Mesh(playerGeo, playerMat);
    playerMesh.castShadow = true;
    playerGroup.add(playerMesh);

    // Gun Visual
    const gunGeo = new THREE.BoxGeometry(0.3, 0.3, 0.9);
    const gunMat = new THREE.MeshStandardMaterial({ color: 0x1f2833, metalness: 0.9 });
    const gunMesh = new THREE.Mesh(gunGeo, gunMat);
    gunMesh.position.set(0.6, 0.2, -0.4);
    playerGroup.add(gunMesh);

    scene.add(playerGroup);

    const playerPhysics = {
      position: playerGroup.position,
      velocity: new THREE.Vector3(),
      isGrounded: false,
      radius: 0.7,
      height: 1.8
    };

    /* ==========================================================
       JUICE, PARTICLES & VISUAL EFFECTS
    ========================================================== */
    function triggerCameraShake(intensity, duration) {
      cameraShake.intensity = intensity;
      cameraShake.duration = duration;
    }

    function triggerHitStop(durationSec) {
      hitStopTimer = durationSec;
    }

    function triggerGlitchEffect(durationMs = 250) {
      const glitch = document.getElementById('glitch-overlay');
      glitch.classList.add('active');
      setTimeout(() => { glitch.classList.remove('active'); }, durationMs);
    }

    function spawnNeonParticles(pos, colorHex, count = 12, speedMult = 1) {
      for (let i = 0; i < count; i++) {
        const pGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const pMat = new THREE.MeshBasicMaterial({ color: colorHex });
        const pMesh = new THREE.Mesh(pGeo, pMat);
        pMesh.position.copy(pos);

        const vel = new THREE.Vector3(
          (Math.random() - 0.5) * 16 * speedMult,
          (Math.random() * 12 + 2) * speedMult,
          (Math.random() - 0.5) * 16 * speedMult
        );

        scene.add(pMesh);
        particles.push({
          mesh: pMesh,
          velocity: vel,
          life: 0.4 + Math.random() * 0.3
        });
      }
    }

    // Hologram Trail Mesh Effect
    function spawnHologramTrail() {
      const trailGeo = new THREE.CylinderGeometry(0.6, 0.6, 1.8, 12);
      const trailMat = new THREE.MeshBasicMaterial({
        color: playerStats.isOverdrive ? 0xff007f : (isBulletTime ? 0x00ffff : 0x66fcf1),
        transparent: true,
        opacity: 0.6,
        wireframe: true
      });
      const trailMesh = new THREE.Mesh(trailGeo, trailMat);
      trailMesh.position.copy(playerGroup.position);
      trailMesh.rotation.copy(playerGroup.rotation);
      scene.add(trailMesh);

      trails.push({ mesh: trailMesh, opacity: 0.6, life: 0.25 });
    }

    function updateTrails(dt) {
      for (let i = trails.length - 1; i >= 0; i--) {
        const t = trails[i];
        t.life -= dt;
        t.opacity = Math.max(0, t.life / 0.25 * 0.6);
        t.mesh.material.opacity = t.opacity;
        if (t.life <= 0) {
          scene.remove(t.mesh);
          trails.splice(i, 1);
        }
      }
    }

    function triggerLightningBeam(startPos, endPos, colorHex = 0x00d2ff) {
      const points = [startPos.clone()];
      const mid = startPos.clone().add(endPos).multiplyScalar(0.5);
      mid.x += (Math.random() - 0.5) * 3;
      mid.y += (Math.random() - 0.5) * 3;
      mid.z += (Math.random() - 0.5) * 3;
      points.push(mid);
      points.push(endPos.clone());

      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const mat = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 3 });
      const line = new THREE.Line(geo, mat);
      scene.add(line);

      setTimeout(() => { scene.remove(line); }, 80);
    }

    function triggerDamageFlash() {
      const flash = document.getElementById('damage-flash');
      flash.style.opacity = '1';
      setTimeout(() => { flash.style.opacity = '0'; }, 150);
    }

    function addODGauge(amount) {
      if (playerStats.isOverdrive) return;
      playerStats.odGauge = Math.min(playerStats.maxOdGauge, playerStats.odGauge + amount);
      const pct = (playerStats.odGauge / playerStats.maxOdGauge) * 100;
      document.getElementById('od-bar').style.width = pct + '%';

      const odBtn = document.getElementById('od-btn');
      if (playerStats.odGauge >= playerStats.maxOdGauge) {
        odBtn.classList.add('ready');
      } else {
        odBtn.classList.remove('ready');
      }
    }

    /* ==========================================================
       ENVIRONMENT OBJECTS, DYNAMIC PLATFORMS & GRIND RAILS
    ========================================================== */
    function clearStage() {
      platforms.forEach(p => scene.remove(p.mesh)); platforms.length = 0;
      grindRails.forEach(r => scene.remove(r.mesh)); grindRails.length = 0;
      enemies.forEach(e => scene.remove(e.mesh)); enemies.length = 0;
      bullets.forEach(b => scene.remove(b.mesh)); bullets.length = 0;
      enemyBullets.forEach(b => scene.remove(b.mesh)); enemyBullets.length = 0;
      hazards.forEach(h => scene.remove(h.mesh)); hazards.length = 0;
      envObjects.forEach(o => scene.remove(o.mesh)); envObjects.length = 0;
      particles.forEach(p => scene.remove(p.mesh)); particles.length = 0;
      trails.forEach(t => scene.remove(t.mesh)); trails.length = 0;

      if (goalPortal) scene.remove(goalPortal);
      if (megaBoss) { scene.remove(megaBoss.mesh); megaBoss = null; }

      document.getElementById('boss-hud').style.display = 'none';
      isGrinding = false;
      currentRail = null;
    }

    function createPlatform(x, y, z, width, depth, type = 'normal') {
      const height = 1;
      const geo = new THREE.BoxGeometry(width, height, depth);
      let color = 0x121824;
      let lineClr = 0x45a29e;

      if (type === 'boost') lineClr = 0x00ffcc;
      if (type === 'disappear') lineClr = 0xffa000;
      if (type === 'moving') lineClr = 0xb026ff;

      const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5, metalness: 0.4 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y - height / 2, z);
      mesh.receiveShadow = true;
      scene.add(mesh);

      const edges = new THREE.EdgesGeometry(geo);
      const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: lineClr }));
      mesh.add(line);

      const bounds = {
        minX: x - width / 2, maxX: x + width / 2,
        minZ: z - depth / 2, maxZ: z + depth / 2,
        topY: y,
        mesh: mesh,
        type: type,
        initialY: y,
        initialX: x,
        timer: Math.random() * Math.PI * 2,
        active: true,
        width: width, depth: depth
      };

      if (type === 'boost') {
        const pad = new THREE.Mesh(new THREE.BoxGeometry(width * 0.4, 0.1, depth * 0.4), cyanNeonMat);
        pad.position.set(0, 0.55, 0);
        mesh.add(pad);
      }

      platforms.push(bounds);
      return bounds;
    }

    function createGrindRail(startPos, endPos) {
      const midPos = startPos.clone().add(endPos).multiplyScalar(0.5);
      midPos.y += 2.5; // Slight curved arch upward

      const curve = new THREE.QuadraticBezierCurve3(startPos, midPos, endPos);
      const tubeGeo = new THREE.TubeGeometry(curve, 24, 0.18, 8, false);
      const tubeMat = new THREE.MeshStandardMaterial({
        color: 0x00ffff,
        emissive: 0x00ffff,
        emissiveIntensity: 0.8,
        roughness: 0.1
      });
      const railMesh = new THREE.Mesh(tubeGeo, tubeMat);
      scene.add(railMesh);

      grindRails.push({
        mesh: railMesh,
        curve: curve,
        length: curve.getLength(),
        startPos: startPos,
        endPos: endPos
      });
    }

    function spawnEnergyBarrel(x, y, z) {
      const group = new THREE.Group();
      const geo = new THREE.CylinderGeometry(0.8, 0.8, 2.0, 12);
      const mat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.6, roughness: 0.3 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      group.add(mesh);

      group.position.set(x, y + 1.0, z);
      scene.add(group);

      envObjects.push({
        mesh: group,
        type: 'barrel',
        hp: 20,
        position: group.position
      });
    }

    function spawnGravityVoid(x, y, z) {
      const group = new THREE.Group();
      const geo = new THREE.SphereGeometry(1.2, 16, 16);
      const mat = new THREE.MeshStandardMaterial({ color: 0x7928ca, emissive: 0x7928ca, emissiveIntensity: 0.9, wireframe: true });
      const mesh = new THREE.Mesh(geo, mat);
      group.add(mesh);

      group.position.set(x, y + 2.0, z);
      scene.add(group);

      envObjects.push({
        mesh: group,
        type: 'gravity_void',
        pulseTimer: 0,
        position: group.position
      });
    }

    function createLaserFence(x, y, z) {
      const group = new THREE.Group();
      const fenceGeo = new THREE.CylinderGeometry(0.1, 0.1, 3, 8);

      const p1 = new THREE.Mesh(fenceGeo, redNeonMat); p1.position.set(-2, 1.5, 0);
      const p2 = new THREE.Mesh(fenceGeo, redNeonMat); p2.position.set(2, 1.5, 0);
      group.add(p1); group.add(p2);

      const beamGeo = new THREE.BoxGeometry(4, 0.2, 0.2);
      const beam = new THREE.Mesh(beamGeo, redNeonMat);
      beam.position.set(0, 1.5, 0);
      group.add(beam);

      group.position.set(x, y, z);
      scene.add(group);

      hazards.push({
        mesh: group,
        type: 'laser',
        timer: Math.random() * Math.PI,
        beamMesh: beam
      });
    }

    function spawnEnemy(x, y, z, type = 'slime') {
      const group = new THREE.Group();
      let color = type === 'slime' ? 0xff0055 : 0xffaa00;
      let hp = type === 'slime' ? (45 + floor * 15) : (70 + floor * 22);

      const geo = type === 'slime' ? new THREE.SphereGeometry(0.85, 16, 16) : new THREE.BoxGeometry(1.3, 1.6, 1.3);
      const mat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.4, roughness: 0.3 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      group.add(mesh);

      group.position.set(x, y + 1, z);
      scene.add(group);

      enemies.push({
        mesh: group,
        hp: hp,
        maxHp: hp,
        type: type,
        speed: type === 'slime' ? 4.8 : 0,
        shootCooldown: 1.6,
        lastShoot: Math.random() * 1.5,
        frozenTimer: 0
      });
    }

    function spawnMegaBoss(x, y, z) {
      const group = new THREE.Group();
      const hp = 750 + floor * 250;

      const coreGeo = new THREE.BoxGeometry(3.8, 3.8, 3.8);
      const coreMesh = new THREE.Mesh(coreGeo, purpleNeonMat);
      coreMesh.castShadow = true;
      group.add(coreMesh);

      const ringGeo = new THREE.TorusGeometry(3.5, 0.3, 16, 32);
      const ringMesh = new THREE.Mesh(ringGeo, cyanNeonMat);
      ringMesh.rotation.x = Math.PI / 2;
      group.add(ringMesh);

      group.position.set(x, y + 4.5, z);
      scene.add(group);

      megaBoss = {
        mesh: group,
        coreMesh: coreMesh,
        ringMesh: ringMesh,
        hp: hp,
        maxHp: hp,
        phase: 1,
        attackTimer: 0,
        type: 'boss',
        frozenTimer: 0
      };

      document.getElementById('boss-hud').style.display = 'flex';
      document.getElementById('boss-title').innerText = `MEGABOSS: CYBER CORE [FLOOR ${floor}]`;
      document.getElementById('boss-hp-bar').style.width = '100%';
    }

    function generateStage() {
      clearStage();
      playerPhysics.position.set(0, 3, 0);
      playerPhysics.velocity.set(0, 0, 0);

      const isBossFloor = (floor % 5 === 0);

      if (isBossFloor) {
        createPlatform(0, 0, -22, 38, 38);
        spawnMegaBoss(0, 0, -26);
        spawnEnergyBarrel(-10, 0, -15);
        spawnEnergyBarrel(10, 0, -15);
      } else {
        createPlatform(0, 0, 0, 10, 10);
        let currentPos = new THREE.Vector3(0, 0, 0);
        let lastPlatformPos = currentPos.clone();

        const sectionCount = 5 + Math.min(floor, 10);

        for (let i = 0; i < sectionCount; i++) {
          const gap = 8 + Math.random() * 5;
          const angle = (Math.random() - 0.5) * 1.2;
          const heightDiff = (Math.random() - 0.25) * 3;

          currentPos.x += Math.sin(angle) * gap;
          currentPos.z -= Math.cos(angle) * gap;
          currentPos.y += heightDiff;

          const w = 7 + Math.random() * 4;
          const d = 7 + Math.random() * 4;

          const randType = Math.random();
          const pType = randType < 0.2 ? 'disappear' : (randType < 0.35 ? 'boost' : (randType < 0.5 ? 'moving' : 'normal'));
          createPlatform(currentPos.x, currentPos.y, currentPos.z, w, d, pType);

          // Build Cyber Grind Rails between platforms
          if (i > 0 && Math.random() < 0.5) {
            createGrindRail(
              new THREE.Vector3(lastPlatformPos.x, lastPlatformPos.y + 1.2, lastPlatformPos.z),
              new THREE.Vector3(currentPos.x, currentPos.y + 1.2, currentPos.z)
            );
          }
          lastPlatformPos.copy(currentPos);

          if (Math.random() < 0.35 && pType === 'normal') {
            if (Math.random() < 0.5) spawnEnergyBarrel(currentPos.x, currentPos.y, currentPos.z);
            else spawnGravityVoid(currentPos.x, currentPos.y, currentPos.z);
          }

          if (Math.random() < 0.3 && pType === 'normal') {
            createLaserFence(currentPos.x, currentPos.y, currentPos.z);
          }

          const enemyCount = Math.floor(Math.random() * 2) + 1;
          for (let e = 0; e < enemyCount; e++) {
            const type = Math.random() > 0.4 ? 'slime' : 'shooter';
            spawnEnemy(
              currentPos.x + (Math.random() - 0.5) * (w - 3),
              currentPos.y,
              currentPos.z + (Math.random() - 0.5) * (d - 3),
              type
            );
          }
        }

        currentPos.z -= 10;
        createPlatform(currentPos.x, currentPos.y, currentPos.z, 8, 8);

        const portalGeo = new THREE.TorusGeometry(2.0, 0.4, 16, 32);
        goalPortal = new THREE.Mesh(portalGeo, cyanNeonMat);
        goalPortal.position.set(currentPos.x, currentPos.y + 2.5, currentPos.z);
        scene.add(goalPortal);
      }

      document.getElementById('floor-num').innerText = floor;
    }

    /* ==========================================================
       INPUT SYSTEM
    ========================================================== */
    const input = { x: 0, y: 0, jump: false, fire: false };

    const stickArea = document.getElementById('joystick-area');
    const stickKnob = document.getElementById('joystick-knob');
    let touchId = null;
    let stickCenter = { x: 0, y: 0 };
    const maxRadius = 45;

    stickArea.addEventListener('touchstart', (e) => {
      const touch = e.changedTouches[0];
      touchId = touch.identifier;
      const rect = stickArea.getBoundingClientRect();
      stickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      handleStickMove(touch.clientX, touch.clientY);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (touchId === null) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === touchId) {
          handleStickMove(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
          break;
        }
      }
    }, { passive: false });

    function endStick(e) {
      if (touchId === null) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === touchId) {
          touchId = null;
          input.x = 0; input.y = 0;
          stickKnob.style.transform = `translate(-50%, -50%)`;
          break;
        }
      }
    }
    window.addEventListener('touchend', endStick);
    window.addEventListener('touchcancel', endStick);

    function handleStickMove(cx, cy) {
      let dx = cx - stickCenter.x;
      let dy = cy - stickCenter.y;
      const dist = Math.hypot(dx, dy);

      if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
      }
      stickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      input.x = dx / maxRadius;
      input.y = dy / maxRadius;
    }

    const jumpBtn = document.getElementById('jump-btn');
    const fireBtn = document.getElementById('fire-btn');
    const dashBtn = document.getElementById('dash-btn');
    const skillBtn = document.getElementById('skill-btn');
    const odBtn = document.getElementById('od-btn');

    jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); input.jump = true; jumpBtn.classList.add('active'); if (isGrinding) jumpFromRail(); });
    jumpBtn.addEventListener('touchend', () => { input.jump = false; jumpBtn.classList.remove('active'); });
    fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); input.fire = true; fireBtn.classList.add('active'); });
    fireBtn.addEventListener('touchend', () => { input.fire = false; fireBtn.classList.remove('active'); });
    dashBtn.addEventListener('touchstart', (e) => { e.preventDefault(); triggerDash(); });
    skillBtn.addEventListener('touchstart', (e) => { e.preventDefault(); triggerSkill(); });
    odBtn.addEventListener('touchstart', (e) => { e.preventDefault(); triggerOverdrive(); });

    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space') { input.jump = true; if (isGrinding) jumpFromRail(); }
      if (e.code === 'KeyJ' || e.code === 'KeyZ') input.fire = true;
      if (e.code === 'ShiftLeft' || e.code === 'KeyK') triggerDash();
      if (e.code === 'KeyE' || e.code === 'KeyX') triggerSkill();
      if (e.code === 'KeyR' || e.code === 'KeyC') triggerOverdrive();
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      if (e.code === 'Space') input.jump = false;
      if (e.code === 'KeyJ' || e.code === 'KeyZ') input.fire = false;
    });

    function updateKeyboardInput() {
      if (touchId === null) {
        let x = 0, y = 0;
        if (keys['KeyA'] || keys['ArrowLeft']) x -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) x += 1;
        if (keys['KeyW'] || keys['ArrowUp']) y -= 1;
        if (keys['KeyS'] || keys['ArrowDown']) y += 1;
        if (x !== 0 || y !== 0) {
          const len = Math.hypot(x, y);
          input.x = x / len;
          input.y = y / len;
        } else {
          input.x = 0; input.y = 0;
        }
      }
    }

    /* ==========================================================
       ACTION MECHANICS: STYLISH PERFECT DODGE & BULLET TIME
    ========================================================== */
    function checkPerfectDodge() {
      let isNearThreat = false;
      const dodgeRadius = 4.0;

      for (const eb of enemyBullets) {
        if (eb.mesh.position.distanceTo(playerGroup.position) < dodgeRadius) {
          isNearThreat = true;
          break;
        }
      }

      if (!isNearThreat) {
        for (const e of enemies) {
          if (e.mesh.position.distanceTo(playerGroup.position) < dodgeRadius + 1) {
            isNearThreat = true;
            break;
          }
        }
      }

      if (isNearThreat) {
        triggerPerfectDodge();
      }
    }

    function triggerPerfectDodge() {
      isBulletTime = true;
      bulletTimeTimer = 1.5; // 1.5s stylish slow motion
      addODGauge(45); // Huge OD Gauge reward

      document.getElementById('bullet-time-fx').classList.add('active');
      triggerGlitchEffect(300);

      const banner = document.getElementById('dodge-banner');
      banner.classList.add('show');
      setTimeout(() => { banner.classList.remove('show'); }, 900);

      triggerCameraShake(0.8, 0.3);
      spawnNeonParticles(playerGroup.position, 0x00ffff, 25, 2.0);
    }

    function updateBulletTime(dtReal) {
      if (!isBulletTime) return;

      bulletTimeTimer -= dtReal;
      if (bulletTimeTimer <= 0) {
        isBulletTime = false;
        document.getElementById('bullet-time-fx').classList.remove('active');
      }
    }

    /* ==========================================================
       COMBAT & OVERDRIVE / SKILL SYSTEM
    ========================================================== */
    function triggerOverdrive() {
      if (playerStats.odGauge < playerStats.maxOdGauge || playerStats.isOverdrive) return;

      playerStats.isOverdrive = true;
      playerStats.odTimer = 10.0;
      playerStats.odGauge = 0;
      document.getElementById('od-bar').style.width = '0%';
      document.getElementById('od-btn').classList.remove('ready');

      document.getElementById('overdrive-screen-fx').classList.add('active');
      bloomPass.strength = 3.2;

      triggerGlitchEffect(400);
      triggerCameraShake(1.2, 0.5);
      spawnNeonParticles(playerGroup.position, 0xff007f, 40, 2.0);
    }

    function triggerDash() {
      const now = performance.now() / 1000;
      const effectiveCooldown = playerStats.isOverdrive ? 0.1 : playerStats.dashCooldown;
      if (now - playerStats.lastDashTime < effectiveCooldown || playerStats.isDashing) return;

      if (isGrinding) jumpFromRail();

      checkPerfectDodge();

      playerStats.isDashing = true;
      playerStats.dashTimer = CONFIG.dashDuration;
      playerStats.lastDashTime = now;
      playerStats.invulnerableTimer = CONFIG.dashDuration + 0.15;

      if (Math.hypot(input.x, input.y) > 0.1) {
        playerStats.dashDir.set(input.x, 0, input.y).normalize();
      } else {
        playerStats.dashDir.set(0, 0, -1).applyQuaternion(playerGroup.quaternion);
      }

      spawnNeonParticles(playerGroup.position, playerStats.isOverdrive ? 0xff007f : 0x00ffcc, 15);
      spawnHologramTrail();
      triggerCameraShake(0.3, 0.15);
    }

    function triggerSkill() {
      const now = performance.now() / 1000;
      if (now - playerStats.lastSkillTime < playerStats.skillCooldown) return;

      playerStats.lastSkillTime = now;

      triggerCameraShake(0.9, 0.35);
      triggerGlitchEffect(200);
      spawnNeonParticles(playerGroup.position, 0xb026ff, 35, 1.5);

      const empRadius = 20;
      enemies.forEach(e => {
        if (playerGroup.position.distanceTo(e.mesh.position) <= empRadius) {
          applyDamageToEnemy(e, playerStats.damage * 2.8, 'electric');
        }
      });

      if (megaBoss && playerGroup.position.distanceTo(megaBoss.mesh.position) <= empRadius + 5) {
        applyDamageToEnemy(megaBoss, playerStats.damage * 2.8, 'electric');
      }

      envObjects.forEach(o => {
        if (o.type === 'barrel' && playerGroup.position.distanceTo(o.position) <= empRadius) {
          explodeBarrel(o);
        }
      });
    }

    function shootBullet() {
      let targetPos = null;
      let minDist = 38;

      if (megaBoss) {
        targetPos = megaBoss.mesh.position;
      } else {
        enemies.forEach(e => {
          const d = playerGroup.position.distanceTo(e.mesh.position);
          if (d < minDist) { minDist = d; targetPos = e.mesh.position; }
        });
      }

      let aimDir = new THREE.Vector3();
      if (targetPos) {
        aimDir.subVectors(targetPos, playerGroup.position).normalize();
        aimDir.y += 0.04;
      } else {
        aimDir.set(0, 0, -1).applyQuaternion(playerGroup.quaternion);
      }

      const shotCount = playerStats.isOverdrive ? playerStats.multishot + 2 : playerStats.multishot;

      for (let i = 0; i < shotCount; i++) {
        const bulletGeo = new THREE.SphereGeometry(playerStats.isOverdrive ? 0.5 : 0.35, 8, 8);
        
        let mat = cyanNeonMat;
        if (playerStats.isOverdrive) mat = redNeonMat;
        else if (playerStats.elements.electric && playerStats.elements.fire) mat = redNeonMat;
        else if (playerStats.elements.electric) mat = cyanNeonMat;
        else if (playerStats.elements.fire) mat = redNeonMat;

        const bullet = new THREE.Mesh(bulletGeo, mat);
        bullet.position.copy(playerGroup.position);
        bullet.position.y += 0.2;

        let spread = (i - (shotCount - 1) / 2) * 0.12;
        let dir = aimDir.clone();
        dir.x += spread;
        dir.normalize();

        scene.add(bullet);
        bullets.push({
          mesh: bullet,
          velocity: dir.multiplyScalar(CONFIG.bulletSpeed * (playerStats.isOverdrive ? 1.25 : 1.0)),
          life: CONFIG.bulletLifetime,
          damage: playerStats.damage * (playerStats.isOverdrive ? 1.6 : 1.0),
          isOverdrive: playerStats.isOverdrive
        });
      }

      triggerCameraShake(playerStats.isOverdrive ? 0.2 : 0.08, 0.05);
    }

    function shootEnemyBullet(fromPos, targetPos, speed = 18, colorHex = 0xff0055) {
      const geo = new THREE.SphereGeometry(0.38, 8, 8);
      const mat = new THREE.MeshBasicMaterial({ color: colorHex });
      const bullet = new THREE.Mesh(geo, mat);
      bullet.position.copy(fromPos);

      const dir = new THREE.Vector3().subVectors(targetPos, fromPos).normalize();
      scene.add(bullet);

      enemyBullets.push({
        mesh: bullet,
        velocity: dir.multiplyScalar(speed),
        life: 3.2,
        damage: 16
      });
    }

    /* ==========================================================
       ELEMENTAL FUSIONS & DAMAGE ENGINE
    ========================================================== */
    function applyDamageToEnemy(enemy, dmg, elemType = 'none') {
      enemy.hp -= dmg;
      addODGauge(dmg * 0.15);

      const hasElectric = playerStats.elements.electric || elemType === 'electric';
      const hasFire = playerStats.elements.fire;
      const hasIce = playerStats.elements.ice;

      // --- ELEMENTAL FUSION 1: Electric x Fire = Superconductive Plasma ---
      if (hasElectric && hasFire) {
        spawnNeonParticles(enemy.mesh.position, 0xff3300, 16, 1.8);
        triggerLightningBeam(enemy.mesh.position, enemy.mesh.position.clone().add(new THREE.Vector3(0, 4, 0)), 0xff3300);
        
        enemies.forEach(other => {
          if (other !== enemy && other.mesh.position.distanceTo(enemy.mesh.position) < 9.0) {
            other.hp -= dmg * 0.65;
            triggerLightningBeam(enemy.mesh.position, other.mesh.position, 0xff3300);
          }
        });
        triggerGlitchEffect(120);
      }
      // --- ELEMENTAL FUSION 2: Ice x Electric = Absolute Zero Shock ---
      else if (hasIce && hasElectric) {
        if (enemy.frozenTimer > 0) {
          // Shatter frozen ice into crystalline blades
          for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2;
            const bladeDir = new THREE.Vector3(Math.cos(angle), 0.2, Math.sin(angle));
            enemies.forEach(other => {
              if (other !== enemy && other.mesh.position.distanceTo(enemy.mesh.position) < 7.0) {
                other.hp -= dmg * 0.8;
              }
            });
          }
          spawnNeonParticles(enemy.mesh.position, 0x00ffff, 20, 2.2);
          triggerGlitchEffect(100);
        } else {
          enemy.frozenTimer = 2.0;
        }
      }
      // Single Elements
      else if (hasElectric) {
        enemies.forEach(other => {
          if (other !== enemy && other.mesh.position.distanceTo(enemy.mesh.position) < 8) {
            other.hp -= dmg * 0.5;
            triggerLightningBeam(enemy.mesh.position, other.mesh.position, 0x00d2ff);
          }
        });
      } else if (hasFire) {
        spawnNeonParticles(enemy.mesh.position, 0xff3300, 8);
        enemies.forEach(other => {
          if (other !== enemy && other.mesh.position.distanceTo(enemy.mesh.position) < 4.5) {
            other.hp -= dmg * 0.35;
          }
        });
      } else if (hasIce) {
        enemy.frozenTimer = 1.8;
        spawnNeonParticles(enemy.mesh.position, 0x00ffff, 6);
      }

      if (enemy.hp <= 0) {
        spawnNeonParticles(enemy.mesh.position, 0xff0055, 20);
        
        if (enemy.type === 'boss') {
          scene.remove(enemy.mesh);
          megaBoss = null;
          triggerCinematicKO(enemy.mesh.position);
        } else {
          scene.remove(enemy.mesh);
          const idx = enemies.indexOf(enemy);
          if (idx !== -1) enemies.splice(idx, 1);
          totalKills++;
          document.getElementById('kill-num').innerText = totalKills;

          if (enemies.length === 0 && !megaBoss && goalPortal) {
            triggerCinematicKO(enemy.mesh.position);
          }
        }
      }
    }

    function explodeBarrel(barrel) {
      spawnNeonParticles(barrel.position, 0xff3300, 35, 2.0);
      triggerCameraShake(1.0, 0.4);

      const radius = 12;
      enemies.forEach(e => {
        if (e.mesh.position.distanceTo(barrel.position) <= radius) {
          applyDamageToEnemy(e, 150, 'fire');
        }
      });

      if (megaBoss && megaBoss.mesh.position.distanceTo(barrel.position) <= radius + 3) {
        applyDamageToEnemy(megaBoss, 150, 'fire');
      }

      if (playerGroup.position.distanceTo(barrel.position) <= radius) {
        takeDamage(25);
      }

      scene.remove(barrel.mesh);
      const idx = envObjects.indexOf(barrel);
      if (idx !== -1) envObjects.splice(idx, 1);
    }

    /* ==========================================================
       PHYSICS & GRIND RAIL MECHANICS
    ========================================================== */
    function checkGrounded(pos) {
      const footY = pos.y - playerPhysics.height / 2;
      for (const p of platforms) {
        if (!p.active) continue;
        if (
          pos.x + playerPhysics.radius > p.minX &&
          pos.x - playerPhysics.radius < p.maxX &&
          pos.z + playerPhysics.radius > p.minZ &&
          pos.z - playerPhysics.radius < p.maxZ
        ) {
          if (footY <= p.topY && footY >= p.topY - 1.2) {
            if (p.type === 'boost') {
              playerPhysics.velocity.y = CONFIG.jumpVelocity * 1.4;
              spawnNeonParticles(pos, 0x00ffcc, 10);
            }
            if (p.type === 'disappear') {
              p.timer += 0.03;
              if (p.timer > 1.0) p.active = false;
            }
            return p.topY;
          }
        }
      }
      return null;
    }

    function checkGrindRailSnap(pos) {
      if (isGrinding) return;

      const snapRadius = 2.2;
      for (const rail of grindRails) {
        const p1 = rail.curve.getPoint(0);
        if (pos.distanceTo(p1) < snapRadius) {
          isGrinding = true;
          currentRail = rail;
          railProgress = 0;
          spawnNeonParticles(pos, 0x00ffff, 15);
          break;
        }
      }
    }

    function updateGrindRail(dt) {
      if (!isGrinding || !currentRail) return;

      railProgress += (railSpeed * dt) / currentRail.length;
      if (railProgress >= 1.0) {
        isGrinding = false;
        playerPhysics.velocity.y = 8; // Launch off rail
        currentRail = null;
        return;
      }

      const railPos = currentRail.curve.getPoint(railProgress);
      playerGroup.position.copy(railPos);
      playerGroup.position.y += 0.9;

      // Rail grind spark particles & trail
      spawnNeonParticles(playerGroup.position, 0x00ffff, 2, 0.5);
      if (Math.random() < 0.4) spawnHologramTrail();
    }

    function jumpFromRail() {
      if (!isGrinding) return;
      isGrinding = false;
      playerPhysics.velocity.y = CONFIG.jumpVelocity;
      playerPhysics.isGrounded = false;
      currentRail = null;
      spawnNeonParticles(playerGroup.position, 0x00ffff, 12);
    }

    function updatePlatforms(dt) {
      platforms.forEach(p => {
        if (!p.active) {
          p.mesh.scale.multiplyScalar(0.9);
          if (p.mesh.scale.x < 0.05) p.mesh.visible = false;
          return;
        }

        if (p.type === 'moving') {
          p.timer += dt * 2;
          const offsetY = Math.sin(p.timer) * 3.5;
          p.mesh.position.y = (p.initialY - 0.5) + offsetY;
          p.topY = p.initialY + offsetY;
        }
      });
    }

    function updatePlayer(dt) {
      updateKeyboardInput();

      if (playerStats.isOverdrive) {
        playerStats.odTimer -= dt;
        if (playerStats.odTimer <= 0) {
          playerStats.isOverdrive = false;
          document.getElementById('overdrive-screen-fx').classList.remove('active');
          bloomPass.strength = 1.6;
        }
      }

      if (playerStats.invulnerableTimer > 0) playerStats.invulnerableTimer -= dt;

      if (isGrinding) {
        updateGrindRail(dt);
      } else if (playerStats.isDashing) {
        playerStats.dashTimer -= dt;
        playerPhysics.position.x += playerStats.dashDir.x * CONFIG.dashSpeed * dt;
        playerPhysics.position.z += playerStats.dashDir.z * CONFIG.dashSpeed * dt;

        spawnNeonParticles(playerGroup.position, playerStats.isOverdrive ? 0xff007f : 0x66fcf1, 2);
        if (Math.random() < 0.5) spawnHologramTrail();

        if (playerStats.dashTimer <= 0) playerStats.isDashing = false;
      } else {
        const speed = CONFIG.playerSpeed * playerStats.speedMult * (playerStats.isOverdrive ? 1.4 : 1.0);
        playerPhysics.position.x += input.x * speed * dt;
        playerPhysics.position.z += input.y * speed * dt;

        checkGrindRailSnap(playerPhysics.position);
      }

      if (Math.hypot(input.x, input.y) > 0.1) {
        const targetAngle = Math.atan2(input.x, input.y);
        playerGroup.rotation.y = THREE.MathUtils.lerp(playerGroup.rotation.y, targetAngle, 0.25);
      }

      // Gravity & Jump Physics
      if (!isGrinding) {
        const groundY = checkGrounded(playerPhysics.position);
        if (groundY !== null && playerPhysics.velocity.y <= 0) {
          playerPhysics.isGrounded = true;
          playerPhysics.velocity.y = 0;
          playerPhysics.position.y = groundY + playerPhysics.height / 2;
        } else {
          playerPhysics.isGrounded = false;
          playerPhysics.velocity.y += CONFIG.gravity * dt;
        }

        if (input.jump && playerPhysics.isGrounded) {
          playerPhysics.velocity.y = CONFIG.jumpVelocity;
          playerPhysics.isGrounded = false;
        }

        playerPhysics.position.y += playerPhysics.velocity.y * dt;
      }

      if (playerPhysics.position.y < -20) {
        takeDamage(playerStats.maxHp);
      }

      // Weapon Firing Logic
      const effectiveFireRate = playerStats.isOverdrive ? 0.07 : playerStats.fireRate;
      if (input.fire && performance.now() / 1000 - lastShootTime >= effectiveFireRate) {
        shootBullet();
        lastShootTime = performance.now() / 1000;
      }

      if (goalPortal) {
        goalPortal.rotation.z += dt * 2.5;
        if (playerPhysics.position.distanceTo(goalPortal.position) < 2.2) {
          triggerStageClear();
        }
      }

      const now = performance.now() / 1000;
      const dashCDPct = Math.max(0, 1 - (now - playerStats.lastDashTime) / playerStats.dashCooldown);
      const skillCDPct = Math.max(0, 1 - (now - playerStats.lastSkillTime) / playerStats.skillCooldown);

      document.getElementById('dash-cd').style.height = (dashCDPct * 100) + '%';
      document.getElementById('skill-cd').style.height = (skillCDPct * 100) + '%';
    }

    function updateEnvObjects(dt) {
      envObjects.forEach(o => {
        if (o.type === 'gravity_void') {
          o.pulseTimer += dt * 3;
          o.mesh.rotation.y += dt * 2;
          o.mesh.rotation.z += dt * 1.5;

          const pullRadius = 14;
          enemies.forEach(e => {
            const d = e.mesh.position.distanceTo(o.position);
            if (d < pullRadius && d > 0.5) {
              const pullDir = new THREE.Vector3().subVectors(o.position, e.mesh.position).normalize();
              e.mesh.position.addScaledVector(pullDir, dt * 6.0);
              if (d < 1.8) applyDamageToEnemy(e, 35 * dt, 'none');
            }
          });
        }
      });
    }

    function updateHazards(dt) {
      hazards.forEach(h => {
        if (h.type === 'laser') {
          h.timer += dt * 3;
          const active = Math.sin(h.timer) > -0.2;
          h.beamMesh.visible = active;

          if (active && playerPhysics.position.distanceTo(h.mesh.position) < 2.5) {
            takeDamage(22 * dt);
          }
        }
      });
    }

    function updateEnemies(dt) {
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];

        if (enemy.frozenTimer > 0) {
          enemy.frozenTimer -= dt;
          continue;
        }

        const dist = enemy.mesh.position.distanceTo(playerGroup.position);

        if (enemy.type === 'slime') {
          if (dist < 24) {
            const dir = new THREE.Vector3().subVectors(playerGroup.position, enemy.mesh.position).normalize();
            enemy.mesh.position.x += dir.x * enemy.speed * dt;
            enemy.mesh.position.z += dir.z * enemy.speed * dt;

            if (dist < 1.4) takeDamage(20 * dt);
          }
        } else if (enemy.type === 'shooter') {
          enemy.lastShoot += dt;
          if (dist < 30 && enemy.lastShoot >= enemy.shootCooldown) {
            enemy.lastShoot = 0;
            shootEnemyBullet(enemy.mesh.position, playerGroup.position);
          }
        }
      }

      if (megaBoss) {
        megaBoss.ringMesh.rotation.z += dt * 1.8;
        megaBoss.ringMesh.rotation.y += dt * 1.2;

        megaBoss.attackTimer += dt;
        const interval = megaBoss.phase === 1 ? 1.3 : 0.75;

        if (megaBoss.hp < megaBoss.maxHp * 0.5 && megaBoss.phase === 1) {
          megaBoss.phase = 2;
          triggerCameraShake(1.0, 0.4);
          spawnNeonParticles(megaBoss.mesh.position, 0xff0055, 35);
        }

        if (megaBoss.attackTimer >= interval) {
          megaBoss.attackTimer = 0;

          if (megaBoss.phase === 1) {
            const bulletCount = 8;
            for (let b = 0; b < bulletCount; b++) {
              const ang = (b / bulletCount) * Math.PI * 2;
              const target = megaBoss.mesh.position.clone().add(new THREE.Vector3(Math.cos(ang) * 10, -2, Math.sin(ang) * 10));
              shootEnemyBullet(megaBoss.mesh.position, target, 16);
            }
          } else {
            shootEnemyBullet(megaBoss.mesh.position, playerGroup.position, 26, 0xb026ff);
          }
        }
      }
    }

    function updateBullets(dt) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.mesh.position.addScaledVector(b.velocity, dt);
        b.life -= dt;

        let hit = false;

        envObjects.forEach(o => {
          if (o.type === 'barrel' && b.mesh.position.distanceTo(o.position) < 1.2) {
            explodeBarrel(o);
            hit = true;
          }
        });

        if (!hit) {
          for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (b.mesh.position.distanceTo(e.mesh.position) < 1.4) {
              applyDamageToEnemy(e, b.damage);
              hit = true;
              spawnNeonParticles(b.mesh.position, 0x66fcf1, 5);
              triggerHitStop(0.04);
              break;
            }
          }
        }

        if (!hit && megaBoss && b.mesh.position.distanceTo(megaBoss.mesh.position) < 3.0) {
          applyDamageToEnemy(megaBoss, b.damage);
          hit = true;
          spawnNeonParticles(b.mesh.position, 0xb026ff, 6);
          triggerHitStop(0.03);

          const hpPct = Math.max(0, (megaBoss.hp / megaBoss.maxHp) * 100);
          document.getElementById('boss-hp-bar').style.width = hpPct + '%';
        }

        if (hit || b.life <= 0) {
          scene.remove(b.mesh);
          bullets.splice(i, 1);
        }
      }

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.mesh.position.addScaledVector(eb.velocity, dt);
        eb.life -= dt;

        if (eb.mesh.position.distanceTo(playerGroup.position) < 1.1) {
          takeDamage(eb.damage);
          spawnNeonParticles(eb.mesh.position, 0xff0055, 8);
          scene.remove(eb.mesh);
          enemyBullets.splice(i, 1);
          continue;
        }

        if (eb.life <= 0) {
          scene.remove(eb.mesh);
          enemyBullets.splice(i, 1);
        }
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.velocity.y += CONFIG.gravity * 0.3 * dt;
        p.mesh.position.addScaledVector(p.velocity, dt);
        p.mesh.scale.multiplyScalar(0.92);

        if (p.life <= 0) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
        }
      }
    }

    function takeDamage(amount) {
      if (isGameOver || playerStats.invulnerableTimer > 0) return;

      playerStats.hp -= amount;
      if (playerStats.hp < 0) playerStats.hp = 0;

      triggerDamageFlash();
      triggerCameraShake(0.55, 0.25);

      const hpPct = Math.max(0, (playerStats.hp / playerStats.maxHp) * 100);
      document.getElementById('hp-bar').style.width = hpPct + '%';

      if (playerStats.hp <= 0) {
        gameOver();
      }
    }

    /* ==========================================================
       CINEMATIC K.O. & ROGUELIKE UPGRADES
    ========================================================== */
    function triggerCinematicKO(targetPos) {
      isCinematicKO = true;
      koTimer = 1.4;
      koTargetPos.copy(targetPos);
      timeScale = 0.08;

      const banner = document.getElementById('ko-banner');
      banner.classList.add('show');
      triggerCameraShake(1.2, 0.6);
      spawnNeonParticles(targetPos, 0xff007f, 50, 2.5);
    }

    function updateCinematicKO(dtReal) {
      if (!isCinematicKO) return;

      koTimer -= dtReal;
      if (koTimer <= 0) {
        isCinematicKO = false;
        timeScale = 1.0;
        document.getElementById('ko-banner').classList.remove('show');
        triggerStageClear();
      }
    }

    const UPGRADE_POOL = [
      { name: "プラズマボルト [電撃]", desc: "弾丸に電撃を付与。着弾時に周囲の敵へ連鎖放電", apply: () => { playerStats.elements.electric = true; } },
      { name: "サーマルブラスト [過熱]", desc: "弾丸に過熱効果を付与。着弾時に範囲爆発ダメージ", apply: () => { playerStats.elements.fire = true; } },
      { name: "ヴォルテックスフロスト [氷結]", desc: "弾丸に氷結効果を付与。敵の動きを完全に凍結停止", apply: () => { playerStats.elements.ice = true; } },
      { name: "オーバーチャージHP", desc: "最大HPが50増加し、HPを全回復する", apply: () => { playerStats.maxHp += 50; playerStats.hp = playerStats.maxHp; } },
      { name: "ハイパーラピッド", desc: "攻撃の連射速度が35%上昇", apply: () => { playerStats.fireRate *= 0.65; } },
      { name: "プラズマコア", desc: "弾丸の威力が45%向上", apply: () => { playerStats.damage *= 1.45; } },
      { name: "スプリット弾丸", desc: "同時に発射する弾丸が1発増加", apply: () => { playerStats.multishot += 1; } },
      { name: "サイバードライブ", desc: "移動速度+20% ＆ ダッシュCD短縮", apply: () => { playerStats.speedMult += 0.2; playerStats.dashCooldown *= 0.8; } }
    ];

    function updateElementTagsUI() {
      const container = document.getElementById('element-tags');
      container.innerHTML = '';

      if (playerStats.elements.electric && playerStats.elements.fire) {
        container.innerHTML += `<span class="elem-tag fusion-plasma">FUSION: PLASMA</span>`;
      } else if (playerStats.elements.ice && playerStats.elements.electric) {
        container.innerHTML += `<span class="elem-tag fusion-zero">FUSION: ZERO-SHOCK</span>`;
      } else {
        if (playerStats.elements.electric) container.innerHTML += `<span class="elem-tag electric">ELEC</span>`;
        if (playerStats.elements.fire) container.innerHTML += `<span class="elem-tag fire">FIRE</span>`;
        if (playerStats.elements.ice) container.innerHTML += `<span class="elem-tag ice">ICE</span>`;
      }
    }

    function triggerStageClear() {
      isPaused = true;
      const modal = document.getElementById('upgrade-modal');
      const container = document.getElementById('upgrade-options');
      container.innerHTML = '';

      const shuffled = [...UPGRADE_POOL].sort(() => 0.5 - Math.random()).slice(0, 3);
      shuffled.forEach(upg => {
        const card = document.createElement('div');
        card.className = 'upgrade-card';
        card.innerHTML = `<div class="card-name"><span>${upg.name}</span></div><div class="card-desc">${upg.desc}</div>`;
        card.onclick = () => {
          upg.apply();
          updateElementTagsUI();
          document.getElementById('hp-bar').style.width = ((playerStats.hp / playerStats.maxHp) * 100) + '%';
          modal.style.display = 'none';
          floor++;
          isPaused = false;
          generateStage();
        };
        container.appendChild(card);
      });

      modal.style.display = 'flex';
    }

    function gameOver() {
      isGameOver = true;
      document.getElementById('final-floor').innerText = floor;
      document.getElementById('gameover-modal').style.display = 'flex';
    }

    document.getElementById('restart-btn').onclick = () => {
      document.getElementById('gameover-modal').style.display = 'none';
      floor = 1;
      totalKills = 0;
      document.getElementById('kill-num').innerText = totalKills;
      playerStats.maxHp = 100;
      playerStats.hp = 100;
      playerStats.damage = 32;
      playerStats.fireRate = 0.20;
      playerStats.speedMult = 1.0;
      playerStats.multishot = 1;
      playerStats.dashCooldown = 1.4;
      playerStats.odGauge = 0;
      playerStats.isOverdrive = false;
      playerStats.elements = { electric: false, fire: false, ice: false };
      updateElementTagsUI();
      document.getElementById('hp-bar').style.width = '100%';
      document.getElementById('od-bar').style.width = '0%';
      isGameOver = false;
      generateStage();
    };

    /* ==========================================================
       CINEMATIC DYNAMIC CAMERA & MAIN RENDER LOOP
    ========================================================== */
    const defaultCamOffset = new THREE.Vector3(0, 11, 15);
    const railCamOffset = new THREE.Vector3(0, 6, 10); // Cinematic Low-angle during rail grinding

    function updateCamera(dt) {
      let targetOffset = isGrinding ? railCamOffset : defaultCamOffset;
      let targetPos;

      if (isCinematicKO) {
        targetPos = koTargetPos.clone().add(new THREE.Vector3(0, 4, 7));
      } else {
        targetPos = playerGroup.position.clone().add(targetOffset);
      }

      if (cameraShake.duration > 0) {
        cameraShake.duration -= dt;
        targetPos.x += (Math.random() - 0.5) * cameraShake.intensity;
        targetPos.y += (Math.random() - 0.5) * cameraShake.intensity;
        targetPos.z += (Math.random() - 0.5) * cameraShake.intensity;
      }

      camera.position.lerp(targetPos, isGrinding ? 0.2 : (isCinematicKO ? 0.08 : 0.12));

      const lookTarget = isCinematicKO ? koTargetPos : playerGroup.position;
      camera.lookAt(lookTarget.x, lookTarget.y + (isGrinding ? 0.5 : 1.0), lookTarget.z);
    }

    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const dtReal = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      if (isCinematicKO) updateCinematicKO(dtReal);
      if (isBulletTime) updateBulletTime(dtReal);

      let dt = dtReal * (isBulletTime ? 0.18 : timeScale);

      if (hitStopTimer > 0) {
        hitStopTimer -= dtReal;
        dt = 0;
      }

      if (!isGameOver && !isPaused) {
        updatePlatforms(dt);
        updatePlayer(dt);
        updateEnvObjects(dt);
        updateHazards(dt);
        updateEnemies(dt);
        updateBullets(dt);
        updateParticles(dt);
        updateTrails(dtReal);
        updateCamera(dtReal);

        bgGroup.userData.particles.rotation.y += dtReal * 0.05;
      }

      composer.render();
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    // INITIALIZE & START
    generateStage();
    animate();
  </script>
</body>
