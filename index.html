<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TITAN SLAYER - 2Dボスバトルアクション</title>
  <style>
    :root {
      --primary: #00f0ff;
      --secondary: #ff0055;
      --accent: #ffd700;
      --bg-dark: #070913;
      --panel: rgba(13, 18, 36, 0.88);
      --font-main: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: var(--font-main);
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, #151930 0%, #060710 100%);
    }

    /* UI Overlays */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      backdrop-filter: blur(10px);
      background: rgba(4, 6, 15, 0.75);
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Card Panels */
    .modal-card {
      background: var(--panel);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 20px;
      padding: 28px 24px;
      width: 92%;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    .modal-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--secondary), var(--primary), var(--accent));
    }

    .game-title {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff 20%, var(--primary) 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
      text-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
    }

    .subtitle {
      font-size: 13px;
      color: #8da2c0;
      letter-spacing: 2px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    /* Style Selector */
    .style-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .style-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #ccc;
      text-align: center;
    }

    .style-btn.active {
      border-color: var(--primary);
      background: rgba(0, 240, 255, 0.15);
      color: #fff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.35);
      transform: translateY(-2px);
    }

    .style-icon {
      font-size: 26px;
      margin-bottom: 4px;
    }

    .style-name {
      font-size: 12px;
      font-weight: 800;
    }

    .style-desc-box {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 12px;
      line-height: 1.6;
      color: #cbd5e1;
      text-align: left;
      border-left: 3px solid var(--primary);
      min-height: 64px;
    }

    .controls-hint {
      font-size: 11px;
      color: #718096;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .controls-hint span {
      color: var(--accent);
      font-weight: bold;
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, var(--primary) 0%, #0077ff 100%);
      color: #030712;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
      transition: transform 0.1s, box-shadow 0.2s;
    }

    .action-btn:active {
      transform: scale(0.97);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .player-bars {
      width: 220px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .bar-wrap {
      height: 14px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
    }

    #player-hp-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff0055, #00f0ff);
      transition: width 0.1s linear;
    }

    #player-stamina-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ffbb00, #ffe600);
      transition: width 0.05s linear;
    }

    .hud-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #e2e8f0;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
    }

    /* BOSS HUD TOP */
    #boss-hud {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
    }

    #boss-name {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--secondary);
      text-shadow: 0 0 10px rgba(255, 0, 85, 0.8);
    }

    .boss-bar-outer {
      width: 100%;
      height: 16px;
      background: rgba(0, 0, 0, 0.7);
      border: 1.5px solid var(--secondary);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.35);
      position: relative;
    }

    #boss-hp-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff5500, #ff0055);
      transition: width 0.15s ease-out;
    }

    #boss-break-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: #00f0ff;
      box-shadow: 0 0 8px #00f0ff;
    }

    /* Flash Notice / Slowmo Indicator */
    #risk-alert {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--accent);
      text-shadow: 0 0 20px var(--accent);
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 12;
    }

    /* Touch Controls */
    #touch-controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      height: 160px;
      display: none;
      pointer-events: none;
      z-index: 15;
    }

    .touch-btn {
      position: absolute;
      border-radius: 50%;
      pointer-events: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 1px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(20, 25, 45, 0.7);
      color: #fff;
      backdrop-filter: blur(4px);
    }

    .touch-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.25);
    }

    #btn-atk {
      right: 25px;
      bottom: 30px;
      width: 76px;
      height: 76px;
      background: rgba(0, 240, 255, 0.25);
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    #btn-parry {
      right: 115px;
      bottom: 60px;
      width: 62px;
      height: 62px;
      background: rgba(255, 215, 0, 0.25);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }

    #btn-dash {
      right: 40px;
      bottom: 115px;
      width: 58px;
      height: 58px;
      background: rgba(255, 0, 85, 0.25);
      border-color: var(--secondary);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
    }

    #touch-stick-base {
      position: absolute;
      left: 30px;
      bottom: 25px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(0, 240, 255, 0.3);
      pointer-events: auto;
    }

    #touch-stick-thumb {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--primary) 0%, rgba(0, 119, 255, 0.7) 100%);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px var(--primary);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Top HUD -->
    <div id="hud">
      <div class="player-bars">
        <div class="hud-label" id="player-class-title">STYLE: BLADE MASTER</div>
        <div class="bar-wrap">
          <div id="player-hp-bar"></div>
        </div>
        <div class="bar-wrap" style="height: 8px;">
          <div id="player-stamina-bar"></div>
        </div>
      </div>

      <div id="boss-hud">
        <div id="boss-name">BOSS NAME</div>
        <div class="boss-bar-outer">
          <div id="boss-hp-bar"></div>
          <div id="boss-break-bar"></div>
        </div>
      </div>
      <div></div>
    </div>

    <!-- Alert / Impact Banner -->
    <div id="risk-alert">PARRY SUCCESS!</div>

    <!-- Mobile Virtual Controls -->
    <div id="touch-controls">
      <div id="touch-stick-base">
        <div id="touch-stick-thumb"></div>
      </div>
      <div id="btn-atk" class="touch-btn">ATK</div>
      <div id="btn-parry" class="touch-btn">PARRY</div>
      <div id="btn-dash" class="touch-btn">DASH</div>
    </div>

    <!-- Start / Style Select Screen -->
    <div id="start-screen" class="overlay">
      <div class="modal-card">
        <h1 class="game-title">TITAN SLAYER</h1>
        <div class="subtitle">HIGH-OCTANE BOSS RUSH ACTION</div>
        
        <div class="style-selector">
          <div class="style-btn active" data-style="blade">
            <div class="style-icon">⚔️</div>
            <div class="style-name">刃聖</div>
          </div>
          <div class="style-btn" data-style="gunner">
            <div class="style-icon">⚡</div>
            <div class="style-name">雷弾術士</div>
          </div>
          <div class="style-btn" data-style="brawler">
            <div class="style-icon">🥊</div>
            <div class="style-name">剛拳闘士</div>
          </div>
        </div>

        <div id="style-desc" class="style-desc-box">
          <!-- Populated by JS -->
        </div>

        <div class="controls-hint">
          💻 <span>PC:</span> WASD移動 / 攻撃 [J or クリック] / パリィ・ガード [K] / 回避 [Space]<br>
          📱 <span>スマホ:</span> 左スティック移動 / 右側ボタン操作
        </div>

        <button class="action-btn" id="start-btn">ENGAGE BATTLE</button>
      </div>
    </div>

    <!-- Victory / Defeat Screen -->
    <div id="result-screen" class="overlay hidden">
      <div class="modal-card">
        <h1 class="game-title" id="result-title">VICTORY</h1>
        <div class="subtitle" id="result-subtitle">ボスを完全に圧倒した</div>
        <div style="margin: 20px 0; font-size: 14px; line-height: 1.8; color: #e2e8f0;">
          撃破タイム: <span id="res-time" style="color:var(--accent); font-weight:bold;">0s</span><br>
          パリィ/ジャスト成功回数: <span id="res-parries" style="color:var(--primary); font-weight:bold;">0</span><br>
          最大コンボ倍率: <span id="res-combo" style="color:var(--secondary); font-weight:bold;">x1.0</span>
        </div>
        <button class="action-btn" id="next-btn">NEXT BOSS</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================
       SYNTHESIZED AUDIO ENGINE (Web Audio API)
       ========================================================== */
    class SFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      slash() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }
      parry() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [1600, 2400, 3200].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.25 / (idx + 1), now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.45);
        });
      }
      dash() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.14);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.14);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.14);
      }
      impact() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(25, now + 0.28);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.28);
      }
      warning() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(750, now);
        osc.frequency.exponentialRampToValueAtTime(950, now + 0.12);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }
      breakSfx() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [300, 600, 900, 1400].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now + idx * 0.05);
          gain.gain.setValueAtTime(0.15, now + idx * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.05 + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.05);
          osc.stop(now + idx * 0.05 + 0.25);
        });
      }
    }
    const sfx = new SFX();

    /* ==========================================================
       CANVAS & GAME ENVIRONMENT
       ========================================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width = 0, height = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        document.getElementById('touch-controls').style.display = 'block';
      }
    }
    window.addEventListener('resize', resize);
    resize();

    // Style Definitions (完全固有の攻撃システム化)
    const STYLES = {
      blade: {
        name: '刃聖 (BLADE MASTER)',
        desc: '【近接連撃 & 精密弾き】高威力の連続斬撃と接近戦に特化。敵の強攻撃を「ジャストパリィ」すると相手を怯ませ特大リターン。',
        color: '#00f0ff',
        hp: 110,
        staminaMax: 100,
        atkDamage: 26,
        speed: 4.8
      },
      gunner: {
        name: '雷弾術士 (SPELL GUNNER)',
        desc: '【遠隔レーザー砲 & 魔法弾幕】接近戦を捨て、高速ホーミング魔法弾と貫通レーザーで安全な中遠距離からボスを蜂の巣にする。',
        color: '#ffd700',
        hp: 85,
        staminaMax: 130,
        atkDamage: 14,
        speed: 5.4
      },
      brawler: {
        name: '剛拳闘士 (TITAN BRAWLER)',
        desc: '【超重量カウンター & 衝撃波】近接で強力なガントレット衝撃波を放つ。攻撃を直前ガードするとカウンターでHP回復と大ダメージ。',
        color: '#ff0055',
        hp: 150,
        staminaMax: 80,
        atkDamage: 40,
        speed: 3.6
      }
    };
    let currentSelectedStyle = 'blade';

    // UI Selector Setup
    const styleBtns = document.querySelectorAll('.style-btn');
    const styleDesc = document.getElementById('style-desc');
    function updateStyleUI(key) {
      currentSelectedStyle = key;
      styleBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.style === key);
      });
      styleDesc.innerText = STYLES[key].desc;
      document.getElementById('player-class-title').innerText = `STYLE: ${STYLES[key].name}`;
    }
    styleBtns.forEach(btn => {
      btn.addEventListener('click', () => updateStyleUI(btn.dataset.style));
    });
    updateStyleUI('blade');

    /* ==========================================================
       INPUT CONTROLLER (Keyboard, Mouse, Touch Stick & Buttons)
       ========================================================== */
    const keys = {};
    const input = {
      x: 0,
      y: 0,
      atk: false,
      parry: false,
      dash: false
    };

    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
      if (k === 'j') input.atk = true;
      if (k === 'k') input.parry = true;
      if (k === ' ' || k === 'shift') input.dash = true;
    });
    window.addEventListener('keyup', e => {
      const k = e.key.toLowerCase();
      keys[k] = false;
      if (k === 'j') input.atk = false;
      if (k === 'k') input.parry = false;
      if (k === ' ' || k === 'shift') input.dash = false;
    });

    window.addEventListener('mousedown', e => {
      if (e.target.tagName !== 'BUTTON' && !e.target.closest('.modal-card')) {
        if (e.button === 0) input.atk = true;
        if (e.button === 2) input.parry = true;
      }
    });
    window.addEventListener('mouseup', e => {
      if (e.button === 0) input.atk = false;
      if (e.button === 2) input.parry = false;
    });
    window.addEventListener('contextmenu', e => e.preventDefault());

    // Virtual Touch Stick
    const stickBase = document.getElementById('touch-stick-base');
    const stickThumb = document.getElementById('touch-stick-thumb');
    let touchStickId = null;
    let stickCenter = { x: 0, y: 0 };

    stickBase.addEventListener('touchstart', e => {
      const touch = e.changedTouches[0];
      touchStickId = touch.identifier;
      const rect = stickBase.getBoundingClientRect();
      stickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      if (touchStickId === null) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === touchStickId) {
          const dx = touch.clientX - stickCenter.x;
          const dy = touch.clientY - stickCenter.y;
          const dist = Math.hypot(dx, dy);
          const maxDist = 45;
          const angle = Math.atan2(dy, dx);
          const cappedDist = Math.min(dist, maxDist);

          input.x = (cappedDist / maxDist) * Math.cos(angle);
          input.y = (cappedDist / maxDist) * Math.sin(angle);

          stickThumb.style.transform = `translate(calc(-50% + ${Math.cos(angle) * cappedDist}px), calc(-50% + ${Math.sin(angle) * cappedDist}px))`;
          break;
        }
      }
    }, { passive: false });

    function endStick(e) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === touchStickId) {
          touchStickId = null;
          input.x = 0;
          input.y = 0;
          stickThumb.style.transform = `translate(-50%, -50%)`;
          break;
        }
      }
    }
    window.addEventListener('touchend', endStick);
    window.addEventListener('touchcancel', endStick);

    // Touch Buttons
    const bindTouchBtn = (id, field) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); input[field] = true; }, { passive: false });
      el.addEventListener('touchend', (e) => { e.preventDefault(); input[field] = false; }, { passive: false });
      el.addEventListener('touchcancel', (e) => { e.preventDefault(); input[field] = false; }, { passive: false });
    };
    bindTouchBtn('btn-atk', 'atk');
    bindTouchBtn('btn-parry', 'parry');
    bindTouchBtn('btn-dash', 'dash');

    /* ==========================================================
       GAME ENGINE & PARTICLES
       ========================================================== */
    let gameState = 'START'; // START, PLAYING, RESULT
    let shakeTimer = 0;
    let hitStopTimer = 0;
    let slowMoTimer = 0;
    let battleStartTime = 0;
    let totalParries = 0;
    let maxCombo = 1.0;
    let bossIndex = 0;

    class Particle {
      constructor(x, y, vx, vy, color, size, life) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.size = size;
        this.life = life;
        this.maxLife = life;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.94;
        this.vy *= 0.94;
        this.life--;
      }
      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0.5, this.size), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class DamageNumber {
      constructor(text, x, y, color = '#fff', isCrit = false) {
        this.text = text;
        this.x = x + (Math.random() - 0.5) * 20;
        this.y = y + (Math.random() - 0.5) * 15;
        this.color = color;
        this.isCrit = isCrit;
        this.life = 45;
        this.vy = isCrit ? -2.2 : -1.4;
      }
      update() {
        this.y += this.vy;
        this.life--;
      }
      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life / 45);
        ctx.fillStyle = this.color;
        ctx.font = this.isCrit ? '900 22px var(--font-main)' : 'bold 15px var(--font-main)';
        ctx.textAlign = 'center';
        ctx.shadowColor = this.color;
        ctx.shadowBlur = this.isCrit ? 15 : 6;
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
      }
    }

    class AttackSlash {
      constructor(x, y, angle, range, color) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.range = range;
        this.color = color;
        this.life = 12;
      }
      update() {
        this.life--;
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.globalAlpha = this.life / 12;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 5;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(0, 0, this.range, -0.6, 0.6);
        ctx.stroke();
        ctx.restore();
      }
    }

    class Projectile {
      constructor(x, y, vx, vy, dmg, isEnemy = false, color = '#00f0ff', rad = 6, homing = false) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.dmg = dmg;
        this.isEnemy = isEnemy;
        this.color = color;
        this.rad = rad;
        this.homing = homing;
        this.life = 140;
      }
      update() {
        // Gunner Homing ability
        if (this.homing && boss && !this.isEnemy) {
          const targetAngle = Math.atan2(boss.y - this.y, boss.x - this.x);
          const currentAngle = Math.atan2(this.vy, this.vx);
          let diff = targetAngle - currentAngle;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          const newAngle = currentAngle + Math.sign(diff) * Math.min(Math.abs(diff), 0.08);
          const spd = Math.hypot(this.vx, this.vy);
          this.vx = Math.cos(newAngle) * spd;
          this.vy = Math.sin(newAngle) * spd;
        }

        this.x += this.vx;
        this.y += this.vy;
        this.life--;
      }
      draw(ctx) {
        ctx.save();
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.rad, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    let particles = [];
    let damageNumbers = [];
    let slashes = [];
    let projectiles = [];

    function triggerRiskAlert(text, color = '#ffd700') {
      const el = document.getElementById('risk-alert');
      el.innerText = text;
      el.style.color = color;
      el.style.textShadow = `0 0 20px ${color}`;
      el.style.opacity = '1';
      el.style.transform = 'translate(-50%, -50%) scale(1.2)';
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translate(-50%, -50%) scale(0.9)';
      }, 600);
    }

    function spawnBurst(x, y, color, count = 15, spd = 6) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = (Math.random() * 0.7 + 0.3) * spd;
        particles.push(new Particle(x, y, Math.cos(a) * s, Math.sin(a) * s, color, Math.random() * 3.5 + 1.5, 25));
      }
    }

    /* ==========================================================
       PLAYER CHARACTER CLASS
       ========================================================== */
    class Player {
      constructor() {
        this.styleKey = 'blade';
        this.x = width / 2;
        this.y = height * 0.75;
        this.radius = 18;
        this.angle = -Math.PI / 2;
        this.initStyle();
      }
      initStyle() {
        const st = STYLES[this.styleKey];
        this.maxHp = st.hp;
        this.hp = this.maxHp;
        this.staminaMax = st.staminaMax;
        this.stamina = this.staminaMax;
        this.baseDmg = st.atkDamage;
        this.speed = st.speed;
        this.color = st.color;

        this.isDashing = false;
        this.dashTimer = 0;
        this.dashCooldown = 0;
        this.isParrying = false;
        this.parryWindow = 0;
        this.atkCooldown = 0;
        this.critBuffTimer = 0;
        this.comboMultiplier = 1.0;
        this.invulnerableTimer = 0;
      }
      update() {
        if (!this.isDashing && !this.isParrying) {
          this.stamina = Math.min(this.staminaMax, this.stamina + 0.55);
        }

        if (this.dashCooldown > 0) this.dashCooldown--;
        if (this.atkCooldown > 0) this.atkCooldown--;
        if (this.invulnerableTimer > 0) this.invulnerableTimer--;
        if (this.critBuffTimer > 0) this.critBuffTimer--;
        else this.comboMultiplier = Math.max(1.0, this.comboMultiplier - 0.005);

        let mx = input.x;
        let my = input.y;
        if (keys['w'] || keys['arrowup']) my -= 1;
        if (keys['s'] || keys['arrowdown']) my += 1;
        if (keys['a'] || keys['arrowleft']) mx -= 1;
        if (keys['d'] || keys['arrowright']) mx += 1;
        const len = Math.hypot(mx, my);

        // Dash Handling
        if (input.dash && this.dashCooldown <= 0 && this.stamina >= 20) {
          sfx.dash();
          this.isDashing = true;
          this.dashTimer = 14;
          this.dashCooldown = 28;
          this.invulnerableTimer = 16;
          this.stamina -= 20;

          this.dashVx = len > 0.1 ? (mx / len) * (this.speed * 2.8) : Math.cos(this.angle) * (this.speed * 2.8);
          this.dashVy = len > 0.1 ? (my / len) * (this.speed * 2.8) : Math.sin(this.angle) * (this.speed * 2.8);

          spawnBurst(this.x, this.y, this.color, 8, 3);
        }

        if (this.isDashing) {
          this.x += this.dashVx;
          this.y += this.dashVy;
          this.dashTimer--;
          if (this.dashTimer <= 0) this.isDashing = false;
        } else {
          if (len > 0.05) {
            this.x += (mx / len) * this.speed;
            this.y += (my / len) * this.speed;
            this.angle = Math.atan2(my, mx);
          }
        }

        if (boss) {
          const bAngle = Math.atan2(boss.y - this.y, boss.x - this.x);
          this.angle = bAngle;
        }

        this.x = Math.max(this.radius + 10, Math.min(width - this.radius - 10, this.x));
        this.y = Math.max(this.radius + 60, Math.min(height - this.radius - 20, this.y));

        if (input.parry && this.parryWindow <= 0 && this.stamina >= 10) {
          this.isParrying = true;
          this.parryWindow = 18;
          this.stamina -= 10;
          spawnBurst(this.x, this.y, '#ffd700', 6, 2);
        }
        if (this.parryWindow > 0) {
          this.parryWindow--;
          if (this.parryWindow <= 0) this.isParrying = false;
        }

        if (input.atk && this.atkCooldown <= 0) {
          this.executeAttack();
        }
      }
      executeAttack() {
        const isCrit = this.critBuffTimer > 0;
        const totalDmg = Math.floor(this.baseDmg * this.comboMultiplier * (isCrit ? 1.8 : 1.0));

        if (this.styleKey === 'blade') {
          // 近接剣聖スタイル
          sfx.slash();
          this.atkCooldown = 15;
          slashes.push(new AttackSlash(this.x, this.y, this.angle, 75, this.color));
          const dist = Math.hypot(boss.x - this.x, boss.y - this.y);
          if (dist < boss.radius + 75) {
            boss.takeDamage(totalDmg, isCrit);
            spawnBurst(boss.x, boss.y, this.color, 10, 4);
          }
        } else if (this.styleKey === 'gunner') {
          // 雷弾術士スタイル：遠隔ホーミング弾幕連射 ＆ 貫通レーザー
          sfx.slash();
          this.atkCooldown = 8;
          const spd = 13;
          // 3連装ホーミングマジック
          for (let i = -1; i <= 1; i++) {
            const spreadAngle = this.angle + i * 0.18;
            projectiles.push(new Projectile(
              this.x, this.y,
              Math.cos(spreadAngle) * spd,
              Math.sin(spreadAngle) * spd,
              Math.floor(totalDmg * 0.75),
              false,
              isCrit ? '#ff0055' : this.color,
              isCrit ? 7 : 4,
              true // ホーミング有効
            ));
          }
        } else if (this.styleKey === 'brawler') {
          // 剛拳闘士スタイル：衝撃波メガパンチ
          sfx.impact();
          this.atkCooldown = 26;
          slashes.push(new AttackSlash(this.x, this.y, this.angle, 65, '#ff0055'));
          const dist = Math.hypot(boss.x - this.x, boss.y - this.y);
          if (dist < boss.radius + 70) {
            boss.takeDamage(totalDmg * 1.4, isCrit);
            shakeTimer = 8;
            spawnBurst(boss.x, boss.y, '#ff0055', 20, 8);
          }
        }
      }
      triggerJustAction(type) {
        totalParries++;
        this.critBuffTimer = 180;
        this.comboMultiplier = Math.min(3.0, this.comboMultiplier + 0.4);
        maxCombo = Math.max(maxCombo, this.comboMultiplier);
        this.stamina = this.staminaMax;
        slowMoTimer = 22;
        hitStopTimer = 6;
        shakeTimer = 15;

        if (type === 'PARRY') {
          sfx.parry();
          triggerRiskAlert('PERFECT PARRY!!', '#ffd700');
          boss.inflictStun(120);
          spawnBurst(this.x, this.y, '#ffd700', 30, 9);
        } else if (type === 'DODGE') {
          sfx.parry();
          triggerRiskAlert('JUST EVASION!!', '#00f0ff');
          spawnBurst(this.x, this.y, '#00f0ff', 25, 7);
        } else if (type === 'COUNTER') {
          sfx.impact();
          triggerRiskAlert('TITAN COUNTER!!', '#ff0055');
          this.hp = Math.min(this.maxHp, this.hp + 25);
          boss.takeDamage(140, true);
          spawnBurst(this.x, this.y, '#ff0055', 35, 10);
        }
      }
      hit(dmg, incomingAngle) {
        if (this.invulnerableTimer > 0) {
          if (this.isDashing && this.dashTimer > 6) {
            this.triggerJustAction('DODGE');
            return;
          }
          return;
        }

        if (this.isParrying && this.parryWindow > 4) {
          if (this.styleKey === 'brawler') {
            this.triggerJustAction('COUNTER');
          } else {
            this.triggerJustAction('PARRY');
          }
          return;
        }

        this.hp -= dmg;
        this.invulnerableTimer = 35;
        this.comboMultiplier = 1.0;
        shakeTimer = 14;
        sfx.impact();
        damageNumbers.push(new DamageNumber(`-${dmg}`, this.x, this.y, '#ff0055', false));
        spawnBurst(this.x, this.y, '#ff0055', 12, 5);

        if (this.hp <= 0) {
          this.hp = 0;
          endGame(false);
        }
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        if (this.invulnerableTimer > 0 && Math.floor(Date.now() / 50) % 2 === 0) {
          ctx.globalAlpha = 0.4;
        }

        if (this.critBuffTimer > 0) {
          ctx.strokeStyle = this.color;
          ctx.lineWidth = 3;
          ctx.shadowColor = this.color;
          ctx.shadowBlur = 20;
          ctx.beginPath();
          ctx.arc(0, 0, this.radius + 8 + Math.sin(Date.now() * 0.015) * 3, 0, Math.PI * 2);
          ctx.stroke();
        }

        if (this.isParrying) {
          ctx.strokeStyle = '#ffd700';
          ctx.lineWidth = 5;
          ctx.shadowColor = '#ffd700';
          ctx.shadowBlur = 18;
          ctx.beginPath();
          ctx.arc(0, 0, this.radius + 14, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.rotate(this.angle);

        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2.5;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;

        ctx.beginPath();
        ctx.moveTo(this.radius + 4, 0);
        ctx.lineTo(-this.radius, -this.radius * 0.85);
        ctx.lineTo(-this.radius * 0.5, 0);
        ctx.lineTo(-this.radius, this.radius * 0.85);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
      }
    }

    /* ==========================================================
       SUPER DIVERSE BOSS ENCOUNTERS (多彩なボスの行動パターンと技追加)
       ========================================================== */
    class Boss {
      constructor(typeIndex) {
        this.typeIndex = typeIndex;
        this.x = width / 2;
        this.y = height * 0.28;
        this.stunTimer = 0;
        this.actionTimer = 0;
        this.warningTimer = 0;
        this.targetChargeAngle = 0;
        this.chargeDuration = 0;

        // ボス個別定義：多彩で変化に富んだ強力なボスたち
        const configs = [
          {
            name: '【業火の断罪者・イグニス】',
            maxHp: 1000,
            radius: 36,
            color: '#ff3300',
            title: 'IGNIS THE INFERNO'
          },
          {
            name: '【虚空の暗殺者・ゼファー】',
            maxHp: 850,
            radius: 28,
            color: '#a855f7',
            title: 'ZEPHYR THE VOID BLADE'
          },
          {
            name: '【機甲要塞・ゴライアス】',
            maxHp: 1500,
            radius: 46,
            color: '#00f0ff',
            title: 'GOLIATH THE DREADNOUGHT'
          },
          {
            name: '【終焉の魔導王・ザラール】',
            maxHp: 1800,
            radius: 40,
            color: '#ffd700',
            title: 'ZARAL THE ARCANE LORD'
          }
        ];

        const cfg = configs[typeIndex % configs.length];
        this.name = cfg.name;
        this.maxHp = cfg.maxHp;
        this.hp = this.maxHp;
        this.radius = cfg.radius;
        this.color = cfg.color;
        this.title = cfg.title;
        this.breakMeter = 0;

        document.getElementById('boss-name').innerText = this.name;
      }
      inflictStun(duration) {
        this.stunTimer = duration;
        sfx.breakSfx();
        triggerRiskAlert('BOSS STAGGERED!!', '#00f0ff');
      }
      takeDamage(amount, isCrit) {
        this.hp -= amount;
        damageNumbers.push(new DamageNumber(amount, this.x, this.y, isCrit ? '#ffd700' : '#fff', isCrit));

        this.breakMeter += isCrit ? 15 : 6;
        if (this.breakMeter >= 100) {
          this.breakMeter = 0;
          this.inflictStun(160);
        }

        if (this.hp <= 0) {
          this.hp = 0;
          endGame(true);
        }
      }
      update() {
        if (this.stunTimer > 0) {
          this.stunTimer--;
          return;
        }

        this.actionTimer++;

        const bossType = this.typeIndex % 4;
        if (bossType === 0) {
          this.updateIgnis();
        } else if (bossType === 1) {
          this.updateZephyr();
        } else if (bossType === 2) {
          this.updateGoliath();
        } else {
          this.updateZaral();
        }
      }

      /* Boss 0: イグニス (炎の爆撃＆突進の猛攻) */
      updateIgnis() {
        const angle = Math.atan2(player.y - this.y, player.x - this.x);

        if (this.actionTimer % 160 === 40) {
          sfx.warning();
          this.warningTimer = 40;
          this.targetChargeAngle = angle;
        }

        if (this.warningTimer > 0) {
          this.warningTimer--;
          if (this.warningTimer === 0) {
            this.vx = Math.cos(this.targetChargeAngle) * 15;
            this.vy = Math.sin(this.targetChargeAngle) * 15;
            this.chargeDuration = 22;
          }
        }

        if (this.chargeDuration > 0) {
          this.x += this.vx;
          this.y += this.vy;
          this.chargeDuration--;
          spawnBurst(this.x, this.y, '#ff4400', 3, 2);

          if (Math.hypot(player.x - this.x, player.y - this.y) < this.radius + player.radius) {
            player.hit(32, this.targetChargeAngle);
          }
        } else {
          this.x += Math.cos(angle) * 1.6;
          this.y += Math.sin(angle) * 1.6;

          // 放射状ファイア弾幕
          if (this.actionTimer % 80 === 0) {
            for (let i = -2; i <= 2; i++) {
              const a = angle + i * 0.22;
              projectiles.push(new Projectile(this.x, this.y, Math.cos(a) * 5.5, Math.sin(a) * 5.5, 18, true, '#ff3300', 7));
            }
          }
        }
      }

      /* Boss 1: ゼファー (高速テレポート＆十字スラッシュ弾) */
      updateZephyr() {
        if (this.actionTimer % 120 === 0) {
          sfx.warning();
          spawnBurst(this.x, this.y, this.color, 20, 6);
          const offsetAngle = Math.random() * Math.PI * 2;
          this.x = player.x + Math.cos(offsetAngle) * 130;
          this.y = player.y + Math.sin(offsetAngle) * 130;
          spawnBurst(this.x, this.y, this.color, 20, 6);

          setTimeout(() => {
            const angle = Math.atan2(player.y - this.y, player.x - this.x);
            for (let i = 0; i < 8; i++) {
              const a = angle + (i * Math.PI / 4);
              projectiles.push(new Projectile(this.x, this.y, Math.cos(a) * 6.5, Math.sin(a) * 6.5, 15, true, '#a855f7', 5));
            }
          }, 250);
        } else {
          const angle = Math.atan2(player.y - this.y, player.x - this.x) + Math.PI / 2;
          this.x += Math.cos(angle) * 3.5;
          this.y += Math.sin(angle) * 3.5;
        }
      }

      /* Boss 2: ゴライアス (全方位弾幕 ＆ 追尾ミサイル砲) */
      updateGoliath() {
        const angle = Math.atan2(player.y - this.y, player.x - this.x);
        this.x += Math.cos(angle) * 0.9;
        this.y += Math.sin(angle) * 0.9;

        if (this.actionTimer % 65 === 0) {
          sfx.warning();
          const count = 14;
          for (let i = 0; i < count; i++) {
            const a = (i * Math.PI * 2 / count) + (this.actionTimer * 0.05);
            projectiles.push(new Projectile(this.x, this.y, Math.cos(a) * 4.8, Math.sin(a) * 4.8, 16, true, '#00f0ff', 6));
          }
        }

        if (this.actionTimer % 180 === 0) {
          // 巨大ミサイル
          projectiles.push(new Projectile(this.x, this.y, Math.cos(angle) * 4, Math.sin(angle) * 4, 30, true, '#ffd700', 12));
        }
      }

      /* Boss 3: ザラール (新ボス：魔法陣ビーム ＆ 混乱弾幕) */
      updateZaral() {
        const angle = Math.atan2(player.y - this.y, player.x - this.x);
        
        // 浮遊移動
        this.x += Math.cos(angle + 1.2) * 2.2;
        this.y += Math.sin(angle + 1.2) * 2.2;

        if (this.actionTimer % 90 === 0) {
          sfx.warning();
          // 螺旋魔弾
          for (let i = 0; i < 6; i++) {
            const a = (this.actionTimer * 0.1) + (i * Math.PI / 3);
            projectiles.push(new Projectile(this.x, this.y, Math.cos(a) * 5, Math.sin(a) * 5, 20, true, '#ffd700', 7));
          }
        }

        if (this.actionTimer % 220 === 0) {
          // プレイヤー狙いの高速収束レーザー弾
          sfx.warning();
          for (let k = -2; k <= 2; k++) {
            const a = angle + k * 0.12;
            projectiles.push(new Projectile(this.x, this.y, Math.cos(a) * 8.5, Math.sin(a) * 8.5, 25, true, '#ff0055', 8));
          }
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        if (this.warningTimer > 0) {
          ctx.save();
          ctx.strokeStyle = 'rgba(255, 0, 85, 0.7)';
          ctx.lineWidth = 3;
          ctx.setLineDash([8, 8]);
          ctx.beginPath();
          ctx.arc(0, 0, 160 * (1 - this.warningTimer / 40), 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        if (this.stunTimer > 0) {
          ctx.strokeStyle = '#ffd700';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 0, this.radius + 15, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.fillStyle = '#0b0f19';
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 4;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 18;

        ctx.beginPath();
        const bossType = this.typeIndex % 4;
        const sides = bossType === 0 ? 5 : bossType === 1 ? 4 : bossType === 2 ? 8 : 6;
        for (let i = 0; i < sides; i++) {
          const a = (i * Math.PI * 2) / sides;
          const px = Math.cos(a) * this.radius;
          const py = Math.sin(a) * this.radius;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    /* ==========================================================
       GAME STATE MANAGEMENT
       ========================================================== */
    let player = new Player();
    let boss = null;

    function startBossFight(index = 0) {
      bossIndex = index;
      player.styleKey = currentSelectedStyle;
      player.initStyle();
      player.x = width / 2;
      player.y = height * 0.75;

      boss = new Boss(bossIndex);
      projectiles = [];
      particles = [];
      damageNumbers = [];
      slashes = [];
      battleStartTime = Date.now();
      totalParries = 0;
      maxCombo = 1.0;

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      gameState = 'PLAYING';
    }

    function endGame(victory) {
      gameState = 'RESULT';
      const timeSec = ((Date.now() - battleStartTime) / 1000).toFixed(1);
      
      const title = document.getElementById('result-title');
      const sub = document.getElementById('result-subtitle');
      if (victory) {
        sfx.breakSfx();
        title.innerText = 'VICTORY SLAYED';
        title.style.background = 'linear-gradient(135deg, #00f0ff, #ffd700)';
        title.style.webkitBackgroundClip = 'text';
        sub.innerText = `${boss.name} の討伐に成功！`;
        document.getElementById('next-btn').innerText = 'NEXT TITAN';
      } else {
        sfx.impact();
        title.innerText = 'DEFEATED';
        title.style.background = 'linear-gradient(135deg, #ff0055, #ff5500)';
        title.style.webkitBackgroundClip = 'text';
        sub.innerText = '刃砕け、散った。再挑戦せよ。';
        document.getElementById('next-btn').innerText = 'RETRY BATTLE';
      }

      document.getElementById('res-time').innerText = `${timeSec}s`;
      document.getElementById('res-parries').innerText = `${totalParries} 回`;
      document.getElementById('res-combo').innerText = `x${maxCombo.toFixed(1)}`;
      document.getElementById('result-screen').classList.remove('hidden');
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      sfx.init();
      startBossFight(0);
    });

    document.getElementById('next-btn').addEventListener('click', () => {
      sfx.init();
      if (document.getElementById('result-title').innerText === 'VICTORY SLAYED') {
        startBossFight(bossIndex + 1);
      } else {
        startBossFight(bossIndex);
      }
    });

    /* ==========================================================
       MAIN GAME LOOP
       ========================================================== */
    function update() {
      if (gameState !== 'PLAYING') return;

      if (hitStopTimer > 0) {
        hitStopTimer--;
        return;
      }

      const steps = slowMoTimer > 0 ? (slowMoTimer--, 0.5) : 1.0;
      if (Math.random() > steps) return;

      player.update();
      boss.update();

      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.update();

        if (p.life <= 0 || p.x < 0 || p.x > width || p.y < 0 || p.y > height) {
          projectiles.splice(i, 1);
          continue;
        }

        if (p.isEnemy) {
          const dist = Math.hypot(player.x - p.x, player.y - p.y);
          if (dist < player.radius + p.rad) {
            player.hit(p.dmg, Math.atan2(p.vy, p.vx));
            projectiles.splice(i, 1);
            continue;
          }
        } else {
          const dist = Math.hypot(boss.x - p.x, boss.y - p.y);
          if (dist < boss.radius + p.rad) {
            boss.takeDamage(p.dmg, p.color === '#ff0055');
            spawnBurst(p.x, p.y, p.color, 6, 3);
            projectiles.splice(i, 1);
            continue;
          }
        }
      }

      slashes.forEach(s => s.update());
      slashes = slashes.filter(s => s.life > 0);

      particles.forEach(pt => pt.update());
      particles = particles.filter(pt => pt.life > 0);

      damageNumbers.forEach(d => d.update());
      damageNumbers = damageNumbers.filter(d => d.life > 0);

      document.getElementById('player-hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
      document.getElementById('player-stamina-bar').style.width = `${(player.stamina / player.staminaMax) * 100}%`;
      document.getElementById('boss-hp-bar').style.width = `${(boss.hp / boss.maxHp) * 100}%`;
      document.getElementById('boss-break-bar').style.width = `${boss.breakMeter}%`;
    }

    function draw() {
      ctx.save();

      if (shakeTimer > 0) {
        const sx = (Math.random() - 0.5) * shakeTimer;
        const sy = (Math.random() - 0.5) * shakeTimer;
        ctx.translate(sx, sy);
        shakeTimer *= 0.9;
        if (shakeTimer < 0.5) shakeTimer = 0;
      }

      ctx.clearRect(0, 0, width, height);

      ctx.strokeStyle = 'rgba(0, 240, 255, 0.05)';
      ctx.lineWidth = 1;
      const step = 44;
      for (let x = 0; x < width; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y < height; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(255, 0, 85, 0.2)';
      ctx.lineWidth = 3;
      ctx.strokeRect(10, 50, width - 20, height - 60);

      particles.forEach(p => p.draw(ctx));
      projectiles.forEach(p => p.draw(ctx));
      slashes.forEach(s => s.draw(ctx));

      if (boss && gameState !== 'START') boss.draw(ctx);
      if (gameState !== 'START') player.draw(ctx);

      damageNumbers.forEach(d => d.draw(ctx));

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
