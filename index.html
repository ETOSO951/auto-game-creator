        b.mesh.position.addScaledVector(b.velocity, dt);
        b.life -= dt;

        let hit = false;

        envObjects.forEach(o => {
          if (o.type === 'barrel' && b.mesh.position.distanceTo(o.position) < 1.2) {
            explodeBarrel(o);
            hit = true;
          }
        });

        if (!hit) {
          for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (b.mesh.position.distanceTo(e.mesh.position) < 1.4) {
              applyDamageToEnemy(e, b.damage);
              hit = true;
              spawnNeonParticles(b.mesh.position, 0x66fcf1, 5);
              triggerHitStop(0.04);
              break;
            }
          }
        }

        if (!hit && megaBoss && b.mesh.position.distanceTo(megaBoss.mesh.position) < 3.2) {
          applyDamageToEnemy(megaBoss, b.damage);
          hit = true;
          spawnNeonParticles(b.mesh.position, 0xb026ff, 6);
          triggerHitStop(0.03);

          const hpPct = Math.max(0, (megaBoss.hp / megaBoss.maxHp) * 100);
          document.getElementById('boss-hp-bar').style.width = hpPct + '%';
        }

        if (hit || b.life <= 0) {
          scene.remove(b.mesh);
          bullets.splice(i, 1);
        }
      }

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.mesh.position.addScaledVector(eb.velocity, dt);
        eb.life -= dt;

        if (eb.mesh.position.distanceTo(playerGroup.position) < 1.1) {
          takeDamage(eb.damage);
          spawnNeonParticles(eb.mesh.position, 0xff0055, 8);
          scene.remove(eb.mesh);
          enemyBullets.splice(i, 1);
          continue;
        }

        if (eb.life <= 0) {
          scene.remove(eb.mesh);
          enemyBullets.splice(i, 1);
        }
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.velocity.y += CONFIG.gravity * 0.3 * dt;
        p.mesh.position.addScaledVector(p.velocity, dt);
        p.mesh.scale.multiplyScalar(0.92);

        if (p.life <= 0) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
        }
      }
    }

    function takeDamage(amount) {
      if (isGameOver || playerStats.invulnerableTimer > 0) return;

      // 3. AI Emergency Shield Protocol
      if (!emergencyShieldActive && playerStats.hp - amount <= 0 && playerStats.maxHp >= 100) {
        emergencyShieldActive = true;
        playerStats.hp = 30;
        SFX.playCounter();
        triggerGlitchEffect(400);
        setAIEmotion('excited', 'IRIS-9緊急プロトコル発動！致命的ダメージを防ぎました！', 4000);
        spawnNeonParticles(playerGroup.position, 0x00ffff, 35, 2.5);
        document.getElementById('hp-bar').style.width = '30%';
        return;
      }

      playerStats.hp -= amount;
      if (playerStats.hp < 0) playerStats.hp = 0;

      SFX.playHit();
      triggerDamageFlash();
      triggerCameraShake(0.6, 0.25);
      setAIEmotion('panic', '被弾確認！シールド耐久値低下中！', 2000);

      const hpPct = Math.max(0, (playerStats.hp / playerStats.maxHp) * 100);
      document.getElementById('hp-bar').style.width = hpPct + '%';

      if (playerStats.hp <= 0) {
        gameOver();
      }
    }

    /* ==========================================================
       1. CYBER MATRIX DOMINATION (INTERACTIVE FINISH QTE)
    ========================================================== */
    function triggerMatrixDominationCinematic(targetPos) {
      isCinematicKO = true;
      waitingForDominationInput = true;
      koTargetPos.copy(targetPos);
      timeScale = 0.05; // Extreme Matrix Slowmo

      document.getElementById('matrix-kill-fx').classList.add('active');
      document.getElementById('domination-prompt').style.display = 'flex';
      triggerCameraShake(1.5, 1.2);
      spawnNeonParticles(targetPos, 0xff007f, 50, 2.5);
      setAIEmotion('excited', 'マトリックス・ドミネーション展開！ブレードを入力せよ！', 3000);
    }

    function executeDominationFinish() {
      if (!waitingForDominationInput) return;
      waitingForDominationInput = false;

      document.getElementById('domination-prompt').style.display = 'none';
      
      SFX.playCounter();
      triggerGlitchEffect(350);
      triggerCameraShake(2.0, 0.8);
      spawnNeonParticles(koTargetPos, 0x00ffff, 80, 3.2);

      // Chain Destruction of all remaining enemies
      enemies.forEach(e => {
        spawnNeonParticles(e.mesh.position, 0xff0055, 25);
        scene.remove(e.mesh);
      });
      enemies.length = 0;

      addODGauge(100); // Max OD Gauge
      setAIEmotion('excited', 'チェーン・デストラクション完了！オーバードライブ全開！');

      setTimeout(() => {
        isCinematicKO = false;
        timeScale = 1.0;
        document.getElementById('matrix-kill-fx').classList.remove('active');
        triggerStageClear();
      }, 800);
    }

    function updateMatrixKillCinematic(dtReal) {
      if (!isCinematicKO) return;
      // Auto-execute if player doesn't click within 4.5 seconds
      koTimer += dtReal;
      if (koTimer >= 4.5 && waitingForDominationInput) {
        executeDominationFinish();
      }
    }

    /* ==========================================================
       ROGUELIKE UPGRADES (FUSION SYSTEM)
    ========================================================== */
    const UPGRADE_POOL = [
      { name: "プラズマボルト [電撃]", desc: "弾丸に電撃を付与。着弾時に周囲の敵へ連鎖放電", apply: () => { playerStats.elements.electric = true; checkFusions(); } },
      { name: "サーマルブラスト [過熱]", desc: "弾丸に過熱効果を付与。着弾時に範囲爆発ダメージ", apply: () => { playerStats.elements.fire = true; checkFusions(); } },
      { name: "ヴォルテックスフロスト [氷結]", desc: "弾丸に氷結効果を付与。敵の動きを完全に凍結停止", apply: () => { playerStats.elements.ice = true; checkFusions(); } },
      { name: "オーバーチャージHP", desc: "最大HPが50増加し、HPを全回復する", apply: () => { playerStats.maxHp += 50; playerStats.hp = playerStats.maxHp; } },
      { name: "ハイパーラピッド", desc: "攻撃の連射速度が35%上昇", apply: () => { playerStats.fireRate *= 0.65; } },
      { name: "プラズマコア", desc: "弾丸の威力が45%向上", apply: () => { playerStats.damage *= 1.45; } },
      { name: "スプリット弾丸", desc: "同時に発射する弾丸が1発増加", apply: () => { playerStats.multishot += 1; } },
      { name: "サイバードライブ", desc: "移動速度+20% ＆ ダッシュCD短縮", apply: () => { playerStats.speedMult += 0.2; playerStats.dashCooldown *= 0.8; } }
    ];

    function checkFusions() {
      if (playerStats.elements.electric && playerStats.elements.fire) {
        playerStats.fusionType = 'melt_plasma';
        playerStats.damage *= 1.8;
      } else if (playerStats.elements.ice && playerStats.elements.electric) {
        playerStats.fusionType = 'absolute_zero';
        playerStats.damage *= 1.6;
      }
    }

    function updateElementTagsUI() {
      const container = document.getElementById('element-tags');
      container.innerHTML = '';

      if (playerStats.fusionType === 'melt_plasma') {
        container.innerHTML += `<span class="elem-tag fusion-plasma">FUSION: MELT PLASMA</span>`;
      } else if (playerStats.fusionType === 'absolute_zero') {
        container.innerHTML += `<span class="elem-tag fusion-zero">FUSION: ABSOLUTE ZERO</span>`;
      } else {
        if (playerStats.elements.electric) container.innerHTML += `<span class="elem-tag electric">ELEC</span>`;
        if (playerStats.elements.fire) container.innerHTML += `<span class="elem-tag fire">FIRE</span>`;
        if (playerStats.elements.ice) container.innerHTML += `<span class="elem-tag ice">ICE</span>`;
      }
    }

    function triggerStageClear() {
      isPaused = true;
      koTimer = 0;
      const modal = document.getElementById('upgrade-modal');
      const container = document.getElementById('upgrade-options');
      container.innerHTML = '';

      const shuffled = [...UPGRADE_POOL].sort(() => 0.5 - Math.random()).slice(0, 3);
      shuffled.forEach(upg => {
        const card = document.createElement('div');
        card.className = 'upgrade-card';
        card.innerHTML = `<div class="card-name"><span>${upg.name}</span></div><div class="card-desc">${upg.desc}</div>`;
        card.onclick = () => {
          upg.apply();
          updateElementTagsUI();
          document.getElementById('hp-bar').style.width = ((playerStats.hp / playerStats.maxHp) * 100) + '%';
          modal.style.display = 'none';
          floor++;
          isPaused = false;
          generateStage();
        };
        container.appendChild(card);
      });

      modal.style.display = 'flex';
    }

    function gameOver() {
      isGameOver = true;
      document.getElementById('final-floor').innerText = floor;
      document.getElementById('gameover-modal').style.display = 'flex';
      setAIEmotion('panic', 'システム完全停止。リブートしてください。', 0);
    }

    document.getElementById('restart-btn').onclick = () => {
      document.getElementById('gameover-modal').style.display = 'none';
      floor = 1;
      totalKills = 0;
      emergencyShieldActive = false;
      document.getElementById('kill-num').innerText = totalKills;
      playerStats.maxHp = 100;
      playerStats.hp = 100;
      playerStats.damage = 34;
      playerStats.fireRate = 0.18;
      playerStats.speedMult = 1.0;
      playerStats.multishot = 1;
      playerStats.dashCooldown = 1.3;
      playerStats.odGauge = 0;
      playerStats.isOverdrive = false;
      playerStats.elements = { electric: false, fire: false, ice: false };
      playerStats.fusionType = 'none';
      playerStats.weaponModules = [];
      updateElementTagsUI();
      document.getElementById('hp-bar').style.width = '100%';
      document.getElementById('od-bar').style.width = '0%';
      isGameOver = false;
      generateStage();
    };

    /* ==========================================================
       CAMERA & MAIN RENDER LOOP
    ========================================================== */
    const defaultCamOffset = new THREE.Vector3(0, 11, 15);
    const railCamOffset = new THREE.Vector3(0, 6, 10);

    function updateCamera(dt) {
      let targetOffset = isGrinding ? railCamOffset : defaultCamOffset;
      let targetPos;

      if (isCinematicKO) {
        targetPos = koTargetPos.clone().add(new THREE.Vector3(0, 4, 7));
      } else {
        targetPos = playerGroup.position.clone().add(targetOffset);
      }

      if (cameraShake.duration > 0) {
        cameraShake.duration -= dt;
        targetPos.x += (Math.random() - 0.5) * cameraShake.intensity;
        targetPos.y += (Math.random() - 0.5) * cameraShake.intensity;
        targetPos.z += (Math.random() - 0.5) * cameraShake.intensity;
      }

      camera.position.lerp(targetPos, isGrinding ? 0.22 : (isCinematicKO ? 0.08 : 0.14));

      const lookTarget = isCinematicKO ? koTargetPos : playerGroup.position;
      camera.lookAt(lookTarget.x, lookTarget.y + (isGrinding ? 0.5 : 1.0), lookTarget.z);
    }

    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const dtReal = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      if (isCinematicKO) updateMatrixKillCinematic(dtReal);
      if (isBulletTime) updateBulletTime(dtReal);
      if (isCounterActive) updateSynchroCounter(dtReal);

      let dt = dtReal * (isBulletTime ? 0.18 : (isCounterActive ? 0.1 : timeScale));

      if (hitStopTimer > 0) {
        hitStopTimer -= dtReal;
        dt = 0;
      }

      if (!isGameOver && !isPaused) {
        updatePlatforms(dt);
        updatePlayer(dt);
        updateEnvObjects(dt);
        updateHazards(dt);
        updateEnemies(dt);
        updateBullets(dt);
        updateParticles(dt);
        updateTrails(dtReal);
        updateCamera(dtReal);

        bgGroup.userData.particles.rotation.y += dtReal * 0.06;
      }

      composer.render();
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    // INITIALIZE & START
    generateStage();
    animate();
  </script>
</body>
