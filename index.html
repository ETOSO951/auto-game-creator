<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>斬影 - ZANEI: 3D CYBER SLASH (Ultimate Masterpiece Refined)</title>
  <style>
    :root {
      --bg: #010206;
      --accent: #00ffcc;
      --accent-glow: rgba(0, 255, 204, 0.65);
      --danger: #ff0055;
      --danger-glow: rgba(255, 0, 85, 0.7);
      --font-main: 'Segoe UI', Roboto, 'Hiragino Kaku Gothic ProN', sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: var(--font-main);
      color: #fff;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Cinematic Vignette & Scanline Overlay */
    #vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
      box-shadow: inset 0 0 160px rgba(0, 0, 0, 0.85);
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 3px 100%;
      transition: box-shadow 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #vignette.danger {
      box-shadow: inset 0 0 220px rgba(255, 0, 85, 0.85);
      animation: vignettePulse 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite alternate;
    }
    @keyframes vignettePulse {
      0% { box-shadow: inset 0 0 160px rgba(255, 0, 85, 0.6); }
      100% { box-shadow: inset 0 0 260px rgba(255, 0, 85, 0.95); }
    }

    /* UI Base Layer */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px;
    }

    /* HUD Header */
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .status-panel {
      background: rgba(4, 8, 18, 0.82);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(0, 255, 204, 0.35);
      border-radius: 18px;
      padding: 20px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.25), 0 0 35px rgba(0, 255, 204, 0.1);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hp-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 250px;
    }

    .hp-label {
      font-size: 11px;
      letter-spacing: 3.5px;
      color: #88eebb;
      font-weight: 800;
      text-shadow: 0 0 12px rgba(0, 255, 204, 0.5);
    }

    .hp-bar-outer {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.7);
    }

    .hp-bar-inner {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--danger), var(--accent));
      box-shadow: 0 0 25px var(--accent-glow);
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .score-container {
      text-align: right;
    }

    .floor-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--accent);
      background: rgba(0, 255, 204, 0.14);
      padding: 7px 18px;
      border-radius: 24px;
      border: 1px solid rgba(0, 255, 204, 0.5);
      margin-bottom: 10px;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.35);
    }

    .score-val {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 2.5px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 35px rgba(255, 255, 255, 0.6), 0 0 18px var(--accent-glow);
    }

    /* Crosshair & Kill Feed */
    .crosshair-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .kill-feed {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 3.5px;
      color: var(--accent);
      opacity: 0;
      transform: translateY(25px) scale(0.8);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      text-shadow: 0 0 30px var(--accent), 0 0 60px var(--accent-glow);
    }
    .kill-feed.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Mobile Controls */
    .touch-controls {
      display: none;
      width: 100%;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 16px;
      pointer-events: auto;
    }

    @media (hover: none) and (pointer: coarse) {
      .touch-controls {
        display: flex;
      }
    }

    .stick-area {
      width: 170px;
      height: 170px;
      background: rgba(255, 255, 255, 0.02);
      border: 2px dashed rgba(0, 255, 204, 0.45);
      border-radius: 50%;
      position: relative;
      touch-action: none;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 45px rgba(0,0,0,0.7);
    }

    .stick-nub {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, var(--accent), #0088ff);
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 40px var(--accent-glow), inset 0 2px 8px rgba(255,255,255,0.6);
      pointer-events: none;
      will-change: transform;
    }

    .action-btns {
      display: flex;
      gap: 22px;
      align-items: flex-end;
    }

    .act-btn {
      border-radius: 50%;
      border: none;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
    }
    .act-btn:active {
      transform: scale(0.85);
    }

    .btn-slash {
      width: 96px;
      height: 96px;
      font-size: 22px;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #ff0055, #ff4400);
      box-shadow: 0 0 45px var(--danger-glow), inset 0 2px 10px rgba(255,255,255,0.5);
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .btn-jump {
      width: 78px;
      height: 78px;
      font-size: 14px;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #0088ff, #00ffcc);
      box-shadow: 0 0 35px var(--accent-glow), inset 0 2px 10px rgba(255,255,255,0.5);
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    /* Modal Screens */
    .screen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      background: rgba(1, 2, 6, 0.9);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px;
      text-align: center;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s;
    }

    .screen-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .screen-title {
      font-size: clamp(48px, 9vw, 84px);
      font-weight: 900;
      letter-spacing: 12px;
      background: linear-gradient(135deg, #ffffff 15%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      text-transform: uppercase;
      filter: drop-shadow(0 0 60px rgba(0, 255, 204, 0.6));
    }

    .screen-sub {
      color: #99bbcc;
      font-size: 15px;
      letter-spacing: 6px;
      margin-bottom: 50px;
      font-weight: 700;
      text-shadow: 0 0 15px rgba(153, 187, 204, 0.5);
    }

    .primary-btn {
      pointer-events: auto;
      background: linear-gradient(135deg, var(--accent), #0088ff);
      color: #020409;
      border: none;
      padding: 22px 68px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 4px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 0 60px var(--accent-glow), inset 0 2px 8px rgba(255,255,255,0.6);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .primary-btn:hover {
      transform: translateY(-6px) scale(1.05);
      box-shadow: 0 0 80px var(--accent-glow), inset 0 2px 12px rgba(255,255,255,0.9);
    }
    .primary-btn:active {
      transform: translateY(1px);
    }

    /* Rogue Perk Select Cards */
    .perk-cards {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 520px;
      margin-top: 18px;
    }
    @media (min-width: 700px) {
      .perk-cards {
        flex-direction: row;
        max-width: 960px;
      }
    }

    .perk-card {
      pointer-events: auto;
      background: rgba(8, 16, 32, 0.88);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 255, 204, 0.35);
      border-radius: 20px;
      padding: 34px 30px;
      flex: 1;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: left;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.2);
    }
    .perk-card:hover {
      background: rgba(0, 255, 204, 0.16);
      border-color: var(--accent);
      transform: translateY(-10px);
      box-shadow: 0 28px 70px rgba(0, 255, 204, 0.45), inset 0 1px 3px rgba(255, 255, 255, 0.4);
    }
    .perk-name {
      font-weight: 800;
      font-size: 20px;
      color: var(--accent);
      margin-bottom: 14px;
      letter-spacing: 2px;
      text-shadow: 0 0 18px var(--accent-glow);
    }
    .perk-desc {
      font-size: 14px;
      color: #aaccbb;
      line-height: 1.85;
    }

    .tips {
      margin-top: 45px;
      font-size: 13px;
      color: #778899;
      letter-spacing: 1.5px;
      line-height: 1.9;
      text-shadow: 0 0 10px rgba(0,0,0,0.9);
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="vignette"></div>

  <!-- Ingame HUD -->
  <div class="ui-layer">
    <div class="hud-top">
      <div class="status-panel hp-container">
        <div class="hp-label">VITAL INTEGRITY</div>
        <div class="hp-bar-outer">
          <div id="hp-bar" class="hp-bar-inner"></div>
        </div>
      </div>

      <div class="status-panel score-container">
        <div id="floor-badge" class="floor-badge">FLOOR 1</div>
        <div id="score-display" class="score-val">0</div>
      </div>
    </div>

    <div class="crosshair-container">
      <div id="kill-feed" class="kill-feed">SLASHED! +100</div>
    </div>

    <!-- Virtual Controls for Mobile -->
    <div class="touch-controls">
      <div id="stick-area" class="stick-area">
        <div id="stick-nub" class="stick-nub"></div>
      </div>
      <div class="action-btns">
        <button id="btn-jump" class="act-btn btn-jump">JUMP</button>
        <button id="btn-slash" class="act-btn btn-slash">斬</button>
      </div>
    </div>
  </div>

  <!-- Start Screen -->
  <div id="screen-start" class="screen-overlay">
    <h1 class="screen-title">斬影 : ZANEI</h1>
    <p class="screen-sub">CYBERNETIC 3D SLASHER ROGUELIKE</p>
    <button id="btn-start" class="primary-btn">MISSION START</button>
    <div class="tips">
      PC: [WASD] 移動 / [SPACE] ジャンプ / [クリック or J] 斬撃<br>
      スマホ: バーチャルパッド & 右ボタン
    </div>
  </div>

  <!-- Level Clear / Roguelike Upgrade Screen -->
  <div id="screen-perk" class="screen-overlay hidden">
    <h2 class="screen-title" style="font-size: 38px;">フロア踏破</h2>
    <p class="screen-sub">ニューラルモジュールを選択してください</p>
    <div id="perk-list" class="perk-cards"></div>
  </div>

  <!-- Game Over Screen -->
  <div id="screen-gameover" class="screen-overlay hidden">
    <h1 class="screen-title" style="color: var(--danger); -webkit-text-fill-color: var(--danger);">TERMINATED</h1>
    <p class="screen-sub" id="gameover-summary">フロア 1 で信号切断</p>
    <button id="btn-restart" class="primary-btn" style="background: linear-gradient(135deg, var(--danger), #ffaa00); box-shadow: 0 0 60px var(--danger-glow);">REBOOT SYSTEM</button>
  </div>

  <script>
    /* ========================================================
       1. Enhanced SoundFX Synthesizer (Web Audio API with Filters)
       ======================================================== */
    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playSlash() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();
        
        filter.type = 'bandpass';
        filter.frequency.value = 2200;
        filter.Q.value = 4.0;

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1600, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.24);

        gain.gain.setValueAtTime(0.45, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.24);

        const bufSize = this.ctx.sampleRate * 0.2;
        const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.28));
        const noise = this.ctx.createBufferSource();
        noise.buffer = buf;
        const noiseFilter = this.ctx.createBiquadFilter();
        noiseFilter.type = 'highpass';
        noiseFilter.frequency.value = 3800;
        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.35, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);
        noise.start(now);
      }
      playHit() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();
        
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, now);

        osc.type = 'square';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(25, now + 0.22);

        gain.gain.setValueAtTime(0.55, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      }
      playJump() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(700, now + 0.24);
        gain.gain.setValueAtTime(0.32, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.24);
      }
      playClear() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.25, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.55);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.55);
        });
      }
    }
    const audio = new SoundFX();

    /* ========================================================
       2. Unified Input & Command Buffer System
       ======================================================== */
    class InputSystem {
      constructor() {
        this.commands = { slash: 0, jump: 0 };
        this.framesValid = 12;
        this.keys = {};
        
        window.addEventListener('keydown', e => {
          if (!this.keys[e.code]) {
            this.keys[e.code] = true;
            if (e.code === 'KeyJ' || e.code === 'KeyF') this.push('slash');
            if (e.code === 'Space') this.push('jump');
          }
        });
        window.addEventListener('keyup', e => { this.keys[e.code] = false; });
        window.addEventListener('pointerdown', e => {
          if (state === GAME_STATE.PLAYING && e.target.tagName !== 'BUTTON') {
            this.push('slash');
          }
        });
      }

      push(cmd) {
        this.commands[cmd] = this.framesValid;
      }

      consume(cmd) {
        if (this.commands[cmd] > 0) {
          this.commands[cmd] = 0;
          return true;
        }
        return false;
      }

      update() {
        for (let key in this.commands) {
          if (this.commands[key] > 0) this.commands[key]--;
        }
      }

      clear() {
        this.commands.slash = 0;
        this.commands.jump = 0;
      }
    }
    const inputSys = new InputSystem();

    /* ========================================================
       3. Game Engine Setup & Visual Polish (Three.js)
       ======================================================== */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010206);
    scene.fog = new THREE.FogExp2(0x010206, 0.022);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 150);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x00ffcc, 1.8);
    dirLight.position.set(35, 65, 35);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xff0055, 3.5, 50);
    scene.add(pointLight);

    const GAME_STATE = { TITLE: 0, PLAYING: 1, PERK_SELECT: 2, GAMEOVER: 3 };
    let state = GAME_STATE.TITLE;

    const stats = {
      maxHp: 100,
      hp: 100,
      score: 0,
      floor: 1,
      moveSpeed: 13.0,
      slashDamage: 45,
      slashRange: 4.6,
      critChance: 0.12
    };

    let enemies = [];
    let particles = [];
    let platforms = [];
    let portal = null;
    let cameraShake = 0;
    let hitStopFrames = 0;
    const raycaster = new THREE.Raycaster();

    /* ========================================================
       4. Player Mesh & Cyber Aesthetic Setup
       ======================================================== */
    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0c1322, roughness: 0.12, metalness: 0.98 });
    const bodyMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.2, 1.2, 12), bodyMat);
    bodyMesh.castShadow = true;
    bodyMesh.position.y = 0.6;
    playerGroup.add(bodyMesh);

    const coreMaterial = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 1.5, roughness: 0.08 });
    const coreMesh = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), coreMaterial);
    coreMesh.position.set(0, 0.7, 0.22);
    playerGroup.add(coreMesh);

    const katanaGroup = new THREE.Group();
    katanaGroup.position.set(0.42, 0.6, 0);
    const bladeMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 2.6, roughness: 0.03, metalness: 0.95 });
    const bladeMesh = new THREE.Mesh(new THREE.BoxGeometry(0.035, 1.35, 0.08), bladeMat);
    bladeMesh.position.set(0, 0.5, 0.3);
    bladeMesh.rotation.x = Math.PI / 4;
    katanaGroup.add(bladeMesh);
    playerGroup.add(katanaGroup);

    const slashArc = new THREE.Mesh(
      new THREE.RingGeometry(1.6, 4.5, 48, 1, 0, Math.PI * 0.95),
      new THREE.MeshBasicMaterial({ color: 0x00ffcc, side: THREE.DoubleSide, transparent: true, opacity: 0, blending: THREE.AdditiveBlending })
    );
    slashArc.rotation.x = Math.PI / 2;
    slashArc.position.y = 0.6;
    playerGroup.add(slashArc);

    const playerPhysics = {
      position: new THREE.Vector3(),
      prevPosition: new THREE.Vector3(),
      velocity: new THREE.Vector3(),
      quaternion: new THREE.Quaternion(),
      prevQuaternion: new THREE.Quaternion(),
      targetQuaternion: new THREE.Quaternion(),
      isGrounded: false,
      isSlashing: false,
      slashTime: 0,
      slashHitTriggered: false
    };

    /* ========================================================
       5. Stage & Procedural Grid Platforms
       ======================================================== */
    function clearLevel() {
      platforms.forEach(p => scene.remove(p));
      platforms = [];
      enemies.forEach(e => scene.remove(e.group));
      enemies = [];
      if (portal) {
        scene.remove(portal);
        portal = null;
      }
    }

    function createPlatform(x, y, z, w, h, d, color = 0x111c34) {
      const group = new THREE.Group();
      group.position.set(x, y, z);

      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color, roughness: 0.25, metalness: 0.75 })
      );
      mesh.receiveShadow = true;
      mesh.castShadow = true;
      group.add(mesh);

      const edgeGeom = new THREE.EdgesGeometry(mesh.geometry);
      const edgeMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.65 });
      const wireframe = new THREE.LineSegments(edgeGeom, edgeMat);
      group.add(wireframe);

      scene.add(group);
      platforms.push(mesh);
      return group;
    }

    function generateStage(floorNumber) {
      clearLevel();
      createPlatform(0, -0.5, 0, 14, 1, 14, 0x142240);
      playerPhysics.position.set(0, 2, 0);
      playerPhysics.prevPosition.copy(playerPhysics.position);
      playerPhysics.velocity.set(0, 0, 0);
      playerGroup.position.copy(playerPhysics.position);

      const pathLength = 6 + floorNumber * 2;
      let currPos = new THREE.Vector3(0, -0.5, 0);

      for (let i = 0; i < pathLength; i++) {
        const stepX = (Math.random() - 0.5) * 16;
        const stepZ = -(10 + Math.random() * 9);
        const stepY = (Math.random() - 0.35) * 4.0;

        currPos.x += stepX;
        currPos.z += stepZ;
        currPos.y = Math.max(-3.5, Math.min(11, currPos.y + stepY));

        const w = 6.5 + Math.random() * 5;
        const d = 6.5 + Math.random() * 5;
        createPlatform(currPos.x, currPos.y, currPos.z, w, 1, d);

        if (i > 0) {
          const enemyCount = Math.floor(1 + Math.random() * 2.5);
          for (let e = 0; e < enemyCount; e++) {
            spawnEnemy(
              currPos.x + (Math.random() - 0.5) * (w - 2.5),
              currPos.y + 1.4,
              currPos.z + (Math.random() - 0.5) * (d - 2.5)
            );
          }
        }
      }

      currPos.z -= 14;
      createPlatform(currPos.x, currPos.y, currPos.z, 9, 1, 9, 0x1a2e58);

      portal = new THREE.Mesh(
        new THREE.TorusGeometry(2.0, 0.3, 20, 40),
        new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true })
      );
      portal.position.set(currPos.x, currPos.y + 2.8, currPos.z);
      scene.add(portal);
    }

    function spawnEnemy(x, y, z) {
      const group = new THREE.Group();
      group.position.set(x, y, z);

      const mesh = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.85, 0),
        new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.12, metalness: 0.98, emissive: 0xff0055, emissiveIntensity: 1.1 })
      );
      mesh.castShadow = true;
      group.add(mesh);

      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      eye.position.set(0, 0, 0.58);
      group.add(eye);

      scene.add(group);

      enemies.push({
        group,
        mesh,
        position: new THREE.Vector3(x, y, z),
        prevPosition: new THREE.Vector3(x, y, z),
        hp: 75 + stats.floor * 24,
        speed: 5.0 + Math.random() * 2.8,
        velocity: new THREE.Vector3()
      });
    }

    /* ========================================================
       6. Collision Detection, CCD & Combat Feedback
       ======================================================== */
    function triggerSlash() {
      if (playerPhysics.isSlashing) return;
      playerPhysics.isSlashing = true;
      playerPhysics.slashTime = 0.24;
      playerPhysics.slashHitTriggered = false;

      audio.playSlash();

      slashArc.material.opacity = 1.0;
      slashArc.scale.set(stats.slashRange * 0.58, stats.slashRange * 0.58, 1);
      katanaGroup.rotation.y = -Math.PI * 0.75;
    }

    function executeSlashHit() {
      const playerPos = playerPhysics.position;
      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(playerPhysics.quaternion);

      const samplePoints = [];
      const numSamples = 10;
      for (let i = 1; i <= numSamples; i++) {
        const ratio = i / numSamples;
        samplePoints.push(playerPos.clone().add(forward.clone().multiplyScalar(stats.slashRange * ratio)));
      }

      enemies.forEach((enemy, idx) => {
        const enemyPos = enemy.position;
        if (Math.abs(enemyPos.y - playerPos.y) < 3.2) {
          let hitDetected = false;
          for (let pt of samplePoints) {
            if (pt.distanceTo(enemyPos) <= 2.2) {
              hitDetected = true;
              break;
            }
          }

          if (hitDetected) {
            const isCrit = Math.random() < stats.critChance;
            const damage = stats.slashDamage * (isCrit ? 2.5 : 1.0);
            enemy.hp -= damage;

            audio.playHit();
            hitStopFrames = 10;
            cameraShake = isCrit ? 0.85 : 0.55;
            spawnBloodParticles(enemyPos.clone(), isCrit ? 0x00ffcc : 0xff0055);
            
            const knockbackDir = enemyPos.clone().sub(playerPos).normalize();
            enemy.velocity.add(knockbackDir.multiplyScalar(14.0));

            if (enemy.hp <= 0) {
              stats.score += 100 * stats.floor;
              updateHUD();
              showKillFeed(isCrit ? "CRITICAL SLASH! +200" : "SLASHED! +100");
              scene.remove(enemy.group);
              enemies.splice(idx, 1);
            }
          }
        }
      });
    }

    function showKillFeed(msg) {
      const feed = document.getElementById('kill-feed');
      feed.textContent = msg;
      feed.classList.add('show');
      setTimeout(() => feed.classList.remove('show'), 1050);
    }

    function spawnBloodParticles(pos, colorHex) {
      const geom = new THREE.BoxGeometry(0.18, 0.18, 0.18);
      const mat = new THREE.MeshBasicMaterial({ color: colorHex });

      for (let i = 0; i < 35; i++) {
        const p = new THREE.Mesh(geom, mat);
        p.position.copy(pos);
        const vel = new THREE.Vector3(
          (Math.random() - 0.5) * 20,
          Math.random() * 16 + 6,
          (Math.random() - 0.5) * 20
        );
        scene.add(p);
        particles.push({ mesh: p, vel, life: 0.9 });
      }
    }

    /* ========================================================
       7. Touch Controls & Event Bindings
       ======================================================== */
    const stick = { active: false, x: 0, y: 0 };
    const stickArea = document.getElementById('stick-area');
    const stickNub = document.getElementById('stick-nub');

    function handleStickTouch(e) {
      const touch = e.touches[0];
      const rect = stickArea.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const deltaX = touch.clientX - centerX;
      const deltaY = touch.clientY - centerY;
      const dist = Math.min(50, Math.hypot(deltaX, deltaY));
      const angle = Math.atan2(deltaY, deltaX);

      stick.x = (Math.cos(angle) * dist) / 50;
      stick.y = (Math.sin(angle) * dist) / 50;
      stickNub.style.transform = `translate(calc(-50% + ${stick.x * 45}px), calc(-50% + ${stick.y * 45}px))`;
    }

    stickArea.addEventListener('touchstart', e => {
      stick.active = true;
      handleStickTouch(e);
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      if (stick.active) handleStickTouch(e);
    }, { passive: false });

    window.addEventListener('touchend', () => {
      stick.active = false;
      stick.x = 0;
      stick.y = 0;
      stickNub.style.transform = 'translate(-50%, -50%)';
    });

    document.getElementById('btn-slash').addEventListener('touchstart', (e) => {
      e.stopPropagation();
      inputSys.push('slash');
    });
    document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
      e.stopPropagation();
      inputSys.push('jump');
    });

    /* ========================================================
       8. Roguelike Upgrades & HUD Management
       ======================================================== */
    const PERK_DEFINITIONS = [
      { id: 'dmg', name: '波動刃エンハンス', desc: '基本斬撃攻撃力が 25% 向上', apply: () => stats.slashDamage = Math.round(stats.slashDamage * 1.25) },
      { id: 'range', name: 'サイバーレンジ拡大', desc: '斬撃リーチが +20% 拡大', apply: () => stats.slashRange *= 1.2 },
      { id: 'speed', name: 'アクセラレータ', desc: '走行速度が 15% 上昇', apply: () => stats.moveSpeed *= 1.15 },
      { id: 'crit', name: 'フェイタルリンク', desc: 'クリティカル率 +15%', apply: () => stats.critChance += 0.15 },
      { id: 'heal', name: 'ナノリペア修復', desc: 'HPを 65 回復し、最大HP +35', apply: () => { stats.maxHp += 35; stats.hp = Math.min(stats.maxHp, stats.hp + 65); } }
    ];

    function showPerkSelection() {
      state = GAME_STATE.PERK_SELECT;
      audio.playClear();

      const screen = document.getElementById('screen-perk');
      const perkContainer = document.getElementById('perk-list');
      perkContainer.innerHTML = '';

      const shuffled = [...PERK_DEFINITIONS].sort(() => 0.5 - Math.random()).slice(0, 3);
      shuffled.forEach(perk => {
        const card = document.createElement('div');
        card.className = 'perk-card';
        card.innerHTML = `<div class="perk-name">${perk.name}</div><div class="perk-desc">${perk.desc}</div>`;
        card.onclick = () => {
          perk.apply();
          stats.floor++;
          screen.classList.add('hidden');
          generateStage(stats.floor);
          updateHUD();
          state = GAME_STATE.PLAYING;
        };
        perkContainer.appendChild(card);
      });

      screen.classList.remove('hidden');
    }

    function updateHUD() {
      const hpPct = Math.max(0, (stats.hp / stats.maxHp) * 100);
      document.getElementById('hp-bar').style.width = `${hpPct}%`;
      document.getElementById('score-display').textContent = stats.score;
      document.getElementById('floor-badge').textContent = `FLOOR ${stats.floor}`;

      const vignette = document.getElementById('vignette');
      if (hpPct < 30) {
        vignette.classList.add('danger');
      } else {
        vignette.classList.remove('danger');
      }
    }

    function triggerGameOver() {
      state = GAME_STATE.GAMEOVER;
      document.getElementById('gameover-summary').textContent = `フロア ${stats.floor} で切断 | スコア: ${stats.score}`;
      document.getElementById('screen-gameover').classList.remove('hidden');
    }

    function resetGame() {
      stats.hp = 100;
      stats.maxHp = 100;
      stats.score = 0;
      stats.floor = 1;
      stats.moveSpeed = 13.0;
      stats.slashDamage = 45;
      stats.slashRange = 4.6;
      stats.critChance = 0.12;

      inputSys.clear();
      updateHUD();
      generateStage(stats.floor);
      document.getElementById('screen-start').classList.add('hidden');
      document.getElementById('screen-gameover').classList.add('hidden');
      state = GAME_STATE.PLAYING;
    }

    document.getElementById('btn-start').addEventListener('click', () => { audio.init(); resetGame(); });
    document.getElementById('btn-restart').addEventListener('click', () => { resetGame(); });

    /* ========================================================
       9. Main Game Loop with Fixed Timestep & Interpolation
       ======================================================== */
    const FIXED_TIME_STEP = 1 / 60;
    let accumulator = 0;
    let lastTime = performance.now();

    function updateSimulation(delta) {
      if (state !== GAME_STATE.PLAYING) return;

      inputSys.update();

      playerPhysics.prevPosition.copy(playerPhysics.position);
      playerPhysics.prevQuaternion.copy(playerPhysics.quaternion);
      enemies.forEach(e => e.prevPosition.copy(e.position));

      let moveX = 0;
      let moveZ = 0;
      if (inputSys.keys['KeyW'] || inputSys.keys['ArrowUp']) moveZ -= 1;
      if (inputSys.keys['KeyS'] || inputSys.keys['ArrowDown']) moveZ += 1;
      if (inputSys.keys['KeyA'] || inputSys.keys['ArrowLeft']) moveX -= 1;
      if (inputSys.keys['KeyD'] || inputSys.keys['ArrowRight']) moveX += 1;

      if (stick.active) {
        moveX = stick.x;
        moveZ = stick.y;
      }

      const moveVec = new THREE.Vector2(moveX, moveZ);
      if (moveVec.length() > 0.1) {
        moveVec.normalize();
        const targetAngle = Math.atan2(moveVec.x, moveVec.y) + Math.PI;
        playerPhysics.targetQuaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), targetAngle);
        playerPhysics.quaternion.slerp(playerPhysics.targetQuaternion, Math.min(1.0, delta * 28));

        playerPhysics.velocity.x = moveVec.x * stats.moveSpeed;
        playerPhysics.velocity.z = moveVec.y * stats.moveSpeed;
      } else {
        playerPhysics.velocity.x *= 0.80;
        playerPhysics.velocity.z *= 0.80;
      }

      if (inputSys.consume('jump') && playerPhysics.isGrounded) {
        playerPhysics.velocity.y = 14.5;
        playerPhysics.isGrounded = false;
        audio.playJump();
      }

      playerPhysics.velocity.y -= 38.0 * delta;
      playerPhysics.position.addScaledVector(playerPhysics.velocity, delta);

      playerPhysics.isGrounded = false;
      raycaster.set(playerPhysics.position.clone().add(new THREE.Vector3(0, 0.5, 0)), new THREE.Vector3(0, -1, 0));
      const intersects = raycaster.intersectObjects(platforms);

      if (intersects.length > 0) {
        const hit = intersects[0];
        if (playerPhysics.velocity.y <= 0 && hit.distance <= 0.78) {
          playerPhysics.position.y = hit.point.y + 0.6;
          playerPhysics.velocity.y = 0;
          playerPhysics.isGrounded = true;
        }
      }

      if (playerPhysics.position.y < -16) {
        stats.hp = 0;
        updateHUD();
        triggerGameOver();
      }

      if (inputSys.consume('slash') && !playerPhysics.isSlashing) {
        triggerSlash();
      }

      if (playerPhysics.isSlashing) {
        playerPhysics.slashTime -= delta;
        const progress = 1.0 - (playerPhysics.slashTime / 0.24);
        katanaGroup.rotation.y = -Math.PI * 0.75 + progress * Math.PI * 1.5;

        if (!playerPhysics.slashHitTriggered && progress >= 0.2 && progress <= 0.7) {
          executeSlashHit();
          playerPhysics.slashHitTriggered = true;
        }

        if (playerPhysics.slashTime <= 0) {
          playerPhysics.isSlashing = false;
          slashArc.material.opacity = 0;
          katanaGroup.rotation.y = 0;
        }
      }

      enemies.forEach(enemy => {
        const dir = playerPhysics.position.clone().sub(enemy.position);
        const dist = dir.length();

        enemy.mesh.rotation.y += delta * 3.5;
        enemy.mesh.rotation.x += delta * 2.4;

        enemy.position.addScaledVector(enemy.velocity, delta);
        enemy.velocity.multiplyScalar(0.82);

        if (dist < 30) {
          dir.y = 0;
          dir.normalize();

          const targetRot = Math.atan2(dir.x, dir.z);
          enemy.group.rotation.y = THREE.MathUtils.lerp(enemy.group.rotation.y, targetRot, Math.min(1.0, delta * 18));

          enemy.position.add(dir.multiplyScalar(enemy.speed * delta));

          if (dist < 1.45) {
            stats.hp -= 32 * delta;
            cameraShake = 0.55;
            updateHUD();
            if (stats.hp <= 0) triggerGameOver();
          }
        }
      });

      if (portal) {
        portal.rotation.z += delta * 2.8;
        portal.rotation.x += delta * 1.6;
        if (playerPhysics.position.distanceTo(portal.position) < 2.3) {
          showPerkSelection();
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.mesh.position.addScaledVector(p.vel, delta);
        p.vel.y -= 36.0 * delta;
        p.life -= delta;
        p.mesh.scale.multiplyScalar(0.9);

        if (p.life <= 0) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
        }
      }
    }

    function animate(now) {
      requestAnimationFrame(animate);
      const rawDelta = (now - lastTime) / 1000;
      lastTime = now;

      // Dynamic Core Pulsing & Lighting
      const timeSec = now * 0.0045;
      const corePulse = 1.0 + Math.sin(timeSec * 8) * 0.5;
      coreMaterial.emissiveIntensity = corePulse;
      bladeMat.emissiveIntensity = 2.0 + Math.sin(timeSec * 12) * 0.6;

      if (hitStopFrames > 0) {
        hitStopFrames--;
        renderer.render(scene, camera);
        return;
      }

      accumulator += Math.min(rawDelta, 0.1);
      while (accumulator >= FIXED_TIME_STEP) {
        updateSimulation(FIXED_TIME_STEP);
        accumulator -= FIXED_TIME_STEP;
      }

      const alpha = accumulator / FIXED_TIME_STEP;

      if (state === GAME_STATE.PLAYING) {
        playerGroup.position.copy(playerPhysics.prevPosition).lerp(playerPhysics.position, alpha);
        playerGroup.quaternion.copy(playerPhysics.prevQuaternion).slerp(playerPhysics.quaternion, alpha);

        enemies.forEach(e => {
          e.group.position.copy(e.prevPosition).lerp(e.position, alpha);
        });

        const idealOffset = new THREE.Vector3(0, 8.5, 11.0);
        const camTarget = playerGroup.position.clone().add(idealOffset);
        camera.position.lerp(camTarget, 0.2);

        if (cameraShake > 0) {
          camera.position.x += (Math.random() - 0.5) * cameraShake;
          camera.position.y += (Math.random() - 0.5) * cameraShake;
          cameraShake = Math.max(0, cameraShake - rawDelta * 4.5);
        }
        camera.lookAt(playerGroup.position);

        pointLight.position.copy(playerGroup.position).add(new THREE.Vector3(0, 2, 0));
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    requestAnimationFrame(animate);
  </script>
