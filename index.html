<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON RUSH - HYPER ACTION</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #05050a;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 854px;
            background: linear-gradient(135deg, #0b091a 0%, #1a0b2e 100%);
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.2);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Layers */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }

        .interactive {
            pointer-events: auto;
        }

        /* HUD */
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .score-board {
            text-align: left;
        }

        .score-label {
            font-size: 10px;
            letter-spacing: 2px;
            color: #00ffcc;
            text-transform: uppercase;
        }

        .score-value {
            font-size: 32px;
            font-weight: 900;
            font-family: monospace;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .combo-badge {
            background: rgba(255, 0, 128, 0.2);
            border: 2px solid #ff0080;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            color: #ff0080;
            text-shadow: 0 0 8px #ff0080;
            transform: scale(1);
            transition: transform 0.1s;
        }

        .combo-badge.pulse {
            transform: scale(1.3);
        }

        /* Fever Gauge */
        .fever-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
            position: relative;
        }

        .fever-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff0080, #ffcc00);
            box-shadow: 0 0 10px #ff0080;
            transition: width 0.1s linear;
        }

        /* Screens (Start / Gameover) */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .game-title {
            font-size: 48px;
            font-weight: 900;
            font-style: italic;
            text-align: center;
            background: linear-gradient(180deg, #fff 0%, #00ffcc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 255, 204, 0.6);
            margin-bottom: 5px;
            letter-spacing: -1px;
        }

        .game-subtitle {
            font-size: 12px;
            letter-spacing: 6px;
            color: #ff0080;
            margin-bottom: 40px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn {
            background: linear-gradient(135deg, #00ffcc 0%, #0088ff 100%);
            color: #05050a;
            border: none;
            padding: 18px 48px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.8);
        }

        .instructions {
            margin-top: 30px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            line-height: 1.6;
        }

        .instructions span {
            color: #00ffcc;
            font-weight: bold;
        }

        /* Game Over Specific */
        .gameover-stats {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 40px;
            border-radius: 16px;
            margin-bottom: 30px;
            text-align: center;
        }

        .gameover-stats .label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        .gameover-stats .val {
            font-size: 36px;
            font-weight: 900;
            color: #ff0080;
            font-family: monospace;
            text-shadow: 0 0 10px rgba(255, 0, 128, 0.5);
        }

        /* Flash overlay for damage/fever */
        #flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.1s;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas for Game Graphics -->
        <canvas id="gameCanvas"></canvas>

        <!-- Flash Effect Layer -->
        <div id="flash-overlay"></div>

        <!-- UI Layer -->
        <div class="ui-layer">
            <div class="hud-top">
                <div class="score-board">
                    <div class="score-label">SCORE</div>
                    <div class="score-value" id="current-score">000000</div>
                    <div class="fever-container">
                        <div class="fever-fill" id="fever-fill"></div>
                    </div>
                </div>
                <div class="combo-badge" id="combo-badge" style="display: none;">
                    <span id="combo-count">0</span> COMBO
                </div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <div class="game-title">NEON<br>RUSH</div>
            <div class="game-subtitle">Hyper Dopamine Action</div>
            <button class="btn interactive" id="start-btn">PLAY NOW</button>
            <div class="instructions">
                TAP to <span>JUMP / REVERSE</span><br>
                Collect Orbs &bull; Dodge Spikes &bull; Enter Fever
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="screen hidden">
            <div class="game-title" style="font-size: 36px; margin-bottom: 20px; color: #ff0080; -webkit-text-fill-color: #ff0080;">GAME OVER</div>
            <div class="gameover-stats">
                <div class="label">FINAL SCORE</div>
                <div class="val" id="final-score">000000</div>
            </div>
            <button class="btn interactive" id="restart-btn">RETRY</button>
        </div>
    </div>

    <script>
        // --- SOUND SYSTEM (Web Audio API) ---
        class SoundManager {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playTone(freq, type, duration, vol = 0.1, slideTo = null) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    if (slideTo) {
                        osc.frequency.exponentialRampToValueAtTime(slideTo, this.ctx.currentTime + duration);
                    }
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            jump() { this.playTone(300, 'square', 0.15, 0.1, 600); }
            score() { this.playTone(800, 'sine', 0.1, 0.08, 1200); }
            hit() { this.playTone(120, 'sawtooth', 0.3, 0.2, 40); }
            fever() {
                if (!this.ctx) return;
                [400, 600, 800, 1200].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'triangle', 0.1, 0.15), i * 60);
                });
            }
        }

        const sound = new SoundManager();

        // --- GAME CONFIG & STATE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let baseScale = 1; // 解像度相対化のためのスケール基準値
        function resize() {
            width = canvas.parentElement.clientWidth;
            height = canvas.parentElement.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            // 基準高さ（800px）に対するスケール比率を算出
            baseScale = height / 800;
        }
        window.addEventListener('resize', resize);
        resize();

        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let combo = 0;
        let comboTimer = 0;
        let feverGauge = 0;
        let isFever = false;
        let feverTimer = 0;
        let screenShake = 0;
        let hitStop = 0;

        // 速度スムーズ遷移＆入力先行入力用変数
        let currentSpeed = 5 * baseScale;
        let jumpBufferTimer = 0;

        // --- GAME OBJECTS ---
        class Player {
            constructor() {
                this.baseSize = 24;
                this.baseHitRadius = 8.5; // 見た目と完全に一致する精密な判定半径
                this.baseGravity = 0.8;
                this.baseJumpForce = -12.5;
                
                this.reset();
            }

            get size() { return this.baseSize * baseScale; }
            get hitRadius() { return this.baseHitRadius * baseScale; }

            reset() {
                this.x = Math.max(60, width * 0.18);
                this.y = height / 2;
                this.vy = 0;
                this.gravityDir = 1; // 1: down, -1: up
                this.rotation = 0;
                this.trail = [];
            }

            update(dt60) {
                const gravity = this.baseGravity * baseScale;
                this.vy += gravity * this.gravityDir * dt60;
                this.y += this.vy * dt60;

                // 上下境界でのレスポンシブな減衰反発
                const margin = this.size * 0.8;
                if (this.y < margin) {
                    this.y = margin;
                    this.vy = Math.abs(this.vy) * 0.2;
                } else if (this.y > height - margin) {
                    this.y = height - margin;
                    this.vy = -Math.abs(this.vy) * 0.2;
                }

                this.rotation += 0.15 * this.gravityDir * dt60;

                // 軌跡 (Trail)
                this.trail.push({x: this.x, y: this.y});
                if (this.trail.length > 10) this.trail.shift();
            }

            jump() {
                this.gravityDir *= -1;
                // 従来の垂直速度を完全にリセットしてから反転力を加えることで、遅延のないダイレクトな操作感を実現
                this.vy = 0;
                this.vy = (this.baseJumpForce * baseScale) * this.gravityDir;
                sound.jump();

                // Jump particles
                for(let i = 0; i < 8; i++) {
                    particles.push(new Particle(this.x, this.y, '#00ffcc', true));
                }
            }

            draw() {
                const curSize = this.size;
                // Draw trail
                this.trail.forEach((t, index) => {
                    let alpha = index / this.trail.length;
                    ctx.fillStyle = isFever ? `rgba(255, 0, 128, ${alpha * 0.4})` : `rgba(0, 255, 204, ${alpha * 0.3})`;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, curSize * 0.8 * (index / this.trail.length), 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Body
                ctx.shadowBlur = isFever ? 25 : 15;
                ctx.shadowColor = isFever ? '#ff0080' : '#00ffcc';
                ctx.fillStyle = isFever ? '#ff0080' : '#00ffcc';
                ctx.fillRect(-curSize / 2, -curSize / 2, curSize, curSize);

                // Inner core
                ctx.fillStyle = '#fff';
                ctx.fillRect(-curSize / 4, -curSize / 4, curSize / 2, curSize / 2);

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, burst = false) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = burst ? Math.random() * Math.PI * 2 : (Math.random() - 0.5) * 0.5;
                const speed = (burst ? Math.random() * 6 + 2 : Math.random() * 3 + 1) * baseScale;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.size = (Math.random() * 4 + 2) * baseScale;
                this.life = 1.0;
                this.decay = Math.random() * 0.03 + 0.02;
            }
            update(dt60) {
                this.x += this.vx * dt60;
                this.y += this.vy * dt60;
                this.life -= this.decay * dt60;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        class Obstacle {
            constructor() {
                this.x = width + 50 * baseScale;
                this.w = 30 * baseScale;
                this.topH = Math.random() * (height * 0.4) + 50 * baseScale;
                this.gap = (isFever ? 220 : 160) * baseScale;
                this.bottomH = height - (this.topH + this.gap);
                this.passed = false;
                this.color = '#ff3366';
            }
            update(speed, dt60) {
                this.x -= speed * dt60;
            }
            draw() {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;

                // Top block
                ctx.fillRect(this.x, 0, this.w, this.topH);
                // Bottom block
                ctx.fillRect(this.x, height - this.bottomH, this.w, this.bottomH);

                // Neon borders
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, 0, this.w, this.topH);
                ctx.strokeRect(this.x, height - this.bottomH, this.w, this.bottomH);

                ctx.restore();
            }
        }

        class Collectible {
            constructor(obs) {
                this.x = obs.x + obs.w / 2;
                this.y = obs.topH + (obs.gap / 2);
                this.size = 14 * baseScale;
                this.collected = false;
                this.angle = 0;
            }
            update(speed, dt60) {
                this.x -= speed * dt60;
                this.angle += 0.1 * dt60;
            }
            draw() {
                if (this.collected) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ffcc00';
                ctx.fillStyle = '#ffcc00';
                
                // Diamond shape
                ctx.beginPath();
                ctx.moveTo(0, -this.size);
                ctx.lineTo(this.size, 0);
                ctx.lineTo(0, this.size);
                ctx.lineTo(-this.size, 0);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        // 精密な「円 vs 猶予付き矩形」当たり判定ロジック（ビジュアル整合性を高めたチューニング）
        function checkCircleBoxCollision(cx, cy, r, bx, by, bw, bh, inset = 2) {
            const rx = bx + inset;
            const ry = by + inset;
            const rw = Math.max(0, bw - inset * 2);
            const rh = Math.max(0, bh - inset * 2);

            const closestX = Math.max(rx, Math.min(cx, rx + rw));
            const closestY = Math.max(ry, Math.min(cy, ry + rh));
            const dx = cx - closestX;
            const dy = cy - closestY;
            return (dx * dx + dy * dy) < (r * r);
        }

        // --- INITIALIZATION ---
        const player = new Player();
        let obstacles = [];
        let collectibles = [];
        let particles = [];
        let spawnTimer = 0;

        // --- CONTROLS ---
        function triggerAction(e) {
            if (e.target.classList.contains('interactive')) return;
            if (gameState === 'PLAYING') {
                jumpBufferTimer = 0.15; // 0.15秒間の先行入力を保持
            }
        }

        window.addEventListener('pointerdown', triggerAction);

        document.getElementById('start-btn').addEventListener('click', () => {
            sound.init();
            startGame();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            sound.init();
            startGame();
        });

        function startGame() {
            gameState = 'PLAYING';
            score = 0;
            combo = 0;
            feverGauge = 0;
            isFever = false;
            feverTimer = 0;
            jumpBufferTimer = 0;
            currentSpeed = 5 * baseScale;
            obstacles = [];
            collectibles = [];
            particles = [];
            player.reset();

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('combo-badge').style.display = 'none';
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            sound.hit();
            screenShake = 30;
            hitStop = 20;

            // Flash red
            const flash = document.getElementById('flash-overlay');
            flash.style.background = 'rgba(255, 0, 50, 0.5)';
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 200);

            document.getElementById('final-score').innerText = String(Math.floor(score)).padStart(6, '0');
            document.getElementById('gameover-screen').classList.remove('hidden');
        }

        // --- GAME LOOP & RESPONSIBILITY SEPARATION ---
        let lastTime = performance.now();

        function updateGame(dt, dt60) {
            // 入力バッファ（先行入力）の処理
            if (jumpBufferTimer > 0) {
                jumpBufferTimer -= dt;
                player.jump();
                jumpBufferTimer = 0;
            }

            // スピード補間 (Lerp) による滑らかな加減速
            let targetSpeed = (isFever ? 9 : 5) * baseScale;
            currentSpeed += (targetSpeed - currentSpeed) * (1 - Math.exp(-0.15 * dt60));

            // Fever logic
            if (isFever) {
                feverTimer -= dt;
                feverGauge = Math.max(0, (feverTimer / 5.0) * 100);
                if (feverTimer <= 0) {
                    isFever = false;
                }
            }

            // Spawn obstacles (Delta-time scaling)
            spawnTimer += dt60;
            if (spawnTimer >= (isFever ? 45 : 75)) {
                spawnTimer = 0;
                let obs = new Obstacle();
                obstacles.push(obs);
                collectibles.push(new Collectible(obs));
            }

            // Update Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.update(currentSpeed, dt60);

                if (!obs.passed && obs.x + obs.w < player.x) {
                    obs.passed = true;
                    score += isFever ? 200 : 100;
                    sound.score();
                }

                // Precise Collision Detection
                const hitTop = checkCircleBoxCollision(player.x, player.y, player.hitRadius, obs.x, 0, obs.w, obs.topH);
                const hitBottom = checkCircleBoxCollision(player.x, player.y, player.hitRadius, obs.x, height - obs.bottomH, obs.w, obs.bottomH);

                if (hitTop || hitBottom) {
                    gameOver();
                }

                if (obs.x < -100 * baseScale) {
                    obstacles.splice(i, 1);
                }
            }

            // Update Collectibles
            for (let i = collectibles.length - 1; i >= 0; i--) {
                let col = collectibles[i];
                col.update(currentSpeed, dt60);

                let dist = Math.hypot(player.x - col.x, player.y - col.y);
                if (!col.collected && dist < player.hitRadius + col.size) {
                    col.collected = true;
                    score += 500;
                    combo++;
                    comboTimer = 3.0;
                    sound.score();

                    const comboBadge = document.getElementById('combo-badge');
                    document.getElementById('combo-count').innerText = combo;
                    comboBadge.style.display = 'block';
                    comboBadge.classList.add('pulse');
                    setTimeout(() => comboBadge.classList.remove('pulse'), 100);

                    if (!isFever) {
                        feverGauge += 15;
                        if (feverGauge >= 100) {
                            isFever = true;
                            feverTimer = 5.0;
                            feverGauge = 100;
                            sound.fever();
                            screenShake = 15;
                        }
                    }

                    for(let p = 0; p < 12; p++) {
                        particles.push(new Particle(col.x, col.y, '#ffcc00', true));
                    }
                }

                if (col.x < -100 * baseScale || col.collected) {
                    collectibles.splice(i, 1);
                }
            }

            // Combo timeout
            if (combo > 0) {
                comboTimer -= dt;
                if (comboTimer <= 0) {
                    combo = 0;
                    document.getElementById('combo-badge').style.display = 'none';
                }
            }

            // Update Player
            player.update(dt60);
            score += (isFever ? 2 : 1) * dt60;
        }

        function renderGame(dt60) {
            ctx.save();

            // Screen Shake Application
            if (screenShake > 0) {
                let offsetX = (Math.random() - 0.5) * screenShake * baseScale;
                let offsetY = (Math.random() - 0.5) * screenShake * baseScale;
                ctx.translate(offsetX, offsetY);
                screenShake *= Math.pow(0.85, dt60);
                if (screenShake < 0.2) screenShake = 0;
            }

            // Screen clear
            ctx.fillStyle = isFever ? 'rgba(26, 11, 46, 0.3)' : 'rgba(11, 9, 26, 0.3)';
            ctx.fillRect(-30, -30, width + 60, height + 60);

            // Draw Obstacles & Collectibles
            for (let obs of obstacles) obs.draw();
            for (let col of collectibles) col.draw();

            // Draw Particles
            for (let p of particles) p.draw();

            if (gameState === 'PLAYING') {
                player.draw();
            }

            ctx.restore();
        }

        function updateUI() {
            document.getElementById('current-score').innerText = String(Math.floor(score)).padStart(6, '0');
            document.getElementById('fever-fill').style.width = feverGauge + '%';
        }

        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            if (dt > 0.1) dt = 0.1;
            const dt60 = dt * 60;

            if (hitStop > 0) {
                hitStop--;
                requestAnimationFrame(loop);
                return;
            }

            if (gameState === 'PLAYING') {
                updateGame(dt, dt60);
            }

            // Update Particles always
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update(dt60);
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            renderGame(dt60);
            updateUI();

            requestAnimationFrame(loop);
        }

        // Start initial loop
        requestAnimationFrame(loop);
    </script>
</body>
</html>
