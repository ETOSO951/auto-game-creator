name: Auto Game Creator

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pythonの準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 必要なツールのインストール
        run: |
          python -m pip install --upgrade pip
          # 古いパッケージの競合を防ぐため、完全に削除してから新SDKを導入
          pip uninstall -y google-generativeai google-api-core
          pip install google-genai playwright tenacity
          python -m playwright install --with-deps chromium

      - name: 司令塔プログラムの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
