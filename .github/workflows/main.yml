name: Auto Game Creator
on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pythonの準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なツールのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 司令塔プログラムの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
